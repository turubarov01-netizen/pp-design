<div class="top">
  <h1>Продление подписки ПП в&nbsp;личном кабинете</h1>
  <p>Пять экранов телефона по&nbsp;порядку. Стили кабинета и&nbsp;«Плана Продюсера»&nbsp;— из&nbsp;кода платформы, тарифы&nbsp;— с&nbsp;12-го экрана «Моего оффера». Даты&nbsp;— для 17&nbsp;участников установочной 20&nbsp;октября. <a href="karty.html">Все состояния карточки отдельно</a></p>
</div>
<div class="row">
  <figure><figcaption><b>1. Главная кабинета · с&nbsp;4&nbsp;ноября</b>Уведомление в&nbsp;колокольчике и&nbsp;плашка над «Моим днём». «Продлить» ведёт в&nbsp;«План Продюсера»</figcaption><iframe src="s1-kabinet.html" title="Главная кабинета"></iframe></figure>
  <figure><figcaption><b>2. Главная «Плана Продюсера»</b>Карточка продления первой, над встречами</figcaption><iframe src="s2-pp.html" title="Главная ПП"></iframe></figure>
  <figure><figcaption><b>3. Окно продления</b>Открывается по&nbsp;кнопке. Базовый и&nbsp;ВИП, как в&nbsp;«Моём оффере»; прокручивается</figcaption><iframe src="s3-tarify.html" title="Окно с тарифами"></iframe></figure>
  <figure><figcaption><b>4. После 18&nbsp;ноября, не&nbsp;продлил</b>«План Продюсера» уходит из&nbsp;меню. Плашка остаётся на&nbsp;главной кабинета и&nbsp;открывает то&nbsp;же окно</figcaption><iframe src="s4-kabinet-posle.html" title="Главная после окончания доступа"></iframe></figure>
  <figure><figcaption><b>5. Сразу после оплаты</b>Доступ продлён, карточка сменилась на&nbsp;зелёную</figcaption><iframe src="s5-oplacheno.html" title="После оплаты"></iframe></figure>
</div>
