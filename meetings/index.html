<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>План Продюсера · встречи и календарь — варианты</title>
<link rel="stylesheet" href="pp.css">
<style>

body{background:#0A0E13}
.doc{max-width:1440px;margin:0 auto;padding:28px 32px 60px}
.doc h1.tt{font-size:28px;font-weight:800;letter-spacing:-.01em}
.doc .lead{font-size:15px;color:var(--t2);margin-top:8px;max-width:820px;line-height:1.5}
.part{margin-top:56px;padding:14px 18px;border-radius:16px;background:linear-gradient(90deg,rgba(240,208,128,.12),transparent);font-size:24px;font-weight:800}
.part small{display:block;font-size:14px;font-weight:500;color:var(--t2);margin-top:4px}
.blk{margin-top:36px;padding-top:28px;border-top:1px solid var(--line2)}
.blk>h2{font-size:22px;font-weight:800}
.blk>h2 small{font-size:14px;font-weight:600;color:var(--gold-a);margin-left:8px}
.why{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:14px;max-width:1100px}
.why div{font-size:14px;line-height:1.5;color:var(--t2)}
.why b{color:#fff}
.why .pro b{color:var(--moss)} .why .con b{color:#FF9A9A}
.frames{display:flex;flex-wrap:wrap;gap:32px;margin-top:22px;align-items:flex-start}
.fl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:0 0 10px 4px}
.now{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;margin-top:16px}
.now img{width:390px;border-radius:14px;border:1px solid var(--line2);display:block}
.now ul{font-size:14px;color:var(--t2);line-height:1.55;max-width:600px;padding-left:18px}
.now li+li{margin-top:6px}
.now li b{color:#fff}
.new2{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;border:1px dashed rgba(107,159,255,.7);color:#9DBDFF;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle;letter-spacing:0;text-transform:none;white-space:nowrap}
.qs{margin-top:14px;max-width:900px;font-size:14px;color:var(--t2);line-height:1.55;padding-left:20px}
.qs li+li{margin-top:8px} .qs b{color:#fff}

/* ── телефон ── */
.ph{position:relative;width:390px;height:780px;border-radius:28px;border:1px solid var(--line2);overflow:hidden;background:var(--bg)}
.ph .scroll{position:absolute;inset:0;overflow:hidden}
.ph .mv{padding:70px 16px 120px}
.appbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;height:56px;padding:0 12px 0 16px;background:rgba(13,17,23,.96);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:#1A1406;background:linear-gradient(135deg,var(--gold-a),var(--gold-b))}
.appbar .ttl{flex:1;min-width:0;font-size:17px;font-weight:700}
.appbar .ttl small{display:block;font-size:12px;font-weight:500;color:var(--t3);margin-top:1px}
.ib{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--t2);flex:none}
.ib .ic{width:22px;height:22px}
.ib em{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.tb{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;height:72px;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(17,24,39,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.t{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px;font-size:11px;font-weight:600;color:rgba(255,255,255,.62)}
.t .ic{width:22px;height:22px;position:relative;z-index:1}
.t.on{color:var(--gold-a)}
.t.on::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:56px;height:32px;border-radius:16px;background:rgba(240,208,128,.14);box-shadow:inset 0 0 0 1px rgba(240,208,128,.28)}
.t em{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold-b);color:#1A1406;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;z-index:2}

/* ── компьютер ── */
.dk{width:1180px;height:760px;border-radius:20px;border:1px solid var(--line2);overflow:hidden;display:flex;background:var(--bg);position:relative}
.side{width:248px;flex:none;border-right:1px solid var(--line);background:linear-gradient(180deg,#0F1620,#0B1016);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.side .brand b{font-size:15px;letter-spacing:.02em}
.side .brand small{display:block;font-size:12px;color:var(--t3);font-weight:500}
.sa{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--t2);font-size:15px;font-weight:600}
.sa .ic{width:19px;height:19px}
.sa .x{margin-left:auto;color:var(--t3)} .sa .x .ic{width:14px;height:14px}
.sa em{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold-b);color:#1A1406;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.sa.on{background:rgba(240,208,128,.09);color:var(--gold-a);box-shadow:inset 3px 0 0 var(--gold-b)}
.side .g{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:16px 12px 6px}
.side .foot{margin-top:auto}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dbar{display:flex;align-items:center;gap:12px;height:64px;flex:none;padding:0 24px;border-bottom:1px solid var(--line)}
.dbar .ttl{flex:1;font-size:20px;font-weight:700}
.dbody{padding:22px 28px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;overflow:hidden;align-items:start}
.dbody.one{grid-template-columns:minmax(0,1fr)}
.me2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#1A1406;background:linear-gradient(135deg,var(--gold-a),var(--gold-b));flex:none}

/* ── общие куски ── */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.c-done{background:rgba(107,203,119,.16);color:var(--moss)}
.c-new{background:rgba(75,123,255,.16);color:#9DBDFF}
.c-rev{background:rgba(75,123,255,.16);color:#9DBDFF}
.c-draft{background:rgba(255,255,255,.08);color:var(--t2)}
.c-key{background:rgba(234,184,32,.16);color:var(--amber)}
.c-lock{background:rgba(255,255,255,.08);color:var(--t2)}
.c-dark{background:rgba(13,17,23,.72);color:#fff;backdrop-filter:blur(4px)}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--moss)}
.meta{font-size:13px;color:var(--t3);margin-top:4px;line-height:1.4}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 8px}
.sh h2{font-size:20px;font-weight:800}
.sh span{font-size:13px;color:var(--t3)}
.strip{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-top:10px}
.strip .si{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.strip .si .ic{width:19px;height:19px}
.strip .tx{flex:1;min-width:0}
.strip .tx small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.strip .tx b{display:block;font-size:15px;font-weight:600;margin-top:2px;line-height:1.3}
.strip .rt{text-align:right;flex:none}
.strip .rt b{font-size:15px;display:block}
.strip .rt span{font-size:12px;color:var(--t3)}
.si-amb{background:rgba(234,184,32,.14);color:var(--amber)} .si-blue{background:rgba(75,123,255,.14);color:var(--blue2)} .si-moss{background:rgba(107,203,119,.14);color:var(--moss)} .si-gold{background:rgba(240,208,128,.12);color:var(--gold-a)}
.u-amb{color:var(--amber)} .u-blue{color:var(--blue2)} .u-moss{color:var(--moss)}
.go{color:var(--t3);flex:none} .go .ic{width:18px;height:18px}

/* недели-фишки */
.wk{display:flex;gap:8px;overflow:hidden;margin:0 -16px;padding:0 16px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.wc{flex:none;height:44px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--t2)}
.wc .ic{width:16px;height:16px}
.wc small{font-size:12px;color:var(--t3);font-weight:500}
.wc.on{background:rgba(240,208,128,.1);border-color:rgba(240,208,128,.45);color:var(--gold-a)}
.wc.on small{color:rgba(240,208,128,.75)}
.wc.done .ic{color:var(--moss)}
.wc.fut{color:var(--t3)}

/* «продолжить» */
.hero{margin-top:14px;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid rgba(240,208,128,.25)}
.hero .pic{height:118px;background:center 40%/cover;position:relative}
.hero .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,43,0) 40%,#141E2B)}
.hero .pic .chip{position:absolute;top:12px;left:12px;z-index:1}
.hero .body{padding:4px 16px 16px}
.hero h3{font-size:19px;font-weight:700;line-height:1.25;margin-top:4px}
.hero .pr{display:flex;align-items:center;gap:10px;margin:12px 0 14px}
.hero .pr .pbar{flex:1}
.hero .pr span{font-size:13px;color:var(--t2);font-weight:600}

/* вариант А: тропа */
.trail{position:relative;margin-top:4px}
.trail::before{content:"";position:absolute;left:15px;top:30px;bottom:30px;width:2px;background:rgba(255,255,255,.09)}
.day{position:relative;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:18px 0 4px 46px}
.day.today{color:var(--gold-a)}
.day{white-space:nowrap}
.row{position:relative;display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0}
.node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;z-index:1;background:var(--bg)}
.node .ic{width:16px;height:16px}
.n-done{background:var(--moss);color:#0B2217}
.n-cur{border:2px solid var(--gold-a);color:var(--gold-a);box-shadow:0 0 0 5px rgba(240,208,128,.14)}
.n-new{border:2px solid var(--blue2);color:var(--blue2)}
.n-key{background:#2A2410;border:2px solid var(--amber);color:var(--amber)}
.n-lock{background:#161E29;border:1px solid var(--line2);color:var(--t3)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.row small{display:block;font-size:13px;color:var(--t3);margin-top:3px;line-height:1.35}
.row.done b{color:var(--t2)}
.row.lock b{color:var(--t2)}
.row .why2{color:#E9D9A6}
.why2 .ic,.cn .ic{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.cn .ic{color:#EAB820;margin-right:3px}
.nw{display:inline-block;font-size:11px;font-weight:700;color:#9DBDFF;background:rgba(75,123,255,.16);padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:1px}
.row.cur{background:rgba(240,208,128,.06);border-radius:16px;margin:0 -10px;padding:8px 10px}
.soon{display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 0;color:var(--t3);font-size:14px}
.soon .node{border:1.5px dashed rgba(255,255,255,.25);color:var(--t3);background:var(--bg)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.lt{min-height:88px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.lt .ic{width:22px;height:22px}
.lt b{font-size:15px;display:block} .lt small{font-size:12px;color:var(--t3)}

/* вариант Б: список по неделям */
.seg{display:grid;grid-template-columns:1fr 1fr;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:4px}
.seg a{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;font-size:15px;font-weight:600;color:var(--t2)}
.seg a .ic{width:17px;height:17px}
.seg a.on{background:rgba(240,208,128,.14);color:var(--gold-a)}
.hc{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px;border-radius:20px;background:var(--card);border:1px solid rgba(240,208,128,.25);flex-wrap:wrap}
.hc .th{width:76px;height:76px;border-radius:14px;background:center/cover;flex:none}
.hc .tx{flex:1;min-width:0}
.hc .tx small{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-a)}
.hc .tx b{display:block;font-size:16px;font-weight:700;line-height:1.3;margin-top:3px}
.hc .b{width:100%}
.acc{border-radius:18px;background:var(--card);border:1px solid var(--line);margin-top:10px}
.acc .ah{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 14px 0 16px}
.acc .ah .tx{flex:1;min-width:0}
.acc .ah b{display:block;font-size:16px;font-weight:700}
.acc .ah small{display:block;font-size:13px;color:var(--t3);margin-top:2px}
.acc .ah .ok{width:28px;height:28px;border-radius:50%;background:rgba(107,203,119,.16);color:var(--moss);display:grid;place-items:center;flex:none}
.acc .ah .ok .ic{width:15px;height:15px}
.acc.open{border-color:rgba(240,208,128,.3)}
.acc .apb{padding:0 16px 6px}
.acc .ab{padding:0 16px 4px}
.lr{display:flex;gap:12px;align-items:center;min-height:76px;padding:10px 0;border-top:1px solid var(--line)}
.lr .th{width:56px;height:56px;border-radius:12px;background:center/cover;flex:none;position:relative}
.lr .th.gray{filter:grayscale(1) brightness(.55)}
.lr .th .st{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card)}
.lr .th .st .ic{width:13px;height:13px}
.lr .tx{flex:1;min-width:0}
.lr b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.lr small{display:block;font-size:13px;color:var(--t3);margin-top:3px}
.lr.cur b{color:var(--gold-a)}
.st-done{background:var(--moss);color:#0B2217} .st-cur{background:var(--gold-a);color:#1A1406} .st-lock{background:#2A3342;color:#fff} .st-key{background:var(--amber);color:#1A1406}

/* вариант В: обложки */
.wsel{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.wsel .tx{flex:1} .wsel b{font-size:17px;font-weight:700;display:block} .wsel small{font-size:13px;color:var(--t3)}
.cc{position:relative;border-radius:20px;overflow:hidden;height:196px;margin-top:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;border:1px solid var(--line)}
.cc .bg{position:absolute;inset:0;background:center/cover}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,17,23,.1) 20%,rgba(13,17,23,.94) 92%)}
.cc>*:not(.bg){position:relative;z-index:1}
.cc .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.cc b{font-size:18px;font-weight:700;line-height:1.25}
.cc small{font-size:13px;color:rgba(255,255,255,.72);margin-top:4px;display:block}
.cc.lock .bg{filter:grayscale(1) brightness(.45)}
.cc.big{height:250px;border-color:rgba(240,208,128,.35)}
.cc.big .b{margin-top:12px}
.cc.done .bg{filter:saturate(.5) brightness(.7)}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.dk .lcov{margin:0;border-radius:18px}
.cgrid .cc{margin-top:0}

/* ── страница урока ── */
.lbar{display:flex;align-items:center;gap:4px;height:48px;margin:0 -8px}
.back{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;font-size:15px;font-weight:600;color:var(--t2)}
.back .ic{width:18px;height:18px}
.lbar .pos{margin-left:auto;font-size:13px;color:var(--t3);padding-right:8px}
.lcov{height:150px;margin:0 -16px;background:center 45%/cover;position:relative}
.lcov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,17,23,.05),#0D1117)}
.lhead{margin-top:-34px;position:relative}
.lhead.flat{margin-top:6px}
.lhead h1{font-size:26px;margin-top:8px}
.stat{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:13px;color:var(--t2)}
.stat .pb2{display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
.stat .pb2 .pbar{flex:1}
.stat .rw{display:flex;align-items:center;gap:6px}
.stat .rw .ic{width:15px;height:15px}
.prose{font-size:16px;line-height:1.6;color:rgba(255,255,255,.86);margin-top:18px}
.vid{margin-top:16px;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.vid .pic{aspect-ratio:16/9;background:center/cover;position:relative;display:grid;place-items:center}
.vid .pic::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.vid .play{position:relative;z-index:1;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);color:#0D1117;display:grid;place-items:center}
.vid .play .ic{width:24px;height:24px;margin-left:3px;fill:currentColor}
.vid .dur{position:absolute;right:10px;bottom:10px;z-index:1;font-size:12px;font-weight:700;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:8px}
.vid .foot{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.vid .foot b{flex:1;font-size:15px;font-weight:600}
.vid .src{font-size:13px;color:var(--t3);padding:0 14px 12px;display:flex;gap:8px}
.vid .src span{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);display:inline-flex;align-items:center}
.vid .src span.on{border-color:rgba(240,208,128,.45);color:var(--gold-a)}
.asg{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.asg .hd{display:flex;align-items:center;gap:10px}
.asg .hd .si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(240,208,128,.12);color:var(--gold-a)}
.asg .hd b{flex:1;font-size:17px;font-weight:700}
.fld{margin-top:16px}
.fld label{display:block;font-size:15px;font-weight:600;line-height:1.4}
.fld label i{color:var(--amber);font-style:normal}
.ta{margin-top:8px;min-height:92px;border-radius:14px;background:#0F1620;border:1px solid var(--line2);padding:12px 14px;font-size:15px;line-height:1.5;color:var(--t1)}
.ta.empty{color:var(--t3)}
.ta.err{border-color:#FF6B6B}
.errt{font-size:13px;color:#FF9A9A;margin-top:6px}
.saved{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);margin-top:12px}
.saved .ic{width:14px;height:14px}
.rwl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.asg .b-cta{margin-top:14px}
.sent{margin-top:12px;padding:12px 14px;border-radius:14px;background:#0F1620;border:1px solid var(--line);font-size:14px;color:var(--t2);line-height:1.5}
.sent small{display:block;font-size:12px;color:var(--t3);margin-bottom:4px}
.lnk{display:inline-flex;align-items:center;gap:6px;height:44px;font-size:14px;font-weight:600;color:var(--blue2)}
.lnk .ic{width:16px;height:16px}

/* прилипающая строка */
.sticky{position:absolute;left:0;right:0;top:56px;z-index:3;padding:8px 16px;background:rgba(13,17,23,.96);border-bottom:1px solid var(--line)}

/* шаги */
.steps{display:flex;gap:6px;margin-top:10px}

.steps i.on{background:var(--gold-a)} .steps i.done{background:var(--moss)}

.stl b{color:var(--t1);font-size:15px}
.stnav{display:flex;gap:10px;margin-top:20px}
.stnav .b{flex:1}

.gate{text-align:center;padding:40px 8px 0}

<script>

const I=(id,c='',s='')=>`<svg class="ic ${c}" ${s?`style="${s}"`:''}><use href="#${id}"/></svg>`;
const NEW=(t='новое')=>`<span class="new2">${t}</span>`;
const X=`<span class="x">${I('ext')}</span>`;


/* Пример: ученик тарифа «Бизнес», Поток 5, среда 30 сентября, 16:50 МСК. Встречи, даты, ссылки — настоящие из расписания потока. */
const appbar=(title,sub)=>`<div class="appbar"><div class="logo">ПП</div><div class="ttl">${title}${sub?`<small>${sub}</small>`:''}</div><span class="ib" aria-label="Уведомления">${I('bell')}<em>3</em></span></div>`;
const tb=(active='Ещё')=>`<nav class="tb">${[['home','Главная'],['map','Маршрут'],['bag','Рюкзак'],['tent','Лагерь'],['grid','Ещё']].map(([i,l])=>`<a class="t ${l===active?'on':''}">${I(i)}${l==='Рюкзак'?'<em>2</em>':''}${l}</a>`).join('')}</nav>`;
const phone=({head='',body,off=0,extra=''})=>`<div class="ph"><div class="scroll">${head}<div class="mv" style="transform:translateY(-${off}px)">${body}</div></div>${extra}</div>`;
const side=(active)=>`<nav class="side"><div class="brand"><div class="logo">ПП</div><div><b class="gold" style="font-size:15px">План Продюсера</b><small>Поток 5 · Бизнес</small></div></div>
  ${[['home','Главная'],['map','Маршрут'],['bag','Рюкзак'],['tent','Лагерь']].map(([i,l])=>`<a class="sa ${l===active?'on':''}">${I(i)}${l}${l==='Рюкзак'?'<em>2</em>':''}</a>`).join('')}
  <div class="g">Экспедиция</div><a class="sa ${active==='Встречи'?'on':''}">${I('video')}Встречи</a><a class="sa">${I('shop')}Лавка</a>
  <div class="g">Общение</div><a class="sa">${I('chat')}Чат ПП${X}</a><a class="sa">${I('users')}Чат отряда${X}</a>
  <div class="g">Инструменты</div><a class="sa">${I('cal')}Запись клиентов${X}</a>
  <div class="foot"><a class="sa">${I('gear')}Настройки</a><a class="sa">${I('out')}На платформу</a></div></nav>`;
const desk=(title,body,active='Встречи')=>`<div class="dk">${side(active)}<div class="dmain"><div class="dbar"><div class="ttl">${title}</div><span class="ib">${I('bell')}<em>3</em></span><span class="me2">А</span></div><div class="dbody">${body}</div></div></div>`;

/* ── встречи Потока 5 для тарифа Бизнес ── */
const M=[
 {d:30,m:'сен',wd:'ср',t:'17:00',title:'Разбор недели 1',sub:'Стандарт · Zoom'},
 {d:7,m:'окт',wd:'ср',t:'17:00',title:'Разбор недели 2',sub:'Стандарт · Zoom'},
 {d:14,m:'окт',wd:'ср',t:'17:00',title:'Разбор недели 3',sub:'Стандарт · Zoom'},
 {d:21,m:'окт',wd:'ср',t:'17:00',title:'Разбор недели 4',sub:'Стандарт · Zoom'},
 {d:24,m:'окт',wd:'сб',t:'12:00',title:'Финальный интенсив',sub:'Для всех тарифов · Zoom'},

const PAST=[{d:27,m:'сен',wd:'вс',t:'12:00',title:'Интенсив. День 2',rec:true}];

const heroSoon=()=>`<div class="mt-hero"><div class="body">

</div></div>`;
const heroLive=()=>`<div class="mt-hero live"><div class="body">

const heroLater=()=>`<div class="mt-hero"><div class="body">

  <div class="mt-when"><b>17:00</b><span>ср 30 сентября · ваше время</span></div>
  <a class="b b-white full">${I('cal')}Добавить в мой календарь</a>
  <div class="mt-note">Кнопка «Войти в Zoom» появится здесь за 15 минут до начала.</div>
</div></div>`;
const nextList=(from=1,n=4)=>`<div class="box">${M.slice(from,from+n).map(x=>`<a class="ml"><span class="dt"><b>${x.d}</b><span>${x.m}</span></span><span class="tx"><b>${x.title}</b><small>${x.wd}, ${x.t} · ${x.sub}</small></span><span class="go">${I('right')}</span></a>`).join('')}</div>`;
const pastList=()=>`<div class="box">${PAST.map(x=>`<a class="ml past"><span class="dt"><b>${x.d}</b><span>${x.m}</span></span><span class="tx"><b>${x.title}</b><small>${x.wd}, ${x.t}</small></span><span class="act"><span class="b-sm play">${I('play')}Запись</span></span></a>`).join('')}
  <a class="ml past"><span class="dt"><b>30</b><span>сен</span></span><span class="tx"><b>Разбор недели 1</b><small>Запись появится в этом уроке</small></span></a></div>`;

/* ═══ А · Страница «Встречи» ═══ */
const pageA=(hero=heroSoon)=>`${hero()}

const deskA=()=>desk('Встречи',`<div>${heroSoon()}<div class="sh"><h2>Записи</h2><span>прошедшие встречи</span></div>${pastList()}</div><div><div class="sh" style="margin-top:0"><h2>Дальше по программе</h2></div>${nextList(1,4)}</div>`);

/* ═══ Б · Неделя лентой ═══ */
const week=(sel=2)=>{const days=[['пн',28],['вт',29],['ср',30],['чт',1],['пт',2],['сб',3],['вс',4]];
  return `<div class="wnav"><span class="ib">${I('left')}</span><b>28 сентября — 4 октября</b><span class="ib">${I('right')}</span></div>
  <div class="week">${days.map(([w,d],i)=>`<a class="wd ${i===sel?'sel':''} ${i===1?'today':''} ${i===2?'has':''}"><small>${w}</small><b>${d}</b><i></i></a>`).join('')}</div>`};
const pageB=()=>`${week(2)}

  ${heroSoon().replace('Ближайшая встреча','Разбор')}

const deskB=()=>desk('Встречи',`<div>${week(2)}<div class="sh"><h2>Среда, 30 сентября</h2><span>1 встреча</span></div>${heroSoon().replace('Ближайшая встреча','Разбор')}</div><div><div class="sh" style="margin-top:0"><h2>Весь поток</h2></div>${nextList(0,5)}</div>`);

/* ═══ В · Без отдельной страницы ═══ */
const homeToday=()=>`<div class="sh" style="margin-top:4px"><h2>Сегодня</h2></div>
  <div class="box" style="padding:0">
   <div class="today-row"><span class="ring">${I('video')}</span><span class="tx"><small class="u-blue">Разбор недели 1 · через 10 мин</small><b>Сегодня в 17:00</b></span><a class="zoom-sm">${I('video')}Zoom</a></div>
   <div class="today-row" style="border-top:1px solid var(--line)"><span class="ring" style="background:rgba(234,184,32,.14);color:var(--amber)">${I('star','fill')}</span><span class="tx"><small class="u-amb">Ключевое задание</small><b>Сбор данных</b></span><span style="text-align:right;font-size:13px;color:var(--t3)"><b style="display:block;color:#fff;font-size:15px">2 д 1 ч</b>до пт, 18:00</span></div>
  </div>
  <div class="sh"><h2>Встречи потока</h2><a class="lnk2" style="height:auto">Все ${I('right')}</a></div>${nextList(1,2)}

const menuC=()=>`<div class="sheet" style="position:static;border-radius:20px;padding:12px 16px 16px">
  <div class="grp">Экспедиция</div>

  <div class="grp">Инструменты</div>
  <a class="mi"><span class="ico">${I('cal','','color:#6BCB77')}</span><span class="tx">Запись клиентов<small>ваша страница записи и Zoom</small></span>${X}</a>

const S1=()=>`${lessonTop('Разбор · Стандарт','Разбор недели 1')}<div class="mt-when"><b style="font-size:22px">ср 30 сен, 17:00</b></div><div class="mt-note" style="margin-top:4px">Ваше время</div><a class="b b-white full" style="margin-top:14px">${I('cal')}В мой календарь</a><div class="mt-note">Кнопка Zoom откроется за 15 минут до начала.</div>`;
const S2=()=>`${lessonTop('Разбор · Стандарт','Разбор недели 1')}<div class="mt-when"><b style="font-size:22px">через 10 мин</b></div><div class="mt-note" style="margin-top:4px">Сегодня в 17:00 · ваше время</div><a class="b b-cta full" style="margin-top:14px">${I('video')}Войти в Zoom</a>`;
const S3=()=>`${lessonTop('Идёт сейчас','Разбор недели 1')}<div style="margin-top:10px"><span class="chip c-live">идёт 35 мин</span></div><a class="b b-cta full" style="margin-top:14px">${I('video')}Войти в Zoom</a><div class="mt-note">Можно зайти и после начала.</div>`;
const S4=()=>`${lessonTop('Прошла 30 сентября','Разбор недели 1')}<div class="rec" style="margin-top:12px"><span class="play">${I('play')}</span></div><div class="mt-note">Запись встречи</div>`;

const block=v=>`<div class="blk"><h2>${v.name}${v.tag?`<small>${v.tag}</small>`:''}</h2><p class="lead">${v.lead}</p>
 <div class="why"><div class="pro">${v.pro.map(x=>`<div>+ ${x}</div>`).join('')}</div><div class="con">${v.con.map(x=>`<div>− ${x}</div>`).join('')}</div></div>
 <div class="frames">${v.frames().map(([l,h])=>`<div class="${l.startsWith('Компьютер')?'dkwrap':''}"><div class="fl">${l}</div>${h}</div>`).join('')}</div></div>`;

const V=[
 {name:'А · Страница «Встречи» вместо календаря',tag:'рекомендую',
  lead:'Сетку месяца убираем: встречи идут раз в неделю, в сетке их почти не видно. На первом месте — ближайшая встреча с одной золотой кнопкой «Войти в Zoom». Ниже следующие встречи вашего тарифа и записи прошедших. Пункт меню «Календарь» становится «Встречи», а нынешние «Встречи» (запись ваших клиентов) переезжают в «Инструменты» под понятным названием.',
  pro:['<b>Ссылка на Zoom в одно нажатие</b> — сейчас она появляется только после «Иду!» внутри урока.','<b>Только ваши встречи</b>: по тарифу и по датам вашего потока. Сейчас Бизнес видит VIP-разборы, а «Финальный интенсив» стоит в прошедших с датой 18 апреля.','<b>Записи рядом</b> — не нужно искать урок прошедшей встречи.'],
  con:['<b>Нет общего вида месяца</b>. Если он кому-то нужен, его заменит выгрузка встреч в личный календарь (вариант В).'],
  frames:()=>[['Телефон · за 10 минут до встречи',phone({head:appbar('Встречи','Поток 5'),body:pageA(),extra:tb()})],['Телефон · встреча идёт',phone({head:appbar('Встречи','Поток 5'),body:pageA(heroLive),extra:tb()})],['Телефон · за день до встречи',phone({head:appbar('Встречи','Поток 5'),body:pageA(heroLater),extra:tb()})],['Компьютер',`<div class="dkwrap">${deskA()}</div>`]]},
 {name:'Б · Неделя лентой',
  lead:'Календарь остаётся, но вместо сетки месяца — одна неделя из семи крупных дней. Точка под днём значит, что в этот день встреча. Нажали день — ниже встречи этого дня с кнопкой Zoom. Под неделей — весь поток списком и записи.',
  pro:['<b>Привычный вид календаря</b>, но дни крупные: 50 × 64 px вместо 42 × 32 сейчас.','<b>Видна неделя целиком</b> — удобно, когда у VIP две встречи в неделю (ср и пт).'],
  con:['<b>Лишний шаг</b>: чтобы увидеть следующую неделю, нужно листать стрелками.','<b>У тарифа Бизнес одна встреча в неделю</b> — шесть пустых дней из семи.'],
  frames:()=>[['Телефон',phone({head:appbar('Встречи','Поток 5'),body:pageB(),extra:tb()})],['Телефон · ниже',phone({head:appbar('Встречи','Поток 5'),body:pageB(),off:560,extra:tb()})],['Компьютер',`<div class="dkwrap">${deskB()}</div>`]]},
 {name:'В · Без отдельной страницы',
  lead:'Встречи и так видны на главной в «Сегодня» и на маршруте. Добавляем туда маленькую золотую кнопку «Zoom» и выгрузку всех встреч в личный календарь телефона одной ссылкой. Пункт «Календарь» из меню убираем, список встреч открывается по «Все».',
  pro:['<b>Меньше разделов в меню</b> — ученик заходит на главную, а там уже кнопка.','<b>Встречи в родном календаре телефона</b> с напоминанием за 15 минут — это надёжнее любого уведомления платформы.'],
  con:['<b>Выгрузки в календарь сейчас нет</b> — её нужно сделать с нуля (ссылка-подписка на встречи потока).','<b>Записи прошедших встреч</b> придётся искать в уроках-встречах на маршруте.'],
  frames:()=>[['Телефон · главная',phone({head:appbar('Главная','Поток 5 · Неделя 1'),body:homeToday(),extra:tb('Главная')})],['Телефон · «Ещё»',phone({head:appbar('Ещё',''),body:menuC(),extra:tb('Ещё')})]]},
