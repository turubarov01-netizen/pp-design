<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>План Продюсера · меню и каркас кабинета — 3 варианта</title>
<link rel="stylesheet" href="pp.css">
<link rel="stylesheet" href="base.css">
<style>
body{background:#0A0E13}
.doc{max-width:1440px;margin:0 auto;padding:28px 32px 60px}
.doc h1.tt{font-size:28px;font-weight:800;letter-spacing:-.01em}
.doc .lead{font-size:15px;color:var(--t2);margin-top:8px;max-width:760px;line-height:1.5}
.blk{margin-top:36px;padding-top:28px;border-top:1px solid var(--line2)}
.blk>h2{font-size:22px;font-weight:800}
.blk>h2 small{font-size:14px;font-weight:600;color:var(--gold-a);margin-left:8px}
.why{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:14px;max-width:1100px}
.why div{font-size:14px;line-height:1.5;color:var(--t2)}
.why b{color:#fff}
.why .pro b{color:var(--moss)} .why .con b{color:#FF9A9A}
.frames{display:flex;flex-wrap:wrap;gap:32px;margin-top:22px;align-items:flex-start}
.fl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:0 0 10px 4px}
.now{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;margin-top:16px}
.now img{width:390px;border-radius:14px;border:1px solid var(--line2);display:block}
.now ul{font-size:14px;color:var(--t2);line-height:1.55;max-width:560px;padding-left:18px}
.now li+li{margin-top:6px}
.now li b{color:#fff}

/* телефон */
.ph{position:relative;width:390px;height:780px;border-radius:28px;border:1px solid var(--line2);overflow:hidden;background:var(--bg)}
.ph .scroll{position:absolute;inset:0;overflow:hidden;padding:0 16px}
.appbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;height:56px;margin:0 -16px 14px;padding:0 12px 0 16px;background:rgba(13,17,23,.92);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:#1A1406;background:linear-gradient(135deg,var(--gold-a),var(--gold-b))}
.appbar .ttl{flex:1;min-width:0;font-size:17px;font-weight:700}
.appbar .ttl small{display:block;font-size:12px;font-weight:500;color:var(--t3);margin-top:1px}
.ib{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--t2);flex:none}
.ib .ic{width:22px;height:22px}
.ib em{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.me2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#1A1406;background:linear-gradient(135deg,var(--gold-a),var(--gold-b));flex:none;margin-left:2px}

/* нижнее меню */
.tb{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;height:72px;border-radius:22px;display:grid;background:rgba(17,24,39,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tb.c5{grid-template-columns:repeat(5,1fr)} .tb.c4{grid-template-columns:repeat(4,1fr)}
.t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;gap:6px;font-size:11px;font-weight:600;color:rgba(255,255,255,.62)}
.t .ic{width:22px;height:22px;position:relative;z-index:1}
.t.on{color:var(--gold-a)}
.t.on::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:56px;height:32px;border-radius:16px;background:rgba(240,208,128,.14);box-shadow:inset 0 0 0 1px rgba(240,208,128,.28)}
.t em{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold-b);color:#1A1406;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;z-index:2}
/* вариант Б: рюкзак в центре */
.t.fab{padding-top:0;justify-content:center}
.t.fab .disc{width:58px;height:58px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;color:#1A1406;background:linear-gradient(180deg,#DFC880,#C9A84C);box-shadow:0 5px 0 #A07828,0 10px 22px rgba(0,0,0,.45);position:relative}
.t.fab .disc .ic{width:26px;height:26px}
.t.fab .disc em{top:-4px;left:auto;right:-4px;background:#fff;color:#1A1406}
.t.fab span{margin-top:4px;color:var(--gold-a)}

/* шторка «Ещё» */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:#141E2B;border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:10px 16px 24px}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.shh{display:flex;align-items:center;gap:12px;padding:0 4px 12px}
.shh b{flex:1;font-size:18px}
.grp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:14px 6px 6px}
.mi{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 10px;border-radius:14px;font-size:15px;font-weight:600}
.mi+.mi{margin-top:2px}
.mi .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:none}
.mi .ico .ic{width:19px;height:19px}
.mi .tx{flex:1;min-width:0}
.mi .tx small{display:block;font-size:12px;font-weight:500;color:var(--t3);margin-top:1px}
.mi .x{color:var(--t3)} .mi .x .ic{width:16px;height:16px}
.mi .val{font-size:14px;font-weight:700;color:var(--t2)}
.mi.exit{color:var(--t2)}
.mi.exit .ico{background:transparent;border:1px solid var(--line2)}
.sep{height:1px;background:var(--line);margin:12px 6px}

/* вариант В: меню-страница */
.menu-page .prof{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.menu-page .prof .me2{width:48px;height:48px;font-size:18px}
.menu-page .prof b{display:block;font-size:17px} .menu-page .prof span{font-size:13px;color:var(--t3)}
.menu-page .pst{display:flex;gap:8px;margin-top:10px}
.menu-page .pst div{flex:1;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.menu-page .pst .ic{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile2{min-height:96px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.tile2 .ic{width:24px;height:24px}
.tile2 b{font-size:15px;display:block}
.tile2 small{font-size:12px;color:var(--t3)}
.tile2 .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile2 .top .x .ic{width:15px;height:15px;color:var(--t3)}

/* компьютер */
.dk{width:1180px;height:720px;border-radius:20px;border:1px solid var(--line2);overflow:hidden;display:flex;background:var(--bg);position:relative}
.side{width:248px;flex:none;border-right:1px solid var(--line);background:linear-gradient(180deg,#0F1620,#0B1016);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.side .brand b{font-size:15px;letter-spacing:.02em}
.side .brand small{display:block;font-size:12px;color:var(--t3);font-weight:500}
.sa{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--t2);font-size:15px;font-weight:600}
.sa .ic{width:19px;height:19px}
.sa .x{margin-left:auto;color:var(--t3)} .sa .x .ic{width:14px;height:14px}
.sa em{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold-b);color:#1A1406;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.sa.on{background:rgba(240,208,128,.09);color:var(--gold-a);box-shadow:inset 3px 0 0 var(--gold-b)}
.side .g{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:16px 12px 6px}
.side .foot{margin-top:auto}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dbar{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px;border-bottom:1px solid var(--line)}
.dbar .ttl{flex:1;font-size:20px;font-weight:700}
.dbody{padding:22px 28px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;overflow:hidden}
/* вариант В на компьютере: меню сверху */
.dk.topnav{flex-direction:column}
.hnav{display:flex;align-items:center;gap:6px;height:68px;padding:0 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0F1620,#0B1016)}
.hnav .brand{display:flex;align-items:center;gap:10px;margin-right:18px}
.hnav .brand b{font-size:15px}
.ha{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;color:var(--t2);font-size:15px;font-weight:600}
.ha .ic{width:18px;height:18px}
.ha.on{background:rgba(240,208,128,.1);color:var(--gold-a)}
.hnav .sp{flex:1}
.new2{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;border:1px dashed rgba(107,159,255,.7);color:#9DBDFF;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
/* мини-контент главной (из утверждённого макета) */
.mini .sectt{margin-top:0}
.mini .todo{margin-bottom:20px}
.mini .route .pic{height:96px}
@media (max-width:560px){.doc{padding:16px 0}.doc>*:not(.blk){margin-left:14px;margin-right:14px}.blk{padding-left:0;padding-right:0}.blk>h2,.blk>.why,.blk>.lead{margin-left:14px;margin-right:14px}.why{grid-template-columns:1fr}.frames{gap:24px;justify-content:center}.dkwrap{display:none}.now{margin:16px 14px 0}.now img{width:100%}}
</style>

<script>
const I=(id,c='',s='')=>`<svg class="ic ${c}" ${s?`style="${s}"`:''}><use href="#${id}"/></svg>`;
const NEW=(t='новое')=>`<span class="new2">${t}</span>`;

/* мини-контент главной — из утверждённого макета, люди и суммы — примеры */

/* неразрывные пробелы после коротких слов */
(function(){const NB=' ',short=/(^|[\s(«])(в|во|с|со|к|ко|и|а|о|об|у|по|до|на|из|от|за|не|но|же|для|или|что|как|без|при|под|над|через|—)\s+/gi;
 const walk=n=>{if(n.nodeType===3){let t=n.nodeValue;t=t.replace(short,(m,a,w)=>a+w+NB).replace(short,(m,a,w)=>a+w+NB);t=t.replace(/(\d)\s+(?=[А-Яа-яЁё₽%])/g,'$1'+NB);t=t.replace(/\s+(—|·|→)/g,NB+'$1');n.nodeValue=t;return}
 if(n.nodeType===1&&!/^(TEXTAREA|INPUT|SCRIPT|STYLE|svg)$/i.test(n.nodeName))n.childNodes.forEach(walk)};walk(document.getElementById('doc'));})();
</script>
