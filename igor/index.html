<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игорь Граф · Freeman's Alliance</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1220;--card:#161d30;--line:#26304a;--text:#f3efe6;--muted:#a3a9b8;--gold:#f2c94c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100dvh;display:flex;justify-content:center;padding:32px 18px 40px}
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:56px;height:auto;margin-bottom:22px}
  .photo{width:116px;height:116px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin-bottom:16px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:15px;line-height:1.45;margin:8px 0 26px;max-width:32ch}
  .links{width:100%;display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:16px;text-align:left;transition:transform .15s ease-out,border-color .15s}
  a.btn:active{transform:scale(.98)}
  a.btn:hover{border-color:var(--gold)}
  a.btn small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
  a.main{background:var(--gold);border-color:var(--gold);color:#141414}
  a.main small{color:#3a3320}
  .ic{width:26px;height:26px;flex:none}
  footer{margin-top:30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-yellow.svg" alt="Freeman's Alliance">
  <img class="photo" src="igor.jpg" alt="Игорь Граф">
  <h1>Игорь Граф</h1>
  <p class="sub">Основатель Freeman's&nbsp;Alliance — сообщества предпринимателей</p>
  <div class="links">
    <a class="btn main" href="https://wearefree.club/intro">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span>Вступить в&nbsp;комьюнити<small>Регистрация в&nbsp;Freeman's Alliance</small></span>
    </a>
    <a class="btn" href="https://instagram.com/igorgraf.life">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      <span>Instagram*<small>@igorgraf.life</small></span>
    </a>
    <a class="btn" href="https://t.me/igorgraf">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21.5 3.5 2.5 11l7 2.5L12 21l3.5-5.5 5 3.5z"/><path d="m9.5 13.5 6-4.5"/></svg>
      <span>Telegram<small>@igorgraf</small></span>
    </a>
    <a class="btn" href="https://wa.me/380673321221">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 7.8 19.6z"/><path d="M9 9.5c.3 2 2.2 4.2 4.8 5 .6.2 1.4-.4 1.7-1l-1.6-.9-.9.8c-1-.5-1.8-1.3-2.3-2.3l.8-.9-.9-1.6c-.6.3-1.2 1.1-1 1.7"/></svg>
      <span>WhatsApp<small>Написать Игорю</small></span>
    </a>
    <a class="btn" href="https://igorgraf.life">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <span>Сайт Игоря<small>igorgraf.life</small></span>
    </a>
  </div>
  <footer>* Instagram принадлежит компании Meta, признанной экстремистской и запрещённой в&nbsp;РФ</footer>
</main>
</body>
</html>
