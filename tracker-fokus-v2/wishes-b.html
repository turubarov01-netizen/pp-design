<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1000 целей · Б · Карта 1000</title>
<link rel="stylesheet" href="wishes.css">
<style>
.map { margin-top: 22px; border-radius: 30px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; }
.mh { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.mh .big { font: 400 64px/.8 "Bebas", sans-serif; color: var(--navy); letter-spacing: .01em; }
.mh .big em { font-style: normal; font-size: 30px; color: var(--ink2); }
.mh .lbl { font-size: 13.5px; color: var(--ink2); line-height: 1.35; padding-bottom: 2px; }
.mh .lbl b { color: var(--gold-ink); }

/* десять сотен */
.mapl { margin-top: 18px; display: grid; grid-template-columns: 196px minmax(0, 500px); gap: 26px; align-items: start; }
.hs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hu { border-radius: 12px; padding: 6px 6px 5px; text-align: center; transition: background .2s, box-shadow .2s, transform .25s var(--ease); }
.hu:hover { background: rgba(255,255,255,.5); transform: translateY(-2px); }
.hu[aria-pressed="true"] { background: var(--card); box-shadow: 0 0 0 2px var(--navy), 0 8px 18px rgba(20,34,70,.12); }
.hu .mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; }
.hu .mini i { aspect-ratio: 1; border-radius: 1px; background: oklch(0.22 0.13 268 / .08); }
.hu .mini i.g { background: oklch(0.22 0.13 268 / .45); }
.hu .mini i.d { background: var(--gold); }
.hu small { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 650; color: var(--ink2); white-space: nowrap; }
.hu.locked { opacity: .5; }

/* текущая сотня крупно */
.hh { display: flex; align-items: baseline; gap: 10px; }
.hh h3 { margin: 0; font-size: 17px; font-weight: 750; }
.hh span { font-size: 13px; color: var(--ink2); }
.grid { margin-top: 10px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.cl { aspect-ratio: 1; border-radius: 9px; position: relative; display: grid; place-items: center; transition: transform .2s var(--ease), box-shadow .2s; }
.cl.e { border: 1.5px dashed oklch(0.22 0.13 268 / .16); }
.cl.g { background: color-mix(in oklch, var(--c) 32%, var(--card)); border: 1.5px solid color-mix(in oklch, var(--c) 60%, transparent); }
.cl.work { background: var(--navy); border: 0; box-shadow: 0 0 0 3px oklch(0.83 0.13 80 / .7); }
.cl.work::after { content: ""; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2.5px solid var(--yellow); border-right-color: transparent; }
.cl.done { background: linear-gradient(145deg, oklch(0.9 0.12 88), var(--gold2)); border: 0; box-shadow: 0 0 14px oklch(0.8 0.14 82 / .6); color: oklch(0.35 0.08 70); }
.cl.done svg { width: 46%; height: 46%; }
.cl.next { border: 2px solid var(--navy); color: var(--navy); font: 400 22px/1 "Bebas", sans-serif; animation: nx 1.6s ease-in-out infinite; }
@keyframes nx { 50% { box-shadow: 0 0 0 5px oklch(0.22 0.13 268 / .12); } }
.cl:not(.e):hover, .cl:focus-visible { transform: scale(1.12); z-index: 2; box-shadow: 0 8px 18px rgba(20,34,70,.2); outline: none; }
.cl.fresh { animation: pop 1s var(--ease); }
@keyframes pop { 0% { transform: scale(.3); } 50% { transform: scale(1.25); } }
.cl.sel { box-shadow: 0 0 0 3px var(--navy); }

/* правая колонка: что за цель под пальцем */
.pv { display: flex; flex-direction: column; gap: 14px; }
.pv .card { border-radius: 22px; overflow: hidden; background: var(--card); border: 1px solid var(--line); min-height: 280px; display: flex; flex-direction: column; }
.pv .card .cover { height: 130px; flex: none; }
.pv .card .in { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pv .card .no { font: 400 15px/1 "Bebas", sans-serif; color: var(--ink2); letter-spacing: .04em; }
.pv .card h4 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 750; }
.pv .card .meta { display: flex; gap: 10px; flex-wrap: wrap; }
.pv .card .btn { margin-top: auto; align-self: flex-start; height: 40px; }
.pv .card.hint { padding: 18px; justify-content: center; gap: 8px; }
.pv .card.hint b { font-size: 17px; }
.pv .card.hint p { margin: 0; font-size: 13.5px; color: var(--ink2); }
.lg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12.5px; color: var(--ink2); }
.lg span { display: flex; align-items: center; gap: 7px; }
.lg i { width: 14px; height: 14px; border-radius: 4px; flex: none; }

/* под картой: в работе и список */
.below { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.below > main { min-width: 0; }
.wrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px; }
.wt { border-radius: 20px; padding: 12px; display: flex; gap: 12px; align-items: center; text-align: left; color: var(--cream); background: var(--nglass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 12px 28px rgba(10,20,60,.18); transition: transform .3s var(--ease); }
.wt:hover { transform: translateY(-2px); }
.wt b { display: block; font-size: 14.5px; line-height: 1.25; font-weight: 700; }
.wt small { font-size: 12px; color: oklch(0.82 0.03 268); }
.wt.slot { background: none; color: var(--ink2); border: 1.5px dashed oklch(0.22 0.13 268 / .25); box-shadow: none; font-size: 13px; justify-content: center; -webkit-backdrop-filter: none; backdrop-filter: none; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tabs button { height: 38px; padding: 0 14px; border-radius: 12px; font-size: 13.5px; font-weight: 650; background: var(--glass); border: 1px solid var(--glass-b); display: inline-flex; gap: 6px; align-items: center; }
.tabs button em { font-style: normal; font-weight: 500; color: var(--ink2); }
.tabs button[aria-selected="true"] { background: var(--navy); color: var(--cream); border-color: var(--navy); }
.tabs button[aria-selected="true"] em { color: oklch(0.8 0.03 268); }
.tabs .srch { margin-left: auto; height: 38px; border-radius: 12px; display: flex; align-items: center; gap: 6px; padding: 0 12px; min-width: 190px; }
.tabs .srch svg { width: 16px; height: 16px; color: var(--ink2); }
.tabs .srch input { border: 0; background: none; outline: none; min-width: 0; flex: 1; font-size: 14px; }
.rows { margin-top: 12px; border-radius: 22px; padding: 6px; display: flex; flex-direction: column; }
.rw { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; text-align: left; transition: background .2s; }
.rw:hover { background: rgba(255,255,255,.55); }
.rw + .rw { border-top: 1px solid oklch(0.89 0.015 85 / .6); }
.rw .no { font: 400 17px/1 "Bebas", sans-serif; color: var(--c); text-align: center; padding-top: 2px; }
.rw b { font-size: 14.5px; font-weight: 620; line-height: 1.3; }
.rw .st { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.rw .st.w { color: var(--navy); font-weight: 650; }
.rw .st.d { color: var(--gold-ink); font-weight: 650; }
.pg { margin: 8px auto 4px; }

@media (max-width: 980px) { .map { grid-template-columns: 1fr; } .pv .card { display: none; } .below { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .map { padding: 16px 12px; border-radius: 24px; margin-top: 16px; gap: 14px; }
  .mh .big { font-size: 50px; } .mh .big em { font-size: 24px; }
  .mapl { grid-template-columns: 1fr; gap: 14px; }
  .hu { padding: 4px 3px; } .hu small { font-size: 9px; }
  .hh { flex-wrap: wrap; gap: 2px 8px; }
  .mh .lbl br { display: none; }
  .hs { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .grid { gap: 4px; } .cl { border-radius: 6px; } .cl.next { font-size: 17px; }
  .wrow { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -12px 22px; padding: 2px 12px 6px; scrollbar-width: none; }
  .wt { flex: 0 0 78%; scroll-snap-align: start; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px; padding: 0 12px 2px; scrollbar-width: none; }
  .tabs button { flex: none; }
  .tabs .srch { order: -1; flex: 0 0 100%; margin: 0; }
  .tabs { flex-wrap: wrap; overflow: visible; }
  .rw { grid-template-columns: 38px minmax(0, 1fr); } .rw .st { grid-column: 2; }
}

.pp .mh .big { color: var(--ink); }
.pp .hu:hover { background: rgba(255,255,255,.05); }
.pp .hu[aria-pressed="true"] { background: #1E2B3C; box-shadow: 0 0 0 2px var(--yellow); }
.pp .hu .mini i { background: rgba(255,255,255,.08); } .pp .hu .mini i.g { background: rgba(143,179,255,.5); } .pp .hu .mini i.d { background: var(--gold); }
.pp .cl.e { border-color: rgba(255,255,255,.12); }
.pp .cl.g { background: color-mix(in oklch, var(--c) 22%, #141E2B); }
.pp .cl.work { background: #22324A; }
.pp .cl.next { border-color: var(--yellow); color: var(--yellow); }
.pp .cl.sel { box-shadow: 0 0 0 3px var(--yellow); }
.pp .wt { background: #172231; box-shadow: 0 12px 28px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.07); }
.pp .wt.slot { background: none; border-color: rgba(255,255,255,.18); box-shadow: none; }
.pp .tabs button[aria-selected="true"] { background: var(--yellow); color: #1A1406; border-color: var(--yellow); }
.pp .tabs button[aria-selected="true"] em { color: rgba(26,20,6,.6); }
.pp .rw:hover { background: rgba(255,255,255,.04); }
.pp .rw + .rw { border-color: rgba(255,255,255,.06); }
.pp .rw .st.w { color: var(--yellow); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><h1>1000 целей</h1><div class="lead" id="lead"></div></div></header>
  <div id="capHost"></div>
  <section class="map glass">
    <div>
      <div class="mh"><div class="big" id="big"></div><div class="lbl" id="mlbl"></div></div>
      <div class="mapl"><div class="hs" id="hs" role="group" aria-label="Сотни"></div><div>
      <div class="hh"><h3 id="hhT"></h3><span id="hhS"></span></div>
      <div class="grid" id="grid"></div></div></div>
    </div>
    <div class="pv">
      <div class="card hint" id="pv"></div>
      <div class="lg">
        <span><i style="background:color-mix(in oklch, var(--be) 30%, var(--card));border:1.5px solid var(--be)"></i>Быть</span>
        <span><i style="background:color-mix(in oklch, var(--do) 30%, var(--card));border:1.5px solid var(--do)"></i>Делать</span>
        <span><i style="background:color-mix(in oklch, var(--have) 30%, var(--card));border:1.5px solid var(--have)"></i>Иметь</span>
        <span><i style="background:var(--navy);box-shadow:0 0 0 2px var(--yellow)"></i>В работе</span>
        <span><i style="background:var(--gold)"></i>Исполнено</span>
        <span><i style="border:1.5px dashed var(--ink2)"></i>Свободная клетка</span>
      </div>
    </div>
  </section>
  <div class="below">
    <main>
      <div class="sec-h"><h3>В работе</h3><p id="wHint"></p></div>
      <div class="wrow" id="wrow"></div>
      <div class="sec-h"><h3>Все цели</h3></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="rows glass" id="rows"></div>
    </main>
    <aside class="side"><div class="sec-h"><h3>Исполняется прямо сейчас</h3></div><div class="feed" id="feed"></div></aside>
  </div>
</div>
<script src="wishes.js"></script>
<script>
(function () {
  const { S, nb, esc, T, CAT, IC, openSheet } = WI;
  const $ = s => document.querySelector(s);
  $('#capHost').innerHTML = WI.capHTML('Новая цель займёт следующую клетку…');
  const MOB = matchMedia('(max-width: 980px)');
  let hu = null, sel = null, freshId = null, tab = 'all', q = '', page = 1;
  const PER = 20;
  const live = () => S.live();
  const curHu = () => Math.min(9, Math.floor(live().length / 100));

  function top() {
    const tot = live().length, dn = S.done().length;
    $('#lead').textContent = nb(tot < 100 ? 'Каждая записанная цель занимает клетку. Заполни первую сотню, потом откроется следующая.' : 'Каждая записанная цель занимает клетку. Исполненные горят золотом.');
    $('#big').innerHTML = `${tot}<em> / 1000</em>`;
    $('#mlbl').innerHTML = nb(`клеток заполнено <br><b>${dn} исполнено</b> · ${S.work().length} в работе`);
  }

  function cls(g) { return g.st === 'done' ? 'done' : g.st === 'work' ? 'work' : 'g c-' + g.cat; }

  function hundreds() {
    const L = live(), c = curHu(); if (hu == null) hu = c;
    $('#hs').innerHTML = Array.from({ length: 10 }, (_, h) => {
      const mini = Array.from({ length: 100 }, (_, k) => { const g = L[h * 100 + k]; return `<i class="${g ? (g.st === 'done' ? 'd' : 'g') : ''}"></i>`; }).join('');
      const fill = Math.max(0, Math.min(100, L.length - h * 100));
      return `<button class="hu ${h > c ? 'locked' : ''}" data-h="${h}" aria-pressed="${h === hu}" aria-label="Сотня ${h * 100 + 1}–${h * 100 + 100}, заполнено ${fill}"><span class="mini">${mini}</span><small>${h * 100 + 1}–${h * 100 + 100}</small></button>`;
    }).join('');
  }

  function grid() {
    const L = live(), base = hu * 100, nextI = L.length;
    const inH = L.slice(base, base + 100);
    $('#hhT').textContent = `Сотня ${hu + 1}`;
    $('#hhS').textContent = nb(hu > curHu() ? 'откроется, когда заполнишь предыдущие' : `заполнено ${inH.length} из 100 · исполнено ${inH.filter(g => g.st === 'done').length}`);
    $('#grid').innerHTML = Array.from({ length: 100 }, (_, k) => {
      const i = base + k, g = L[i];
      if (g) return `<button class="cl ${cls(g)} ${g.id === freshId ? 'fresh' : ''} ${g.id === sel ? 'sel' : ''}" data-id="${g.id}" data-n="${i + 1}" aria-label="Цель ${i + 1}: ${esc(g.t)}">${g.st === 'done' ? IC.star : ''}</button>`;
      if (i === nextI) return `<button class="cl e next" data-next aria-label="Свободная клетка ${i + 1}: записать цель">+</button>`;
      return `<span class="cl e"></span>`;
    }).join('');
  }

  function preview(id) {
    const el = $('#pv');
    if (!id) {
      const L = live();
      el.className = 'card hint';
      el.innerHTML = `<b>${nb(L.length < 1000 ? 'Клетка ' + (L.length + 1) + ' ждёт цель' : 'Все 1000 клеток заполнены')}</b><p>${nb('Наведи на клетку, чтобы увидеть цель. Нажми, чтобы открыть, взять в работу или отметить исполненной.')}</p>`;
      return;
    }
    const g = S.get(id), n = live().indexOf(g) + 1;
    el.className = 'card';
    const st = g.st === 'done' ? `<span class="tag" style="color:var(--gold-ink)">${IC.cup}исполнено ${esc(g.doneAt)}</span>` : g.st === 'work' ? `<span class="tag">шаг ${g.sd} из ${g.sn}</span>` : `<span class="tag">${IC.clock}${esc(g.hor)}</span>`;
    el.innerHTML = `${WI.coverHTML(g)}<div class="in"><span class="no">Цель № ${n}</span><h4>${T(g.t)}</h4><div class="meta"><span class="pill c-${g.cat}"><i></i>${CAT[g.cat].l}</span>${st}</div><button class="btn pri" data-open="${g.id}">Открыть</button></div>`;
  }

  function workRow() {
    const ws = S.work();
    $('#wHint').textContent = nb(ws.length + ' из ' + S.MAXW + '. Шаги приходят в Фокус дня');
    const R = 20, C = 2 * Math.PI * R;
    const t = ws.map(g => `<button class="wt" data-id="${g.id}"><span class="ring" style="width:48px;height:48px"><svg viewBox="0 0 48 48"><circle class="tr" cx="24" cy="24" r="${R}" stroke-width="4"/><circle class="pr" cx="24" cy="24" r="${R}" stroke-width="4" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - g.sd / g.sn)}"/></svg><span class="ph cover c-${g.cat}" style="inset:6px">${g.img ? `<img src="${g.img}" alt="">` : `<b style="font-size:18px">${esc(g.t[0])}</b>`}</span></span><span><b>${T(g.t)}</b><small>шаг ${g.sd} из ${g.sn}</small></span></button>`);
    for (let i = ws.length; i < S.MAXW; i++) t.push(`<div class="wt slot">${nb('Свободно. Открой цель на карте')}</div>`);
    $('#wrow').innerHTML = t.join('');
  }

  function rows() {
    const L = live(), ql = q.trim().toLowerCase();
    const cnt = { all: L.length, be: 0, do: 0, have: 0, work: S.work().length, done: S.done().length };
    L.forEach(g => cnt[g.cat]++);
    const T2 = [['all', 'Все'], ['be', 'Быть'], ['do', 'Делать'], ['have', 'Иметь'], ['work', 'В работе'], ['done', 'Исполнено']];
    const searchVal = $('#tabs input')?.value ?? '';
    $('#tabs').innerHTML = T2.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${k === tab}">${l}<em>${cnt[k]}</em></button>`).join('') + `<label class="srch glass">${IC.search}<input placeholder="Найти" value="${esc(searchVal)}" autocomplete="off"></label>`;
    let it = L.filter(g => tab === 'all' || g.cat === tab || g.st === tab).filter(g => !ql || g.t.toLowerCase().includes(ql));
    it = it.slice().reverse();
    const shown = it.slice(0, page * PER);
    $('#rows').innerHTML = (shown.map(g => `<button class="rw c-${g.cat}" data-id="${g.id}"><span class="no">${L.indexOf(g) + 1}</span><b>${T(g.t)}</b><span class="st ${g.st === 'work' ? 'w' : g.st === 'done' ? 'd' : ''}">${g.st === 'work' ? 'в работе · ' + S.pct(g) + '%' : g.st === 'done' ? 'исполнено ' + esc(g.doneAt) : CAT[g.cat].l + ' · ' + esc(g.sph)}</span></button>`).join('') || `<p class="note" style="padding:10px 12px">Ничего не нашлось</p>`)
      + (it.length > shown.length ? `<button class="link pg" data-page>Показать ещё ${Math.min(PER, it.length - shown.length)} из ${it.length - shown.length}</button>` : '');
    $('#tabs input').oninput = e => { q = e.target.value; page = 1; rowsOnly(); };
  }
  function rowsOnly() { const p = $('#tabs input').selectionStart; rows(); const i = $('#tabs input'); i.focus(); i.setSelectionRange(p, p); }

  function render() { top(); hundreds(); grid(); preview(sel); workRow(); rows(); }
  render();
  S.on((why, id) => {
    freshId = why === 'add' ? id : null;
    if (why === 'add') { hu = curHu(); sel = id; }
    if (why === 'remove') sel = null;
    render();
  });

  $('#grid').addEventListener('pointerover', e => { if (MOB.matches || e.pointerType === 'touch') return; const c = e.target.closest('.cl[data-id]'); if (c) preview(c.dataset.id); });
  $('#grid').addEventListener('pointerleave', () => { if (!MOB.matches) preview(sel); });
  $('#grid').addEventListener('focusin', e => { const c = e.target.closest('.cl[data-id]'); if (c && !MOB.matches) preview(c.dataset.id); });
  document.addEventListener('click', e => {
    const h = e.target.closest('[data-h]'); if (h) { hu = +h.dataset.h; hundreds(); grid(); return; }
    if (e.target.closest('[data-next]')) { const c = $('#cap'); c.querySelector('input').focus(); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); c.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; page = 1; rows(); return; }
    if (e.target.closest('[data-page]')) { page++; rows(); return; }
    const o = e.target.closest('[data-open]'); if (o) { openSheet(o.dataset.open); return; }
    const c = e.target.closest('.cl[data-id]'); if (c) { sel = c.dataset.id; grid(); preview(sel); openSheet(sel); return; }
    const g = e.target.closest('[data-id]'); if (g && !e.target.closest('.sheet')) openSheet(g.dataset.id);
  });
})();
</script>
</body>
</html>
