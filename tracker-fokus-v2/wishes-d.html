<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1000 целей · Г · Полки + Карта 1000</title>
<link rel="stylesheet" href="wishes.css">
<style>
.vsw { margin-left: auto; display: flex; gap: 2px; padding: 4px; border-radius: 16px; }
.vsw button { height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--ink2); transition: background .2s, color .2s; }
.vsw button[aria-selected="true"] { background: var(--navy); color: var(--cream); }

/* карта: число, суммы, сотни, текущая сотня */
.map { margin-top: 20px; border-radius: 30px; padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 370px); gap: 30px; align-items: center; }
.mh { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.big { font: 400 72px/.8 "Bebas", sans-serif; color: var(--navy); letter-spacing: .01em; }
.big em { font-style: normal; font-size: 32px; color: var(--ink2); }
.sums { display: flex; gap: 18px; flex-wrap: wrap; padding-bottom: 2px; }
.sm b { display: block; font: 400 28px/1 "Bebas", sans-serif; letter-spacing: .01em; color: var(--ink); }
.sm b em { font-style: normal; font-size: 18px; color: var(--ink2); }
.sm span { font-size: 12.5px; color: var(--ink2); }
.sm.g b { color: var(--gold-ink); }
.hs { margin-top: 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.hu { border-radius: 13px; padding: 7px 7px 5px; text-align: center; transition: background .2s, box-shadow .2s, transform .25s var(--ease); }
.hu:hover { background: rgba(255,255,255,.55); transform: translateY(-2px); }
.hu[aria-pressed="true"] { background: var(--card); box-shadow: 0 0 0 2px var(--navy), 0 8px 18px rgba(20,34,70,.12); }
.hu .mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; }
.hu .mini i { aspect-ratio: 1; border-radius: 1px; background: oklch(0.22 0.13 268 / .08); }
.hu .mini i.g { background: oklch(0.22 0.13 268 / .42); }
.hu .mini i.w { background: oklch(0.22 0.13 268 / .85); }
.hu .mini i.d { background: var(--gold); }
.hu small { display: block; margin-top: 4px; font-size: 11px; font-weight: 650; color: var(--ink2); white-space: nowrap; }
.hu.nil { opacity: .55; }
.lg { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); }
.lg span { display: inline-flex; align-items: center; gap: 7px; }
.lg i { width: 13px; height: 13px; border-radius: 4px; flex: none; }
.lg .l1 { background: color-mix(in oklch, var(--do) 32%, var(--card)); border: 1.5px solid color-mix(in oklch, var(--do) 60%, transparent); }
.lg .l2 { background: var(--navy); box-shadow: 0 0 0 2px oklch(0.83 0.13 80 / .7); }
.lg .l3 { background: linear-gradient(145deg, oklch(0.9 0.12 88), var(--gold2)); }
.lg .l4 { border: 1.5px dashed oklch(0.22 0.13 268 / .25); }
.hh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hh h3 { margin: 0; font-size: 17px; font-weight: 750; }
.hh > span { font-size: 13px; color: var(--ink2); }
.hh .link { margin-left: auto; font-size: 13px; min-height: 28px; }
.grid { margin-top: 10px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.cl { aspect-ratio: 1; border-radius: 8px; position: relative; display: grid; place-items: center; transition: transform .2s var(--ease), box-shadow .2s; }
.cl.e { border: 1.5px dashed oklch(0.22 0.13 268 / .15); }
.cl.g { background: color-mix(in oklch, var(--c) 32%, var(--card)); border: 1.5px solid color-mix(in oklch, var(--c) 60%, transparent); }
.cl.work { background: var(--navy); box-shadow: 0 0 0 2.5px oklch(0.83 0.13 80 / .7); color: var(--yellow); }
.cl.done { background: linear-gradient(145deg, oklch(0.9 0.12 88), var(--gold2)); box-shadow: 0 0 12px oklch(0.8 0.14 82 / .55); color: oklch(0.35 0.08 70); }
.cl svg { width: 48%; height: 48%; }
.cl.next { border: 2px solid var(--navy); color: var(--navy); font: 400 16px/1 "Bebas", sans-serif; padding-top: 2px; animation: nx 1.6s ease-in-out infinite; }
@keyframes nx { 50% { box-shadow: 0 0 0 5px oklch(0.22 0.13 268 / .12); } }
.cl:not(.e):hover, .cl:focus-visible { transform: scale(1.14); z-index: 2; box-shadow: 0 8px 18px rgba(20,34,70,.22); outline: none; }
.cl.fresh { animation: pop 1.1s var(--ease); }
@keyframes pop { 0% { transform: scale(.3); } 50% { transform: scale(1.3); box-shadow: 0 0 0 4px var(--yellow); } }
.tip { margin-top: 10px; min-height: 44px; border-radius: 14px; background: var(--tile); padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.tip .hint { color: var(--ink2); font-size: 13px; }
.tip .no { font: 400 17px/1 "Bebas", sans-serif; color: var(--c); padding-top: 2px; flex: none; }
.tip b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tip em { margin-left: auto; font-style: normal; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }

.layout { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
main { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.side { position: sticky; top: 12px; }

/* в работе */
.wl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wk { border-radius: 22px; padding: 14px 14px 12px; color: var(--cream); background: radial-gradient(60% 70% at 85% 10%, oklch(0.42 0.14 268 / .5), transparent 70%), var(--nglass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 14px 30px rgba(10,20,60,.18); display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform .3s var(--ease); min-height: 200px; }
.wk:hover { transform: translateY(-2px); }
.wk.f { box-shadow: 0 0 0 2px var(--yellow), 0 14px 30px rgba(10,20,60,.2); }
.wk .wh { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.wk .no { font: 400 18px/1 "Bebas", sans-serif; color: var(--yellow); letter-spacing: .03em; padding-top: 2px; }
.wk .fb { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: var(--yellow); }
.wk .fb svg { width: 12px; height: 12px; }
.wk .fs { margin-left: auto; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--yellow); background: oklch(1 0 0 / .08); transition: background .2s; }
.wk .fs:hover { background: oklch(1 0 0 / .16); }
.wk .fs svg { width: 18px; height: 18px; }
.wk h4 { margin: 0; font-size: 15.5px; line-height: 1.25; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.wk .pb { height: 6px; border-radius: 3px; background: oklch(1 0 0 / .14); overflow: hidden; margin-top: 2px; }
.wk .pb i { display: block; height: 100%; border-radius: 3px; background: var(--yellow); transition: width .6s var(--ease); }
.wk .pr { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: oklch(0.85 0.03 268); line-height: 1.3; }
.wk .pr b { font: 400 22px/1 "Bebas", sans-serif; color: var(--yellow); flex: none; }
.wk .pr span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wk .btn { margin-top: auto; height: 38px; font-size: 13.5px; background: var(--yellow); color: var(--navy); align-self: flex-start; padding: 0 14px; }
.wk.slot { background: none; border: 1.5px dashed oklch(0.22 0.13 268 / .28); color: var(--ink2); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; justify-content: center; align-items: center; text-align: center; font-size: 13.5px; cursor: default; padding: 16px; }
.wk.slot b { font: 400 36px/1 "Bebas", sans-serif; color: var(--navy); }
.wk.slot:hover { transform: none; }
.more { margin-top: 10px; min-height: 40px; padding: 0 14px; border-radius: 13px; font-size: 13.5px; font-weight: 700; color: var(--navy); background: var(--tile); display: inline-flex; align-items: center; }
.shelf .more { color: var(--c); background: color-mix(in oklch, var(--c) 10%, transparent); }

/* поиск и фильтры */
.tools { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 12px; }
.tl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.srch { flex: 1; min-width: 200px; height: 44px; border-radius: 14px; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.srch #sicon svg { width: 17px; height: 17px; color: var(--ink2); display: block; }
.srch input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; }
.sel { height: 44px; border-radius: 14px; padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.hc { height: 44px; padding: 0 12px 0 14px; border-radius: 14px; background: var(--navy); color: var(--cream); font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.hc svg { width: 15px; height: 15px; }
.sph { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sph::-webkit-scrollbar { display: none; }
.sph button { flex: none; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--glass); border: 1px solid var(--glass-b); transition: background .2s, color .2s; }
.sph button[aria-pressed="true"] { background: var(--navy); color: var(--cream); border-color: var(--navy); }

/* полки со строками */
.shelves { display: flex; flex-direction: column; gap: 14px; }
.shelf { border-radius: 26px; padding: 14px 10px 12px; }
.shh { display: flex; align-items: center; gap: 10px; margin: 0 6px 6px; }
.shh .dot { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in oklch, var(--c) 14%, transparent); color: var(--c); font: 400 20px/1 "Bebas", sans-serif; padding-top: 2px; flex: none; }
.shh h4 { margin: 0; font-size: 17px; font-weight: 750; }
.shh small { display: block; font-size: 12.5px; color: var(--ink2); }
.shh .n { margin-left: auto; font: 400 24px/1 "Bebas", sans-serif; color: var(--c); }
.shh .sum { font-size: 12.5px; font-weight: 650; color: var(--ink2); white-space: nowrap; }
.rows { display: flex; flex-direction: column; }
.rw { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; text-align: left; transition: background .2s; }
.rw:hover { background: rgba(255,255,255,.6); }
.rw + .rw { border-top: 1px solid oklch(0.89 0.015 85 / .55); }
.rw .no { font: 400 18px/1 "Bebas", sans-serif; color: var(--c); text-align: center; padding-top: 2px; letter-spacing: .02em; }
.rw .tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rw .tx b { font-size: 14.5px; font-weight: 620; line-height: 1.3; overflow-wrap: anywhere; }
.rw .mt { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink2); align-items: center; }
.rw .pg { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--navy); }
.rw .pg i { width: 46px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--navy) var(--p), oklch(0.22 0.13 268 / .14) var(--p)); }
.rw .fz { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--gold-ink); }
.rw .fz svg, .rw .lk svg { width: 12px; height: 12px; }
.rw .lk { display: inline-flex; }
.rw .cs { font-size: 13.5px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rw .nw { height: 20px; padding: 0 8px; border-radius: 999px; background: var(--yellow); color: var(--navy); font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; letter-spacing: .02em; }
.rw.fresh { background: oklch(0.83 0.13 80 / .2); box-shadow: inset 0 0 0 2px oklch(0.83 0.13 80 / .8); animation: rin 1s var(--ease); }
@keyframes rin { from { transform: translateY(-14px); opacity: 0; } }
.empty { font-size: 13.5px; color: var(--ink2); padding: 8px 10px; }

/* стена исполненного */
.wall { border-radius: 26px; padding: 18px; background: radial-gradient(70% 90% at 100% 0%, oklch(0.93 0.07 88 / .9), transparent 70%), var(--glass); }
.wsh { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.wsh .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--gold); color: oklch(0.3 0.08 70); flex: none; }
.wsh .ic svg { width: 22px; height: 22px; }
.wsh h4 { margin: 0; font-size: 18px; font-weight: 750; }
.wsh small { display: block; font-size: 12.5px; color: var(--ink2); }
.wsh .n { margin-left: auto; font: 400 34px/1 "Bebas", sans-serif; color: var(--gold-ink); }
.tro { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.tp { border-radius: 18px; padding: 12px 14px; text-align: left; background: linear-gradient(160deg, oklch(0.97 0.04 88), oklch(0.92 0.07 85)); border: 1px solid oklch(0.86 0.08 85); display: flex; flex-direction: column; gap: 6px; min-height: 92px; transition: transform .3s var(--ease); }
.tp:hover { transform: translateY(-3px) rotate(-.4deg); }
.tp .d { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--gold-ink); display: flex; align-items: center; gap: 5px; }
.tp .d svg { width: 13px; height: 13px; }
.tp b { font-size: 14.5px; line-height: 1.28; font-weight: 700; color: oklch(0.3 0.05 70); }
.wall .none { margin: 0; font-size: 14px; color: var(--ink2); }

/* карта желаний картинками */
.bbar { margin-top: 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btabs { display: flex; gap: 4px; padding: 4px; border-radius: 16px; overflow-x: auto; scrollbar-width: none; }
.btabs button { flex: none; height: 38px; padding: 0 13px; border-radius: 12px; font-size: 13.5px; font-weight: 650; color: var(--ink2); display: inline-flex; gap: 6px; align-items: center; }
.btabs button em { font-style: normal; font-weight: 500; opacity: .75; }
.btabs button[aria-selected="true"] { background: var(--navy); color: var(--cream); }
.bbar .sp { margin-left: auto; display: flex; gap: 8px; }
.board { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-auto-rows: 118px; grid-auto-flow: dense; gap: 10px; }
.bt { position: relative; border-radius: 22px; overflow: hidden; grid-row: span 2; text-align: left; box-shadow: 0 10px 26px rgba(20,34,70,.14); transition: transform .3s var(--ease); }
.bt.im { grid-row: span 3; }
.bt.wd { grid-column: span 2; }
.bt:hover { transform: translateY(-3px); }
.bt .cover { position: absolute; inset: 0; }
.bt .cover .lt { font-size: 190px; bottom: -18%; }
.bt .cover .sp { display: none; }
.bt .sh { position: absolute; inset: 35% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.bt b { position: absolute; left: 14px; right: 14px; bottom: 12px; color: #fff; font-size: 15px; line-height: 1.25; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bt .no { position: absolute; left: 14px; top: 12px; font: 400 16px/1 "Bebas", sans-serif; color: rgba(255,255,255,.85); letter-spacing: .04em; }
.bt .bd2 { position: absolute; right: 10px; top: 10px; height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; }
.bt .bd2 svg { width: 13px; height: 13px; }
.bt .bd2.d { background: var(--gold); color: oklch(0.3 0.08 70); }
.bt .bd2.w { background: var(--navy); color: var(--yellow); }
.bt.dn { box-shadow: 0 0 0 3px var(--gold), 0 10px 26px rgba(150,110,20,.2); }
#bmore { text-align: center; }
.none { color: var(--ink2); }

/* шторка: доп. элементы */
.cvw { position: relative; flex: none; }
.cvact { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 2; }
.cb { height: 34px; padding: 0 11px; border-radius: 11px; background: rgba(0,0,0,.34); color: #fff; font-size: 12.5px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .2s; }
.cb:hover { background: rgba(0,0,0,.5); }
.cb svg { width: 15px; height: 15px; }
.sheet .cvw .cv .sp { left: auto; right: 14px; bottom: 14px; }
.sh-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sh-h .no { font: 400 20px/1 "Bebas", sans-serif; color: var(--ink2); letter-spacing: .04em; padding-top: 2px; }
.sh-h .ed { margin-left: auto; height: 36px; padding: 0 12px; border-radius: 11px; background: var(--tile); font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.sh-h .ed svg { width: 15px; height: 15px; }
.sh-h .ttl { font-size: 15px; font-weight: 750; }
.facts dd .link { font-size: 14px; min-height: 0; }
.way { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.way p { margin: 0 0 2px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.opt { border-radius: 16px; padding: 12px 14px; text-align: left; background: var(--tile); border: 1.5px solid transparent; display: flex; flex-direction: column; gap: 3px; transition: border-color .2s, transform .25s var(--ease); }
.opt:hover { border-color: var(--navy); transform: translateY(-1px); }
.opt b { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 750; }
.opt b svg { width: 18px; height: 18px; }
.opt small { font-size: 12.5px; color: var(--ink2); line-height: 1.35; }
.opt.g { background: var(--gold-bg); }
.opt.g b { color: var(--gold-ink); }
.opt.g:hover { border-color: var(--gold); }
.sheet .prog .lbl b { font: 400 22px/1 "Bebas", sans-serif; color: var(--ink); }
.st2 { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.st2 li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.st2 .ck { width: 24px; height: 24px; border-radius: 50%; border: 2px solid oklch(0.22 0.13 268 / .28); flex: none; display: grid; place-items: center; position: relative; }
.st2 .ck::before { content: ""; position: absolute; inset: -10px; }
.st2 li.on .ck { background: var(--ok); border-color: var(--ok); }
.st2 li.on .ck::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.st2 li.on .tx { color: var(--ink2); text-decoration: line-through; }
.st2 .tx { flex: 1; min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }
.st2 .wt { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.st2 .wt button { width: 30px; height: 30px; border-radius: 9px; background: var(--tile); font-weight: 700; font-size: 16px; }
.st2 .wt b { min-width: 38px; text-align: center; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
.st2 .fl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 750; color: var(--gold-ink); text-transform: uppercase; letter-spacing: .03em; flex: none; }
.st2 .fl svg { width: 14px; height: 14px; }
.st2 li.fin .tx { font-weight: 700; }
.st2 .rm { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--ink2); flex: none; opacity: .6; }
.st2 .rm:hover { opacity: 1; background: var(--tile); }
.st2 .rm svg { width: 14px; height: 14px; }
.addst { margin-top: 10px; display: flex; gap: 6px; }
.addst input { flex: 1; min-width: 0; height: 42px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--card); padding: 0 12px; font-size: 14.5px; outline: none; }
.addst input:focus { border-color: var(--navy); }
.addst .btn { width: 42px; height: 42px; padding: 0; }
.sug { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.sug button { min-height: 32px; padding: 4px 11px; border-radius: 10px; border: 1px dashed oklch(0.22 0.13 268 / .3); font-size: 12.5px; font-weight: 600; color: var(--ink2); text-align: left; }
.sug button:hover { color: var(--ink); border-style: solid; }
.sheet .note .link { font-size: 13px; min-height: 0; }
.sheet .acts .btn.on svg { color: var(--gold-ink); }
.ef { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.fld > small { font-weight: 500; font-size: 12px; }
.fld textarea { font-family: inherit; }
.fld textarea, .fld input, .fld select { width: 100%; border-radius: 13px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; font-weight: 550; outline: none; transition: border-color .2s; }
.fld textarea { padding: 10px 12px; resize: vertical; line-height: 1.35; min-height: 64px; }
.fld input, .fld select { height: 44px; padding: 0 12px; }
.fld :is(textarea, input, select):focus { border-color: var(--navy); }
.fld .seg { align-self: flex-start; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mny { display: flex; gap: 6px; }
.mny input { flex: 1; font-variant-numeric: tabular-nums; }
.mny select { width: 72px; flex: none; }
.imgrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.imgrow .btn { height: 40px; font-size: 13.5px; padding: 0 13px; cursor: pointer; }
.ef .acts { margin-top: 4px; }

/* обои */
.wp { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 16px; background: rgba(12,18,40,.55); opacity: 0; pointer-events: none; transition: opacity .3s; }
.wp.on { opacity: 1; pointer-events: auto; }
.wbox { width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; border-radius: 28px; padding: 20px; background: oklch(0.99 0.006 85); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 12px; transform: translateY(16px); transition: transform .4s var(--ease); }
.wp.on .wbox { transform: none; }
.wtop { display: flex; align-items: center; }
.wtop h3 { margin: 0; font-size: 20px; font-weight: 750; }
.x2 { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); }
.x2 svg { width: 18px; height: 18px; }
.wbox .seg { align-self: flex-start; }
.cvs { display: grid; place-items: center; background: var(--tile); border-radius: 18px; padding: 14px; }
.cvs canvas { display: block; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.cvs canvas.dk { width: 100%; height: auto; }
.cvs canvas.ph { height: min(56vh, 520px); width: auto; }
.wbox .note { margin: 0; }
.wbox .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 1060px) { .map { grid-template-columns: 1fr; } .layout { grid-template-columns: 1fr; } .side { position: static; } }
@media (max-width: 760px) {
  .vsw { margin-left: 0; width: 100%; } .vsw button { flex: 1; }
  .map { padding: 16px 12px; border-radius: 24px; margin-top: 16px; gap: 18px; }
  .map:not(.open) > div:last-child { display: none; }
  .big { font-size: 56px; } .big em { font-size: 26px; }
  .mh { gap: 14px; } .sums { gap: 14px; } .sm b { font-size: 24px; }
  .hs { gap: 5px; margin-top: 14px; } .hu { padding: 4px 3px 3px; } .hu small { font-size: 9.5px; }
  .grid { gap: 3px; } .cl { border-radius: 5px; } .cl.next { font-size: 12px; }
  .layout { margin-top: 20px; }
  .wl { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -12px; padding: 2px 12px 8px; scrollbar-width: none; }
  .wl::-webkit-scrollbar { display: none; }
  .wk { flex: 0 0 80%; scroll-snap-align: start; }
  .srch { flex-basis: 100%; min-width: 0; }
  .sel { flex: 1; }
  .sph { margin: 0 -12px; padding: 0 12px 2px; }
  .shelf { padding: 12px 4px 10px; border-radius: 22px; }
  .shh { flex-wrap: wrap; } .shh .sum { flex-basis: 100%; padding-left: 44px; margin-top: -4px; }
  .rw { grid-template-columns: 38px minmax(0, 1fr); padding: 9px 8px; gap: 8px; }
  .rw .cs { grid-column: 2; font-size: 12.5px; color: var(--ink); margin-top: -2px; }
  .rw .cs:empty { display: none; }
  .tro { grid-template-columns: 1fr 1fr; }
  .bbar .sp { margin-left: 0; width: 100%; } .bbar .sp .btn { flex: 1; padding: 0 10px; }
  .btabs { width: 100%; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 96px; gap: 8px; }
  .bt { border-radius: 18px; } .bt b { font-size: 13.5px; left: 11px; right: 11px; bottom: 10px; }
  .two { grid-template-columns: 1fr; }
  .cvs canvas.ph { height: 48vh; }
  .wbox { padding: 16px; border-radius: 24px; }
}

/* тёмная тема */
.pp .vsw button[aria-selected="true"], .pp .btabs button[aria-selected="true"], .pp .sph button[aria-pressed="true"] { background: var(--yellow); color: #1A1406; border-color: var(--yellow); }
.pp .big { color: var(--ink); }
.pp .hu:hover { background: rgba(255,255,255,.05); }
.pp .hu[aria-pressed="true"] { background: #1E2B3C; box-shadow: 0 0 0 2px var(--yellow); }

.pp .hu .mini i.g { background: rgba(143,179,255,.45); }
.pp .hu .mini i.w { background: rgba(143,179,255,.95); }
.pp .hu .mini i.d { background: var(--gold); }
.pp .lg .l2 { background: #22324A; }
.pp .lg .l4 { border-color: rgba(255,255,255,.18); }

.pp .wk { background: radial-gradient(60% 70% at 85% 10%, rgba(240,208,128,.1), transparent 70%), #172231; box-shadow: 0 14px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.07); }
.pp .wk.f { box-shadow: 0 0 0 2px var(--yellow), 0 14px 30px rgba(0,0,0,.4); }
.pp .wk .btn { color: #1A1406; }
.pp .wk.slot { background: none; box-shadow: none; border-color: rgba(255,255,255,.18); }
.pp .wk.slot b { color: var(--yellow); }
.pp .more { color: var(--yellow); }
.pp .shelf .more { color: var(--c); }
.pp .hc { background: var(--yellow); color: #1A1406; }
.pp .rw:hover { background: rgba(255,255,255,.04); }
.pp .rw + .rw { border-color: rgba(255,255,255,.06); }
.pp .rw .pg { color: var(--yellow); }
.pp .rw .pg i { background: linear-gradient(90deg, var(--yellow) var(--p), rgba(255,255,255,.12) var(--p)); }
.pp .rw.fresh { background: rgba(240,208,128,.1); box-shadow: inset 0 0 0 2px rgba(240,208,128,.6); }
.pp .rw .nw { color: #1A1406; }
.pp .wall { background: radial-gradient(70% 90% at 100% 0%, rgba(240,208,128,.14), transparent 70%), var(--glass); }
.pp .tp { background: linear-gradient(160deg, rgba(240,208,128,.16), rgba(240,208,128,.06)); border-color: rgba(240,208,128,.28); }
.pp .tp b { color: var(--ink); }
.pp .wsh .ic { color: #1A1406; }
.pp .bt .bd2.w { background: #172231; }
.pp .bt .bd2.d { color: #1A1406; }
.pp .bt.dn { box-shadow: 0 0 0 3px rgba(240,208,128,.7), 0 10px 26px rgba(0,0,0,.4); }
.pp .opt:hover { border-color: var(--yellow); }
.pp .st2 .ck { border-color: rgba(255,255,255,.3); }
.pp .addst input, .pp .fld :is(textarea, input, select) { background: #141E2B; }
.pp .addst input:focus, .pp .fld :is(textarea, input, select):focus { border-color: var(--yellow); }
.pp .sug button { border-color: rgba(255,255,255,.2); }
.pp .wbox { background: #172231; }
.pp .wk .fs { background: rgba(255,255,255,.06); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><h1>1000 целей</h1><div class="lead" id="lead"></div></div>
    <div class="vsw glass" role="tablist" aria-label="Вид"><button role="tab" data-v="list">Список</button><button role="tab" data-v="board">Карта желаний</button></div></header>
  <div id="capHost"></div>

  <div id="vList">
    <section class="map glass">
      <div>
        <div class="mh"><div class="big" id="big"></div><div class="sums" id="sums"></div></div>
        <div class="hs" id="hs" role="group" aria-label="Сотни целей"></div>
        <div class="lg"><span><i class="l1"></i>записана</span><span><i class="l2"></i>в работе</span><span><i class="l3"></i>исполнена</span><span><i class="l4"></i>свободно</span></div>
      </div>
      <div>
        <div class="hh"><h3 id="hhT"></h3><span id="hhS"></span><button class="link" id="hhF"></button></div>
        <div class="grid" id="grid"></div>
        <div class="tip" id="tip" aria-live="polite"></div>
      </div>
    </section>

    <div class="layout">
      <main>
        <section id="work"></section>
        <section class="tools" id="tools">
          <div class="tl"><label class="srch glass"><span id="sicon"></span><input id="q" placeholder="Найти цель" autocomplete="off" aria-label="Поиск по целям"></label>
            <select class="sel glass" id="sort" aria-label="Порядок"><option value="new">Сначала новые</option><option value="num">По номеру</option><option value="cost_desc">Дороже сверху</option><option value="cost_asc">Дешевле сверху</option></select>
            <span id="hchip"></span></div>
          <div class="sph" id="sph" role="group" aria-label="Сфера Колеса баланса"></div>
        </section>
        <div class="shelves" id="shelves"></div>

      </main>
      <aside class="side"><div class="sec-h"><h3>Исполняется прямо сейчас</h3></div><div class="feed" id="feed"></div></aside>
    </div>
  </div>

  <div id="vBoard" hidden>
    <div class="bbar"><div class="btabs glass" id="btabs" role="tablist"></div>
      <div class="sp"><button class="btn soft" data-bsh>Перемешать</button><button class="btn pri" data-wp>Сделать обои</button></div></div>
    <div class="board" id="board"></div>
    <div id="bmore"></div>
  </div>
</div>
