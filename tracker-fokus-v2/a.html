<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фокус дня · А · Поход</title>
<script src="shared.js"></script>
<style>
@font-face { font-family: "Medeo Sans"; src: url(fonts/MedeoSansVariable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Bebas"; src: url(fonts/bebasneue-bold.woff2) format("woff2"); font-display: swap; }
:root {
  --navy: oklch(0.22 0.13 268); --navy2: oklch(0.32 0.11 268); --yellow: oklch(0.83 0.13 80); --fire: oklch(0.7 0.17 50);
  --cream: oklch(0.972 0.013 85); --card: oklch(0.994 0.004 85); --ink: oklch(0.22 0.03 268); --ink2: oklch(0.47 0.03 268);
  --line: oklch(0.89 0.015 85); --tile: oklch(0.955 0.014 85);
  --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); font: 400 15px/1.45 "Medeo Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 120px; }
.top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 750; color: var(--navy); letter-spacing: -.02em; }
.top .date { color: var(--ink2); font-size: 14px; margin-bottom: 3px; }
.chips { margin-left: auto; display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.chip svg { width: 16px; height: 16px; }
.chip .fl { color: var(--fire); } .chip .xp { color: var(--yellow); }
.chip b { font: 400 20px/1 "Bebas", sans-serif; letter-spacing: .02em; padding-top: 3px; }

/* ---------- сцена ---------- */
.scene { position: relative; margin-top: 18px; border-radius: 28px; overflow: hidden; height: 520px; isolation: isolate; }
.scene svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.trails { position: absolute; top: 18px; left: 18px; display: flex; gap: 6px; z-index: 3; flex-wrap: wrap; }
.trail-t { height: 34px; padding: 0 14px; border-radius: 999px; background: oklch(0.99 0.005 85 / .72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; font-weight: 600; color: var(--ink2); transition: background .25s, color .25s; }
.trail-t.on { background: var(--navy); color: var(--cream); }
.goalcard { position: absolute; left: 18px; top: 18px; z-index: 3; width: 340px; padding: 14px 18px 16px; border-radius: 20px; background: oklch(0.99 0.006 85 / .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.with-trails .goalcard { top: 62px; }
.goalcard small { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: .02em; }
.goalcard h2 { margin: 2px 0 0; font-size: 21px; line-height: 1.2; font-weight: 750; color: var(--navy); letter-spacing: -.01em; }
.goalcard .nums { margin-top: 10px; display: flex; align-items: baseline; gap: 10px; }
.goalcard .nums b { font: 400 40px/0.9 "Bebas", sans-serif; color: var(--navy); }
.goalcard .nums span { font-size: 13px; color: var(--ink2); }
.daybox { position: absolute; right: 18px; top: 18px; z-index: 3; padding: 12px 16px; border-radius: 18px; background: oklch(0.99 0.006 85 / .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); width: 440px; }
.dayin .dots, .daybox .dots { margin-top: 8px; }
.dayin { margin-top: 14px; padding-top: 12px; border-top: 1px solid oklch(0.22 0.13 268 / .1); }
.daybox small, .dayin small { font-size: 12px; font-weight: 600; color: var(--ink2); }
.dayin .dl, .daybox .dl { margin-top: 2px; font-size: 17px; font-weight: 750; color: var(--navy); }
.dayin .dots, .daybox .dots { margin-top: 8px; display: flex; gap: 6px; }
.dayin .d, .daybox .d { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--ink2); }
.dayin .d i, .daybox .d i { height: 6px; border-radius: 6px; background: oklch(0.22 0.13 268 / .1); overflow: hidden; display: block; }
.dayin .d i em, .daybox .d i em { display: block; height: 100%; background: var(--yellow); border-radius: 6px; transition: width .7s var(--ease); }

/* ---------- док действия ---------- */
.dock { position: absolute; right: 18px; bottom: 18px; z-index: 4; width: 440px; padding: 16px; border-radius: 22px; background: oklch(0.99 0.006 85 / .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 18px 40px oklch(0.22 0.13 268 / .18); }
.dock .k { font-size: 12px; font-weight: 600; color: var(--ink2); }
.dock .st { margin-top: 2px; font-size: 19px; font-weight: 700; line-height: 1.3; color: var(--ink); }
.dock .row { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
.go { flex: 1; height: 54px; border-radius: 16px; background: var(--navy); color: var(--cream); font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
.go:hover { transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.22 0.13 268 / .3); }
.go:active { transform: scale(.97); }
.go svg { width: 20px; height: 20px; }
.ghost { height: 54px; padding: 0 16px; border-radius: 16px; color: var(--ink2); font-weight: 600; font-size: 14px; }
.ghost:hover { background: var(--tile); }
.signs { margin-top: 10px; display: grid; gap: 8px; }
.sign { position: relative; text-align: left; padding: 12px 44px 12px 16px; border-radius: 14px; background: var(--tile); font-size: 15px; font-weight: 600; line-height: 1.3; transition: transform .3s var(--ease), background .2s; }
.sign::after { content: "→"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--ink2); transition: transform .3s var(--ease); }
.sign:hover { background: oklch(0.93 0.03 85); transform: translateX(4px); }
.sign:hover::after { transform: translate(4px, -50%); color: var(--navy); }
.sign small { display: block; font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 2px; }
.sign.first { background: oklch(0.9 0.07 85); }
.won { display: flex; gap: 14px; align-items: center; }
.won img { width: 64px; height: 64px; object-fit: contain; }
.won b { display: block; font-size: 19px; color: var(--navy); }
.won span { font-size: 14px; color: var(--ink2); }

/* ---------- под сценой ---------- */
.below { margin-top: 22px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }
.block h3 { margin: 0 0 4px; font-size: 19px; font-weight: 750; color: var(--navy); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
.block h3 span { font-size: 13px; font-weight: 600; color: var(--ink2); }
.block p.hint { margin: 0 0 12px; font-size: 13px; color: var(--ink2); }
.fires { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fire { position: relative; text-align: left; padding: 16px 14px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); transition: transform .3s var(--ease), border-color .2s, background .3s; min-height: 168px; display: flex; flex-direction: column; }
.fire:hover { transform: translateY(-3px); border-color: oklch(0.8 0.06 70); }
.fire.on { background: oklch(0.96 0.04 75); border-color: oklch(0.85 0.09 70); }
.fire .flame { width: 46px; height: 46px; }
.fire .flame path.f { fill: oklch(0.85 0.01 85); transition: fill .4s; }
.fire.on .flame path.f1 { fill: var(--fire); } .fire.on .flame path.f2 { fill: var(--yellow); }
.fire.on .flame g.fl { animation: flick 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flick { 0%,100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.06, .96) rotate(2deg); } }
.fire b { margin-top: 10px; font-size: 15px; font-weight: 650; line-height: 1.25; }
.fire .sk { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink2); }
.fire .wk { display: flex; gap: 3px; }
.fire .wk i { width: 7px; height: 7px; border-radius: 50%; background: oklch(0.86 0.015 85); }
.fire .wk i.on { background: var(--fire); }
.pack { border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 6px; }
.item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 14px; text-align: left; transition: background .2s; }
.item:hover { background: var(--tile); }
.item .ck { width: 24px; height: 24px; border-radius: 8px; border: 2px solid oklch(0.22 0.13 268 / .3); display: grid; place-items: center; flex: none; transition: background .25s, border-color .25s, transform .3s var(--ease); }
.item .ck svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s var(--ease); color: var(--cream); }
.item.done .ck { background: var(--navy); border-color: var(--navy); }
.item.done .ck svg { opacity: 1; transform: none; }
.item .tt { flex: 1; font-size: 15px; }
.item.done .tt { color: var(--ink2); text-decoration: line-through; text-decoration-color: oklch(0.47 0.03 268 / .5); }
.tag { font-size: 11px; font-weight: 650; padding: 4px 8px; border-radius: 999px; background: oklch(0.94 0.05 75); color: oklch(0.45 0.12 60); white-space: nowrap; }
.tag.red { background: oklch(0.94 0.04 25); color: oklch(0.5 0.17 25); }
.mates { margin-top: 22px; }
.mates .list { display: flex; gap: 10px; flex-wrap: wrap; }
.mate { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.mate i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--cream); font-style: normal; font-weight: 700; font-size: 12px; flex: none; }
.mate b { font-weight: 650; }
.col { display: flex; flex-direction: column; gap: 22px; }

.conf { position: absolute; z-index: 6; pointer-events: none; width: 8px; height: 12px; border-radius: 2px; }

@media (max-width: 760px) {
  .wrap { padding: 16px 12px 120px; }
  .top h1 { font-size: 24px; }
  .chips { margin-left: 0; width: 100%; }
  .scene { height: auto; border-radius: 0; overflow: visible; }
  .scene svg.map { position: relative; display: block; height: 380px; border-radius: 22px; }
  .goalcard { left: 10px; top: 10px; width: 210px; padding: 10px 12px 12px; } .dayin .dots { display: none; } .dayin { margin-top: 8px; padding-top: 8px; } .dayin .dl { font-size: 14px; }
  .with-trails .goalcard { top: 52px; }
  .trails { top: 10px; left: 10px; }
  .goalcard h2 { font-size: 16px; } .goalcard .nums b { font-size: 30px; }
  .daybox { right: 10px; top: auto; bottom: 10px; width: calc(100% - 20px); padding: 10px 12px; }
  .dayin .dl, .daybox .dl { font-size: 14px; display: inline; margin-left: 6px; }
  .dock { position: relative; left: auto; bottom: auto; transform: none; width: 100%; margin-top: 12px; box-shadow: none; border: 1px solid var(--line); }
  .below { grid-template-columns: 1fr; }
  .fires { grid-template-columns: 1fr; }
  .fire { min-height: 0; flex-direction: row; align-items: center; gap: 12px; padding: 12px; }
  .fire b { margin-top: 0; flex: 1; }
  .fire .flame { width: 36px; height: 36px; flex: none; }
  .fire .sk { margin-top: 0; padding-top: 0; flex-direction: column; align-items: flex-end; gap: 4px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Фокус дня</h1><div class="date">Суббота, 14&nbsp;ноября</div></div>
    <div class="chips">
      <span class="chip"><svg class="fl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg><b id="streak">12</b> дней в&nbsp;пути</span>
      <span class="chip"><svg class="xp" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b id="xp">40</b> XP сегодня</span>
    </div>
  </div>

  <section class="scene" id="scene">
    <svg class="map" id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="oklch(0.95 0.1 85)" stop-opacity=".9"/><stop offset="1" stop-color="oklch(0.95 0.1 85)" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1000" height="520" fill="url(#sky)"/>
      <g id="sun"><circle r="90" fill="url(#glow)"/><circle r="34" fill="oklch(0.9 0.12 85)"/></g>
      <path d="M0 330 C 120 260 220 300 330 250 S 520 190 640 230 S 860 170 1000 210 V520 H0Z" fill="oklch(0.62 0.06 268 / .35)"/>
      <path d="M0 380 C 160 330 260 370 420 320 S 700 300 820 280 S 940 270 1000 260 V520 H0Z" fill="oklch(0.5 0.08 268 / .45)"/>
      <path d="M0 450 C 200 420 330 460 520 420 S 820 380 1000 400 V520 H0Z" fill="oklch(0.36 0.1 268 / .7)"/>
      <path id="trail" d="M60 480 C 170 470 230 430 320 400 S 440 360 500 310 S 560 230 640 205 S 780 170 880 120" fill="none" stroke="oklch(0.98 0.01 85 / .55)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
      <path id="lit" d="M60 480 C 170 470 230 430 320 400 S 440 360 500 310 S 560 230 640 205 S 780 170 880 120" fill="none" stroke="var(--yellow)" stroke-width="6" stroke-linecap="round"/>
      <g id="pts"></g>
      <image id="cup" href="img/focus-cup.webp" width="74" height="74"/>
      <g id="frimi"><image id="frimiImg" href="img/focus-flag.webp" width="150" height="150" x="-75" y="-140"/></g>
    </svg>
    <div class="trails" id="trails"></div>
    <div class="goalcard" id="goalcard"></div>
    
    <div class="dock" id="dock"></div>
  </section>

  <div class="below">
    <div class="block">
      <h3>Стоянки <span id="hbc"></span></h3>
      <p class="hint">Привычки дня. Зажги костёр — серия растёт.</p>
      <div class="fires" id="fires"></div>
    </div>
    <div class="col">
      <div class="block">
        <h3>Рюкзак <span id="tkc"></span></h3>
        <p class="hint">Задачи дня. Важные сверху.</p>
        <div class="pack" id="pack"></div>
      </div>
    </div>
  </div>
  <div class="block mates">
    <h3>Попутчики сегодня</h3>
    <p class="hint">Кто из&nbsp;Альянса тоже в&nbsp;пути.</p>
    <div class="list" id="mates"></div>
  </div>
</div>
<script>
(function () {
  const S = FD, $ = s => document.querySelector(s);
  const svg = $('#map'), trail = $('#trail'), lit = $('#lit'), L = trail.getTotalLength();
  const ease = 'cubic-bezier(.22,1,.36,1)';
  const evening = () => S.mode === 'evening';
  // небо: утро светлое, вечер тёплый закат
  const sky = $('#sky');
  sky.innerHTML = S.mode === 'morning'
    ? '<stop offset="0" stop-color="oklch(0.86 0.06 240)"/><stop offset=".65" stop-color="oklch(0.95 0.03 90)"/><stop offset="1" stop-color="oklch(0.96 0.03 85)"/>'
    : '<stop offset="0" stop-color="oklch(0.42 0.1 280)"/><stop offset=".55" stop-color="oklch(0.74 0.1 30)"/><stop offset="1" stop-color="oklch(0.88 0.08 70)"/>';
  lit.style.strokeDasharray = L;
  const pt = (g, i) => trail.getPointAtLength(L * i / g.total);
  let shown = -1;

  function drawTrail(animate) {
    const g = S.goal();
    const pts = $('#pts'); pts.innerHTML = '';
    for (let i = 0; i <= g.total; i++) {
      const p = pt(g, i), c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      const done = i <= g.done, plan = g.planned != null && i === g.done + 1;
      c.setAttribute('r', plan ? 11 : done ? 7 : 5);
      c.setAttribute('fill', done ? 'var(--yellow)' : plan ? 'oklch(0.99 0.005 85)' : 'oklch(0.99 0.005 85 / .7)');
      if (plan) { c.setAttribute('stroke', 'var(--yellow)'); c.setAttribute('stroke-width', '4'); c.style.animation = 'none'; }
      pts.append(c);
    }
    const end = pt(g, g.total); const cup = $('#cup'); cup.setAttribute('x', end.x - 20); cup.setAttribute('y', end.y - 74);
    const off = L * (1 - g.done / g.total);
    if (animate) lit.animate([{ strokeDashoffset: L * (1 - (g.done - 1) / g.total) }, { strokeDashoffset: off }], { duration: 900, easing: ease, fill: 'forwards' });
    lit.style.strokeDashoffset = off;
    const p = pt(g, g.done), fr = $('#frimi');
    if (animate && shown >= 0) {
      const a = pt(g, g.done - 1);
      fr.animate([
        { transform: `translate(${a.x}px, ${a.y}px)` },
        { transform: `translate(${(a.x + p.x) / 2}px, ${Math.min(a.y, p.y) - 70}px)`, offset: .5 },
        { transform: `translate(${p.x}px, ${p.y}px)` }], { duration: 700, easing: 'cubic-bezier(.3,0,.3,1)', fill: 'forwards' });
    }
    fr.style.transform = `translate(${p.x}px, ${p.y}px)`;
    if (innerWidth < 760) svg.setAttribute('viewBox', `${Math.max(0, Math.min(580, p.x - 200))} 0 420 470`);
    shown = g.done;
  }

  function sun(animate) {
    const d = S.day(); const t = d.sum; // 0..1 — солнце поднимается по дуге
    const x = 470 + t * 420, y = 300 - Math.sin(Math.PI * (0.1 + t * 0.4)) * 230;
    const s = $('#sun');
    if (animate) s.animate([{ transform: s.style.transform || 'translate(470px,300px)' }, { transform: `translate(${x}px, ${y}px)` }], { duration: 1200, easing: ease, fill: 'forwards' });
    s.style.transform = `translate(${x}px, ${y}px)`;
  }

  function cards() {
    const g = S.goal();
    $('#scene').classList.toggle('with-trails', S.goals.length > 1);
    $('#trails').innerHTML = S.goals.length > 1 ? S.goals.map((x, i) => `<button class="trail-t ${i === S.active ? 'on' : ''}" data-i="${i}">${x.short}${x.doneToday ? ' ✓' : ''}</button>`).join('') : '';
    $('#goalcard').innerHTML = `<small>Твоя цель</small><h2>${g.title}</h2><div class="nums"><b>${g.done}/${g.total}</b><span>шагов пройдено<br>до&nbsp;цели ${S.left(g)}</span></div>`;
    const d = S.day();
    const lbl = d.closed === 3 ? 'Отличный день' : d.closed === 2 ? 'Хороший день' : d.closed === 1 ? 'День в&nbsp;разгоне' : 'День только начался';
    $('#goalcard').insertAdjacentHTML('beforeend', `<div class="dayin"><small>Солнце дня · ${d.closed} из&nbsp;3</small><div class="dl">${lbl}</div>
      <div class="dots"><div class="d"><i><em style="width:${d.step * 100}%"></em></i>шаг</div><div class="d"><i><em style="width:${d.hb * 100}%"></em></i>привычки</div><div class="d"><i><em style="width:${d.tk * 100}%"></em></i>задачи</div></div></div>`);
    $('#xp').textContent = S.xp;
  }

  function dock() {
    const g = S.goal(), D = $('#dock');
    if (g.doneToday) {
      D.innerHTML = `<div class="won"><img src="img/love-f7.webp" alt=""><div><b>Шаг сделан! До&nbsp;цели ${S.left(g)}</b><span>Фрими продвинулся на&nbsp;точку. Завтра выберешь следующий шаг.</span></div></div>`;
      return;
    }
    if (g.planned != null && evening()) {
      D.innerHTML = `<div class="k">Сегодня в&nbsp;плане · шаг ${g.done + 1}</div><div class="st">${S.stepTitle(g, g.done)}</div>
        <div class="row"><button class="go" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Сделал шаг</button><button class="ghost" id="later">Не&nbsp;сегодня</button></div>`;
      $('#go').onclick = () => { S.doStep(S.active); burst(); };
      $('#later').onclick = () => { g.planned = null; S.mode = 'morning'; S.emit('later'); };
      return;
    }
    const opts = [g.done, g.done + 1, g.done + 2].filter(i => i < g.steps.length);
    D.innerHTML = `<div class="k">Утро · куда идём сегодня?</div>
      <div class="signs">${opts.map((i, n) => `<button class="sign ${n === 0 ? 'first' : ''}" data-i="${i}"><small>${n === 0 ? 'Следующий по&nbsp;тропе' : 'Можно и&nbsp;этот'}</small>${S.stepTitle(g, i)}</button>`).join('')}</div>`;
    D.querySelectorAll('.sign').forEach(b => b.onclick = () => {
      // выбранный шаг встаёт следующим по тропе
      const i = +b.dataset.i; if (i !== g.done) { const s = g.steps.splice(i, 1)[0]; g.steps.splice(g.done, 0, s); }
      S.plan(S.active, g.done);
    });
  }

  function fires() {
    $('#hbc').textContent = `${S.habits.filter(h => h.done).length} из ${S.habits.length}`;
    $('#fires').innerHTML = S.habits.map(h => `<button class="fire ${h.done ? 'on' : ''}" data-id="${h.id}">
      <svg class="flame" viewBox="0 0 48 48"><g class="fl"><path class="f f1" d="M24 4c3 8 12 11 12 22a12 12 0 0 1-24 0c0-5 3-8 5-10 0 5 3 7 5 7 0-7-2-12 2-19z"/><path class="f f2" d="M24 22c2 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 1 2 2 3 3 3 0-3-1-5 0-8z"/></g><path class="f" d="M10 42h28" stroke="oklch(0.6 0.05 60)" stroke-width="4" stroke-linecap="round"/></svg>
      <b>${h.t}</b>
      <span class="sk"><span>${h.done ? 'горит' : 'не&nbsp;горит'} · ${h.streak}&nbsp;дн.</span><span class="wk">${h.week.map(w => `<i class="${w ? 'on' : ''}"></i>`).join('')}</span></span></button>`).join('');
    $('#fires').querySelectorAll('.fire').forEach(b => b.onclick = () => S.toggleHabit(b.dataset.id));
  }

  function pack() {
    const list = [...S.tasks].sort((a, b) => a.done - b.done || b.hot - a.hot);
    $('#tkc').textContent = `${S.tasks.filter(t => t.done).length} из ${S.tasks.length}`;
    $('#pack').innerHTML = list.map(t => `<button class="item ${t.done ? 'done' : ''}" data-id="${t.id}"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="tt">${t.t}</span>${t.tag && !t.done ? `<span class="tag ${t.tag === 'просрочено' ? 'red' : ''}">${t.tag}</span>` : ''}</button>`).join('');
    $('#pack').querySelectorAll('.item').forEach(b => b.onclick = () => S.toggleTask(b.dataset.id));
  }

  $('#mates').innerHTML = S.pulse.map(p => `<div class="mate"><i style="background:${p.c}">${p.n[0]}</i><span><b>${p.n.split(' ')[0]}</b> ${p.w}</span></div>`).join('');

  function burst() {
    const sc = $('#scene'), r = sc.getBoundingClientRect(), fr = $('#frimi').getBoundingClientRect();
    for (let i = 0; i < 26; i++) {
      const c = document.createElement('i'); c.className = 'conf';
      c.style.background = ['var(--yellow)', 'var(--fire)', 'oklch(0.99 0.005 85)', 'var(--navy2)'][i % 4];
      c.style.left = (fr.left - r.left + fr.width / 2) + 'px'; c.style.top = (fr.top - r.top + 20) + 'px';
      sc.append(c);
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 120;
      c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 80}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.3,1)' }).onfinish = () => c.remove();
    }
    const im = $('#frimiImg'); im.setAttribute('href', 'img/love-f7.webp');
    setTimeout(() => im.setAttribute('href', 'img/focus-flag.webp'), 2400);
  }

  function all(why) {
    cards(); dock(); fires(); pack();
    if (why === 'goal') { shown = -1; drawTrail(false); }
    if (why === 'step') drawTrail(true);
    sun(why && why !== 'goal');
    document.querySelectorAll('.trail-t').forEach(b => b.onclick = () => S.setActive(+b.dataset.i));
  }
  S.on(all);
  drawTrail(false); all();
  // при открытии тропа прорисовывается
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const g = S.goal();
    lit.animate([{ strokeDashoffset: L }, { strokeDashoffset: L * (1 - g.done / g.total) }], { duration: 1300, easing: ease });
    $('#frimi').animate([{ opacity: 0, transform: `translate(${pt(g, g.done).x}px, ${pt(g, g.done).y + 30}px)` }, { opacity: 1, transform: `translate(${pt(g, g.done).x}px, ${pt(g, g.done).y}px)` }], { duration: 700, delay: 700, easing: ease, fill: 'backwards' });
  }
})();
</script>
</body>
</html>
