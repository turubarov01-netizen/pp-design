<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фокус дня · Б · Карточки</title>
<script src="shared.js"></script>
<style>
@font-face { font-family: "Medeo Sans"; src: url(fonts/MedeoSansVariable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Bebas"; src: url(fonts/bebasneue-bold.woff2) format("woff2"); font-display: swap; }
:root {
  --navy: oklch(0.22 0.13 268); --navy2: oklch(0.32 0.11 268); --navy3: oklch(0.42 0.1 268); --yellow: oklch(0.83 0.13 80); --fire: oklch(0.7 0.17 50);
  --cream: oklch(0.972 0.013 85); --card: oklch(0.994 0.004 85); --ink: oklch(0.22 0.03 268); --ink2: oklch(0.47 0.03 268);
  --line: oklch(0.89 0.015 85); --tile: oklch(0.955 0.014 85);
  --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); font: 400 15px/1.45 "Medeo Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 120px; }
.top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 750; color: var(--navy); letter-spacing: -.02em; }
.top .date { color: var(--ink2); font-size: 14px; margin-bottom: 3px; }
.chips { margin-left: auto; display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.chip svg { width: 16px; height: 16px; }
.chip .fl { color: var(--fire); } .chip .xp { color: var(--yellow); }
.chip b { font: 400 20px/1 "Bebas", sans-serif; letter-spacing: .02em; padding-top: 3px; }

.hero { margin-top: 18px; display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }

/* ---------- колода целей ---------- */
.deck { position: relative; min-width: 0; }
.track { --cw: 100%; position: relative; display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px calc(50% - var(--cw) / 2) 10px; overscroll-behavior-x: contain; outline: none; }
.track::-webkit-scrollbar { display: none; }
.deck.multi .track { --cw: 620px; cursor: grab; }
.track.drag { scroll-snap-type: none; cursor: grabbing; user-select: none; }
.slide { flex: 0 0 var(--cw); min-width: 0; scroll-snap-align: center; transition: transform .45s var(--ease), opacity .45s var(--ease); }
.deck.multi .slide:not(.on) { transform: scale(.93); opacity: .55; cursor: pointer; }
.deck.multi .slide:not(.on) .gcard { pointer-events: none; }
.deck.multi .slide:not(.on):hover { opacity: .75; }
.arr { position: absolute; top: calc(50% - 50px); z-index: 5; width: 52px; height: 52px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--navy); display: grid; place-items: center; box-shadow: 0 10px 24px oklch(0.22 0.13 268 / .15); transition: transform .3s var(--ease), opacity .2s; }
.arr svg { width: 22px; height: 22px; }
.arr:hover { transform: scale(1.08); }
.arr[disabled] { opacity: 0; pointer-events: none; }
.arr.l { left: calc(50% - 310px - 26px); } .arr.r { right: calc(50% - 310px - 26px); }
.switch { margin-top: 6px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sw { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 16px 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); text-align: left; transition: background .25s, border-color .25s, color .25s; }
.sw span { font-size: 14px; font-weight: 650; }
.sw b { font: 400 20px/1 "Bebas", sans-serif; color: var(--navy); padding-top: 3px; }
.sw em { font-style: normal; font-size: 12px; color: var(--ink2); }
.sw.ok em { color: oklch(0.5 0.13 150); }
.sw.on { background: var(--navy); border-color: var(--navy); color: var(--cream); }
.sw.on b { color: var(--yellow); } .sw.on em { color: oklch(0.82 0.04 268); } .sw.on.ok em { color: oklch(0.8 0.12 150); }
.hero.multi { grid-template-columns: 1fr; }
.below.multi { grid-template-columns: 1fr 1fr 1fr; }
.gcard { position: relative; z-index: 2; perspective: 1800px; }
.inner { position: relative; display: grid; transform-style: preserve-3d; transition: transform .9s var(--ease); }
.gcard.flipped .inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; position: relative; border-radius: 28px; background: radial-gradient(60% 70% at 85% 20%, oklch(0.42 0.14 268 / .9), transparent 70%), var(--navy); color: var(--cream); padding: 24px 26px 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; clip-path: inset(0 round 28px); }
.face.back { transform: rotateY(180deg); background: radial-gradient(70% 60% at 50% 30%, oklch(0.45 0.15 268), transparent 70%), oklch(0.27 0.14 268); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.face > * { position: relative; }
.head { display: grid; grid-template-columns: 1fr 210px; gap: 10px; align-items: center; }
.head small { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); }
.head h2 { margin: 6px 0 0; font-size: 30px; line-height: 1.12; font-weight: 750; letter-spacing: -.015em; }
.lvl { margin-top: 16px; display: flex; align-items: baseline; gap: 10px; }
.lvl b { font: 400 76px/0.82 "Bebas", sans-serif; color: var(--yellow); letter-spacing: .01em; }
.lvl span { font-size: 15px; color: oklch(0.85 0.03 268); line-height: 1.3; }
.ringwrap { position: relative; width: 210px; height: 210px; }
.ringwrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ringwrap circle { fill: none; stroke-width: 12; }
.ringwrap .tr { stroke: oklch(1 0 0 / .12); }
.ringwrap .pr { stroke: var(--yellow); stroke-linecap: round; transition: stroke-dashoffset 1.1s var(--ease); }
.ringwrap img { position: absolute; left: 50%; bottom: 8px; width: 196px; transform: translateX(-50%); filter: drop-shadow(0 12px 18px oklch(0.12 0.1 268 / .45)); }
.pips { margin-top: 18px; display: flex; gap: 5px; }
.pips i { flex: 1; height: 8px; border-radius: 4px; background: oklch(1 0 0 / .14); }
.pips i.on { background: var(--yellow); }
.pips i.now { background: transparent; box-shadow: inset 0 0 0 2px var(--yellow); animation: pip 1.4s ease-in-out infinite; }
@keyframes pip { 50% { box-shadow: inset 0 0 0 2px var(--yellow), 0 0 0 4px oklch(0.83 0.13 80 / .25); } }

.quest { margin-top: 18px; border-radius: 20px; background: oklch(0.99 0.006 85); color: var(--ink); padding: 16px 16px 16px 18px; display: flex; align-items: center; gap: 16px; }
.quest .k { font-size: 12px; font-weight: 600; color: var(--ink2); }
.quest .st { font-size: 19px; font-weight: 700; line-height: 1.25; margin-top: 2px; }
.quest .q { flex: 1; min-width: 0; }
.go { flex: none; height: 56px; padding: 0 22px; border-radius: 16px; background: var(--yellow); color: var(--navy); font-size: 17px; font-weight: 750; display: inline-flex; align-items: center; gap: 10px; transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
.go:hover { transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.6 0.13 70 / .35); }
.go:active { transform: scale(.97); }
.go svg { width: 20px; height: 20px; }
.go .xp { font: 400 18px/1 "Bebas", sans-serif; padding: 4px 7px 2px; border-radius: 7px; background: var(--navy); color: var(--yellow); }
.later { align-self: flex-start; margin-top: 10px; font-size: 13px; color: oklch(0.8 0.03 268); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: oklch(0.8 0.03 268 / .4); }
.donebar { margin-top: 18px; border-radius: 20px; background: oklch(1 0 0 / .08); padding: 16px 18px; display: flex; align-items: center; gap: 12px; font-weight: 650; }
.donebar .tick { width: 30px; height: 30px; border-radius: 50%; background: var(--yellow); color: var(--navy); display: grid; place-items: center; flex: none; }
.donebar .tick svg { width: 16px; height: 16px; }
.donebar button { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--yellow); }

/* утро: рука из трёх карт */
.hand-t { margin-top: 18px; font-size: 13px; font-weight: 600; color: oklch(0.85 0.03 268); }
.hand { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.qc { position: relative; min-height: 150px; border-radius: 18px; background: oklch(0.99 0.006 85); color: var(--ink); padding: 14px; text-align: left; display: flex; flex-direction: column; transition: transform .35s var(--ease), box-shadow .35s var(--ease); box-shadow: 0 10px 22px oklch(0.12 0.1 268 / .35); }
.qc:nth-child(1) { transform: rotate(-3deg) translateY(6px); } .qc:nth-child(3) { transform: rotate(3deg) translateY(6px); }
.qc:hover { transform: translateY(-10px) rotate(0); box-shadow: 0 22px 34px oklch(0.12 0.1 268 / .45); }
.qc .n { font: 400 30px/1 "Bebas", sans-serif; color: var(--navy); }
.qc .n em { font-style: normal; font-size: 15px; color: var(--ink2); margin-left: 4px; }
.qc b { margin-top: 6px; font-size: 15px; line-height: 1.3; font-weight: 650; }
.qc .take { margin-top: auto; padding-top: 10px; font-size: 13px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 6px; }
.qc .take i { font: 400 15px/1 "Bebas", sans-serif; font-style: normal; padding: 3px 6px 1px; border-radius: 6px; background: var(--yellow); }
.qc.pick { animation: pick .6s var(--ease) forwards; }
@keyframes pick { to { transform: translateY(-30px) scale(1.06); opacity: 0; } }

/* обратная сторона */
.back img { width: 140px; filter: drop-shadow(0 14px 20px oklch(0.12 0.1 268 / .5)); }
.back .plus { font: 400 80px/0.85 "Bebas", sans-serif; color: var(--yellow); margin-top: 4px; }
.back h3 { margin: 6px 0 0; font-size: 26px; font-weight: 750; }
.back p { margin: 6px 0 0; color: oklch(0.85 0.03 268); max-width: 420px; }
.back .next { margin-top: 16px; padding: 12px 16px; border-radius: 16px; background: oklch(1 0 0 / .08); font-size: 14px; }
.back .next b { color: var(--yellow); font-weight: 650; }
.back .turn { margin-top: 16px; height: 44px; padding: 0 18px; border-radius: 12px; background: oklch(1 0 0 / .12); font-weight: 650; font-size: 14px; }
.back .turn:hover { background: oklch(1 0 0 / .2); }

/* ---------- комбо дня ---------- */
.combo { border-radius: 28px; background: var(--card); border: 1px solid var(--line); padding: 22px; position: relative; overflow: hidden; }
.combo .ct { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.combo small { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.combo .x { font: 400 64px/0.85 "Bebas", sans-serif; color: var(--navy); margin-top: 6px; }
.combo .x em { font-style: normal; color: var(--fire); }
.combo .msg { margin-top: 6px; font-size: 16px; font-weight: 650; color: var(--navy); max-width: 210px; }
.combo .fr { width: 150px; height: 150px; object-fit: contain; margin: -10px -12px 0 0; transition: transform .5s var(--ease); }
.combo .fr.pop { animation: pop .7s var(--ease); }
@keyframes pop { 30% { transform: scale(1.18) rotate(-6deg); } }
.segs { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: baseline; }
.seg span { font-size: 14px; font-weight: 600; }
.seg em { font-style: normal; font-size: 13px; color: var(--ink2); }
.seg i { grid-column: 1 / -1; height: 12px; border-radius: 8px; background: var(--tile); overflow: hidden; display: block; }
.seg i u { display: block; height: 100%; border-radius: 8px; transition: width .8s var(--ease); }
.seg.s1 u { background: var(--navy); } .seg.s2 u { background: var(--yellow); } .seg.s3 u { background: var(--fire); }
.seg.full span::after { content: " ✓"; color: oklch(0.55 0.13 150); }
.combo .bonus { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
.combo .bonus b { font: 400 18px/1 "Bebas", sans-serif; color: var(--navy); padding: 4px 7px 2px; background: var(--yellow); border-radius: 6px; }

/* ---------- ниже ---------- */
.below { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.sec h3 { margin: 0 0 4px; font-size: 20px; font-weight: 750; color: var(--navy); letter-spacing: -.01em; }
.sec .sub { font-size: 13px; color: var(--ink2); margin: 0 0 12px; }
.coins { display: flex; gap: 12px; }
.coin { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); transition: transform .3s var(--ease), border-color .2s; perspective: 600px; }
.coin:hover { transform: translateY(-3px); border-color: oklch(0.8 0.06 70); }
.disc { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: oklch(0.93 0.01 85); box-shadow: inset 0 -5px 0 oklch(0.86 0.012 85); transition: background .4s, box-shadow .4s; position: relative; }
.coin.on .disc { background: radial-gradient(circle at 35% 30%, oklch(0.9 0.12 85), oklch(0.78 0.14 75)); box-shadow: inset 0 -5px 0 oklch(0.66 0.14 65), 0 8px 18px oklch(0.7 0.14 70 / .35); }
.coin.spin .disc { animation: spin .7s var(--ease); }
@keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
.disc svg { width: 30px; height: 30px; color: oklch(0.72 0.01 85); }
.coin.on .disc svg { color: oklch(0.6 0.19 40); }
.disc b { position: absolute; bottom: 9px; font: 400 17px/1 "Bebas", sans-serif; color: oklch(0.6 0.01 85); }
.coin.on .disc b { color: oklch(0.32 0.1 60); }
.coin .nm { font-size: 14px; font-weight: 650; text-align: center; line-height: 1.25; }
.coin .wk { display: flex; gap: 3px; } .coin .wk i { width: 7px; height: 7px; border-radius: 50%; background: oklch(0.86 0.015 85); } .coin .wk i.on { background: var(--fire); }
.coin .sk { font-size: 12px; color: var(--ink2); }

.pack { border-radius: 22px; background: var(--card); border: 1px solid var(--line); padding: 6px; }
.item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; text-align: left; transition: background .2s; }
.item:hover { background: var(--tile); }
.item .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid oklch(0.22 0.13 268 / .3); display: grid; place-items: center; flex: none; transition: background .25s, border-color .25s; }
.item .ck svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s var(--ease); color: var(--cream); }
.item.done .ck { background: var(--navy); border-color: var(--navy); }
.item.done .ck svg { opacity: 1; transform: none; }
.item .tt { flex: 1; font-size: 15px; }
.item.done .tt { color: var(--ink2); text-decoration: line-through; text-decoration-color: oklch(0.47 0.03 268 / .5); }
.item .rw { font: 400 15px/1 "Bebas", sans-serif; color: var(--ink2); padding: 4px 6px 2px; border-radius: 6px; background: var(--tile); }
.item.done .rw { background: var(--yellow); color: var(--navy); }
.tag { font-size: 11px; font-weight: 650; padding: 4px 8px; border-radius: 999px; background: oklch(0.94 0.05 75); color: oklch(0.45 0.12 60); white-space: nowrap; }
.tag.red { background: oklch(0.94 0.04 25); color: oklch(0.5 0.17 25); }
.mates { margin-top: 26px; }
.mates .list { display: flex; gap: 10px; flex-wrap: wrap; }
.mate { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.mate i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--cream); font-style: normal; font-weight: 700; font-size: 12px; flex: none; }
.mate b { font-weight: 650; }
.conf { position: fixed; z-index: 60; pointer-events: none; width: 8px; height: 12px; border-radius: 2px; }

@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } .below.multi { grid-template-columns: 1fr 1fr; } .below.multi .combo { grid-column: 1 / -1; } }
@media (hover: none) { .arr { display: none; } }
@media (max-width: 760px) {
  .wrap { padding: 16px 12px 120px; }
  .top h1 { font-size: 24px; }
  .chips { margin-left: 0; width: 100%; }
  .face { padding: 18px 16px 16px; border-radius: 24px; clip-path: inset(0 round 24px); }
  .head { grid-template-columns: 1fr 120px; }
  .head h2 { font-size: 21px; }
  .ringwrap { width: 120px; height: 120px; } .ringwrap img { width: 116px; bottom: 4px; } .ringwrap circle { stroke-width: 9; }
  .lvl { flex-direction: column; align-items: flex-start; gap: 6px; } .lvl b { font-size: 52px; } .lvl span { font-size: 13px; } .lvl span br { display: none; }
  .pips { gap: 3px; } .pips i { height: 6px; }
  .quest { flex-direction: column; align-items: stretch; gap: 12px; padding: 14px; }
  .go { justify-content: center; }
  .hand { grid-template-columns: 1fr; gap: 8px; }
  .qc { min-height: 0; transform: none !important; flex-direction: row; align-items: center; gap: 10px; }
  .qc b { margin-top: 0; flex: 1; font-size: 14px; } .qc .take { margin-top: 0; padding-top: 0; }
  .back img { width: 96px; } .back .plus { font-size: 56px; } .back h3 { font-size: 20px; } .back p { font-size: 14px; } .back .next { display: none; } .back .turn { margin-top: 10px; }
  .below { grid-template-columns: 1fr; }
  .coins { gap: 8px; } .coin { padding: 14px 6px 12px; } .disc { width: 66px; height: 66px; } .coin .nm { font-size: 13px; }
  .combo .fr { width: 112px; height: 112px; } .combo .x { font-size: 50px; }
  .deck.multi { margin: 0 -12px; } .deck.multi .track { --cw: 80vw; gap: 10px; }
  .arr { display: none; }
  .switch { padding: 0 12px; justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .sw { flex: none; flex-direction: column; align-items: flex-start; gap: 0; border-radius: 16px; padding: 8px 12px; }
  .below.multi { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Фокус дня</h1><div class="date">Суббота, 14 ноября</div></div>
    <div class="chips">
      <span class="chip"><svg class="fl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5Z"/></svg><b id="streak">12</b> дней подряд</span>
      <span class="chip"><svg class="xp" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg><b id="xp">40</b> XP сегодня</span>
    </div>
  </div>

  <div class="hero">
    <div class="deck" id="deck"></div>
    <aside class="combo" id="combo"></aside>
  </div>

  <div class="below">
    <section class="sec"><h3>Привычки</h3><p class="sub" id="hbs"></p><div class="coins" id="coins"></div></section>
    <section class="sec"><h3>Квесты дня</h3><p class="sub" id="tks"></p><div class="pack" id="pack"></div></section>
  </div>
  <section class="sec mates"><h3>Попутчики сегодня</h3><p class="sub">Кто из Альянса тоже сделал шаг</p><div class="list" id="mates"></div></section>
</div>

<script>
(function () {
  const S = window.FD, $ = s => document.querySelector(s);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const FLAME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5Z"/></svg>';
  const flips = new Set(); let justStepped = -1, shownXp = S.xp;

  function countXp() {
    const el = $('#xp'), from = shownXp, to = S.xp; shownXp = to;
    if (RM || from === to) { el.textContent = to; return; }
    const t0 = performance.now();
    const tick = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 4); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }

  function front(g, gi) {
    const R = 99, C = 2 * Math.PI * R, off = C * (1 - g.done / g.total);
    const pips = Array.from({ length: g.total }, (_, i) => `<i class="${i < g.done ? 'on' : i === g.planned ? 'now' : ''}"></i>`).join('');
    let act;
    if (g.doneToday) act = `<div class="donebar"><span class="tick">${CHECK}</span>Шаг ${g.done} сделан сегодня<button class="turn2" data-g="${gi}">Посмотреть карточку</button></div>`;
    else if (g.planned != null) act = `<div class="quest"><div class="q"><div class="k">Квест на сегодня · шаг ${g.planned + 1}</div><div class="st">${S.stepTitle(g, g.planned)}</div></div><button class="go" data-g="${gi}">${CHECK}Сделал шаг<span class="xp">+30</span></button></div><button class="later">Сегодня не получится</button>`;
    else {
      const cards = [0, 1, 2].map(k => g.done + k).filter(i => i < g.total).map(i => `<button class="qc" data-g="${gi}" data-i="${i}"><span class="n">${i + 1}<em>шаг</em></span><b>${S.stepTitle(g, i)}</b><span class="take">Беру <i>+30</i></span></button>`).join('');
      act = `<div class="hand-t">Утро. Вытяни квест на сегодня</div><div class="hand">${cards}</div>`;
    }
    return `<div class="face front">
      <div class="head"><div><small>Цель ${S.goalsCount > 1 ? (gi + 1) + ' из ' + S.goalsCount : 'в фокусе'}</small><h2>${g.title}</h2>
        <div class="lvl"><b>${g.done}/${g.total}</b><span>шагов пройдено<br>до цели ${S.left(g)}</span></div></div>
        <div class="ringwrap"><svg viewBox="0 0 210 210"><circle class="tr" cx="105" cy="105" r="${R}"/><circle class="pr" cx="105" cy="105" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><img src="img/focus-happy.webp" alt="Фрими"></div></div>
      <div class="pips">${pips}</div>${act}</div>`;
  }
  function back(g, gi) {
    const nx = g.done < g.total ? `<div class="next">Следующий шаг: <b>${S.stepTitle(g, g.done)}</b></div>` : '';
    return `<div class="face back"><img src="img/love-f7.webp" alt=""><div class="plus">+30 XP</div><h3>Шаг ${g.done} пройден</h3><p>До цели «${g.short}» осталось ${S.left(g)}. Фрими уже на ${Math.round(g.done / g.total * 100)}% пути.</p>${nx}<button class="turn" data-g="${gi}">Перевернуть карточку</button></div>`;
  }

  const ARR = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  let tr = null, dragged = false;
  const slides = () => [...tr.children];
  const nearest = () => { const c = tr.scrollLeft + tr.clientWidth / 2; let best = 0, bd = 1e9; slides().forEach((el, i) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - c); if (d < bd) { bd = d; best = i; } }); return best; };
  function jumpTo(i, smooth) {
    i = Math.max(0, Math.min(S.goals.length - 1, i));
    const el = tr.children[i];
    tr.scrollTo({ left: el.offsetLeft - (tr.clientWidth - el.offsetWidth) / 2, behavior: smooth && !RM ? 'smooth' : 'instant' });
    mark(i);
  }
  function mark(i) {
    S.active = i;
    slides().forEach((el, k) => el.classList.toggle('on', k === i));
    const l = $('.arr.l'), r = $('.arr.r'); if (l) { l.disabled = i === 0; r.disabled = i === S.goals.length - 1; }
    switcher();
  }
  function switcher() {
    const sw = $('#switch'); if (!sw) return;
    sw.innerHTML = S.goals.map((g, i) => { const st = g.doneToday ? 'шаг сделан ✓' : g.planned != null ? 'шаг ' + (g.planned + 1) + ' в плане' : 'выбрать шаг'; return `<button class="sw ${i === S.active ? 'on' : ''} ${g.doneToday ? 'ok' : ''}" data-i="${i}"><span>${g.short}</span><b>${g.done}/${g.total}</b><em>${st}</em></button>`; }).join('');
    sw.querySelectorAll('.sw').forEach(b => b.onclick = () => jumpTo(+b.dataset.i, true));
  }

  function deck() {
    const multi = S.goalsCount > 1, d = $('#deck');
    d.className = 'deck' + (multi ? ' multi' : '');
    d.innerHTML = `<div class="track" id="track" tabindex="0" aria-label="Цели, листайте влево и вправо">${S.goals.map((g, i) => `<div class="slide" data-i="${i}"><div class="gcard ${flips.has(i) && i !== justStepped ? 'flipped' : ''}"><div class="inner">${front(g, i)}${back(g, i)}</div></div></div>`).join('')}</div>`
      + (multi ? `<button class="arr l" aria-label="Предыдущая цель">${ARR('M15 18l-6-6 6-6')}</button><button class="arr r" aria-label="Следующая цель">${ARR('M9 18l6-6-6-6')}</button><div class="switch" id="switch"></div>` : '');
    tr = $('#track');
    jumpTo(S.active, false);
    if (justStepped >= 0) { const c = tr.children[justStepped].querySelector('.gcard'); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('flipped'))); justStepped = -1; }
    if (!multi) return;
    $('.arr.l').onclick = () => jumpTo(S.active - 1, true);
    $('.arr.r').onclick = () => jumpTo(S.active + 1, true);
    tr.onkeydown = e => { if (e.key === 'ArrowLeft') jumpTo(S.active - 1, true); if (e.key === 'ArrowRight') jumpTo(S.active + 1, true); };
    let raf = 0; tr.onscroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const n = nearest(); if (n !== S.active) mark(n); }); };
    // мышью: тянуть карточки как пальцем
    tr.onpointerdown = e => {
      if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.slide.on button')) return;
      const x0 = e.clientX, s0 = tr.scrollLeft; dragged = false;
      const mv = ev => { const dx = ev.clientX - x0; if (Math.abs(dx) > 5) { dragged = true; tr.classList.add('drag'); } if (dragged) tr.scrollLeft = s0 - dx; };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); if (dragged) { const n = nearest(); tr.classList.remove('drag'); jumpTo(n, true); } };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    };
  }

  // клики внутри карусели
  document.addEventListener('click', e => {
    if (!tr || !tr.contains(e.target)) return;
    if (dragged) { dragged = false; e.preventDefault(); return; }
    const sl = e.target.closest('.slide');
    if (sl && !sl.classList.contains('on')) { jumpTo(+sl.dataset.i, true); return; }
    const b = e.target.closest('button'); if (!b) return;
    const gi = +b.dataset.g;
    if (b.classList.contains('go')) { justStepped = gi; flips.add(gi); S.doStep(gi); burst($('.slide.on .gcard')); }
    else if (b.classList.contains('turn')) { flips.delete(gi); b.closest('.gcard').classList.remove('flipped'); }
    else if (b.classList.contains('turn2')) { flips.add(gi); b.closest('.gcard').classList.add('flipped'); }
    else if (b.classList.contains('qc')) { b.classList.add('pick'); setTimeout(() => S.plan(gi, +b.dataset.i), RM ? 0 : 450); }
  }, true);

  let lastClosed = -1;
  function combo() {
    const d = S.day(), hb = S.habits.filter(h => h.done).length, hot = S.tasks.filter(t => t.hot), tk = hot.filter(t => t.done).length;
    const img = ['sleepy', 'idea', 'focus-joy', 'hooray'][d.closed];
    const msg = ['Начни с шага к цели, Фрими ждёт', 'Разогрев. Ещё два блока до комбо', 'Почти комбо, остался один блок', 'Комбо дня! Бонус начислен'][d.closed];
    $('#combo').innerHTML = `<div class="ct"><div><small>Комбо дня</small><div class="x">${d.closed}<em>/3</em></div><div class="msg">${msg}</div></div><img class="fr" id="cfr" src="img/${img}.webp" alt=""></div>
      <div class="segs">
        <div class="seg s1 ${d.step ? 'full' : ''}"><span>Шаг к цели</span><em>${d.step ? 'сделан' : 'ждёт'}</em><i><u style="width:${d.step * 100}%"></u></i></div>
        <div class="seg s2 ${d.hb === 1 ? 'full' : ''}"><span>Привычки</span><em>${hb} из ${S.habits.length}</em><i><u style="width:${d.hb * 100}%"></u></i></div>
        <div class="seg s3 ${d.tk === 1 ? 'full' : ''}"><span>Важные квесты</span><em>${tk} из ${hot.length}</em><i><u style="width:${d.tk * 100}%"></u></i></div>
      </div>
      <div class="bonus"><b>+50</b> за полное комбо: закрой все три блока</div>`;
    if (lastClosed >= 0 && d.closed !== lastClosed && !RM) $('#cfr').classList.add('pop');
    if (lastClosed >= 0 && d.closed === 3 && lastClosed < 3) burst($('#cfr'));
    lastClosed = d.closed;
  }

  function coins(why, id) {
    $('#hbs').textContent = `${S.habits.filter(h => h.done).length} из ${S.habits.length} сегодня · монета за каждую`;
    $('#coins').innerHTML = S.habits.map(h => `<button class="coin ${h.done ? 'on' : ''} ${why === 'habit' && id === h.id ? 'spin' : ''}" data-id="${h.id}"><span class="disc">${FLAME}<b>${h.streak}</b></span><span class="nm">${h.t}</span><span class="wk">${h.week.map(w => `<i class="${w ? 'on' : ''}"></i>`).join('')}</span><span class="sk">${h.perWeek ? h.perWeek + ' раза в неделю' : 'серия ' + h.streak + ' дн.'}</span></button>`).join('');
    $('#coins').querySelectorAll('.coin').forEach(b => b.onclick = () => { last = b.dataset.id; S.toggleHabit(b.dataset.id); });
  }
  function pack() {
    const list = [...S.tasks].sort((a, b) => a.done - b.done || b.hot - a.hot);
    $('#tks').textContent = `${S.tasks.filter(t => t.done).length} из ${S.tasks.length} · важные идут в комбо`;
    $('#pack').innerHTML = list.map(t => `<button class="item ${t.done ? 'done' : ''}" data-id="${t.id}"><span class="ck">${CHECK}</span><span class="tt">${t.t}</span>${t.tag && !t.done ? `<span class="tag ${t.tag === 'просрочено' ? 'red' : ''}">${t.tag}</span>` : ''}<span class="rw">+5</span></button>`).join('');
    $('#pack').querySelectorAll('.item').forEach(b => b.onclick = () => S.toggleTask(b.dataset.id));
  }
  $('#mates').innerHTML = S.pulse.map(p => `<div class="mate"><i style="background:${p.c}">${p.n[0]}</i><span><b>${p.n.split(' ')[0]}</b> ${p.w}</span></div>`).join('');

  function burst(from) {
    if (RM) return;
    const el = from || $('.slide.on .gcard'), r = el.getBoundingClientRect();
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('i'); c.className = 'conf';
      c.style.background = ['var(--yellow)', 'var(--fire)', 'oklch(0.99 0.005 85)', 'var(--navy2)'][i % 4];
      c.style.left = (r.left + r.width / 2) + 'px'; c.style.top = (r.top + r.height / 3) + 'px';
      document.body.append(c);
      const a = Math.random() * Math.PI * 2, d = 100 + Math.random() * 160;
      c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 90}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.6,.3,1)' }).onfinish = () => c.remove();
    }
  }

  let last = null;
  function all(why) { deck(why); combo(); coins(why, last); pack(); countXp(); last = null; }
  if (S.goalsCount > 1) { $('.hero').classList.add('multi'); $('.below').classList.add('multi'); $('.below').prepend($('#combo')); }
  S.on(all);
  all();
  addEventListener('resize', () => tr && jumpTo(S.active, false));
  if (!RM) document.querySelectorAll('.ringwrap .pr').forEach(pr => {
    const full = pr.getAttribute('stroke-dasharray');
    pr.animate([{ strokeDashoffset: full }, { strokeDashoffset: pr.getAttribute('stroke-dashoffset') }], { duration: 1200, easing: 'cubic-bezier(.22,1,.36,1)' });
  });
  if (!RM) {
    document.querySelectorAll('.slide.on .pips i').forEach((p, i) => p.animate([{ transform: 'scaleY(0)' }, { transform: 'none' }], { duration: 400, delay: 200 + i * 30, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }));
  }
})();
</script>
</body>
</html>
