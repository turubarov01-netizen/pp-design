<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок «Сбор данных» — макет</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0D1117}
body{font-family:Inter,-apple-system,system-ui,sans-serif;color:rgba(255,255,255,.76);-webkit-font-smoothing:antialiased;--top:56px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* оболочка кабинета (упрощённо) */
.app-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:#0D1117;border-bottom:1px solid rgba(255,255,255,.07);font-size:18px;font-weight:700;color:#fff}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#1A1406;background:linear-gradient(135deg,#F0D080,#CCA830)}
.lesson{max-width:768px;margin:0 auto;padding:0 16px 140px}
.crumb{display:flex;gap:6px;align-items:center;padding:16px 0 4px;font-size:14px;color:rgba(255,255,255,.5)}
.crumb b{font-weight:500;color:rgba(255,255,255,.75)}
.head{padding:12px 0 8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;background:rgba(234,184,32,.12);border:1px solid rgba(234,184,32,.35);color:#F0D080;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge svg.i{width:13px;height:13px}
h1{margin-top:12px;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;background:linear-gradient(135deg,#F0D080,#CCA830);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-wrap:balance}
.blk{margin-top:8px}
.html-host{margin:0 -16px}

/* аудио — как блок кабинета */
.aud{display:flex;align-items:center;gap:14px;margin:12px 0;padding:14px 16px;border-radius:18px;background:#141E2B;border:1px solid rgba(255,255,255,.12)}
.aud-p{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#DFC880,#C9A84C);color:#2A2008}
.aud-p svg.i{width:18px;height:18px;fill:currentColor;stroke:none;margin-left:2px}
.aud-t{flex:1;min-width:0}
.aud-t b{display:block;font-size:16px;color:#fff}
.aud-t small{display:block;font-size:13px;color:rgba(255,255,255,.5);margin-top:2px}
.aud-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:10px}

/* задание — как блок кабинета */
.task{margin-top:28px;padding:20px;border-radius:20px;background:#141E2B;border:1px solid rgba(234,184,32,.35)}
.task h3{font-size:20px;color:#fff;margin:10px 0 8px}
.task p{font-size:15px;line-height:1.5;margin-top:8px}
.task-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.task-meta span{padding:6px 12px;border-radius:100px;background:rgba(255,255,255,.05);font-size:13px;font-weight:600;color:rgba(255,255,255,.8)}
.task label{display:block;margin-top:18px;font-size:14px;font-weight:600;color:#fff}
.task textarea,.task input{display:block;width:100%;margin-top:8px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0D1117;color:#fff;font:inherit;font-size:15px}
.task textarea{min-height:150px;line-height:1.5}
.task .sub{margin-top:18px;width:100%;min-height:50px;border-radius:14px;background:linear-gradient(180deg,#DFC880,#C9A84C);color:#2A2008;font-weight:700;box-shadow:0 4px 0 #A07828}

/* ===== постраничная инструкция ===== */
.pg{margin:24px 0 8px}
.pg-cap{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pg-cap .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(107,159,255,.12);color:#6B9FFF;flex:none}
.pg-cap b{display:block;font-size:17px;color:#fff;line-height:1.25}
.pg-cap small{display:block;font-size:13px;color:rgba(255,255,255,.5);margin-top:2px}
.pg-bar{position:sticky;top:var(--top);z-index:20;margin:0 -16px;padding:10px 16px 0;background:#0D1117;border-bottom:1px solid rgba(255,255,255,.07)}
.pg-row{display:flex;align-items:center;gap:10px;min-height:36px}
.pg-num{flex:none;font-size:13px;font-weight:700;color:#F0D080;font-variant-numeric:tabular-nums}
.pg-ttl{flex:1;min-width:0;font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-tocbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.pg-tocbtn svg.i{width:16px;height:16px}
.pg-tocbtn[aria-expanded="true"]{border-color:rgba(240,208,128,.5);color:#F0D080}
.pg-seg{display:grid;gap:3px;padding:10px 0 12px}
.pg-seg i{height:4px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .2s}
.pg-seg i.seen{background:rgba(107,159,255,.55)}
.pg-seg i.on{background:#F0D080}
.pg-toc{margin:0 -16px;padding:6px 8px 10px;background:#111925;border-top:1px solid rgba(255,255,255,.07);max-height:min(60vh,560px);overflow:auto;overscroll-behavior:contain}
.pg-toc button{display:grid;grid-template-columns:34px 1fr 20px;gap:10px;align-items:center;width:100%;min-height:48px;padding:6px 10px;border-radius:12px;text-align:left;font-size:15px;line-height:1.3;color:rgba(255,255,255,.85)}
.pg-toc button:hover{background:rgba(255,255,255,.04)}
.pg-toc button .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.14)}
.pg-toc button.seen .n{color:#6B9FFF;border-color:rgba(107,159,255,.4);background:rgba(107,159,255,.1)}
.pg-toc button.on{background:rgba(240,208,128,.08)}
.pg-toc button.on .n{color:#2A2008;border-color:transparent;background:linear-gradient(180deg,#DFC880,#C9A84C)}
.pg-toc button.on .t{color:#F0D080;font-weight:600}
.pg-toc button svg.i{width:16px;height:16px;color:#6BCB77}
.pg-toc .grp{padding:12px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}

/* вариант Б: вкладки */
.pg-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:0 16px}
.pg-chips::-webkit-scrollbar{display:none}
.pg-chips button{flex:none;min-height:36px;padding:0 13px;border-radius:100px;border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pg-chips button.seen{color:#A9C6FF;border-color:rgba(107,159,255,.35)}
.pg-chips button.seen::before{content:"";width:6px;height:6px;border-radius:50%;background:#6B9FFF}
.pg-chips button.on{background:linear-gradient(180deg,#DFC880,#C9A84C);border-color:transparent;color:#2A2008}
.pg-chips button.on::before{display:none}
.pg-line{height:3px;margin:0 -16px;background:rgba(255,255,255,.06)}
.pg-line i{display:block;height:100%;background:linear-gradient(90deg,#6B9FFF,#F0D080);transition:width .3s}

.pg-stage{margin:0 -16px;touch-action:pan-y}
.pg-hint{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 0;font-size:13px;color:rgba(255,255,255,.45)}
.pg-hint svg.i{width:15px;height:15px}

/* листалка внизу — стиль как у «Следующий урок» */
.plp{display:grid;gap:10px;margin-top:12px}
.plp>*{min-width:0}
@media (min-width:640px){.plp{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:stretch}}
a.plp-nx,a.plp-pv{text-decoration:none}
.plp-nx{position:relative;display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 14px 14px 18px;border-radius:20px;text-align:left;border:1px solid rgba(240,208,128,.28);background:linear-gradient(135deg,rgba(240,208,128,.12),rgba(240,208,128,.03));color:#fff;transition:border-color .2s,background .2s}
.plp-nx:hover{border-color:rgba(240,208,128,.55)}
.plp-nx .tx{flex:1;min-width:0}
.plp-nx small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#F0D080}
.plp-nx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:16px;font-weight:700;line-height:1.3}
.plp-nx .go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#DFC880,#C9A84C);color:#3A2E18;box-shadow:0 4px 0 #A07828;transition:transform .15s,box-shadow .15s}
.plp-nx:hover .go{transform:translateY(2px);box-shadow:0 2px 0 #A07828}
.plp-nx.done{border-color:rgba(107,203,119,.35);background:linear-gradient(135deg,rgba(107,203,119,.12),rgba(107,203,119,.03))}
.plp-nx.done small{color:#6BCB77}
.plp-nx.done .go{background:rgba(107,203,119,.16);color:#6BCB77;box-shadow:none}
.plp-pv{display:flex;align-items:center;gap:12px;min-height:84px;padding:14px 16px;border-radius:20px;text-align:left;border:1px solid rgba(255,255,255,.1);color:#fff}
.plp-pv:hover{background:rgba(255,255,255,.04)}
.plp-pv svg.i{color:rgba(255,255,255,.55)}
.plp-pv .tx{min-width:0}
.plp-pv small{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5)}
.plp-pv b{display:block;margin-top:3px;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.85)}
@media (max-width:639px){.plp-pv{order:2;min-height:52px;border:0;padding:6px 8px}.plp-nx{order:1}}
.pg button:focus-visible{outline:2px solid #F0D080;outline-offset:2px}

/* переключатель уроков макета */
.ltabs{display:flex;gap:6px;padding:14px 0 0}
.ltabs a{flex:1;min-height:40px;display:grid;place-items:center;border-radius:12px;border:1px dashed rgba(255,255,255,.18);font-size:13px;font-weight:700;color:rgba(255,255,255,.6);text-decoration:none}
.ltabs a.on{border-style:solid;border-color:rgba(240,208,128,.5);color:#F0D080;background:rgba(240,208,128,.06)}
.lnext{margin-top:36px}

/* переключатель вариантов макета */
.vsw{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(17,25,37,.96);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.vsw span{align-self:center;padding:0 8px 0 10px;font-size:12px;color:rgba(255,255,255,.5)}
.vsw button{min-height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.vsw button.on{background:linear-gradient(180deg,#DFC880,#C9A84C);color:#2A2008}

@media (min-width:1024px){
  body{--top:0px}
  .app-top{position:static}
  h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app-top"><span class="logo">ПП</span>Маршрут</div>
<main class="lesson">
  <nav class="ltabs" aria-label="Уроки макета"><a href="?l=1">1 · Сбор данных</a><a href="?l=2">2 · Кастдев</a></nav>
  <div class="crumb">‹ <b>Маршрут</b> › <span id="crumb"></span></div>
  <div class="head" id="head"></div>
  <div id="blocks"></div>
  <nav class="plp lnext" id="lnext"></nav>
</main>

; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-tem rgin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Сбор данных»: дополнения к lesson.css урока «Правила курса». */\n.rule-ic.amber { background: rgba(234,184,32,.12); color: var(--amber); }\n\n/* ——— план урока ——— */\n.plan { margin-top: 14px; padding: 16px 18px 6px; border-radius: var(--r); border: 1px solid var(--line); }\n.plan-h { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); margin-bottom: 6px; }\n.plan ol { list-style: none; }\n.plan li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.3; }\n.plan li:first-child { border-top: 0; }\n.plan b { font-weight: 600; color: var(--t1); }\n.plan em { font-style: normal; font-size: 13px; color: var(--t3); white-space: nowrap; }\n.plan-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--t2); }\n.plan-ic svg.i { width: 15px; height: 15px; }\n.plan-ic.gold { background: rgba(234,184,32,.12); color: var(--amber); }\n\n/* ——— глаза в глаза ——— */\n.near-scale { margin: 4px 0 16px; }\n.near-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(107,159,25 nd: #A9C6FF; justify-content: center; padding: 0; }\n.fnl-split { display: flex; gap: 8px; margin: -4px 0 14px; }\n.fnl-split span { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--line2); font-size: 14px; color: var(--t2); }\n.fnl-split b { font-size: 16px; }\n.fnl-cv { display: flex; justify-content: center; padding: 8px 0; }\n.fnl-cv span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 100px; background: var(--blue-bg); border: 1px solid var(--blue-line); font-size: 13px; font-weight: 700; color: var(--blue); }\n.fnl-cv svg.i { width: 15px; height: 15px; }\n.fnl-cash { margin-top: 10px; border-color: rgba(234,184,32,.4); background: linear-gradient(180deg, rgba(234,184,32,.10), var(--card)); }\n.fnl-cash .fnl-n { color: var(--amber); background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.35); }\n.fnl-cash .fnl-v { background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }\n.fnl-cash p { margin-top: 12px; }\n\n/* ——— шаблон отчёта ——— */\n.report { margin-top: 16px; border-radius: var(--r); border: 1px dashed rgba(240,208,128,.45); padding: 18px; background: rgba(240,208,128,.04); }\n.report-h { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #F0D080; margin-bottom: 10px; }\n.report dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }\n.report dl > div:first-child { border-top: 0; }\n.report dt { color: var(--t2); }\n.report dd { text-align: right; font-weight: 700; color: var(--t1); font-variant-numeric: tabular-nums; }\n.report dd small { display: block; font-size: 12px; font-weight: 500; color: var(--t3); }\n.report .sum dt, .report .sum dd { color: #F0D080; }\n.report-f { margin-top: 10px; font-size: 14px; color: var(--t3); }\n\n/* ——— вс у неделю<\/p>\n    <p class=\"cheat-sub\">Всё остальное в&nbsp;уроке помогает их&nbsp;выполнить.<\/p>\n    <div class=\"rule\">\n      <span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg><\/span>\n      <div><p class=\"rule-name\">Провести 10&nbsp;встреч<\/p><p class=\"rule-txt\">С&nbsp;потенциальными клиентами, с&nbsp;целью продажи. Офлайн или онлайн.<\/p><\/div>\n    <\/div>\n    <div class=\"rule\">\n      <span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/><\/svg><\/span>\n      <div><p class=\"rule-name\">Посчитать воронку<\/p><p class=\"rule-txt\">Охват → ответы → договорённости → встречи → оплаты → деньги в&nbsp;кассе.<\/p><\/div>\n    <\/div>\n    <div class=\"rule\">\n      <span class=\"rule-ic amber\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span>\n      <div><p class=\"rule-name\">Встречи&nbsp;— только через раздел «Встречи»<\/p><p class=\"rule-txt\">После каждой встречи отметьте «Завершена». Скриншоты не&nbsp;нужны.<\/p><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"plan\">\n    <p class=\"plan-h\">Что в&nbsp;уроке<\/p>\n    <ol>\n      <li><span class=\"plan-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span><b>Аудио «Ваша цель на&nbsp;неделю»<\/b><em>3&nbsp;мин<\/em><\/li>\n      <li><span class=\"plan-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/><\/svg><\/span><b>Задания и&nbsp;воронка текстом<\/b><em>5&nbsp;мин<\/em><\/li>\n      <li><span class=\"plan-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><b>Как засчитываются встречи<\/b><em>1&nbsp;мин<\/em><\/li>\n      <li><span class=\"plan-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/><\/svg><\/span><b>Как провести разговор с&nbsp;клиентом<\/b><em>след. урок<\/em><\/li>\n      <li><span class=\"plan-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3\"/><\/svg><\/span><b>Подкаст «Каша в&nbsp;голове»<\/b><em>14&nbsp;мин<\/em><\/li>\n      <li><span class=\"plan-ic gold\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"/><line x1=\"4\" x2=\"4\" y1=\"22\" y2=\"15\"/><\/svg><\/span><b>Сдать отчёт по&nbsp;воронке<\/b><em>в&nbsp;конце<\/em><\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"}, {"kind": "audio", "title": "Ваша цель на неделю", "dur": "3:24"}, {"kind": "html", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Сбор данных · Задания недели подробно<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n  font-size: 17px; line-height: 1.55; letter-spacing: -.011em;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n  text-wrap: pretty;\n}\n.page { max-width: 720px; margin: 0 auto; padding: 8px 16px 24px; }\n\nb, strong { color: var(--t1); font-weight: 700; }\n.am { color: var(--amber); font-weight: 700; }\np + p { margin-top: 12px; }\nsvg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ——— заголовки секций ——— */\n.sec { padding-top: 40px; }\n.sec:first-child { padding-top: 8px; }\n.kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }\n.h2 {\n  font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 14px; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.h3 { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); margin: 24px 0 10px; text-wrap: balance; }\n.lead { font-size: 18px; color: var(--t2); }\n\n/* ——— карточки ——— */\n.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; margin-top: 16px; }\n.card-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.card-t svg.i { width: 18px; height: 18px; color: var(--blue); }\n\n/* ——— шпаргалка ——— */\n.cheat { background: linear-gradient(180deg, #172238 0%, var(--card) 100%); border-color: var(--blue-line); padding: 22px 20px 8px; }\n.cheat-h { font-size: 22px; font-weight: 700; color: var(--t1); line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }\n.cheat-sub { font-size: 15px; color: var(--t3); margin-bottom: 14px; }\n.rule { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }\n.rule-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-bg); color: var(--blue); }\n.rule-ic.red { background: var(--red-bg); color: var(--red); }\n.rule-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.3; }\n.rule-txt { font-size: 15px; line-height: 1.45; color: var(--t2); margin-top: 3px; }\n.tag-loss { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px; background: var(--red-bg); border: 1px solid var(--red-line); color: #FF9B9B; font-size: 13px; font-weight: 600; }\n.tag-loss svg.i { width: 14px; height: 14px; fill: currentColor; stroke: none; }\n\n/* ——— сердечки ——— */\n.hearts { display: flex; gap: 8px; color: var(--red); flex: none; }\n.hearts svg { width: 28px; height: 28px; fill: var(--red); }\n.hearts.sm svg { width: 18px; height: 18px; }\n.hearts .off { fill: rgba(255,255,255,.14); }\n\n/* ——— цель 30 дней ——— */\n.goal { text-align: center; padding: 24px 20px; }\n.goal-days { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }\n.goal-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.goal-or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\n.goal-opt { background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.25; }\n.goal-sep { font-size: 13px; color: var(--t3); font-weight: 600; }\n\n/* ——— списки ——— */\n.list { list-style: none; display: grid; gap: 10px; margin-top: 12px; }\n.list li { position: relative; padding-left: 22px; }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; color: var(--t2); margin-top: 4px; }\n.step-d.ok { color: var(--green); font-weight: 600; }\n\n/* ——— неделя: 3 плашки ——— */\n.week { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }\n.week div { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.3; color: var(--t2); }\n.week div b { width: 20px; text-align: center; font-size: 22px; color: var(--t1); flex: none; }\n.week div:first-child { border-color: rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.week div:first-child b { color: var(--amber); }\n\n/* ——— 80/20 ——— */\n.split-bar { display: grid; grid-template-columns: 20fr 80fr; height: 40px; border-radius: 12px; overflow: hidden; margin: 16px 0 14px; font-size: 14px; font-weight: 700; }\n.split-bar span { display: flex; align-items: center; padding: 0 12px; }\n.split-bar span:first-child { background: var(--gold); color: #1A1406; justify-content: center; padding: 0; }\n.split-bar span:last-child { background: rgba(255,255,255,.07); color: var(--t3); }\n.split { display: grid; gap: 12px; }\n.split .card { margin-top: 0; }\n.split .must { border-color: rgba(234,184,32,.4); }\n.split .must .card-t { color: var(--amber); }\n.split .must .card-t svg.i { color: var(--amber); }\n\n/* ——— таймлайн недели задания ——— */\n.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 14px 0 8px; }\n.day { text-align: center; }\n.day-bar { height: 10px; border-radius: 5px; background: rgba(107,159,255,.28); }\n.day.open .day-bar { background: var(--blue); }\n.day.dl .day-bar { background: var(--red); }\n.day-n { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--t2); }\n.day-s { font-size: 11px; line-height: 1.25; color: var(--t3); margin-top: 2px; }\n.day.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Сбор данных»: дополнения к lesson.css урока «Правила курса». */\n.rule-ic.amber { background: rgba(234,184,32,.12); color: var(--amber); }\n\n/* ——— план урока ——— */\n.plan { margin-top: 14px; padding: 16px 18px 6px; border-radius: var(--r); border: 1px solid var(--line); }\n.plan-h { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); margin-bottom: 6px; }\n.plan ol { list-style: none; }\n.plan li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.3; }\n.plan li:first-child { border-top: 0; }\n.plan b { font-weight: 600; color: var(--t1); }\n.plan em { font-style: normal; font-size: 13px; color: var(--t3); white-space: nowrap; }\n.plan-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--t2); }\n.plan-ic svg.i { width: 15px; height: 15px; }\n.plan-ic.gold { background: rgba(234,184,32,.12); color: var(--amber); }\n\n/* ——— глаза в глаза ——— */\n.near-scale { margin: 4px 0 16px; }\n.near-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(107,159,255,.25), var(--blue) 55%, #F0D080); }\n.near-pts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: -8px; }\n.near-pts span { display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.25; font-weight: 600; color: var(--t2); }\n.near-pts span:nth-child(2) { align-items: center; text-align: center; }\n.near-pts span:nth-child(3) { align-items: flex-end; text-align: right; color: var(--t1); }\n.near-pts i { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 3px var(--blue); }\n.near-pts span:nth-child(3) i { box-shadow: 0 0 0 3px #F0D080; }\n.near-cap { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--amber); }\n.recap { margin-top: 16px; font-size: 15px; color: var(--t3); }\n\n/* ——— воронка ——— */\n.fnl { list-style: none; margin-top: 18px; }\n.fnl-lv { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 16px 18px 18px; }\n.fnl-lv p { font-size: 16px; }\n.fnl-lv p + p { margin-top: 8px; }\n.fnl-hd { display: flex; align-items: center; gap: 12px; }\n.fnl-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); }\n.fnl-n svg.i { width: 16px; height: 16px; }\n.fnl-name { flex: 1; font-size: 18px; font-weight: 700; line-height: 1.2; color: var(--t1); }\n.fnl-v { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; }\n.fnl-bar { display: flex; height: 26px; min-width: 40px; margin: 14px 0; border-radius: 8px; overflow: hidden; background: var(--blue); font-size: 12px; font-weight: 700; color: #0D1117; }\n.fnl-bar span { display: flex; align-items: center; padding: 0 10px; white-space: nowrap; }\n.fnl-bar span:first-child { background: var(--blue); }\n.fnl-bar span:last-child:not(:first-child) { flex: 1; background: #A9C6FF; justify-content: center; padding: 0; }\n.fnl-split { display: flex; gap: 8px; margin: -4px 0 14px; }\n.fnl-split span { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--line2); font-size: 14px; color: var(--t2); }\n.fnl-split b { font-size: 16px; }\n.fnl-cv { display: flex; justify-content: center; padding: 8px 0; }\n.fnl-cv span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 100px; background: var(--blue-bg); border: 1px solid var(--blue-line); font-size: 13px; font-weight: 700; color: var(--blue); }\n.fnl-cv svg.i { width: 15px; height: 15px; }\n.fnl-cash { margin-top: 10px; border-color: rgba(234,184,32,.4); background: linear-gradient(180deg, rgba(234,184,32,.10), var(--card)); }\n.fnl-cash .fnl-n { color: var(--amber); background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.35); }\n.fnl-cash .fnl-v { background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }\n.fnl-cash p { margin-top: 12px; }\n\n/* ——— шаблон отчёта ——— */\n.report { margin-top: 16px; border-radius: var(--r); border: 1px dashed rgba(240,208,128,.45); padding: 18px; background: rgba(240,208,128,.04); }\n.report-h { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #F0D080; margin-bottom: 10px; }\n.report dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }\n.report dl > div:first-child { border-top: 0; }\n.report dt { color: var(--t2); }\n.report dd { text-align: right; font-weight: 700; color: var(--t1); font-variant-numeric: tabular-nums; }\n.report dd small { display: block; font-size: 12px; font-weight: 500; color: var(--t3); }\n.report .sum dt, .report .sum dd { color: #F0D080; }\n.report-f { margin-top: 10px; font-size: 14px; color: var(--t3); }\n\n/* ——— встречи ——— */\n.note a { color: #DCE7FF; font-weight: 600; }\n.note > div { flex: 1; }\n.step.key .step-n { color: var(--amber); background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.4); }\n.step.key b { color: #F0D080; }\n.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 20px; padding: 0 20px; border-radius: 14px; background: linear-gradient(180deg, #DFC880, #C9A84C); color: #2A2008; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #A07828; }\n.btn svg.i { width: 18px; height: 18px; }\n\n/* ——— ссылка на урок-инструкцию ——— */\n.nx-lesson { display: flex; align-items: center; gap: 14px; margin-top: 28px; padding: 18px; border-radius: var(--r); border: 1px solid var(--blue-line); background: linear-gradient(135deg, rgba(107,159,255,.12), rgba(107,159,255,.03)); text-decoration: none; color: var(--t2); }\n.nx-t { flex: 1; min-width: 0; }\n.nx-t small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }\n.nx-t b { display: block; margin-top: 4px; font-size: 17px; line-height: 1.3; color: var(--t1); }\n.nx-t > span { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.nx-go { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--blue-bg); border: 1px solid var(--blue-line); color: var(--blue); }\n.nx-go svg.i { width: 18px; height: 18px; }\n\n/* ——— подкаст ——— */\n.pod { background: linear-gradient(180deg, #1B2233 0%, var(--card) 100%); }\n.pod p { font-size: 16px; }\n.pod .cheat-h { margin-bottom: 10px; }\n\n@media (min-width: 640px) {\n  .fnl-lv { padding: 20px 24px 22px; }\n  .fnl-v { font-size: 34px; }\n}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <p class=\"lead\"><b>Привет, дорогой путник!<\/b><\/p>\n  <p>Рассказываю про задания этой недели. У&nbsp;вас их&nbsp;будет два.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Задание 1<\/span>\n  <h2 class=\"h2\">10 встреч с&nbsp;потенциальными клиентами<\/h2>\n  <p><b>Первое<\/b>&nbsp;— это провести 10 встреч с&nbsp;потенциальными клиентами с&nbsp;целью продажи.<\/p>\n  <p>Что значит встреча? Встреча может быть оффлайн, так и&nbsp;онлайн.<\/p>\n  <div class=\"pair\">\n    <div class=\"card\"><p class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M10 2v2\"/><path d=\"M14 2v2\"/><path d=\"M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1\"/><path d=\"M6 2v2\"/><\/svg>Офлайн<\/p><p>Если офлайн, это, например, встреча в&nbsp;кафе, в&nbsp;ресторане, в&nbsp;торговом центре или в&nbsp;вашем кабинете.<\/p><\/div>\n    <div class=\"card\"><p class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5\"/><rect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\"/><\/svg>Онлайн<\/p><p>Если онлайн, это может быть просто созвон по&nbsp;телефону или встреча в&nbsp;формате зум-созвона.<\/p><\/div>\n  <\/div>\n\n  <div class=\"card near\">\n    <p class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\/svg>Глаза в&nbsp;глаза<\/p>\n    <div class=\"near-scale\" aria-hidden=\"true\">\n      <div class=\"near-bar\"><\/div>\n      <div class=\"near-pts\">\n        <span><i><\/i>Звонок по&nbsp;телефону<\/span>\n        <span><i><\/i>Зум с&nbsp;камерой<\/span>\n        <span><i><\/i>Вживую<\/span>\n      <\/div>\n      <p class=\"near-cap\">ближе к&nbsp;человеку → выше вероятность покупки<\/p>\n    <\/div>\n    <p>Я, конечно, рекомендую встречи, где вы&nbsp;видите человека глаза в&nbsp;глаза, как онлайн, так и&nbsp;офлайн.<br>Это самое эффективное, что вы&nbsp;можете провести. Чем ближе вы&nbsp;к&nbsp;человеку, тем выше вероятность, что человек примет решение о&nbsp;покупке.<\/p>\n  <\/div>\n  <p class=\"recap\">Это получается, первое задание - провести 10 встреч с&nbsp;потенциальными клиентами.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Задание 2<\/span>\n  <h2 class=\"h2\">Посчитать воронку<\/h2>\n  <p><b>Вторая задача<\/b> – это посчитать эффективность этих встреч, то&nbsp;есть посчитать конверсии по&nbsp;воронке.<\/p>\n  <p>Итак, как выглядит наша воронка?<\/p>\n\n  <ol class=\"fnl\">\n    <li class=\"fnl-lv\">\n      <div class=\"fnl-hd\"><span class=\"fnl-n\">1<\/span><span class=\"fnl-name\">Охват<\/span><b class=\"fnl-v\">400<\/b><\/div>\n      <div class=\"fnl-bar\" style=\"width:100%\"><span style=\"width:87.5%\">350 сторис<\/span><span>50<\/span><\/div>\n      <p>На&nbsp;самом верхнем уровне – это охват, то&nbsp;есть это количество людей, которые увидели информацию о&nbsp;том, что вы&nbsp;в&nbsp;принципе собираете людей.<\/p>\n      <p>Допустим, вы&nbsp;примете решение о&nbsp;том, чтобы выложить сториз, пост, карусель, рилс или еще какую-то дополнительную активность о&nbsp;том, что вы&nbsp;собираете людей на&nbsp;подобную встречу.<\/p>\n      <p>И&nbsp;вы&nbsp;прямо указываете: сториз увидело 350 человек.<\/p>\n      <p>Дополнительно вы&nbsp;можете еще отправить личные приглашения по&nbsp;записной книжке. И&nbsp;тут может быть, человек 50.<\/p>\n      <p>В&nbsp;итоге вы&nbsp;пишете «Охват 400 человек», в&nbsp;скобочках: 350 – это охват сториз, 50 – это точечных приглашений по&nbsp;записной книжке.<\/p>\n    <\/li>\n    <li class=\"fnl-cv\"><span><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg>ответили 10%<\/span><\/li>\n    <li class=\"fnl-lv\">\n      <div class=\"fnl-hd\"><span class=\"fnl-n\">2<\/span><span class=\"fnl-name\">Ответы<\/span><b class=\"fnl-v\">40<\/b><\/div>\n      <div class=\"fnl-bar\" style=\"width:32%\"><\/div>\n      <p>Опускаемся с&nbsp;вами на&nbsp;уровень воронки ниже.<\/p>\n      <p>Нам нужно посчитать, сколько из&nbsp;этих 400 человек вам в&nbsp;итоге ответит.<\/p>\n      <p>То&nbsp;есть второй уровень – это ответы.<\/p>\n      <p>Из&nbsp;400 человек вам может ответить человек 40. И&nbsp;мы&nbsp;прямо указываем: 40 человек ответили, и&nbsp;не&nbsp;важно, что они ответили: &laquo;Привет&raquo;, &laquo;да&raquo;, &laquo;нет&raquo;, &laquo;хорошо&raquo;, &laquo;плохо&raquo;.<\/p>\n      <p>Просто прямо указываете, вот из&nbsp;400 – 40 ответило.<\/p>\n    <\/li>\n    <li class=\"fnl-cv\"><span><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg>договорились 50%<\/span><\/li>\n    <li class=\"fnl-lv\">\n      <div class=\"fnl-hd\"><span class=\"fnl-n\">3<\/span><span class=\"fnl-name\">Договорённости о&nbsp;встрече<\/span><b class=\"fnl-v\">20<\/b><\/div>\n      <div class=\"fnl-bar\" style=\"width:22%\"><\/div>\n      <p>Спускаемся ниже, мы&nbsp;указываем, сколько у&nbsp;нас договоренностей о&nbsp;встрече. То&nbsp;есть, сколько из&nbsp;этих 40 человек сказали, что да, я&nbsp;готов с&nbsp;тобой созвониться, встретиться и&nbsp;так далее.<\/p>\n      <p>И&nbsp;мы&nbsp;указываем, например, 20 человек.<\/p>\n    <\/li>\n    <li class=\"fnl-cv\"><span><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg>дошли до&nbsp;встречи 75%<\/span><\/li>\n    <li class=\"fnl-lv\">\n      <div class=\"fnl-hd\"><span class=\"fnl-n\">4<\/span><span class=\"fnl-name\">Проведённые встречи<\/span><b class=\"fnl-v\">15<\/b><\/div>\n      <div class=\"fnl-bar\" style=\"width:19%\"><\/div>\n      <p>Спускаемся на&nbsp;следующий уровень и&nbsp;пишем: Проведенных встреч.<\/p>\n      <p>То&nbsp;есть сколько людей из&nbsp;тех, с&nbsp;которыми мы&nbsp;договорились, вот из&nbsp;20, сколько реально получилось провести встреч.<\/p>\n      <p>Потому что люди имеют такую возможность писать на&nbsp;последний момент, что они не&nbsp;успевают. И&nbsp;возможно из&nbsp;этих 20 только 15 дойдут до&nbsp;реальных встреч.<\/p>\n    <\/li>\n    <li class=\"fnl-cv\"><span><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg>купили 33%<\/span><\/li>\n    <li class=\"fnl-lv\">\n      <div class=\"fnl-hd\"><span class=\"fnl-n\">5<\/span><span class=\"fnl-name\">Купили<\/span><b class=\"fnl-v\">5<\/b><\/div>\n      <div class=\"fnl-bar\" style=\"width:12%\"><\/div>\n      <div class=\"fnl-split\"><span><b>3<\/b>аванса<\/span><span><b>2<\/b>полных оплаты<\/span><\/div>\n      <p>Следующий уровень. Мы&nbsp;пишем, сколько человек у&nbsp;нас купило. И&nbsp;мы&nbsp;прямо указываем, из&nbsp;15 человек у&nbsp;нас купило 5.<\/p>\n      <p>И&nbsp;ниже пишем: авансов, условно, 3, полных оплат 2.<\/p>\n    <\/li>\n    <li class=\"fnl-lv fnl-cash\">\n      <div class=\"fnl-hd\"><span class=\"fnl-n\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M18.09 10.37A6 6 0 1 1 10.34 18\"/><path d=\"M7 6h1v4\"/><path d=\"m16.71 13.88.7.71-2.82 2.82\"/><\/svg><\/span><span class=\"fnl-name\">Итого денег в&nbsp;кассе<\/span><b class=\"fnl-v\">100 000 ₽<\/b><\/div>\n      <p>И&nbsp;ниже сумму: Итого денег в&nbsp;кассе. Допустим, 100 тысяч рублей.<\/p>\n    <\/li>\n  <\/ol>\n  <p class=\"recap\">Вот и&nbsp;все.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Итого<\/span>\n  <div class=\"card\">\n    <p>Получается, <b>первое задание<\/b> – провести 10 встреч с&nbsp;потенциальными клиентами с&nbsp;целью оплаты. <b>Второе<\/b> – посчитать эффективность этих действий.<\/p>\n    <p>Прямо раскладываете охват, сколько было ответов, сколько было договоренностей о&nbsp;встрече, сколько в&nbsp;итоге было проведенных встреч, сколько было оплат, сколько из&nbsp;них было авансов, сколько было полных платежей, итого денег в&nbsp;кассе.<\/p>\n  <\/div>\n\n  <div class=\"report\">\n    <p class=\"report-h\"><svg class=\"i\" viewBox=\"0 0 24 24\"><rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M12 11h4\"/><path d=\"M12 16h4\"/><path d=\"M8 11h.01\"/><path d=\"M8 16h.01\"/><\/svg>Так выглядит отчёт&nbsp;— на&nbsp;примере выше<\/p>\n    <dl>\n      <div><dt>Охват<\/dt><dd>400 <small>(350&nbsp;— сторис, 50&nbsp;— личные приглашения)<\/small><\/dd><\/div>\n      <div><dt>Ответили<\/dt><dd>40<\/dd><\/div>\n      <div><dt>Договорились о&nbsp;встрече<\/dt><dd>20<\/dd><\/div>\n      <div><dt>Провели встреч<\/dt><dd>15<\/dd><\/div>\n      <div><dt>Купили<\/dt><dd>5 <small>(авансов&nbsp;— 3, полных оплат&nbsp;— 2)<\/small><\/dd><\/div>\n      <div class=\"sum\"><dt>Итого денег в&nbsp;кассе<\/dt><dd>100 000 ₽<\/dd><\/div>\n    <\/dl>\n    <p class=\"report-f\">Свои цифры впишите в&nbsp;задание в&nbsp;конце урока.<\/p>\n  <\/div>\n\n  <p class=\"quote\">Вперед! Я&nbsp;уверен, что у&nbsp;вас все получится.<\/p>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"}, {"kind": "html", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Сбор данных · Как засчитываются встречи<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n  font-size: 17px; line-height: 1.55; letter-spacing: -.011em;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n  text-wrap: pretty;\n}\n.page { max-width: 720px; margin: 0 auto; padding: 8px 16px 24px; }\n\nb, strong { color: var(--t1); font-weight: 700; }\n.am { color: var(--amber); font-weight: 700; }\np + p { margin-top: 12px; }\nsvg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ——— заголовки секций ——— */\n.sec { padding-top: 40px; }\n.sec:first-child { padding-top: 8px; }\n.kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }\n.h2 {\n  font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 14px; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.h3 { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); margin: 24px 0 10px; text-wrap: balance; }\n.lead { font-size: 18px; color: var(--t2); }\n\n/* ——— карточки ——— */\n.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; margin-top: 16px; }\n.card-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.card-t svg.i { width: 18px; height: 18px; color: var(--blue); }\n\n/* ——— шпаргалка ——— */\n.cheat { background: linear-gradient(180deg, #172238 0%, var(--card) 100%); border-color: var(--blue-line); padding: 22px 20px 8px; }\n.cheat-h { font-size: 22px; font-weight: 700; color: var(--t1); line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }\n.cheat-sub { font-size: 15px; color: var(--t3); margin-bottom: 14px; }\n.rule { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }\n.rule-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-bg); color: var(--blue); }\n.rule-ic.red { background: var(--red-bg); color: var(--red); }\n.rule-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.3; }\n.rule-txt { font-size: 15px; line-height: 1.45; color: var(--t2); margin-top: 3px; }\n.tag-loss { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px; background: var(--red-bg); border: 1px solid var(--red-line); color: #FF9B9B; font-size: 13px; font-weight: 600; }\n.tag-loss svg.i { width: 14px; height: 14px; fill: currentColor; stroke: none; }\n\n/* ——— сердечки ——— */\n.hearts { display: flex; gap: 8px; color: var(--red); flex: none; }\n.hearts svg { width: 28px; height: 28px; fill: var(--red); }\n.hearts.sm svg { width: 18px; height: 18px; }\n.hearts .off { fill: rgba(255,255,255,.14); }\n\n/* ——— цель 30 дней ——— */\n.goal { text-align: center; padding: 24px 20px; }\n.goal-days { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }\n.goal-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.goal-or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\n.goal-opt { background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.25; }\n.goal-sep { font-size: 13px; color: var(--t3); font-weight: 600; }\n\n/* ——— списки ——— */\n.list { list-style: none; display: grid; gap: 10px; margin-top: 12px; }\n.list li { position: relative; padding-left: 22px; }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; col
