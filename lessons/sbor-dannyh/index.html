;— давайте»<\/td><\/tr><tr><td>Что удивило<\/td><td>Даже не&nbsp;рассматривает платить сам&nbsp;— для него это вопрос компании<\/td><\/tr><tr><td>Мои выводы<\/td><td>Главное допущение про личные деньги под угрозой. Спрашивать про оплату у&nbsp;всех следующих собеседников особенно внимательно<\/td><\/tr><tr><td>Предположения<\/td><td>П1&nbsp;+ · П2&nbsp;− (платила компания) · П3&nbsp;+ · П4&nbsp;+ (через HR)<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<h3 class=\"pp-h3\">Чек-лист после каждого разговора<\/h3>\n<p>Можете отмечать галочками для вашего удобства.<\/p>\n<ul class=\"pp-check\"><li>Заполнила карточку в&nbsp;течение часа после разговора<\/li><li>Записала минимум 3–5 дословных фраз&nbsp;— в&nbsp;кавычках, без пересказа<\/li><li>Факты и&nbsp;выводы записаны раздельно<\/li><li>Отметила, что человек уже пробовал и&nbsp;сколько тратил&nbsp;— деньгами и&nbsp;временем<\/li><li>Записала, чем закончилась проверка делом&nbsp;— что человек сделал, а&nbsp;не&nbsp;что пообещал<\/li><li>Записала, что удивило или противоречит гипотезе<\/li><li>Перенесла плюсы и&nbsp;минусы в&nbsp;общую таблицу<\/li><li>Отправила благодарность<\/li><li>Проверила себя: говорила ли&nbsp;я&nbsp;меньше 20% времени? Не&nbsp;рассказывала ли&nbsp;про свой продукт раньше конца?<\/li><li>Отметила, какой вопрос сработал плохо,&nbsp;— поправлю в&nbsp;гайде до&nbsp;следующего разговора<\/li><\/ul>\n<p>Десять таких карточек&nbsp;— это уже материал для решения. Дальше&nbsp;— как его разобрать.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 9. Проанализируйте все разговоры и решите, что менять\" data-pp-short=\"Шаг 9\"><section class=\"pp-stepsec\" id=\"step-9\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">09<\/span><div><span class=\"pp-part-label\">Шаг 9 из 9<\/span><h2 class=\"pp-section-title\"><span>Проанализируйте все разговоры и&nbsp;решите, что менять<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>2–3 часа, один вечер<\/span><\/div><\/div><div class=\"prose\"><h3 class=\"pp-h3\">Сводная таблица «сколько из&nbsp;10»<\/h3>\n<p>Откройте общую таблицу и&nbsp;посчитайте по&nbsp;каждому предположению: у&nbsp;скольких собеседников оно подтвердилось. Особенно ценно то, о&nbsp;чём человек заговорил <b>сам<\/b>, без вашего вопроса.<\/p>\n<p>Ориентир, а&nbsp;не&nbsp;закон: если что-то подтвердилось больше чем у&nbsp;половины&nbsp;— сигнал сильный. Если у&nbsp;2–3 из&nbsp;10&nbsp;— это либо отдельная подгруппа, либо случайность. Смотрите, что повторяется у&nbsp;большинства.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Вот как могла бы&nbsp;выглядеть сводка Марины после десяти разговоров. Цифры условные&nbsp;— это иллюстрация того, как читать таблицу.<\/p>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Предположение<\/th><th>Сколько из&nbsp;10&nbsp;подтвердили<\/th><th>Что увидела Марина<\/th><\/tr><\/thead><tbody><tr><td>П1. Кто<\/td><td>8&nbsp;из&nbsp;10<\/td><td>У&nbsp;работающих женщин трудностей меньше, острее всего&nbsp;— у&nbsp;тех, кто вёл дом<\/td><\/tr><tr><td>П2. Боль есть<\/td><td>8&nbsp;из&nbsp;10<\/td><td>Конкретные недавние случаи вспомнили восемь человек<\/td><\/tr><tr><td>П3. «Пустое гнездо»<\/td><td>2&nbsp;из&nbsp;10<\/td><td>Чаще звучит «дома стало тихо», «не&nbsp;знаю, куда себя деть»<\/td><\/tr><tr><td>П4. Пробовали и&nbsp;тратили<\/td><td>6&nbsp;из&nbsp;10<\/td><td>Что-то делали шестеро, платили пятеро: психолог, женский курс, ретрит<\/td><\/tr><tr><td>П5. Результат «жить для себя»<\/td><td>4&nbsp;из&nbsp;10<\/td><td>Семь человек, говоря о&nbsp;«хорошо через год», сами заговорили о&nbsp;муже<\/td><\/tr><tr><td>П6. Онлайн-группа<\/td><td>6&nbsp;из&nbsp;10<\/td><td>Трое сказали, что про мужа при чужих говорить не&nbsp;стали бы<\/td><\/tr><tr><td>П7. Цена порядка 15&nbsp;000 ₽<\/td><td>5&nbsp;из&nbsp;10<\/td><td>Все пятеро, кто платил, тратили на&nbsp;это 10&nbsp;000 ₽ и&nbsp;больше<\/td><\/tr><tr><td>П8. Модули<\/td><td>см. ниже<\/td><td>Модуль 2&nbsp;— 7&nbsp;из&nbsp;10&nbsp;сами; модуль 5&nbsp;— 1&nbsp;из&nbsp;10<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<h3 class=\"pp-h3\">Три возможных исхода<\/h3>\n<p>После сводки всегда получается один из&nbsp;трёх исходов. Ни&nbsp;один из&nbsp;них не&nbsp;провал&nbsp;— каждый даёт вам решение.<\/p>\n<p><b>Исход 1. Гипотеза подтвердилась.<\/b><\/p>\n<p>Большинство предположений подтвердилось у&nbsp;большинства собеседников. Люди называют ту&nbsp;же&nbsp;боль, уже тратили деньги на&nbsp;похожие решения, а&nbsp;в&nbsp;конце разговора несколько человек сделали проверку делом.<\/p>\n<p>Что делать: оставить продукт в&nbsp;основе как есть, заменить формулировки на&nbsp;слова собеседников и&nbsp;идти к&nbsp;первым продажам. Первых клиентов искать среди тех, с&nbsp;кем вы&nbsp;говорили.<\/p>\n<p><b>Исход 2. Гипотеза подтвердилась частично.<\/b><\/p>\n<p>Самый частый исход. Боль есть, но&nbsp;не&nbsp;совсем такая. Или аудитория та, но&nbsp;формат другой. Или всё сходится, кроме цены. Бросать всё не&nbsp;нужно&nbsp;— нужно повернуть продукт туда, где сигнал сильнее.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Возьмём для примера такой поворот. Марина шла проверять «пустое гнездо»&nbsp;— потерю опоры после отъезда детей. А&nbsp;в&nbsp;разговорах семь женщин из&nbsp;десяти сами, без вопроса, заговорили о&nbsp;другом: «Дети уехали&nbsp;— а&nbsp;мы&nbsp;с&nbsp;мужем остались вдвоём, и&nbsp;говорить не&nbsp;о&nbsp;чем». «Сидим как соседи». «Раньше все разговоры были про детей, а&nbsp;теперь молчим».<\/p>\n<p>Это пример возможного вывода, а&nbsp;не&nbsp;реальное исследование. Но&nbsp;именно так обычно и&nbsp;выглядит частичное подтверждение: общая тема угадана, а&nbsp;главная боль оказалась рядом.<\/p>\n<p>Что меняет Марина:<\/p>\n<ul class=\"pp-list\"><li><b>Программа.<\/b> Модуль «Дома стало тихо» из&nbsp;второго становится центральным&nbsp;— на&nbsp;него теперь две недели из&nbsp;шести. «Тело и&nbsp;энергия»&nbsp;— убирает: о&nbsp;нём сама заговорила только одна собеседница. Остальные модули остаются, но&nbsp;переписываются вокруг пары: «Чего хочу я&nbsp;сама&nbsp;— и&nbsp;как говорить об&nbsp;этом мужу».<\/li><li><b>Название.<\/b> «Жизнь для себя» звучало только у&nbsp;четырёх. Марина ищет название в&nbsp;словах собеседниц&nbsp;— например, вокруг фраз «снова вдвоём» или «не&nbsp;соседи». Выбирает по&nbsp;тому, что звучало чаще.<\/li><li><b>Формат.<\/b> Трое сказали, что при чужих про мужа говорить не&nbsp;стали бы. Марина добавляет к&nbsp;группе одну индивидуальную встречу в&nbsp;начале&nbsp;— чтобы каждая могла рассказать своё без свидетелей.<\/li><li><b>Цена.<\/b> Пятеро уже платили суммы такого порядка&nbsp;— цену Марина оставляет. А&nbsp;для тех, кто не&nbsp;платил никогда, думает о&nbsp;более простом первом шаге&nbsp;— например, недорогой встрече-знакомстве.<\/li><\/ul><\/div>\n<p><b>Исход 3. Гипотеза не&nbsp;подтвердилась.<\/b><\/p>\n<p>Большинство собеседников не&nbsp;вспомнили ни&nbsp;одного острого случая, ничего не&nbsp;пробовали, ни&nbsp;за&nbsp;что не&nbsp;платили. Или отвечали: «Да&nbsp;наоборот, наконец-то свобода».<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Если бы&nbsp;у&nbsp;Марины было так&nbsp;— например, восемь из&nbsp;десяти сказали «дети уехали, и&nbsp;мне стало легче», никто ничего не&nbsp;пробовал и&nbsp;не&nbsp;тратил,&nbsp;— это значило бы: проблема или не&nbsp;острая, или не&nbsp;у&nbsp;этих людей.<\/p><\/div>\n<p>Что делать:<\/p>\n<ul class=\"pp-list\"><li><b>Посмотреть на&nbsp;подгруппы.<\/b> Может, у&nbsp;двух из&nbsp;десяти боль есть и&nbsp;сильная&nbsp;— и&nbsp;это ваша настоящая, более узкая аудитория. Поговорите ещё с&nbsp;5–7 людьми именно из&nbsp;неё.<\/li><li><b>Посмотреть, о&nbsp;чём говорили вместо этого.<\/b> Часто в&nbsp;разговорах звучит другая проблема, которая волнует сильнее. Она и&nbsp;может стать новой гипотезой.<\/li><li><b>Сформулировать новую гипотезу и&nbsp;пройти шаги 1–9 снова.<\/b> Это быстрее, чем кажется: гайд, шаблоны и&nbsp;навык у&nbsp;вас уже есть.<\/li><\/ul>\n<div class=\"pp-note pp-note-good\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.801 10A10 10 0 1 1 17 3.335\"/><path d=\"m9 11 3 3L22 4\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Это хороший результат<\/span><p>Неподтверждённая гипотеза кажется поражением. На&nbsp;самом деле вы&nbsp;только что сэкономили несколько месяцев работы над продуктом, который бы&nbsp;не&nbsp;купили. Десять разговоров стоили вам две-три недели. Продукт стоил бы&nbsp;в&nbsp;разы больше.<\/p><\/div><\/div>\n<h3 class=\"pp-h3\">Как слова собеседников становятся текстами<\/h3>\n<p>Дословные фразы из&nbsp;карточек&nbsp;— самое ценное, что вы&nbsp;получили. Это язык, которым ваша аудитория сама описывает свою жизнь. Тексты, написанные этими словами, человек читает как про себя.<\/p>\n<div class=\"pp-note pp-note-warn\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Бережно с&nbsp;чужими словами<\/span><p>Используйте фразы без имён и&nbsp;без деталей, по&nbsp;которым человека можно узнать. Если фраза очень личная&nbsp;— спросите у&nbsp;собеседника разрешения.<\/p><\/div><\/div>\n<p>Соберите все дословные фразы из&nbsp;десяти карточек в&nbsp;один документ. Сгруппируйте по&nbsp;темам: боль, что пробовали, чего хотят, страхи. И&nbsp;используйте:<\/p>\n<ul class=\"pp-list\"><li><b>Заголовки и&nbsp;первые строки постов.<\/b> Фраза, которая звучала у&nbsp;нескольких человек,&nbsp;— готовое начало поста.<\/li><li><b>Описание продукта.<\/b> «Для кого» и&nbsp;«что изменится»&nbsp;— словами собеседников, а&nbsp;не&nbsp;вашими профессиональными.<\/li><li><b>Первый экран лендинга.<\/b> <b>Лендинг<\/b>&nbsp;— страница в&nbsp;интернете, где описан ваш продукт и&nbsp;можно записаться. Главная фраза на&nbsp;его первом экране должна звучать так, как говорит клиент.<\/li><li><b>Темы для контента.<\/b> Каждая трудность из&nbsp;разговоров&nbsp;— тема для отдельного поста или видео.<\/li><\/ul>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Что сказала собеседница<\/th><th>Куда пошло<\/th><th>Как стало<\/th><\/tr><\/thead><tbody><tr><td>«Мы&nbsp;с&nbsp;мужем сидим как соседи»<\/td><td>Заголовок поста<\/td><td>«Дети уехали&nbsp;— и&nbsp;вы&nbsp;с&nbsp;мужем сидите как соседи? Откуда это берётся и&nbsp;что с&nbsp;этим делать»<\/td><\/tr><tr><td>«Раньше все разговоры были про детей, а&nbsp;теперь молчим»<\/td><td>Первый экран лендинга<\/td><td>«Когда все разговоры были про детей, а&nbsp;теперь дома тишина&nbsp;— группа для женщин, которые хотят заново найти общий язык с&nbsp;мужем»<\/td><\/tr><tr><td>«Не&nbsp;понимаю, кто я&nbsp;теперь, если не&nbsp;мама»<\/td><td>Описание модуля<\/td><td>«Модуль \"Кто я&nbsp;теперь\": для тех, кто 25&nbsp;лет была прежде всего мамой»<\/td><\/tr><tr><td>«Звоню сыну&nbsp;— а&nbsp;ему всегда некогда»<\/td><td>Тема сторис<\/td><td>Вопрос подписчицам: «Как часто вы&nbsp;звоните взрослым детям&nbsp;— и&nbsp;кто кому звонит первым?»<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Фразы условные, как и&nbsp;весь пример.<\/p><\/div>\n<p>У&nbsp;мастера по&nbsp;косам в&nbsp;тексты идут и&nbsp;тормоза, и&nbsp;эмоции. Фраза «я&nbsp;всё детство мечтала косички заплести»&nbsp;— готовое начало поста для тех, кто сомневается годами.<\/p>\n<h3 class=\"pp-h3\">Как это выглядит у&nbsp;мастера и&nbsp;консультанта<\/h3>\n<p>Та&nbsp;же&nbsp;работа&nbsp;— сводка, исход, фразы в&nbsp;тексты&nbsp;— у&nbsp;двух других героев. Всё ниже&nbsp;— пример возможного вывода, а&nbsp;не&nbsp;реальное исследование. Цифры условные&nbsp;— это иллюстрация того, как читать таблицу.<\/p>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><p><b>Сводка после десяти разговоров<\/b>&nbsp;— с&nbsp;клиентками в&nbsp;кресле и&nbsp;подписчицами, которые так и&nbsp;не&nbsp;записались.<\/p>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Предположение<\/th><th>Сколько из&nbsp;10&nbsp;подтвердили<\/th><th>Что увидела мастер<\/th><\/tr><\/thead><tbody><tr><td>П1. Решение тормозит что-то конкретное<\/td><td>8&nbsp;из&nbsp;10<\/td><td>Чаще всего&nbsp;— «вдруг не&nbsp;пойдёт» и&nbsp;как жить с&nbsp;косами: мыть голову, спать. Цена&nbsp;— на&nbsp;третьем месте<\/td><\/tr><tr><td>П2. Подталкивает событие<\/td><td>7&nbsp;из&nbsp;10<\/td><td>Почти всегда&nbsp;— отпуск. Реже праздник или смена образа<\/td><\/tr><tr><td>П3. 11&nbsp;000 ₽ и&nbsp;переплетение&nbsp;— привычная трата<\/td><td>4&nbsp;из&nbsp;10<\/td><td>Регулярно переплетаются четверо, в&nbsp;основном постоянные клиентки<\/td><\/tr><tr><td>П4. Находят через знакомых и&nbsp;салоны<\/td><td>7&nbsp;из&nbsp;10<\/td><td>Увидели косы у&nbsp;подруги или получили номер в&nbsp;салоне<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Возможный исход&nbsp;— подтвердилось, и&nbsp;загадка разгадана.<\/b> Людей годами держит не&nbsp;цена, а&nbsp;страх «вдруг не&nbsp;пойдёт» и&nbsp;непонимание, как жить с&nbsp;косами каждый день. Решаются, когда появляется повод&nbsp;— отпуск.<\/p>\n<p>Что меняется:<\/p>\n<ul class=\"pp-list\"><li><b>Тексты.<\/b> Показывать работы на&nbsp;клиентках, похожих на&nbsp;тех, кто сомневается,&nbsp;— с&nbsp;их&nbsp;разрешения. Отдельно ответить на&nbsp;бытовые вопросы: как мыть голову, как спать, сколько держится.<\/li><li><b>Первый шаг.<\/b> Добавить короткую бесплатную или недорогую встречу&nbsp;— примерку или консультацию по&nbsp;образу. Так страх «вдруг не&nbsp;пойдёт» снимается до&nbsp;того, как человек решится на&nbsp;несколько часов в&nbsp;кресле и&nbsp;11&nbsp;000 ₽.<\/li><li><b>Запись к&nbsp;поводу.<\/b> Предлагать записаться к&nbsp;отпуску заранее, с&nbsp;предоплатой.<\/li><li><b>Проверка делом в&nbsp;следующих разговорах.<\/b> Не&nbsp;только «приведёте подругу?», но&nbsp;и&nbsp;запись на&nbsp;примерку.<\/li><\/ul>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Что сказала собеседница<\/th><th>Куда пошло<\/th><th>Как стало<\/th><\/tr><\/thead><tbody><tr><td>«А&nbsp;вдруг мне не&nbsp;пойдёт? Я&nbsp;же&nbsp;не&nbsp;модель»<\/td><td>Пост<\/td><td>«\"А&nbsp;вдруг мне не&nbsp;пойдёт?\"&nbsp;— показываю косы на&nbsp;девушках, которые думали так же»<\/td><\/tr><tr><td>«Не&nbsp;понимаю, как с&nbsp;ними мыть голову и&nbsp;спать»<\/td><td>Серия сторис<\/td><td>«Как жить с&nbsp;косами: мою голову, сплю, хожу в&nbsp;бассейн&nbsp;— отвечаю на&nbsp;ваши вопросы»<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p><b>Сводка после десяти разговоров.<\/b><\/p>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Предположение<\/th><th>Сколько из&nbsp;10&nbsp;подтвердили<\/th><th>Что увидел консультант<\/th><\/tr><\/thead><tbody><tr><td>П1. Защита стратегии даётся тяжело<\/td><td>7&nbsp;из&nbsp;10<\/td><td>Конкретная недавняя защита с&nbsp;жёстким сроком, у&nbsp;троих план вернули на&nbsp;доработку<\/td><\/tr><tr><td>П2. Платят сами<\/td><td>2&nbsp;из&nbsp;10<\/td><td>У&nbsp;восьми обучение и&nbsp;коучей оплачивал работодатель. Лично платить не&nbsp;рассматривают<\/td><\/tr><tr><td>П3. Уже тратили на&nbsp;подобное<\/td><td>6&nbsp;из&nbsp;10<\/td><td>Программы для руководителей, коучи&nbsp;— суммы от&nbsp;сотен тысяч рублей, почти всегда за&nbsp;счёт компании<\/td><\/tr><tr><td>П4. Находят по&nbsp;рекомендации<\/td><td>6&nbsp;из&nbsp;10<\/td><td>Через HR&nbsp;и&nbsp;коллег, реже&nbsp;— по&nbsp;совету акционера<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Возможный исход&nbsp;— подтвердилось частично.<\/b> Боль и&nbsp;срок настоящие: руководителям действительно нужно защитить стратегию, и&nbsp;это трудно. Но&nbsp;платить за&nbsp;помощь большинство ждут от&nbsp;компании, как платили за&nbsp;прошлое обучение.<\/p>\n<p>Что меняется:<\/p>\n<ul class=\"pp-list\"><li><b>Кому продавать.<\/b> Не&nbsp;только топ-менеджеру лично, но&nbsp;и&nbsp;тем, кто в&nbsp;компании решает про обучение руководителей: HR&nbsp;и&nbsp;акционеру.<\/li><li><b>Предложение.<\/b> Сделать понятное предложение для компании: что получит бизнес, если новый руководитель за&nbsp;три месяца защитит стратегию. И, возможно, отдельную версию для тех двоих из&nbsp;десяти, кто готов платить сам.<\/li><li><b>Цена.<\/b> 600 000 ₽ проверять по&nbsp;суммам, которые компании уже платили за&nbsp;программы для руководителей и&nbsp;коучей.<\/li><li><b>Проверка делом в&nbsp;следующих разговорах.<\/b> Не&nbsp;только знакомство с&nbsp;коллегой, но&nbsp;и&nbsp;знакомство с&nbsp;человеком, который в&nbsp;компании решает про обучение.<\/li><\/ul>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Что сказал собеседник<\/th><th>Куда пошло<\/th><th>Как стало<\/th><\/tr><\/thead><tbody><tr><td>«Я&nbsp;в&nbsp;этой отрасли полгода, а&nbsp;спрашивают как с&nbsp;человека, который в&nbsp;ней двадцать лет»<\/td><td>Первый экран лендинга<\/td><td>«Вас назначили в&nbsp;новую отрасль, а&nbsp;спрашивают как с&nbsp;человека, который в&nbsp;ней двадцать лет? За&nbsp;три месяца&nbsp;— стратегия, которую вы&nbsp;защитите на&nbsp;совете директоров»<\/td><\/tr><tr><td>«Обучение&nbsp;— это к&nbsp;HR, у&nbsp;нас на&nbsp;это есть бюджет»<\/td><td>Предложение для компании<\/td><td>«Сопровождение руководителя нового направления&nbsp;— из&nbsp;бюджета компании на&nbsp;развитие руководителей»<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<h3 class=\"pp-h3\">Кто из&nbsp;собеседников&nbsp;— первые кандидаты в&nbsp;клиенты<\/h3>\n<p>Пересмотрите карточки и&nbsp;отметьте тех, у&nbsp;кого сошлись три признака:<\/p>\n<ol class=\"pp-olist\"><li>Проблема есть <b>сейчас<\/b>, и&nbsp;она острая&nbsp;— человек вспомнил недавние конкретные случаи.<\/li><li>Человек <b>уже тратил<\/b> деньги или время, чтобы с&nbsp;ней справиться.<\/li><li>Человек <b>сделал проверку делом<\/b>&nbsp;— дал контакт, попросил написать, когда откроется набор, или сам спросил про ваш продукт.<\/li><\/ol>\n<p>Эти люди&nbsp;— ваши первые кандидаты. Когда продукт будет готов, напишите им&nbsp;первыми и&nbsp;лично:<\/p>\n<div class=\"pp-say\">«Ольга, здравствуйте! Мы&nbsp;с&nbsp;вами говорили в&nbsp;сентябре про то, как изменилась жизнь, когда дочь переехала. Спасибо ещё раз&nbsp;— тот разговор во&nbsp;многом определил, какой получилась программа. Я&nbsp;открываю набор в&nbsp;первую группу, и&nbsp;вы&nbsp;просили написать. Рассказать подробнее?»<\/div>\n<p>Не&nbsp;массовая рассылка, а&nbsp;личное сообщение с&nbsp;деталью из&nbsp;вашего разговора.<\/p>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><p>Проверка делом&nbsp;— запись на&nbsp;дату с&nbsp;предоплатой или приглашение подруги. Первые кандидаты&nbsp;— подписчицы, которые в&nbsp;разговоре назвали повод и&nbsp;дату, например отпуск, и&nbsp;клиентки, которые переплетаются регулярно.<\/p><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p>Проверка делом&nbsp;— знакомство с&nbsp;коллегой или платная диагностическая встреча. Первые кандидаты&nbsp;— руководители, у&nbsp;которых защита стратегии впереди, которые уже платили за&nbsp;подобное из&nbsp;своих денег и&nbsp;согласились на&nbsp;диагностику.<\/p><\/div><\/div><\/section>\n<\/div><div data-pp-page=\"Результат и частые вопросы\" data-pp-short=\"Итог\"><section id=\"result\"><span class=\"pp-part-label\">Результат<\/span><h2 class=\"pp-section-title\">Что у&nbsp;вас будет <span>на&nbsp;руках в&nbsp;итоге<\/span><\/h2><div class=\"prose\"><p>После 8–12 разговоров и&nbsp;анализа у&nbsp;вас на&nbsp;руках:<\/p><\/div><div class=\"pp-results\"><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Проверенная гипотеза<\/b>&nbsp;— подтверждённая, исправленная или честно отброшенная. В&nbsp;любом случае вы&nbsp;знаете, а&nbsp;не&nbsp;догадываетесь.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Продукт, каждая часть которого стоит на&nbsp;разговорах<\/b>&nbsp;— модули программы, этапы сопровождения или состав услуги. Лишнее убрано, главное стало главным.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Цена, которая опирается на&nbsp;факты<\/b>&nbsp;— на&nbsp;то, сколько люди уже платили за&nbsp;похожие решения. И&nbsp;понимание, кто платит.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Словарь клиента<\/b>&nbsp;— десятки дословных фраз о&nbsp;боли, попытках и&nbsp;желаниях.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Темы для контента<\/b> на&nbsp;недели вперёд&nbsp;— каждая трудность из&nbsp;разговоров.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Тексты для описания продукта и&nbsp;лендинга<\/b>&nbsp;— словами самих клиентов.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Понимание, где ваши клиенты ищут специалиста<\/b>&nbsp;— а&nbsp;значит, куда вкладывать силы в&nbsp;продвижении.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Список первых кандидатов в&nbsp;клиенты<\/b>&nbsp;— люди, которые знают вас лично и&nbsp;уже проявили интерес делом.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Новые контакты<\/b>&nbsp;— знакомые ваших собеседников, с&nbsp;которыми можно поговорить дальше.<\/p><\/div><div class=\"pp-result\"><svg class=\"pp-result-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><p><b>Навык<\/b>, который пригодится для каждого следующего продукта.<\/p><\/div><\/div><\/section>\n<section id=\"faq\"><span class=\"pp-part-label\">FAQ<\/span><h2 class=\"pp-section-title\">Частые <span>вопросы<\/span><\/h2><details class=\"pp-faq\"><summary>«А&nbsp;можно разослать анкету вместо разговоров? Так быстрее».<\/summary><div class=\"prose\"><p>Анкета не&nbsp;заменяет разговор. В&nbsp;анкете человек пишет, что он&nbsp;о&nbsp;себе думает,&nbsp;— обычно общими словами: «иногда бывает грустно». И&nbsp;вы&nbsp;не&nbsp;можете спросить «а&nbsp;что было дальше?», не&nbsp;видите паузы и&nbsp;эмоций, не&nbsp;слышите, о&nbsp;чём человек заговорил сам. Самое ценное в&nbsp;кастдеве появляется во&nbsp;втором и&nbsp;третьем ответе&nbsp;— в&nbsp;анкете их&nbsp;нет.<\/p>\n<p>Но&nbsp;анкета хорошо помогает найти собеседников. 3–4 простых вопроса («Сколько вам лет?», «Когда дети стали жить отдельно?») и&nbsp;в&nbsp;конце: «Готовы поговорить об&nbsp;этом 30&nbsp;минут? Оставьте контакт». Так вы&nbsp;отберёте подходящих людей и&nbsp;позовёте их&nbsp;на&nbsp;разговор.<\/p><\/div><\/details><details class=\"pp-faq\"><summary>«Можно поговорить с&nbsp;подругами? С&nbsp;ними проще».<\/summary><div class=\"prose\"><p>Проще&nbsp;— да, полезнее&nbsp;— нет. Подруги знают вашу идею и&nbsp;любят вас, поэтому будут поддерживать, а&nbsp;не&nbsp;рассказывать. Если подруга точно из&nbsp;вашей аудитории&nbsp;— поговорите, но&nbsp;не&nbsp;засчитывайте этот разговор в&nbsp;основные 8–12 и&nbsp;особенно внимательно отсеивайте комплименты. А&nbsp;лучше попросите подругу познакомить вас со&nbsp;своей знакомой в&nbsp;такой же&nbsp;ситуации.<\/p><\/div><\/details><details class=\"pp-faq\"><summary>«Мне страшно писать и&nbsp;звонить незнакомым людям. Вдруг я&nbsp;буду навязываться?»<\/summary><div class=\"prose\"><p>Это нормально&nbsp;— почти всем страшно в&nbsp;первый раз. Но&nbsp;посмотрите, о&nbsp;чём вы&nbsp;просите: не&nbsp;о&nbsp;деньгах и&nbsp;не&nbsp;о&nbsp;покупке, а&nbsp;о&nbsp;том, чтобы человек рассказал о&nbsp;своём опыте. Многим это приятно&nbsp;— не&nbsp;так часто кто-то 40&nbsp;минут внимательно слушает их&nbsp;историю. И&nbsp;вы&nbsp;всегда оставляете лёгкий способ отказаться.<\/p>\n<p>Начните с&nbsp;самых тёплых: подписчики, бывшие клиенты, знакомые знакомых. Первые 2–3 разговора считайте тренировкой. К&nbsp;пятому страх обычно сменяется интересом.<\/p><\/div><\/details><details class=\"pp-faq\"><summary>«Нужно ли&nbsp;платить за&nbsp;разговор или дарить подарок?»<\/summary><div class=\"prose\"><p>Платить не&nbsp;стоит. Когда человек приходит за&nbsp;деньгами, он&nbsp;старается «отработать»&nbsp;— отвечать так, как вам, по&nbsp;его мнению, нужно. Небольшая благодарность после разговора уместна&nbsp;— например, ваш полезный материал по&nbsp;теме. Но&nbsp;не&nbsp;обещайте её&nbsp;в&nbsp;приглашении как приманку: придут те, кому нужен подарок, а&nbsp;не&nbsp;те, у&nbsp;кого есть проблема.<\/p><\/div><\/details><details class=\"pp-faq\"><summary>«А&nbsp;что если все говорят разное?»<\/summary><div class=\"prose\"><p>Сначала посмотрите, одинаковые ли&nbsp;люди. Часто «все говорят разное», потому что вы&nbsp;поговорили с&nbsp;разными подгруппами: работающими и&nbsp;нет, замужними и&nbsp;разведёнными, постоянными клиентами и&nbsp;разовыми. Разложите карточки по&nbsp;подгруппам&nbsp;— внутри каждой ответы могут оказаться похожими.<\/p>\n<p>Если и&nbsp;внутри одной подгруппы всё разное&nbsp;— проведите ещё 3–5 разговоров. Если и&nbsp;тогда нет повторов&nbsp;— скорее всего, гипотеза слишком широкая. Сузьте аудиторию и&nbsp;попробуйте снова.<\/p><\/div><\/details><details class=\"pp-faq\"><summary>«Сколько времени займёт весь процесс?»<\/summary><div class=\"prose\"><p>Примерно так:<\/p>\n<ul class=\"pp-list\"><li>гипотеза, предположения, гайд&nbsp;— 1&nbsp;вечер;<\/li><li>поиск собеседников и&nbsp;приглашения&nbsp;— 1–2 недели, параллельно с&nbsp;первыми разговорами;<\/li><li>10&nbsp;разговоров по&nbsp;20–40 минут плюс 15–20 минут на&nbsp;карточку&nbsp;— около 10&nbsp;часов, растянутых на&nbsp;2–3 недели;<\/li><li>анализ&nbsp;— 1&nbsp;вечер.<\/li><\/ul>\n<p>Итого 3–4 недели в&nbsp;спокойном темпе. Для сравнения: создание нового продукта&nbsp;— месяцы.<\/p><\/div><\/details><\/section>\n<\/div><div data-pp-page=\"Что сделать сегодня\" data-pp-short=\"Задание\"><section id=\"task\"><div class=\"pp-task\"><span class=\"pp-task-lbl\">Задание<\/span><h4>Что сделать сегодня<\/h4><div class=\"prose task-intro\"><p>Не&nbsp;«когда-нибудь», а&nbsp;сегодня&nbsp;— пока свежо в&nbsp;голове. На&nbsp;всё уйдёт около двух часов.<\/p><\/div><ul><li><b>Сформулируйте гипотезу по&nbsp;формуле:<\/b> кто → что болит → что уже пробуют → какой результат хотят → что вы&nbsp;предлагаете. Запишите, из&nbsp;чего состоит ваш продукт: модули программы, этапы сопровождения или состав услуги<\/li><li><b>Разложите гипотезу на&nbsp;предположения.<\/b> Сделайте таблицу, как у&nbsp;героев: предположение → каким вопросом проверить → что подтвердит → что опровергнет. Отметьте одно самое важное&nbsp;— без которого продукт не&nbsp;продать<\/li><li><b>Отдельно проверьте состав продукта.<\/b> Для каждой части запишите: что вы&nbsp;должны услышать в&nbsp;разговоре, чтобы она осталась<\/li><li><b>Составьте список из&nbsp;20–30 людей,<\/b> которых можно пригласить: подписчики, клиенты, знакомые знакомых, тематические чаты<\/li><li><b>Напишите и&nbsp;отправьте первые 5&nbsp;приглашений<\/b> по&nbsp;шаблонам из&nbsp;шага 4<\/li><li><b>Соберите свой гайд вопросов<\/b> по&nbsp;шести блокам из&nbsp;шага 7. Проверьте каждый вопрос: может ли&nbsp;ответ показать, что вы&nbsp;ошибаетесь?<\/li><li><b>Подготовьте таблицу для записи<\/b> и&nbsp;распечатайте шаблон карточки собеседника<\/li><li><b>Решите, о&nbsp;чём попросите в&nbsp;конце<\/b>&nbsp;— минимум, средний и&nbsp;сильный уровень проверки делом<\/li><\/ul><div class=\"pp-task-check\"><b>Проверка результата.<\/b> Через неделю у&nbsp;вас должно быть назначено хотя бы&nbsp;2–3 разговора. Если никто не&nbsp;ответил&nbsp;— перечитайте приглашения: нет ли&nbsp;в&nbsp;них рассказа о&nbsp;вашем продукте или слова «интервью», и&nbsp;понятно ли, почему вы&nbsp;пишете именно этому человеку.<\/div><\/div><\/section>\n<section class=\"pp-final\"><div class=\"pp-cta-orbs\" aria-hidden=\"true\"><span class=\"orb-cta orb-cta-tr\"><\/span><span class=\"orb-cta orb-cta-bl\"><\/span><\/div><p class=\"pp-cta-lbl\">Что у&nbsp;вас теперь есть<\/p><h2 class=\"pp-cta-title\">Пошаговый способ проверить идею продукта или услуги до&nbsp;того, как вы&nbsp;потратите на&nbsp;неё месяцы.<\/h2><p class=\"pp-cta-sub\">Вы&nbsp;знаете, как сформулировать гипотезу и&nbsp;разложить её&nbsp;на&nbsp;проверяемые части, где найти собеседников и&nbsp;как их&nbsp;пригласить, какие вопросы задавать и&nbsp;каких избегать, как вести разговор, чтобы получить факты вместо комплиментов, и&nbsp;как превратить десять разговоров в&nbsp;решение: что оставить, что изменить, как назвать и&nbsp;кому продать первым. Для онлайн-группы, для услуги мастера и&nbsp;для дорогого сопровождения&nbsp;— метод один.<\/p><a class=\"pp-cta-btn\" href=\"#task\">К&nbsp;заданию ↑<\/a><\/section>\n\n<footer>\n  <div class=\"footer-brand-block\"><span class=\"footer-logo\">План Продюсера<\/span><span class=\"footer-article\">Кастдев: как проверить идею продукта<\/span><\/div>\n  <span class=\"footer-meta\">Александр Турубаров · Игорь Граф<\/span>\n<\/footer>\n<\/div><\/div>\n<\/body>\n<\/html>\n"}], "next": "Формула достижения желаемого дохода"}]}</script>
<script>
const I = {
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  right: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  swipe: '<path d="M18 8 22 12 18 16"/><path d="M6 8 2 12 6 16"/><path d="M2 12h20"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Та же функция, что в кабинете (HtmlPageBlockEditor.toShadowMarkup)
function toShadowMarkup(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const fonts = [];
  doc.querySelectorAll('link[rel="stylesheet"][href]').forEach((l) => fonts.push(l.getAttribute('href') || ''));
  doc.querySelectorAll('script, iframe, object, embed, link, meta, base').forEach((el) => el.remove());
  let css = Array.from(doc.querySelectorAll('style')).map((s) => s.textContent || '').join('\n');
  doc.querySelectorAll('style').forEach((s) => s.remove());
  css = css.replace(/@import\s+url\(\s*['"]?([^'")]+)['"]?\s*\)\s*;?/g, (_m, href) => { fonts.push(href); return ''; });
  css = css.replace(/:root\b/g, ':host').replace(/(^|[{},\s])html(?=\s*[,{])/g, '$1:host').replace(/(^|[{},\s])body(?=\s*[,{.:[])/g, '$1.pp-shadow-body');
  return { css, body: doc.body ? doc.body.innerHTML : '', fonts };
}
function shadowInto(host, html, extraCss = '') {
  const root = host.attachShadow({ mode: 'open' });
  const { css, body } = toShadowMarkup(html);
  root.innerHTML = `<style>:host{display:block}${css}${extraCss}</style><div class="pp-shadow-body">${body}</div>`;
  return root;
}

// ===== Постраничный показ =====
const PAGED_CSS = `
[data-pp-page]{display:none}
[data-pp-page][data-on]{display:block}
[data-pp-page]>section:first-child{margin-top:0!important}
.pp-shadow-body{min-height:0!important;padding-top:20px!important;padding-bottom:12px!important}
.pp-shadow-body::before{display:none!important}
[data-pp-page][data-in="n"]{animation:ppN .26s cubic-bezier(.2,.7,.2,1)}
[data-pp-page][data-in="p"]{animation:ppP .26s cubic-bezier(.2,.7,.2,1)}
@keyframes ppN{from{opacity:0;transform:translateX(32px)}}
@keyframes ppP{from{opacity:0;transform:translateX(-32px)}}
@media (prefers-reduced-motion:reduce){[data-pp-page]{animation:none!important}}`;

function mountPaged(slot, html, key, opts = {}) {
  const store = JSON.parse(localStorage.getItem(key) || '{"i":0,"seen":[0]}');
  let cur = Math.min(store.i || 0, 999);
  const seen = new Set(store.seen || [0]);
  let variant = localStorage.getItem('pg-variant') || 'a';
  let tocOpen = false;

  slot.innerHTML = `<section class="pg">
    ${opts.cap === false ? '' : `<div class="pg-cap"><span class="ic">${ic('book')}</span><div><b>Инструкция: как провести разговор с&nbsp;клиентом</b><small class="cnt"></small></div></div>`}
    <div class="pg-bar"><div class="pg-bar-in"></div><div class="pg-toc" hidden></div></div>
    <div class="pg-stage"></div>
    <nav class="plp" aria-label="Страницы инструкции"></nav>
  </section>`;
  const $ = (s) => slot.querySelector(s);
  const barBox = $('.pg-bar'), bar = $('.pg-bar-in'), toc = $('.pg-toc'), stage = $('.pg-stage'), nav = $('.plp');
  const root = shadowInto(stage, html, PAGED_CSS);
  const pages = Array.from(root.querySelectorAll('[data-pp-page]'));
  const N = pages.length;
  if (cur >= N) cur = 0;
  if ($('.cnt')) $('.cnt').textContent = `${N} страниц · листайте по одной`;
  const T = (i) => pages[i].getAttribute('data-pp-page');
  const S = (i) => pages[i].getAttribute('data-pp-short') || String(i + 1);

  function save() { localStorage.setItem(key, JSON.stringify({ i: cur, seen: [...seen] })); }

  function renderBar() {
    if (variant === 'a') {
      bar.innerHTML = `<div class="pg-row"><span class="pg-num">${cur + 1} / ${N}</span><span class="pg-ttl">${esc(T(cur))}</span>
        <button class="pg-tocbtn" aria-expanded="${tocOpen}">${ic('list')}Все</button></div>
        <div class="pg-seg" style="grid-template-columns:repeat(${N},1fr)">${pages.map((_, i) => `<i class="${i === cur ? 'on' : seen.has(i) ? 'seen' : ''}"></i>`).join('')}</div>`;
      bar.querySelector('.pg-tocbtn').onclick = () => { tocOpen = !tocOpen; renderBar(); renderToc(); };
    } else {
      bar.innerHTML = `<div class="pg-chips" role="tablist">${pages.map((_, i) => `<button role="tab" aria-selected="${i === cur}" data-i="${i}" class="${i === cur ? 'on' : seen.has(i) ? 'seen' : ''}">${esc(S(i))}</button>`).join('')}</div>
        <div class="pg-line"><i style="width:${((cur + 1) / N) * 100}%"></i></div>`;
      const chips = bar.querySelector('.pg-chips');
      chips.querySelectorAll('button').forEach((b) => (b.onclick = () => go(+b.dataset.i)));
      const on = chips.querySelector('.on');
      chips.scrollLeft = on.offsetLeft - chips.clientWidth / 2 + on.offsetWidth / 2;
      tocOpen = false;
    }
  }
  function renderToc() {
    toc.hidden = !tocOpen || variant !== 'a';
    if (toc.hidden) return;
    const row = (i) => `<button data-i="${i}" class="${i === cur ? 'on' : seen.has(i) ? 'seen' : ''}"><span class="n">${i + 1}</span><span class="t">${esc(T(i))}</span>${seen.has(i) && i !== cur ? ic('check') : '<span></span>'}</button>`;
    const steps = pages.map((_, i) => i).filter((i) => /^Шаг /.test(S(i)));
    const before = pages.map((_, i) => i).filter((i) => i < steps[0]);
    const after = pages.map((_, i) => i).filter((i) => i > steps[steps.length - 1]);
    toc.innerHTML = `<div class="grp">Основа</div>${before.map(row).join('')}<div class="grp">9 шагов</div>${steps.map(row).join('')}<div class="grp">Итог</div>${after.map(row).join('')}`;
    toc.querySelectorAll('button').forEach((b) => (b.onclick = () => { tocOpen = false; go(+b.dataset.i); }));
  }
  function renderNav() {
    const prev = cur > 0 ? `<button class="plp-pv" data-d="-1">${ic('left')}<span class="tx"><small>Назад</small><b>${esc(T(cur - 1))}</b></span></button>` : '<span></span>';
    const next = cur < N - 1
      ? `<button class="plp-nx" data-d="1"><span class="tx"><small>Дальше · ${cur + 2} из ${N}</small><b>${esc(T(cur + 1))}</b></span><span class="go">${ic('right')}</span></button>`
      : `<button class="plp-nx done" data-d="task"><span class="tx"><small>Инструкция пройдена</small><b>${opts.doneText || 'Отчёт по воронке — в задании в конце урока'}</b></span><span class="go">${ic('check')}</span></button>`;
    nav.innerHTML = prev + next;
    nav.querySelectorAll('button').forEach((b) => (b.onclick = () => {
      if (b.dataset.d === 'task') { if (opts.doneHref) { location.href = opts.doneHref; return; } document.getElementById('task')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      go(cur + +b.dataset.d);
    }));
  }
  function show(dir) {
    pages.forEach((p, i) => {
      if (i === cur) { p.setAttribute('data-on', ''); if (dir) { p.removeAttribute('data-in'); void p.offsetWidth; p.setAttribute('data-in', dir); } }
      else { p.removeAttribute('data-on'); p.removeAttribute('data-in'); }
    });
  }
  function go(i, target) {
    if (i < 0 || i >= N) return;
    const dir = i > cur ? 'n' : i < cur ? 'p' : '';
    cur = i; seen.add(i); save();
    show(dir); renderBar(); renderToc(); renderNav();
    const topOff = parseFloat(getComputedStyle(document.body).getPropertyValue('--top')) || 0;
    if (target) { const y = target.getBoundingClientRect().top + scrollY - topOff - barBox.offsetHeight - 12; scrollTo({ top: y, behavior: 'smooth' }); return; }
    const y = slot.querySelector('.pg-bar').getBoundingClientRect().top + scrollY - topOff;
    const anchor = slot.querySelector('.pg').getBoundingClientRect().top + scrollY - topOff - 8;
    if (scrollY > anchor) scrollTo({ top: Math.min(y, anchor), behavior: 'smooth' });
  }
  this.setVariant = (v) => { variant = v; tocOpen = false; renderBar(); renderToc(); };

  // Внутренние ссылки документа (#step-3) ведут на нужную страницу
  root.addEventListener('click', (e) => {
    const a = e.composedPath().find((n) => n.tagName === 'A');
    const href = a && a.getAttribute('href');
    if (!href || !href.startsWith('#')) return;
    const t = root.getElementById(decodeURIComponent(href.slice(1)));
    const p = t && t.closest('[data-pp-page]');
    if (!p) return;
    e.preventDefault();
    const i = pages.indexOf(p);
    go(i, p.firstElementChild === t ? null : t);
  });

  // Свайп: только явный горизонтальный жест и не по прокручиваемой таблице
  let sx = 0, sy = 0, skip = false;
  stage.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    skip = e.composedPath().some((n) => n.nodeType === 1 && n.scrollWidth > n.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(n).overflowX));
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (skip) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // Стрелки клавиатуры, когда инструкция на экране
  addEventListener('keydown', (e) => {
    if (e.altKey || e.metaKey || e.ctrlKey || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
    const r = stage.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return;
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowLeft') go(cur - 1);
  });

  show(''); renderBar(); renderToc(); renderNav();
  return this;
}

// ===== Сборка страницы урока =====
const ALL = JSON.parse(document.getElementById('data').textContent);
const LN = new URLSearchParams(location.search).get('l') === '2' ? 1 : 0;
const L = ALL.lessons[LN];
document.querySelectorAll('.ltabs a').forEach((a, i) => a.classList.toggle('on', i === LN));
document.getElementById('crumb').textContent = L.crumb;
document.getElementById('head').innerHTML = (L.key ? `<span class="badge"><svg class="i" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>Ключевое задание</span>` : '<span class="badge">Инструкция · 9 шагов</span>') + `<h1>${esc(L.title)}</h1>`;
document.getElementById('lnext').innerHTML = `<a class="plp-pv" href="${LN === 1 ? "?l=1" : "#"}">${ic('left')}<span class="tx"><small>Предыдущий урок</small><b>${LN === 1 ? 'Ключевое задание недели 1 — сбор данных' : 'Точки А и Б'}</b></span></a>
  <a class="plp-nx" href="${LN === 0 ? "?l=2" : "#"}"><span class="tx"><small>Следующий урок</small><b>${esc(L.next)}</b></span><span class="go">${ic('right')}</span></a>`;
const box = document.getElementById('blocks');
let pager;
for (const b of L.blocks) {
  const el = document.createElement('div');
  el.className = 'blk';
  box.appendChild(el);
  if (b.kind === 'html') { const h = document.createElement('div'); h.className = 'html-host'; el.appendChild(h); shadowInto(h, b.html); }
  if (b.kind === 'audio') el.innerHTML = `<div class="aud"><span class="aud-p">${ic('play')}</span><div class="aud-t"><b>${esc(b.title)}</b><small>Аудио · ${b.dur}</small><div class="aud-bar"></div></div></div>`;
  if (b.kind === 'instr') pager = new mountPaged(el, b.html, 'pg:kastdev', { cap: false, doneText: 'Вернуться к ключевому заданию недели', doneHref: '?l=1' });
  if (b.kind === 'task') el.innerHTML = `<div class="task" id="task"><span class="badge">Задание</span>
    <h3>Отчёт за неделю</h3>${b.html}
    <div class="task-meta"><span>Срок · 2 октября, 21:00 мск</span><span>+1000 баллов</span><span>+1000 монет</span></div>
    <label>Показатели воронки за неделю *<textarea placeholder="Охват: …\nОтветили: …\nДоговорились о встрече: …\nПровели встреч: …\nКупили: … (авансов — …, полных оплат — …)\nИтого денег в кассе: …"></textarea></label>
    <label>Загрузить в свою группу фото или видео отчеты…<input placeholder="Ссылка"></label>
    <button class="sub">Отправить</button></div>`;
}
const vsw = document.querySelectorAll('.vsw button');
function setV(v) { localStorage.setItem('pg-variant', v); vsw.forEach((b) => b.classList.toggle('on', b.dataset.v === v)); pager && pager.setVariant(v); }
vsw.forEach((b) => (b.onclick = () => setV(b.dataset.v)));
const qv = new URLSearchParams(location.search).get('v');
setV(qv || localStorage.getItem('pg-variant') || 'a');
</script>
</body>
