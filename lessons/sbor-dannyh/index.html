 class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Предположение<\/th><th>Каким вопросом проверяю<\/th><th>Подтвердит<\/th><th>Опровергнет<\/th><\/tr><\/thead><tbody><tr><td><b>П1.<\/b> Решение тормозит что-то конкретное, и&nbsp;это можно снять<\/td><td>«Когда вы&nbsp;впервые захотели косы? Что было между этим моментом и&nbsp;записью?»<\/td><td>Называют конкретные тормоза: цена, страх, что не&nbsp;пойдёт, долго сидеть, уход<\/td><td>«Ничего не&nbsp;мешало, просто не&nbsp;было повода»&nbsp;— значит, работать надо с&nbsp;поводом, а&nbsp;не&nbsp;с&nbsp;сомнениями<\/td><\/tr><tr><td><b>П2.<\/b> Подталкивает событие&nbsp;— отпуск, праздник, смена образа<\/td><td>«Что стало поводом записаться именно тогда?»<\/td><td>У&nbsp;большинства есть конкретное событие с&nbsp;датой<\/td><td>Решение спонтанное, без повода<\/td><\/tr><tr><td><b>П3.<\/b> Есть клиентки, для которых 11&nbsp;000 ₽ и&nbsp;переплетение раз в&nbsp;полтора-два месяца&nbsp;— привычная трата<\/td><td>«Сколько раз за&nbsp;последний год вы&nbsp;делали косы? Сколько в&nbsp;итоге потратили?»<\/td><td>Переплетаются регулярно, называют суммы такого порядка<\/td><td>Делали один раз «к&nbsp;отпуску» и&nbsp;больше не&nbsp;планируют<\/td><\/tr><tr><td><b>П4.<\/b> Мастера находят через знакомых и&nbsp;салоны<\/td><td>«Как вы&nbsp;нашли своего мастера? Что смотрели перед записью?»<\/td><td>Большинство&nbsp;— по&nbsp;рекомендации или через салон<\/td><td>Находят по-другому&nbsp;— это новый канал, о&nbsp;котором она не&nbsp;знала<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Предположение<\/th><th>Каким вопросом проверяю<\/th><th>Подтвердит<\/th><th>Опровергнет<\/th><\/tr><\/thead><tbody><tr><td><b>П1.<\/b> У&nbsp;недавно назначенных топ-менеджеров есть момент «надо защитить стратегию», и&nbsp;он&nbsp;даётся тяжело<\/td><td>«Когда вы&nbsp;последний раз представляли план совету директоров или акционеру? Как готовились?»<\/td><td>Конкретная недавняя история с&nbsp;напряжением и&nbsp;жёстким сроком<\/td><td>Защита&nbsp;— привычная процедура, справились силами своей команды<\/td><\/tr><tr><td><b>П2.<\/b> Платят сами, из&nbsp;личных денег<\/td><td>«Кто платил за&nbsp;ваше последнее обучение или коуча&nbsp;— вы&nbsp;или компания?»<\/td><td>Платили сами, хотя бы&nbsp;частично<\/td><td>Всегда платит компания, лично не&nbsp;платили никогда<\/td><\/tr><tr><td><b>П3.<\/b> Уже тратили на&nbsp;подобное<\/td><td>«Что вы&nbsp;уже пробовали, когда входили в&nbsp;новую роль: программы для руководителей, коуч, консультант? Сколько это стоило?»<\/td><td>Называют конкретные программы и&nbsp;суммы<\/td><td>Ничего, «разбирался сам»<\/td><\/tr><tr><td><b>П4.<\/b> Таких специалистов находят по&nbsp;рекомендации<\/td><td>«Как вы&nbsp;нашли последнего коуча или консультанта? Кто посоветовал?»<\/td><td>Через коллег, HR&nbsp;(отдел по&nbsp;работе с&nbsp;сотрудниками), акционера<\/td><td>По-другому&nbsp;— и&nbsp;это подскажет, где искать клиентов<\/td><\/tr><\/tbody><\/table><\/div>\n<p>П2&nbsp;здесь важнее всех. Если личные деньги не&nbsp;подтвердятся, меняется всё: кому продавать, как говорить о&nbsp;цене, кто принимает решение.<\/p><\/div>\n<h3 class=\"pp-h3\">Как проверить состав продукта, не&nbsp;показывая его<\/h3>\n<p>У&nbsp;курса это модули, у&nbsp;сопровождения&nbsp;— этапы работы, у&nbsp;услуги&nbsp;— варианты и&nbsp;дополнения. Частая ошибка&nbsp;— показать собеседнику список и&nbsp;спросить «что из&nbsp;этого вам нужно?». Он&nbsp;вежливо отметит всё. Правильно&nbsp;— спрашивать про жизнь и&nbsp;слушать, <b>заговорит ли&nbsp;человек об&nbsp;этой теме сам<\/b>, без подсказки.<\/p>\n<p>Если собеседница Марины сама, без вопроса про мужа, рассказывает: «А&nbsp;вечером мы&nbsp;с&nbsp;мужем сидим, и&nbsp;говорить не&nbsp;о&nbsp;чем»&nbsp;— это сильный сигнал для модуля 2. Если Марина спросила «а&nbsp;с&nbsp;мужем как?» и&nbsp;услышала «ну, нормально»&nbsp;— это почти ничего не&nbsp;значит.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Модуль<\/th><th>Что должна услышать Марина, чтобы модуль остался<\/th><th>Какой вопрос открывает эту тему, не&nbsp;называя её<\/th><\/tr><\/thead><tbody><tr><td>1. Что со&nbsp;мной происходит<\/td><td>Растерянность, «не&nbsp;понимаю, что со&nbsp;мной», сравнения с&nbsp;собой прежней<\/td><td>«Что изменилось в&nbsp;вашей жизни, когда дети стали жить отдельно?»<\/td><\/tr><tr><td>2. Дома стало тихо<\/td><td>Рассказы про вечера вдвоём, напряжение или пустоту в&nbsp;паре<\/td><td>«Расскажите, как прошёл ваш вчерашний вечер&nbsp;— с&nbsp;того момента, как вы&nbsp;пришли домой»<\/td><\/tr><tr><td>3. Новые отношения с&nbsp;детьми<\/td><td>Обиды, тревога, «звоню&nbsp;— а&nbsp;ему некогда», желание помогать и&nbsp;контролировать<\/td><td>«Когда вы&nbsp;последний раз разговаривали с&nbsp;сыном или дочерью? О&nbsp;чём был разговор?»<\/td><\/tr><tr><td>4. Чего хочу я&nbsp;сама<\/td><td>«Не&nbsp;знаю, чего хочу», отложенные мечты, «всю жизнь для других»<\/td><td>«Было ли&nbsp;что-то, что вы&nbsp;давно хотели, но&nbsp;откладывали? Что с&nbsp;этим сейчас?»<\/td><\/tr><tr><td>5. Тело и&nbsp;энергия<\/td><td>Жалобы на&nbsp;сон, усталость, силы<\/td><td>Слушает, всплывёт ли&nbsp;тема сама в&nbsp;рассказах про день и&nbsp;про трудности<\/td><\/tr><tr><td>6. План на&nbsp;год<\/td><td>Желание что-то начать, но&nbsp;непонимание, с&nbsp;чего<\/td><td>«Если через год эта ситуация вас больше не&nbsp;беспокоит&nbsp;— что изменилось бы?»<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<p>Предположения записаны, критерии есть. Теперь&nbsp;— с&nbsp;кем говорить.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 3. Найдите 8–12 собеседников\" data-pp-short=\"Шаг 3\"><section class=\"pp-stepsec\" id=\"step-3\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">03<\/span><div><span class=\"pp-part-label\">Шаг 3 из 9<\/span><h2 class=\"pp-section-title\"><span>Найдите 8–12 собеседников<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>1–2 часа на&nbsp;поиск, дальше&nbsp;— по&nbsp;мере ответов<\/span><\/div><\/div><div class=\"prose\"><h3 class=\"pp-h3\">Кого звать<\/h3>\n<p>Вам нужны люди, которые <b>сейчас находятся в&nbsp;ситуации из&nbsp;вашей гипотезы<\/b> или были в&nbsp;ней недавно. Недавно&nbsp;— это важно. Если у&nbsp;собеседницы Марины дети уехали 10&nbsp;лет назад, она уже плохо помнит, как это было, и&nbsp;будет рассказывать сглаженную историю. Если год назад&nbsp;— помнит в&nbsp;деталях.<\/p>\n<p>Где их&nbsp;найти, от&nbsp;самых тёплых к&nbsp;самым холодным:<\/p>\n<ul class=\"pp-list\"><li><b>Свои подписчики.<\/b> Те, кто уже читает вас в&nbsp;соцсетях, в&nbsp;Telegram-канале, ВКонтакте. Особенно те, кто комментировал посты на&nbsp;эту тему или писал вам в&nbsp;личные сообщения.<\/li><li><b>Бывшие клиенты.<\/b> Если среди них есть люди из&nbsp;вашей аудитории. Психологам и&nbsp;коучам&nbsp;— только бывшие: с&nbsp;клиентом, с&nbsp;которым вы&nbsp;работаете сейчас, разговор не&nbsp;получится&nbsp;— ему будет трудно отвечать честно, а&nbsp;вам&nbsp;— оставаться в&nbsp;роли исследователя. У&nbsp;мастеров и&nbsp;других специалистов по&nbsp;услугам иначе: нынешние клиенты&nbsp;— самые доступные собеседники.<\/li><li><b>Знакомые знакомых.<\/b> Попросите коллег, подруг, бывших клиентов: «Может, у&nbsp;вас есть знакомая в&nbsp;такой ситуации?» Сами подруги&nbsp;— не&nbsp;лучший вариант, а&nbsp;вот их&nbsp;знакомые&nbsp;— отличный.<\/li><li><b>Тематические чаты и&nbsp;сообщества.<\/b> Telegram-чаты, группы ВКонтакте, где собирается ваша аудитория. Перед тем как писать, прочитайте правила чата. Если сомневаетесь&nbsp;— спросите у&nbsp;администратора, можно ли&nbsp;разместить такую просьбу.<\/li><\/ul>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Марина составляет список: 4&nbsp;подписчицы, которые писали ей&nbsp;про взрослых детей; 2&nbsp;бывшие клиентки с&nbsp;похожим запросом; просьба к&nbsp;трём коллегам и&nbsp;двум подругам познакомить со&nbsp;знакомыми; два городских женских чата в&nbsp;Telegram, где она давно состоит.<\/p><\/div>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><ul class=\"pp-list\"><li><b>Клиентки прямо в&nbsp;кресле.<\/b> Плетение длится несколько часов&nbsp;— это готовое время для разговора. В&nbsp;том числе постоянная клиентка, которая ходит почти 4&nbsp;года.<\/li><li><b>Подписчицы, которые давно следят за&nbsp;работами, но&nbsp;так и&nbsp;не&nbsp;записались.<\/b> Самые ценные собеседницы: они покажут, что тормозит решение.<\/li><li><b>Бывшие клиентки, которые давно не&nbsp;приходили.<\/b> Раз они возвращаются через 3–5 лет, полезно узнать, что происходит в&nbsp;эти годы.<\/li><li><b>Сотрудники салонов, где раздают её&nbsp;номер.<\/b> Они видят, кто спрашивает про косы и&nbsp;почему не&nbsp;доходит до&nbsp;записи.<\/li><\/ul><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p>Топ-менеджеры очень заняты и&nbsp;на&nbsp;холодные сообщения почти не&nbsp;отвечают. Поэтому собеседников консультант ищет только через знакомых и&nbsp;рекомендации: бывшие коллеги, знакомые руководители, HR-директора, которых он&nbsp;знает лично. Каждого, с&nbsp;кем поговорил, просит познакомить со&nbsp;следующим.<\/p><\/div>\n<h3 class=\"pp-h3\">Почему не&nbsp;подруги и&nbsp;не&nbsp;мама<\/h3>\n<p>Подруги и&nbsp;мама вас любят. Они знают, что вы&nbsp;задумали, и&nbsp;видят, как вам это важно. Поэтому они будут беречь ваши чувства&nbsp;— хвалить идею и&nbsp;соглашаться. Это те&nbsp;же&nbsp;вежливые ответы, только ещё теплее.<\/p>\n<p>По&nbsp;той же&nbsp;причине не&nbsp;стоит звать коллег по&nbsp;профессии: они будут отвечать как специалисты («клиентам это нужно»), а&nbsp;не&nbsp;как люди, у&nbsp;которых это происходит.<\/p>\n<h3 class=\"pp-h3\">Сколько человек нужно<\/h3>\n<p>Ориентир&nbsp;— <b>8–12 разговоров<\/b>. Первые 2–3 будут разминкой: вы&nbsp;привыкнете к&nbsp;вопросам, поймёте, где сбиваетесь. Дальше пойдут самые ценные.<\/p>\n<p>Как понять, что хватит: когда вы&nbsp;заранее угадываете, что скажет следующий собеседник. Ответы начали повторяться, новое больше не&nbsp;звучит&nbsp;— разговоров достаточно. Если же&nbsp;после десяти каждый разговор приносит сюрприз&nbsp;— сделайте ещё 3–5.<\/p>\n<h3 class=\"pp-h3\">Разнообразие внутри аудитории<\/h3>\n<p>Все ваши собеседники должны подходить под гипотезу. Но&nbsp;внутри неё стоит взять разных людей. Для Марины это:<\/p>\n<ul class=\"pp-list\"><li>работающие и&nbsp;не&nbsp;работающие;<\/li><li>замужние, разведённые, вдовы;<\/li><li>с&nbsp;одним ребёнком и&nbsp;с&nbsp;несколькими;<\/li><li>дети уехали в&nbsp;другой город или просто переехали на&nbsp;соседнюю улицу;<\/li><li>из&nbsp;разных городов.<\/li><\/ul>\n<p>Для мастера по&nbsp;косам&nbsp;— постоянные клиентки, разовые «к&nbsp;отпуску» и&nbsp;те, кто так и&nbsp;не&nbsp;записался. Для консультанта&nbsp;— руководители из&nbsp;разных отраслей, назначенные полгода назад и&nbsp;полтора года назад.<\/p>\n<p>Зачем: так вы&nbsp;увидите, у&nbsp;кого потребность острее. Может оказаться, что у&nbsp;работающих женщин боли почти нет, а&nbsp;у&nbsp;тех, кто вёл дом, она сильная. Это важный вывод&nbsp;— он&nbsp;сузит вашу аудиторию.<\/p>\n<p>Список есть. Дальше&nbsp;— как написать людям так, чтобы они согласились.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 4. Пригласите на разговор\" data-pp-short=\"Шаг 4\"><section class=\"pp-stepsec\" id=\"step-4\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">04<\/span><div><span class=\"pp-part-label\">Шаг 4 из 9<\/span><h2 class=\"pp-section-title\"><span>Пригласите на&nbsp;разговор<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>1&nbsp;час на&nbsp;тексты, 1–2 недели на&nbsp;ответы и&nbsp;договорённости<\/span><\/div><\/div><div class=\"prose\"><h3 class=\"pp-h3\">Из&nbsp;чего состоит хорошее приглашение<\/h3>\n<ol class=\"pp-olist\"><li><b>Кто вы<\/b>&nbsp;— одной фразой.<\/li><li><b>Почему пишете именно этому человеку<\/b>&nbsp;— чтобы сообщение не&nbsp;выглядело рассылкой.<\/li><li><b>О&nbsp;чём хотите поговорить<\/b>&nbsp;— о&nbsp;его опыте, а&nbsp;не&nbsp;о&nbsp;вашем продукте.<\/li><li><b>Сколько это займёт<\/b>&nbsp;— 30–40 минут. Очень занятым людям&nbsp;— 20–30.<\/li><li><b>Честно: вы&nbsp;ничего не&nbsp;продаёте.<\/b><\/li><li><b>Лёгкий отказ<\/b>&nbsp;— человеку должно быть не&nbsp;неловко сказать «нет».<\/li><\/ol>\n<p>Приглашение&nbsp;— короткое. 4–6 предложений. Длинное сообщение от&nbsp;малознакомого человека читают по&nbsp;диагонали и&nbsp;откладывают «на&nbsp;потом».<\/p>\n<div class=\"pp-note pp-note-warn\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Не&nbsp;пишите слово «интервью»<\/span><div class=\"pp-say\">«Можно взять у&nbsp;вас интервью?»&nbsp;— и&nbsp;человек внутренне собирается, начинает отвечать «правильно». Пишите «поговорить», «расспросить о&nbsp;вашем опыте». Чем меньше разговор похож на&nbsp;официальную процедуру, тем честнее ответы.<\/div><\/div><\/div>\n<h3 class=\"pp-h3\">Шаблон 1. Подписчице или знакомой аудитории<\/h3>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-say\">«Здравствуйте, Ольга! Это Марина, психолог&nbsp;— вы&nbsp;давно читаете мой канал, и&nbsp;я&nbsp;помню ваш комментарий про дочь, которая переехала в&nbsp;Петербург. Я&nbsp;сейчас разговариваю с&nbsp;женщинами, у&nbsp;которых взрослые дети недавно стали жить отдельно,&nbsp;— хочу лучше понять, как этот период проходит на&nbsp;самом деле. Можно я&nbsp;расспрошу вас о&nbsp;вашем опыте? Это созвон на&nbsp;30–40 минут в&nbsp;удобное для вас время. Я&nbsp;ничего не&nbsp;продаю&nbsp;— мне важно услышать живые истории. Если сейчас не&nbsp;до&nbsp;того&nbsp;— просто напишите, я&nbsp;пойму».<\/div><\/div>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><p>Подписчице, которая давно следит за&nbsp;работами, но&nbsp;не&nbsp;записывалась:<\/p>\n<div class=\"pp-say\">«Здравствуйте, Катя! Вижу, вы&nbsp;давно следите за&nbsp;моими работами,&nbsp;— мне очень приятно. Я&nbsp;сейчас хочу лучше понять, как девушки решаются на&nbsp;косы: что нравится, что останавливает. Можно я&nbsp;задам вам несколько вопросов&nbsp;— созвоном минут на&nbsp;15–20 или в&nbsp;переписке, как удобнее? Записываться не&nbsp;зову и&nbsp;ничего не&nbsp;продаю. Если не&nbsp;хочется&nbsp;— всё в&nbsp;порядке».<\/div><\/div>\n<h3 class=\"pp-h3\">Шаблон 2. Незнакомому человеку в&nbsp;тематическом чате<\/h3>\n<p>Здесь ещё важнее показать, почему вы&nbsp;пишете именно ему. Лучший повод&nbsp;— его собственное сообщение в&nbsp;чате.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-say\">«Здравствуйте, Елена! Увидела в&nbsp;чате ваше сообщение о&nbsp;том, что сын уехал учиться в&nbsp;другой город и&nbsp;дома стало непривычно. Я&nbsp;психолог, сейчас разговариваю с&nbsp;женщинами в&nbsp;похожей ситуации&nbsp;— хочу понять, что в&nbsp;этот период происходит и&nbsp;что помогает. Могу я&nbsp;задать вам несколько вопросов в&nbsp;коротком созвоне, минут на&nbsp;30? Ничего не&nbsp;продаю. Если неудобно&nbsp;— всё в&nbsp;порядке, спасибо, что прочитали».<\/div><\/div>\n<h3 class=\"pp-h3\">Шаблон 3. Пост или сторис-призыв<\/h3>\n<p>Этот вариант работает, если у&nbsp;вас есть своя аудитория. Отвечать будут те, кому тема откликается,&nbsp;— это уже хороший отбор.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-say\">«Ищу собеседниц для разговора.<br><br>Если ваши дети за&nbsp;последние 1–3 года выросли и&nbsp;стали жить отдельно&nbsp;— и&nbsp;вы&nbsp;готовы полчаса рассказать, как это было у&nbsp;вас, напишите мне в&nbsp;личные сообщения слово \"поговорим\".<br><br>Я&nbsp;ничего не&nbsp;продаю. Я&nbsp;собираю реальные истории, чтобы лучше понять, что женщинам в&nbsp;этот период на&nbsp;самом деле нужно. Разговор&nbsp;— по&nbsp;видеосвязи, в&nbsp;удобное вам время. Ваше имя и&nbsp;узнаваемые подробности нигде не&nbsp;появятся».<\/div><\/div>\n<h3 class=\"pp-h3\">Шаблон 4. Устно&nbsp;— клиенту, который уже у&nbsp;вас<\/h3>\n<p>Если вы&nbsp;работаете с&nbsp;людьми вживую, приглашение может быть одной фразой прямо во&nbsp;время услуги.<\/p>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><div class=\"pp-say\">«Пока плетём, можно я&nbsp;вас немного расспрошу? Хочу лучше понять, как клиентки ко&nbsp;мне приходят и&nbsp;что было до&nbsp;записи. Если захочется просто помолчать или послушать музыку&nbsp;— скажите, это нормально».<\/div><\/div>\n<h3 class=\"pp-h3\">Шаблон 5. Через общего знакомого<\/h3>\n<p>Для занятых людей и&nbsp;закрытых сред&nbsp;— единственный рабочий путь. Пишете два текста: просьбу знакомому и&nbsp;короткое сообщение, которое он&nbsp;перешлёт.<\/p>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p>Знакомому:<\/p>\n<div class=\"pp-say\">«Андрей, привет! Хочу попросить о&nbsp;знакомстве. Я&nbsp;сейчас разговариваю с&nbsp;руководителями, которых недавно назначили на&nbsp;новое направление,&nbsp;— изучаю, как они входят в&nbsp;роль и&nbsp;готовят стратегию к&nbsp;защите. Есть среди твоих знакомых такой человек? Если да&nbsp;— перешли, пожалуйста, текст ниже. Если он&nbsp;согласится, дай мне его контакт».<br><br>Текст для пересылки:<br><br>«Здравствуйте! Меня зовут [имя], я&nbsp;консультирую руководителей по&nbsp;стратегии. Андрей сказал, что вы&nbsp;недавно возглавили новое направление. Я&nbsp;разговариваю с&nbsp;руководителями в&nbsp;похожей ситуации&nbsp;— хочу понять, как на&nbsp;деле проходят первые месяцы в&nbsp;новой роли. Найдётся ли&nbsp;у&nbsp;вас 20–30 минут на&nbsp;звонок в&nbsp;удобное время? Ничего не&nbsp;продаю. Если сейчас не&nbsp;до&nbsp;того&nbsp;— пойму».<\/div><\/div>\n<div class=\"pp-note pp-note-tip\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Как попросить знакомых познакомить<\/span><div class=\"pp-say\">«Ищу женщин 45–55, у&nbsp;которых взрослые дети недавно стали жить отдельно,&nbsp;— хочу расспросить их&nbsp;об&nbsp;этом опыте, ничего не&nbsp;продаю. Может, есть такая знакомая? Буду благодарна, если спросите, можно ли&nbsp;дать ей&nbsp;мой контакт».<\/div>\n<p>Просите именно спросить разрешения и&nbsp;передать ваш контакт. Так человек напишет вам сам&nbsp;— уже с&nbsp;доверием.<\/p><\/div><\/div>\n<h3 class=\"pp-h3\">Что отвечать на&nbsp;«А&nbsp;что вы&nbsp;продаёте?»<\/h3>\n<p>Этот вопрос зададут обязательно. Отвечайте честно&nbsp;— скрывать нечего.<\/p>\n<p>Если продукта пока нет, как у&nbsp;Марины:<\/p>\n<div class=\"pp-say\">«Пока ничего. Я&nbsp;думаю о&nbsp;том, чтобы сделать программу для женщин в&nbsp;такой ситуации. Но&nbsp;сначала хочу понять, нужна ли&nbsp;она и&nbsp;какой должна быть. Поэтому и&nbsp;спрашиваю не&nbsp;про программу, а&nbsp;про ваш опыт».<\/div>\n<p>Если продукт уже есть, как у&nbsp;мастера или консультанта:<\/p>\n<div class=\"pp-say\">«Я&nbsp;занимаюсь [чем], это вы&nbsp;знаете. А&nbsp;сейчас хочу понять, что на&nbsp;самом деле важно людям в&nbsp;вашей ситуации,&nbsp;— чтобы делать свою работу точнее. Поэтому спрашиваю про ваш опыт, а&nbsp;не&nbsp;про мои услуги».<\/div>\n<p>Честный ответ снимает настороженность. Человек понимает: его не&nbsp;ведут на&nbsp;продажу, его опыт действительно интересен.<\/p>\n<h3 class=\"pp-h3\">Если отказали или молчат<\/h3>\n<p><b>Отказ.<\/b> Поблагодарите и&nbsp;не&nbsp;уговаривайте: «Спасибо, что ответили! Хорошего вам дня». Отказ&nbsp;— это нормально, у&nbsp;людей своя жизнь. Иногда через неделю такой человек сам пишет «а&nbsp;давайте всё-таки».<\/p>\n<p><b>Молчание.<\/b> Одно напоминание через 3–5 дней: «Ольга, добрый день! Возвращаюсь к&nbsp;своему сообщению&nbsp;— если будет 30&nbsp;минут на&nbsp;этой или следующей неделе, буду рада поговорить. Если не&nbsp;получится&nbsp;— ничего страшного». После этого&nbsp;— не&nbsp;пишите больше. Два сообщения&nbsp;— вежливо. Три&nbsp;— уже навязчиво.<\/p>\n<p><b>Сколько писать.<\/b> Не&nbsp;все согласятся, поэтому приглашений нужно больше, чем разговоров. Начните с&nbsp;20–30 сообщений и&nbsp;смотрите, сколько ответов приходит.<\/p>\n<h3 class=\"pp-h3\">Благодарность после разговора<\/h3>\n<p>Напишите в&nbsp;тот же&nbsp;день:<\/p>\n<div class=\"pp-say\">«Ольга, спасибо вам большое за&nbsp;разговор! Вы&nbsp;очень помогли&nbsp;— особенно ваш рассказ про первое воскресенье без дочери, я&nbsp;над ним ещё думаю. Если вспомнится что-то ещё&nbsp;— пишите, мне всё интересно».<\/div>\n<p>Конкретная деталь из&nbsp;разговора показывает, что вы&nbsp;действительно слушали. Такие люди потом охотнее знакомят вас с&nbsp;другими и&nbsp;первыми откликаются, когда продукт появится.<\/p>\n<p>Договорились о&nbsp;разговорах. Прежде чем их&nbsp;проводить&nbsp;— главный навык кастдева: какие вопросы задавать.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 5. Разберитесь, какие вопросы работают, а какие нет\" data-pp-short=\"Шаг 5\"><section class=\"pp-stepsec\" id=\"step-5\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">05<\/span><div><span class=\"pp-part-label\">Шаг 5 из 9<\/span><h2 class=\"pp-section-title\"><span>Разберитесь, какие вопросы работают, а&nbsp;какие нет<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>30–40 минут на&nbsp;чтение<\/span><\/div><\/div><div class=\"prose\"><h3 class=\"pp-h3\">Что вы&nbsp;ищете в&nbsp;ответах: факты<\/h3>\n<p>Цель каждого вопроса&nbsp;— получить <b>факт<\/b>. Факт&nbsp;— это то, что уже произошло: событие, действие, потраченные деньги или время. «С&nbsp;марта по&nbsp;май я&nbsp;ходила к&nbsp;психологу, по&nbsp;4&nbsp;000 ₽ за&nbsp;встречу»&nbsp;— факт. «Я&nbsp;бы&nbsp;сходила к&nbsp;психологу»&nbsp;— нет.<\/p>\n<p>Всё, что не&nbsp;факт,&nbsp;— <b>пустые ответы<\/b>. Они звучат приятно, но&nbsp;ничего не&nbsp;доказывают. Бывают трёх видов:<\/p>\n<ul class=\"pp-list\"><li><b>Комплименты.<\/b> «Какая классная идея!», «Вы&nbsp;так тонко это чувствуете», «Такое точно нужно». Приятно, но&nbsp;ничего не&nbsp;говорит о&nbsp;том, купит ли&nbsp;человек.<\/li><li><b>Общие слова.<\/b> «Я&nbsp;обычно справляюсь сама», «Я&nbsp;всегда много читаю», «Я&nbsp;никогда не&nbsp;жалуюсь». Слова «обычно», «всегда», «никогда»&nbsp;— сигнал: за&nbsp;ними нет конкретного случая.<\/li><li><b>Обещания и&nbsp;хотелки.<\/b> «Я&nbsp;бы&nbsp;обязательно пошла», «Вот если бы&nbsp;был чат поддержки…», «Надо бы&nbsp;мне этим заняться». Это разговор о&nbsp;будущем&nbsp;— о&nbsp;фантазии.<\/li><\/ul>\n<p>Каждый пустой ответ можно вернуть к&nbsp;фактам. Как это делать&nbsp;— в&nbsp;шаге 7, там будут готовые фразы. А&nbsp;сейчас&nbsp;— какие вопросы приводят к&nbsp;фактам, а&nbsp;какие к&nbsp;пустым ответам.<\/p>\n<h3 class=\"pp-h3\">Шесть типов вопросов<\/h3>\n<p>Примеры ниже&nbsp;— из&nbsp;разговоров Марины, но&nbsp;типы вопросов одинаковые для любого продукта.<\/p>\n<p><b>1. Открытые вопросы&nbsp;— основа разговора.<\/b><\/p>\n<p>Открытый вопрос&nbsp;— тот, на&nbsp;который нельзя ответить «да» или «нет». Он&nbsp;начинается со&nbsp;слов «расскажите», «как», «что», «почему», «когда».<\/p>\n<div class=\"pp-say\">«Расскажите, что изменилось в&nbsp;вашей жизни, когда дочь переехала?»<\/div>\n<p>Зачем: открытый вопрос даёт человеку говорить своими словами. Он&nbsp;сам выбирает, с&nbsp;чего начать,&nbsp;— и&nbsp;именно это вам важно: что всплывает первым, то&nbsp;и&nbsp;болит сильнее. На&nbsp;такие вопросы приходится большая часть разговора.<\/p>\n<p><b>2. Закрытые вопросы&nbsp;— только для фактов, и&nbsp;сразу следом открытый.<\/b><\/p>\n<p>Закрытый вопрос&nbsp;— тот, на&nbsp;который отвечают «да», «нет» или одним словом. «Сколько?», «Когда?», «Пробовали ли?».<\/p>\n<p>Задавать их&nbsp;можно, но&nbsp;только чтобы уточнить факт: число, дату, было или не&nbsp;было. И&nbsp;сразу после&nbsp;— открытый вопрос, чтобы раскрыть этот факт.<\/p>\n<div class=\"pp-say\">«Вы&nbsp;обращались к&nbsp;психологу после того, как дочь уехала?»&nbsp;— «Да».&nbsp;— «Расскажите, как вы&nbsp;его выбирали и&nbsp;чем это закончилось?»<\/div>\n<p>Зачем: закрытый вопрос быстро проверяет факт, открытый показывает, что за&nbsp;ним стоит. Если задавать только закрытые, разговор превращается в&nbsp;допрос: да&nbsp;— нет&nbsp;— да&nbsp;— нет. И&nbsp;вы&nbsp;не&nbsp;узнаете ничего сверх того, что и&nbsp;так предполагали.<\/p>\n<p><b>3. Распаковывающие вопросы&nbsp;— чтобы дойти до&nbsp;сути.<\/b><\/p>\n<p>Распаковывающий вопрос&nbsp;— короткий вопрос вслед за&nbsp;ответом собеседника. Он&nbsp;не&nbsp;открывает новую тему, а&nbsp;углубляет ту, что человек сам начал. Их&nbsp;ещё называют уточняющими&nbsp;— это то&nbsp;же&nbsp;самое.<\/p>\n<p>Набор, который стоит держать под рукой:<\/p>\n<ul class=\"pp-list\"><li>«Расскажите подробнее».<\/li><li>«А&nbsp;что было дальше?»<\/li><li>«Почему это было тяжело?»<\/li><li>«А&nbsp;как вы&nbsp;это поняли?»<\/li><li>«А&nbsp;что вы&nbsp;тогда сделали?»<\/li><li>«А&nbsp;ещё?»<\/li><\/ul>\n<p>Зачем: первый ответ почти всегда поверхностный. «Ну, было грустно». Самое ценное&nbsp;— во&nbsp;втором, третьем ответе, после «а&nbsp;что было дальше?». Именно там звучат конкретные случаи, настоящие слова и&nbsp;настоящие действия.<\/p>\n<p>Отличие от&nbsp;открытого вопроса простое: открытый вы&nbsp;готовите заранее, распаковывающий задаёте по&nbsp;ходу, в&nbsp;ответ на&nbsp;то, что услышали.<\/p>\n<p><b>4. Наводящие вопросы&nbsp;— нельзя.<\/b><\/p>\n<p>Наводящий вопрос&nbsp;— тот, в&nbsp;котором уже спрятан ожидаемый ответ. «Вам ведь, наверное, одиноко по&nbsp;вечерам?», «Согласитесь, что сейчас самое время подумать о&nbsp;себе?»<\/p>\n<p>Почему нельзя: вы&nbsp;подсказываете ответ, и&nbsp;человек из&nbsp;вежливости соглашается. Вы&nbsp;услышите своё же&nbsp;предположение, только произнесённое чужим голосом. Проверки не&nbsp;будет.<\/p>\n<p>Как заменить: убрать подсказку. «Как проходят ваши вечера сейчас?» Если одиноко&nbsp;— она скажет сама.<\/p>\n<p><b>5. Гипотетические вопросы&nbsp;— нельзя.<\/b><\/p>\n<p>Гипотетический вопрос&nbsp;— о&nbsp;том, что было бы. «Купили бы&nbsp;вы&nbsp;такую программу?», «Пошли бы&nbsp;вы&nbsp;в&nbsp;группу?», «Сколько бы&nbsp;вы&nbsp;заплатили?»<\/p>\n<p>Почему нельзя: ответ&nbsp;— фантазия. Сказать «да» ничего не&nbsp;стоит, а&nbsp;сказать «нет» в&nbsp;лицо неловко. Поэтому почти все отвечают «да». Это самый популярный вопрос у&nbsp;начинающих&nbsp;— и&nbsp;самый бесполезный.<\/p>\n<p>Как заменить: спросить о&nbsp;прошлом. «За&nbsp;что подобное вы&nbsp;уже платили? Сколько это стоило?»<\/p>\n<p><b>6. Оценочные вопросы&nbsp;— нельзя.<\/b><\/p>\n<p>Оценочный вопрос&nbsp;— просьба оценить вашу идею. «Как вам идея?», «Что думаете о&nbsp;такой программе?», «Вам нравится название?»<\/p>\n<p>Почему нельзя: вы&nbsp;просите человека стать экспертом по&nbsp;вашему продукту&nbsp;— а&nbsp;он&nbsp;в&nbsp;нём не&nbsp;эксперт, он&nbsp;эксперт по&nbsp;своей жизни. И&nbsp;к&nbsp;тому же&nbsp;он&nbsp;не&nbsp;захочет вас обидеть. В&nbsp;ответ&nbsp;— комплименты.<\/p>\n<p>Как заменить: не&nbsp;оценивать идею, а&nbsp;изучать жизнь. «Что вы&nbsp;уже пробовали, чтобы стало легче? Что помогло, а&nbsp;что нет?»<\/p>\n<h3 class=\"pp-h3\">Сравнение в&nbsp;одной таблице<\/h3>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Тип вопроса<\/th><th>Пример из&nbsp;разговора Марины<\/th><th>Задавать?<\/th><th>Почему<\/th><\/tr><\/thead><tbody><tr><td>Открытый<\/td><td>«Расскажите, что изменилось, когда дочь переехала?»<\/td><td>Да, это основа<\/td><td>Человек говорит своими словами, первым всплывает главное<\/td><\/tr><tr><td>Закрытый<\/td><td>«Вы&nbsp;обращались к&nbsp;психологу?»<\/td><td>Да, но&nbsp;только для фактов и&nbsp;сразу следом открытый<\/td><td>Быстро проверяет факт; без открытого&nbsp;— допрос<\/td><\/tr><tr><td>Распаковывающий<\/td><td>«А&nbsp;что было дальше?»<\/td><td>Да, постоянно<\/td><td>Самое ценное&nbsp;— во&nbsp;втором и&nbsp;третьем ответе<\/td><\/tr><tr><td>Наводящий<\/td><td>«Вам ведь одиноко по&nbsp;вечерам?»<\/td><td>Нет<\/td><td>Подсказывает ответ, человек соглашается из&nbsp;вежливости<\/td><\/tr><tr><td>Гипотетический<\/td><td>«Пошли бы&nbsp;вы&nbsp;в&nbsp;такую группу?»<\/td><td>Нет<\/td><td>Ответ&nbsp;— фантазия, «да» ничего не&nbsp;стоит<\/td><\/tr><tr><td>Оценочный<\/td><td>«Как вам идея?»<\/td><td>Нет<\/td><td>Получите комплименты вместо фактов<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"pp-h3\">Вопросы, которые задавать не&nbsp;стоит&nbsp;— и&nbsp;чем их&nbsp;заменить<\/h3>\n<p>Вот частые вопросы экспертов, которые кажутся нормальными, но&nbsp;приводят к&nbsp;пустым ответам. У&nbsp;каждого&nbsp;— замена.<\/p>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Плохой вопрос<\/th><th>Почему плохо<\/th><th>Чем заменить<\/th><\/tr><\/thead><tbody><tr><td>«Как вам идея группы для женщин, у&nbsp;которых выросли дети?»<\/td><td>Оценочный&nbsp;— получите комплимент<\/td><td>«Расскажите, как изменилась ваша жизнь, когда дети уехали?»<\/td><\/tr><tr><td>«Вы&nbsp;бы&nbsp;пошли в&nbsp;такую группу?»<\/td><td>Гипотетический&nbsp;— «да» ничего не&nbsp;стоит<\/td><td>«Вы&nbsp;когда-нибудь занимались в&nbsp;группе? Как это было?»<\/td><\/tr><tr><td>«Сколько вы&nbsp;готовы заплатить за&nbsp;курс?»<\/td><td>Цена из&nbsp;фантазии, обычно заниженная или вежливо завышенная<\/td><td>«За&nbsp;что подобное вы&nbsp;уже платили? Сколько это стоило?»<\/td><\/tr><tr><td>«Вам ведь одиноко, когда дома пусто?»<\/td><td>Наводящий&nbsp;— подсказывает ответ<\/td><td>«Расскажите про вчерашний вечер&nbsp;— как он&nbsp;прошёл?»<\/td><\/tr><tr><td>«Вы&nbsp;чувствуете, что сепарация с&nbsp;детьми ещё не&nbsp;завершена?»<\/td><td>Профессиональное слово&nbsp;— человек либо не&nbsp;поймёт, либо начнёт отвечать «по&nbsp;учебнику»<\/td><td>«Когда вы&nbsp;последний раз разговаривали с&nbsp;сыном? О&nbsp;чём был разговор?»<\/td><\/tr><tr><td>«Какие энергетические блоки мешают вам двигаться?» (энергопрактик)<\/td><td>Жаргон и&nbsp;готовый вывод внутри вопроса<\/td><td>«Что у&nbsp;вас сейчас не&nbsp;получается, хотя вы&nbsp;стараетесь? Расскажите про последний раз»<\/td><\/tr><tr><td>«Хотели бы&nbsp;вы&nbsp;научиться делать расклады сами?» (таролог)<\/td><td>Гипотетический<\/td><td>«Когда вы&nbsp;последний раз обращались к&nbsp;тарологу? С&nbsp;каким вопросом? Что было после?»<\/td><\/tr><tr><td>«Вам было бы&nbsp;полезно знать благоприятные даты?» (астролог)<\/td><td>Наводящий и&nbsp;гипотетический сразу<\/td><td>«Как вы&nbsp;принимали последнее важное решение в&nbsp;делах? На&nbsp;что опирались?»<\/td><\/tr><tr><td>«Хотели бы&nbsp;вы&nbsp;косы к&nbsp;отпуску?» (мастер по&nbsp;косам)<\/td><td>Гипотетический&nbsp;— «хочу» не&nbsp;значит «запишусь»<\/td><td>«Когда вы&nbsp;последний раз собирались в&nbsp;отпуск&nbsp;— что делали с&nbsp;волосами?»<\/td><\/tr><tr><td>«11&nbsp;тысяч&nbsp;— это для вас дорого?» (мастер по&nbsp;косам)<\/td><td>Оценочный&nbsp;— человек смутится и&nbsp;ответит вежливо<\/td><td>«Сколько раз за&nbsp;последний год вы&nbsp;делали косы или другие причёски у&nbsp;мастера? Сколько это стоило?»<\/td><\/tr><tr><td>«Вы&nbsp;бы&nbsp;заплатили 600 тысяч за&nbsp;сопровождение?» (консультант)<\/td><td>Гипотетический, да&nbsp;ещё с&nbsp;цифрой-подсказкой<\/td><td>«Кто платил за&nbsp;ваше последнее обучение или коуча&nbsp;— вы&nbsp;или компания? Сколько это стоило?»<\/td><\/tr><tr><td>«Вам ведь непросто защищать стратегию перед акционером?» (консультант)<\/td><td>Наводящий. Руководитель такого уровня вряд ли&nbsp;признает трудность в&nbsp;ответ на&nbsp;подсказку<\/td><td>«Расскажите, как проходила ваша последняя защита плана перед советом директоров или акционером»<\/td><\/tr><tr><td>«Вы&nbsp;обычно справляетесь сами?»<\/td><td>Приглашает к&nbsp;общим словам<\/td><td>«Когда вам последний раз было по-настоящему тяжело&nbsp;— что вы&nbsp;сделали?»<\/td><\/tr><tr><td>«Что должно быть в&nbsp;идеальном продукте для вас?»<\/td><td>Просит спроектировать продукт&nbsp;— получите список хотелок<\/td><td>«Что вы&nbsp;уже пробовали? Что из&nbsp;этого помогло, а&nbsp;что нет&nbsp;— и&nbsp;почему?»<\/td><\/tr><tr><td>«Почему вы&nbsp;до&nbsp;сих пор не&nbsp;обратились за&nbsp;помощью?»<\/td><td>Звучит как упрёк&nbsp;— человек начнёт оправдываться<\/td><td>«Приходила ли&nbsp;мысль к&nbsp;кому-то обратиться? Что было дальше?»<\/td><\/tr><tr><td>«Вам тяжело с&nbsp;мужем и&nbsp;с&nbsp;детьми?»<\/td><td>Два вопроса в&nbsp;одном&nbsp;— ответят на&nbsp;один, и&nbsp;то&nbsp;общими словами<\/td><td>Спросить по&nbsp;одному, каждый&nbsp;— через конкретный случай<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"pp-note pp-note-tip\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Проверка любого вопроса<\/span><p>Прежде чем оставить вопрос в&nbsp;списке, спросите себя: «Может ли&nbsp;ответ на&nbsp;него показать, что я&nbsp;ошибаюсь?» Если на&nbsp;вопрос все ответят одинаково приятно&nbsp;— он&nbsp;ничего не&nbsp;проверяет. Вычёркивайте.<\/p><\/div><\/div>\n<p>С&nbsp;вопросами разобрались. Дальше&nbsp;— собираем из&nbsp;них сценарий и&nbsp;готовимся к&nbsp;первому разговору.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 6. Подготовьтесь к разговору\" data-pp-short=\"Шаг 6\"><section class=\"pp-stepsec\" id=\"step-6\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">06<\/span><div><span class=\"pp-part-label\">Шаг 6 из 9<\/span><h2 class=\"pp-section-title\"><span>Подготовьтесь к&nbsp;разговору<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>около часа, один раз перед первым разговором<\/span><\/div><\/div><div class=\"prose\"><p>Подготовка делается один раз&nbsp;— дальше вы&nbsp;используете её&nbsp;во&nbsp;всех разговорах и&nbsp;слегка докручиваете после первых двух-трёх.<\/p>\n<h3 class=\"pp-h3\">1. Гайд вопросов<\/h3>\n<p><b>Гайд<\/b>&nbsp;— список вопросов, по&nbsp;которому вы&nbsp;идёте в&nbsp;разговоре. Он&nbsp;собирается из&nbsp;таблицы предположений из&nbsp;шага 2: у&nbsp;каждого предположения должен быть хотя бы&nbsp;один вопрос. Готовый гайд Марины с&nbsp;таймингом&nbsp;— в&nbsp;шаге 7, там же&nbsp;— как он&nbsp;звучит у&nbsp;мастера и&nbsp;консультанта. Возьмите за&nbsp;основу тот, что ближе к&nbsp;вашему продукту.<\/p>\n<p>Гайд&nbsp;— опора, а&nbsp;не&nbsp;анкета. Не&nbsp;нужно зачитывать вопросы подряд. Если собеседник сам ответил на&nbsp;три вопроса вперёд&nbsp;— не&nbsp;задавайте их&nbsp;повторно. Если ушёл в&nbsp;важную тему, которой нет в&nbsp;гайде,&nbsp;— идите за&nbsp;ним.<\/p>\n<p>Распечатайте гайд или откройте на&nbsp;втором экране. Крупным шрифтом&nbsp;— чтобы не&nbsp;искать глазами во&nbsp;время разговора.<\/p>\n<h3 class=\"pp-h3\">2. Заранее решите, о&nbsp;чём попросите в&nbsp;конце<\/h3>\n<p>Слова «интересно, пишите» ничего не&nbsp;стоят. Настоящий интерес виден по&nbsp;действию&nbsp;— по&nbsp;проверке делом, о&nbsp;которой мы&nbsp;говорили перед шагами.<\/p>\n<p>Решите это до&nbsp;первого разговора&nbsp;— в&nbsp;моменте легко растеряться и&nbsp;закончить на&nbsp;«спасибо, до&nbsp;свидания». Удобно подготовить три уровня:<\/p>\n<ul class=\"pp-list\"><li><b>Минимум:<\/b> «Знаете ли&nbsp;вы&nbsp;человека в&nbsp;похожей ситуации, с&nbsp;которым мне было бы&nbsp;полезно поговорить?» Дать контакт&nbsp;— значит немного поручиться своим именем.<\/li><li><b>Средний:<\/b> «Можно я&nbsp;напишу вам лично, когда буду набирать первую группу?», запись в&nbsp;лист ожидания, запись на&nbsp;следующий визит.<\/li><li><b>Сильный:<\/b> деньги. Бронь места с&nbsp;небольшой предоплатой, которую вы&nbsp;вернёте, если группа не&nbsp;соберётся. Запись на&nbsp;дату с&nbsp;предоплатой. Платная первая встреча. Уместно, только если собеседник сам проявил интерес к&nbsp;продукту.<\/li><\/ul>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><p>Минимум&nbsp;— «Приведёте подругу, которая тоже давно хочет косы?» Сильный уровень&nbsp;— запись на&nbsp;конкретную дату, например перед отпуском, с&nbsp;предоплатой.<\/p><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p>Минимум&nbsp;— знакомство с&nbsp;коллегой в&nbsp;похожей ситуации. Сильный уровень&nbsp;— платная диагностическая встреча: собеседник платит, чтобы разобрать свою ситуацию с&nbsp;консультантом.<\/p><\/div>\n<h3 class=\"pp-h3\">3. Таблица для записи<\/h3>\n<p>Заведите одну таблицу на&nbsp;все разговоры&nbsp;— в&nbsp;тетради, в&nbsp;Excel, в&nbsp;Google Таблицах, где вам удобнее. Одна строка&nbsp;— один собеседник. Столбцы&nbsp;— ваши предположения и&nbsp;проверка делом.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Собеседница<\/th><th>П1&nbsp;Кто<\/th><th>П2&nbsp;Боль<\/th><th>П3&nbsp;Её&nbsp;слова<\/th><th>П4&nbsp;Пробовала / тратила<\/th><th>П5&nbsp;Результат<\/th><th>П6&nbsp;Формат<\/th><th>П7&nbsp;Цена<\/th><th>П8&nbsp;Модули<\/th><th>Проверка делом<\/th><\/tr><\/thead><tbody><tr><td>Ольга, 52<\/td><td>+<\/td><td>+<\/td><td>«дома как в&nbsp;музее»<\/td><td>психолог 3&nbsp;мес., 4&nbsp;000 ₽ за&nbsp;встречу<\/td><td>«найти своё дело»<\/td><td>+<\/td><td>+<\/td><td>1, 2, 4<\/td><td>дала контакт подруги<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Плюс&nbsp;— подтвердила, минус&nbsp;— опровергла, вопрос&nbsp;— непонятно. Строка условная, для образца.<\/p><\/div>\n<p>Заполнять таблицу вы&nbsp;будете после каждого разговора. А&nbsp;в&nbsp;шаге 9&nbsp;она превратится в&nbsp;сводку, по&nbsp;которой видно всё сразу.<\/p>\n<h3 class=\"pp-h3\">4. Запись разговора<\/h3>\n<p>Разговор лучше записывать&nbsp;— <b>только с&nbsp;разрешения собеседника<\/b>. Спросите в&nbsp;самом начале: «Можно я&nbsp;включу запись? Она нужна только мне, чтобы ничего не&nbsp;упустить. Никому её&nbsp;не&nbsp;покажу». Если человек против&nbsp;— ничего страшного, записывайте от&nbsp;руки ключевые слова и&nbsp;дословные фразы.<\/p>\n<p>Подойдёт встроенная запись в&nbsp;программе видеосвязи или диктофон на&nbsp;телефоне. Запись ловит дословные фразы, которые вы&nbsp;не&nbsp;успели записать,&nbsp;— а&nbsp;они потом станут текстами.<\/p>\n<h3 class=\"pp-h3\">5. Время<\/h3>\n<p>Закладывайте 30–40 минут на&nbsp;разговор и&nbsp;15–20 минут после&nbsp;— на&nbsp;запись главного. Для очень занятых собеседников, как у&nbsp;консультанта,&nbsp;— 20–30 минут. Не&nbsp;ставьте разговоры встык: следующий вытеснит из&nbsp;памяти детали предыдущего.<\/p>\n<p>Если собеседник сам хочет продолжать&nbsp;— можно дольше. Но&nbsp;о&nbsp;времени вы&nbsp;договорились, и&nbsp;его стоит уважать.<\/p>\n<h3 class=\"pp-h3\">6. Настрой: я&nbsp;исследователь<\/h3>\n<p>На&nbsp;время разговора у&nbsp;вас одна роль&nbsp;— <b>исследователь<\/b>. Не&nbsp;психолог, не&nbsp;мастер, не&nbsp;консультант. И&nbsp;не&nbsp;продавец.<\/p>\n<p>Для помогающего практика это самое трудное. Вы&nbsp;годами учились помогать: слышите боль&nbsp;— и&nbsp;хочется поддержать, дать технику, переформулировать. Консультанту хочется разобрать стратегию собеседника, мастеру&nbsp;— посоветовать уход. Но&nbsp;задача разговора&nbsp;— узнать, а&nbsp;не&nbsp;помочь. Помощь в&nbsp;этот момент меняет разговор: человек начинает отвечать уже на&nbsp;ваши советы, а&nbsp;не&nbsp;рассказывать о&nbsp;своей жизни.<\/p>\n<p>Продавать тоже нельзя. Как только вы&nbsp;начинаете рассказывать про свой продукт, собеседник переходит в&nbsp;режим вежливости&nbsp;— и&nbsp;честные ответы заканчиваются.<\/p>\n<div class=\"pp-note pp-note-tip\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Фраза-напоминание<\/span><p>Напишите сверху гайда крупно: «Я&nbsp;здесь, чтобы узнать. Не&nbsp;помочь и&nbsp;не&nbsp;продать». И&nbsp;поглядывайте на&nbsp;неё во&nbsp;время разговора.<\/p><\/div><\/div>\n<p>Подготовка закончена. Дальше&nbsp;— сам разговор, блок за&nbsp;блоком.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 7. Проведите разговор\" data-pp-short=\"Шаг 7\"><section class=\"pp-stepsec\" id=\"step-7\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">07<\/span><div><span class=\"pp-part-label\">Шаг 7 из 9<\/span><h2 class=\"pp-section-title\"><span>Проведите разговор<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>20–40 минут на&nbsp;каждый<\/span><\/div><\/div><div class=\"prose\"><p>Разговор состоит из&nbsp;шести блоков. У&nbsp;каждого&nbsp;— своя задача и&nbsp;примерное время. Сначала&nbsp;— полный гайд Марины: под каждым вопросом&nbsp;— зачем он&nbsp;нужен, то&nbsp;есть какое предположение он&nbsp;проверяет. Потом&nbsp;— как тот же&nbsp;сценарий звучит у&nbsp;мастера и&nbsp;консультанта.<\/p>\n<h3 class=\"pp-h3\">Блок 1. Начало&nbsp;— 3&nbsp;минуты<\/h3>\n<p>Задача&nbsp;— снять напряжение и&nbsp;объяснить, как пройдёт разговор.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Спасибо, что нашли время. У&nbsp;нас минут 30–40. Я&nbsp;буду расспрашивать о&nbsp;вашем опыте&nbsp;— здесь нет правильных и&nbsp;неправильных ответов, мне важно, как это было именно у&nbsp;вас».<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>человек расслабляется и&nbsp;перестаёт подбирать «правильные» ответы.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Я&nbsp;сейчас ничего не&nbsp;продаю&nbsp;— я&nbsp;разговариваю с&nbsp;несколькими женщинами, чтобы понять, как этот период проходит на&nbsp;самом деле».<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>снимает ожидание «сейчас мне будут что-то продавать». Без этого человек будет настороже весь разговор.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Можно я&nbsp;включу запись? Она нужна только мне, чтобы ничего не&nbsp;упустить».<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>честность и&nbsp;спокойствие для вас&nbsp;— не&nbsp;нужно лихорадочно записывать каждое слово.<\/div><\/div>\n<h3 class=\"pp-h3\">Блок 2. Жизнь и&nbsp;контекст&nbsp;— 5–7 минут<\/h3>\n<p>Задача&nbsp;— понять, кто перед вами и&nbsp;как устроена её&nbsp;жизнь сейчас. Пока без трудностей.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Расскажите немного о&nbsp;себе: чем вы&nbsp;сейчас занимаетесь, с&nbsp;кем живёте?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П1&nbsp;— подходит ли&nbsp;человек под аудиторию. И&nbsp;даёт контекст: работает ли, замужем ли. Это пригодится при анализе, когда будете смотреть, у&nbsp;кого боль острее.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Когда дети стали жить отдельно? Как это получилось?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>закрытая часть («когда») даёт факт&nbsp;— давность. Открытая («как это получилось») даёт историю. Если прошло 10&nbsp;лет&nbsp;— учитывайте, что воспоминания уже сглажены.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Расскажите, как прошёл ваш вчерашний день&nbsp;— с&nbsp;утра до&nbsp;вечера».<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>вопрос про конкретный день вместо «как проходит ваш обычный день». «Обычный день» вызовет общие слова. Вчерашний&nbsp;— факты: во&nbsp;сколько встала, чем занималась, с&nbsp;кем говорила. Здесь же&nbsp;может сама всплыть тема мужа, усталости, пустоты&nbsp;— сигналы для модулей 2&nbsp;и&nbsp;5.<\/div><\/div>\n<h3 class=\"pp-h3\">Блок 3. Последний конкретный случай&nbsp;— 10&nbsp;минут<\/h3>\n<p>Задача&nbsp;— найти и&nbsp;подробно разобрать один недавний случай, когда было трудно. Это главный блок разговора.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что изменилось в&nbsp;вашей жизни, когда дети стали жить отдельно?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>открытый вопрос без подсказки. Марина не&nbsp;говорит «стало тяжело»&nbsp;— собеседница сама решает, хорошие это перемены или трудные. Проверяет П1&nbsp;и&nbsp;П2. Первое, что она назовёт,&nbsp;— скорее всего, самое важное.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что из&nbsp;этого далось труднее всего?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>сужает от&nbsp;общего к&nbsp;главной трудности. Если ответ «да&nbsp;ничего не&nbsp;далось, мне даже легче»&nbsp;— это честный сигнал против П2, и&nbsp;его нужно записать.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Когда вы&nbsp;последний раз это остро почувствовали? Расскажите, как это было&nbsp;— где вы&nbsp;были, что происходило».<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>переводит разговор из&nbsp;общих слов в&nbsp;конкретный случай. Именно в&nbsp;таких историях звучат настоящие слова (П3) и&nbsp;настоящая сила боли (П2). Если человек не&nbsp;может вспомнить ни&nbsp;одного случая за&nbsp;последние месяцы&nbsp;— боль, скорее всего, не&nbsp;острая.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«А&nbsp;что вы&nbsp;тогда сделали?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>распаковывающий вопрос. Показывает поведение: позвонила подруге, включила сериал, пошла на&nbsp;дачу, записалась к&nbsp;психологу. Поведение важнее переживаний&nbsp;— оно показывает, насколько проблема толкает к&nbsp;действию.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Как часто такое бывает?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>закрытый вопрос для факта. Раз в&nbsp;полгода или каждый вечер&nbsp;— это очень разная сила боли.<\/div><\/div>\n<h3 class=\"pp-h3\">Блок 4. Что уже пробовала и&nbsp;сколько тратила&nbsp;— 8–10 минут<\/h3>\n<p>Задача&nbsp;— узнать, что человек уже делал, чтобы справиться, и&nbsp;сколько на&nbsp;это потратил. Это самый надёжный сигнал из&nbsp;всего разговора.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что вы&nbsp;уже делали, чтобы стало легче?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П4. Если человек что-то делал&nbsp;— проблема для него реальная, он&nbsp;готов тратить на&nbsp;неё силы. Если ничего&nbsp;— возможно, она не&nbsp;такая острая, как кажется.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что из&nbsp;этого помогло, а&nbsp;что нет? Почему?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>показывает, чем недовольны в&nbsp;существующих решениях. Это готовое место для вашего продукта: если книги не&nbsp;помогли, «потому что одной сложно»,&nbsp;— это аргумент за&nbsp;группу.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Обращались ли&nbsp;вы&nbsp;к&nbsp;кому-то за&nbsp;помощью&nbsp;— к&nbsp;психологу, на&nbsp;курсы, в&nbsp;группы поддержки?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>закрытый вопрос для факта. Если «да»&nbsp;— сразу следующий.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Расскажите, как вы&nbsp;его выбирали. Сколько это стоило? Почему закончили?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П7&nbsp;— сколько человек уже платил за&nbsp;подобное. Это надёжнее любого «я&nbsp;бы&nbsp;заплатила». Причина окончания подскажет, что в&nbsp;вашем продукте должно быть иначе.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Вы&nbsp;когда-нибудь занимались в&nbsp;группе&nbsp;— онлайн или вживую? Как вам было?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П6&nbsp;через прошлый опыт, не&nbsp;через «пошли бы&nbsp;вы&nbsp;в&nbsp;группу». Здесь же&nbsp;слушайте, как человек обращается с&nbsp;видеосвязью,&nbsp;— созвон с&nbsp;вами уже маленькая проверка.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Сколько времени и&nbsp;денег за&nbsp;последний год вы&nbsp;примерно потратили на&nbsp;то, чтобы с&nbsp;этим справиться?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>итоговая цифра по&nbsp;П4&nbsp;и&nbsp;П7. Если за&nbsp;год ноль рублей и&nbsp;ноль часов&nbsp;— это важный сигнал: боль есть, но&nbsp;не&nbsp;толкает к&nbsp;действию.<\/div><\/div>\n<h3 class=\"pp-h3\">Блок 5. Как было бы&nbsp;хорошо&nbsp;— 5&nbsp;минут<\/h3>\n<p>Задача&nbsp;— услышать желаемый результат её&nbsp;словами. Это единственное место, где уместен вопрос о&nbsp;будущем: он&nbsp;не&nbsp;про ваш продукт, а&nbsp;про её&nbsp;жизнь.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Представьте, что прошёл год и&nbsp;эта ситуация вас больше не&nbsp;беспокоит. Что изменилось бы?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П5. Слушайте дословно: «хочу снова радоваться утру», «чтобы с&nbsp;мужем было о&nbsp;чём поговорить», «найти своё дело». Это слова для будущего описания продукта. И&nbsp;проверка&nbsp;— совпадает ли&nbsp;её&nbsp;«хорошо» с&nbsp;результатом, который обещает ваш продукт.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Почему это важно для вас именно сейчас?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>показывает, есть ли&nbsp;у&nbsp;проблемы срочность. «Ну, когда-нибудь»&nbsp;— слабый сигнал. «Мне 53, я&nbsp;не&nbsp;хочу так прожить следующие десять лет»&nbsp;— сильный.<\/div><\/div>\n<h3 class=\"pp-h3\">Блок 6. Завершение&nbsp;— 5&nbsp;минут<\/h3>\n<p>Задача&nbsp;— проверить, что вы&nbsp;всё поняли правильно, и&nbsp;сделать проверку делом.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\"><b>«Давайте я&nbsp;перескажу, как я&nbsp;вас поняла, а&nbsp;вы&nbsp;поправьте, если что не&nbsp;так»<\/b>&nbsp;— и&nbsp;3–4 фразы о&nbsp;главном.<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>собеседница поправит, где вы&nbsp;услышали своё, а&nbsp;не&nbsp;её. И&nbsp;часто добавит самое важное: «Да, и&nbsp;ещё…».<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что я&nbsp;не&nbsp;спросила, а&nbsp;стоило бы?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>открывает темы, которые вы&nbsp;не&nbsp;предусмотрели. Иногда именно здесь звучит главная боль.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Знаете ли&nbsp;вы&nbsp;женщину в&nbsp;похожей ситуации, с&nbsp;которой мне было бы&nbsp;полезно поговорить?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>минимальная проверка делом. Заодно&nbsp;— следующая собеседница.<\/div><\/div>\n<p>Если в&nbsp;разговоре собеседница проявила интерес к&nbsp;теме&nbsp;— теперь, и&nbsp;только теперь, можно одной-двумя фразами сказать о&nbsp;своей идее:<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Я&nbsp;думаю собрать небольшую онлайн-группу для женщин в&nbsp;такой ситуации. Можно я&nbsp;напишу вам лично, когда буду набирать первый поток?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>средняя проверка делом. Слушайте не&nbsp;слова, а&nbsp;реакцию. «Да, конечно, напишите обязательно, а&nbsp;когда?» и&nbsp;вежливое «ну, можно»&nbsp;— очень разные ответы.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Спасибо вам большое&nbsp;— вы&nbsp;мне очень помогли».<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>человек уходит с&nbsp;ощущением, что его опыт ценен. Это основа для следующих контактов.<\/div><\/div>\n<div class=\"pp-note pp-note-warn\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Про свою идею&nbsp;— только в&nbsp;последние 5&nbsp;минут<\/span><p>Если рассказать про продукт в&nbsp;начале или в&nbsp;середине, всё, что человек скажет после, окрашено вежливостью. Если собеседник сам раньше спросит «а&nbsp;что вы&nbsp;делаете?»&nbsp;— используйте фразу из&nbsp;раздела «Трудные моменты» ниже и&nbsp;вернитесь к&nbsp;его истории.<\/p><\/div><\/div>\n<h3 class=\"pp-h3\">Как этот сценарий звучит у&nbsp;других героев<\/h3>\n<p>Блоки те&nbsp;же: начало, контекст, последний конкретный случай, что уже пробовал и&nbsp;сколько тратил, как было бы&nbsp;хорошо, завершение. Меняются вопросы&nbsp;— под гипотезу и&nbsp;под продукт.<\/p>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><div class=\"pp-q\"><div class=\"pp-q-text\">«Как вы&nbsp;впервые узнали про меня? Сколько прошло времени до&nbsp;записи?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>показывает, сколько на&nbsp;самом деле созревает решение (П1) и&nbsp;откуда человек пришёл (П4).<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что было в&nbsp;этот промежуток&nbsp;— что останавливало?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>главный вопрос для П1. Тормоза её&nbsp;словами: «боялась, что не&nbsp;пойдёт», «жалко было денег», «не&nbsp;знала, как потом мыть голову».<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что стало поводом записаться именно тогда?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П2&nbsp;— был ли&nbsp;это отпуск, праздник, смена образа.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Когда вы&nbsp;делали косы в&nbsp;последний раз до&nbsp;меня? У&nbsp;кого, сколько это стоило?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>прошлый опыт и&nbsp;привычные суммы (П3).<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Сколько раз за&nbsp;последний год вы&nbsp;переплетались? Что решало, когда идти снова?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>реальная регулярность, а&nbsp;не&nbsp;«я&nbsp;бы&nbsp;ходила каждый месяц».<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Как вы&nbsp;выбирали мастера? Что смотрели, у&nbsp;кого спрашивали?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П4&nbsp;— где такие люди ищут мастера.<\/div><\/div>\n<p>Подписчице, которая так и&nbsp;не&nbsp;записалась: <b>«Когда вы&nbsp;последний раз всерьёз думали записаться? Что произошло потом?»<\/b> Зачем: самый ценный вопрос из&nbsp;всех. Показывает настоящий тормоз&nbsp;— на&nbsp;конкретном случае, а&nbsp;не&nbsp;в&nbsp;общих словах.<\/p><\/div>\n<div class=\"pp-note pp-note-tip\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Как вести разговор, когда вы&nbsp;работаете руками<\/span><p>Мастеру не&nbsp;нужно назначать отдельный созвон: разговор идёт прямо в&nbsp;кресле, а&nbsp;плетение&nbsp;— это несколько часов.<\/p>\n<ul class=\"pp-list\"><li><b>Не&nbsp;задавайте все вопросы подряд.<\/b> Растяните их&nbsp;на&nbsp;всю работу: пара вопросов, потом пауза, потом ещё. Так это остаётся беседой, а&nbsp;не&nbsp;опросом.<\/li><li><b>Сначала&nbsp;— о&nbsp;том, что было до&nbsp;записи.<\/b> Клиентка уже у&nbsp;вас в&nbsp;кресле, она к&nbsp;вам расположена и&nbsp;будет хвалить. Поэтому спрашивайте не&nbsp;«как вам», а&nbsp;«как вы&nbsp;решались».<\/li><li><b>Про деньги&nbsp;— ближе к&nbsp;середине<\/b>, когда разговорились. Не&nbsp;в&nbsp;первые минуты.<\/li><li><b>Не&nbsp;продавайте дополнительные услуги в&nbsp;этом же&nbsp;разговоре.<\/b> Иначе клиентка поймёт, к&nbsp;чему были вопросы, и&nbsp;дальше будет отвечать осторожно.<\/li><li><b>Уважайте тишину.<\/b> Если клиентка хочет помолчать&nbsp;— это её&nbsp;время и&nbsp;её&nbsp;деньги.<\/li><li><b>Записывайте после.<\/b> Руки заняты, поэтому сразу после клиентки надиктуйте себе голосовое: факты, дословные фразы, что удивило. Диктофон во&nbsp;время работы&nbsp;— только с&nbsp;разрешения.<\/li><\/ul><\/div><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p>Разговор короче&nbsp;— 20–30 минут. Вступление сжимается до&nbsp;минуты, без долгих любезностей: время собеседника здесь самая большая ценность.<\/p>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Расскажите, как вы&nbsp;оказались в&nbsp;нынешней роли&nbsp;— когда это было и&nbsp;как получилось?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>контекст и&nbsp;давность назначения. Проверяет, подходит ли&nbsp;человек под гипотезу.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Когда вы&nbsp;последний раз представляли план или стратегию совету директоров или акционеру? Как готовились?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>главный вопрос для П1. Конкретный случай вместо «ну, бывает непросто».<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что в&nbsp;этой подготовке далось труднее всего? Чем закончилось?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>сила боли и&nbsp;её&nbsp;настоящие слова. Распаковывайте: «а&nbsp;что было дальше?».<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«К&nbsp;кому вы&nbsp;обращались, когда входили в&nbsp;новую роль,&nbsp;— коллеги, консультант, коуч, программы для руководителей?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П3&nbsp;— что уже пробовал.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Кто за&nbsp;это платил&nbsp;— вы&nbsp;или компания? Сколько это стоило?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>самый важный вопрос разговора&nbsp;— проверяет П2. Задавайте спокойно, как обычный вопрос о&nbsp;фактах.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Как вы&nbsp;нашли этого человека или программу? Кто посоветовал?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>проверяет П4&nbsp;— через кого к&nbsp;таким людям приходят специалисты.<\/div><\/div>\n<div class=\"pp-q\"><div class=\"pp-q-text\">«Что должно произойти в&nbsp;ближайшие три месяца, чтобы вы&nbsp;сказали себе: я&nbsp;на&nbsp;своём месте?»<\/div><div class=\"pp-q-why\"><span>Зачем<\/span>желаемый результат его словами. Проверяет, совпадает ли&nbsp;его цель с&nbsp;«защитить стратегию»&nbsp;— или для него важнее что-то другое.<\/div><\/div><\/div>\n<h3 class=\"pp-h3\">Трудные моменты в&nbsp;разговоре&nbsp;— и&nbsp;готовые фразы<\/h3>\n<p>Некоторые ситуации случаются почти в&nbsp;каждом разговоре. Лучше знать заранее, что в&nbsp;них сказать.<\/p>\n<p><b>Человек делится очень глубоко или плачет.<\/b><\/p>\n<p>Для психолога это самый сложный момент: включается профессиональная привычка поддержать и&nbsp;начать работать. Остановитесь. Бережно признайте чувства и&nbsp;дайте человеку выбор:<\/p>\n<div class=\"pp-say\">«Я&nbsp;вижу, что это очень важное и&nbsp;больное. Спасибо, что делитесь. Хотите сделать паузу? Можем остановиться здесь или продолжить&nbsp;— как вам лучше».<\/div>\n<p>Если человек хочет продолжать&nbsp;— продолжайте разговор, не&nbsp;превращая его в&nbsp;сессию. Если хочет остановиться&nbsp;— завершите, поблагодарите. Помощь предложите отдельно, после разговора: «Если захотите поговорить об&nbsp;этом уже как с&nbsp;психологом&nbsp;— напишите мне, договоримся отдельно».<\/p>\n<p><b>Отвечает общими словами.<\/b> «Я&nbsp;обычно справляюсь», «Я&nbsp;всегда держусь».<\/p>\n<div class=\"pp-say\">«А&nbsp;можете вспомнить последний раз, когда было трудно? Что тогда происходило?»<\/div>\n<p><b>Хвалит идею.<\/b> «Ой, как здорово, что вы&nbsp;этим занимаетесь, такое точно нужно!»<\/p>\n<div class=\"pp-say\">«Спасибо! Мне пока важнее понять, как это у&nbsp;вас. Вы&nbsp;говорили про воскресенья&nbsp;— расскажите подробнее?»<\/div>\n<p>Не&nbsp;спорьте с&nbsp;комплиментом и&nbsp;не&nbsp;радуйтесь ему&nbsp;— просто вернитесь к&nbsp;фактам.<\/p>\n<p><b>Даёт идеи для продукта.<\/b> «Вот если бы&nbsp;был чат, где можно поговорить вечером…»<\/p>\n<div class=\"pp-say\">«Интересно. А&nbsp;был ли&nbsp;вечер, когда вам этого не&nbsp;хватало? Расскажите, как это было».<\/div>\n<p>Идея&nbsp;— это чьё-то решение. Вам нужна проблема за&nbsp;ним.<\/p>\n<p><b>Спрашивает «а&nbsp;что вы&nbsp;предлагаете?» в&nbsp;середине разговора.<\/b><\/p>\n<div class=\"pp-say\">«Честно&nbsp;— продукта пока нет, я&nbsp;только собираю, как это бывает у&nbsp;разных людей. Расскажу в&nbsp;конце, если будет интересно. Можно сначала про вас?» Если продукт уже есть: «Расскажу в&nbsp;конце, обещаю. Сейчас мне важнее понять вашу ситуацию».<\/div>\n<p><b>Уходит в&nbsp;сторону.<\/b> Начала про детей, а&nbsp;через пять минут рассказывает про соседку по&nbsp;даче.<\/p>\n<div class=\"pp-say\">«Это интересно, я&nbsp;запишу. А&nbsp;давайте вернёмся&nbsp;— вы&nbsp;говорили про первое лето без сына?»<\/div>\n<p>Не&nbsp;обрывайте сразу: иногда «в&nbsp;сторону» оказывается важным. Но&nbsp;если отступление длится дольше пары минут и&nbsp;не&nbsp;связано с&nbsp;темой&nbsp;— мягко возвращайте.<\/p>\n<p><b>Молчит или отвечает односложно.<\/b><\/p>\n<p>Сначала&nbsp;— выдержите паузу 3–5 секунд. Пауза кажется неловкой вам, а&nbsp;человеку даёт время подумать. Часто самое ценное звучит именно после неё. Если молчание продолжается&nbsp;— переформулируйте через конкретный день: «Может, вспомните какой-то конкретный день на&nbsp;прошлой неделе?» Если и&nbsp;это не&nbsp;помогает&nbsp;— возможно, тема для человека неактуальна. Это тоже ответ. Завершите разговор раньше и&nbsp;поблагодарите.<\/p>\n<p><b>Сам просит ваш продукт.<\/b> «А&nbsp;вы&nbsp;такое ведёте? Я&nbsp;бы&nbsp;к&nbsp;вам пошла».<\/p>\n<p>Это самый сильный сигнал из&nbsp;возможных&nbsp;— запишите его отдельно. Но&nbsp;не&nbsp;переключайтесь на&nbsp;продажу посреди разговора:<\/p>\n<div class=\"pp-say\">«Спасибо, мне очень ценно это слышать. Давайте договорим, а&nbsp;после разговора я&nbsp;напишу вам отдельно&nbsp;— обсудим, чем могу помочь».<\/div>\n<h3 class=\"pp-h3\">Ловушки помогающих практиков<\/h3>\n<p>Эти ошибки делают почти все эксперты на&nbsp;первых разговорах. Не&nbsp;потому, что не&nbsp;умеют,&nbsp;— а&nbsp;потому, что слишком хорошо умеют другое.<\/p>\n<p><b>Разговор превращается в&nbsp;сессию.<\/b> Вы&nbsp;слышите проблему&nbsp;— и&nbsp;начинаете помогать: психолог задаёт терапевтические вопросы, консультант разбирает стратегию, мастер советует уход. Через 20&nbsp;минут это уже консультация. Собеседнику, может, и&nbsp;хорошо, но&nbsp;вы&nbsp;ничего не&nbsp;проверили. Признак: вы&nbsp;говорите больше 20% времени или объясняете, что с&nbsp;человеком происходит.<\/p>\n<p><b>Разговор превращается в&nbsp;продажу.<\/b> Собеседник описывает ровно ту&nbsp;проблему, которую решает ваш продукт. Появляется азарт: «Так вот именно для этого я&nbsp;и&nbsp;делаю…» С&nbsp;этой секунды разговор про вашу идею, а&nbsp;не&nbsp;про его жизнь. Всё, что прозвучит дальше,&nbsp;— вежливость.<\/p>\n<p><b>Профессиональный жаргон вместо слов клиента.<\/b> «Сепарация», «ресурс», «проработка», «энергетические блоки», «проживание». Клиенты так не&nbsp;говорят. Когда вы&nbsp;задаёте вопрос этими словами, человек либо не&nbsp;понимает, либо начинает отвечать «правильно», вашим же&nbsp;языком. И&nbsp;вы&nbsp;теряете главное&nbsp;— его собственные слова. Жаргон есть в&nbsp;каждой профессии&nbsp;— у&nbsp;мастеров и&nbsp;консультантов свой.<\/p>\n<p>Переводите на&nbsp;обычный язык: не&nbsp;«как у&nbsp;вас с&nbsp;ресурсом?», а&nbsp;«как у&nbsp;вас с&nbsp;силами в&nbsp;последние недели?». Не&nbsp;«что вы&nbsp;уже проработали?», а&nbsp;«с&nbsp;чем вы&nbsp;уже пытались разобраться?».<\/p>\n<p>И&nbsp;ещё одно: не&nbsp;переводите слова собеседника на&nbsp;свой язык во&nbsp;время разговора. Не&nbsp;нужно «то&nbsp;есть у&nbsp;вас кризис идентичности?». Она сказала «не&nbsp;понимаю, кто я&nbsp;теперь, если не&nbsp;мама»&nbsp;— так и&nbsp;записывайте. Дословно.<\/p>\n<p><b>Поиск подтверждения своей идеи.<\/b> Вам очень хочется, чтобы гипотеза подтвердилась,&nbsp;— вы&nbsp;уже представляете свой продукт. И&nbsp;незаметно вы&nbsp;начинаете слышать только то, что подходит, и&nbsp;пропускать то, что не&nbsp;подходит. Лечится это двумя вещами: заранее записанными критериями «подтвердит / опровергнет» из&nbsp;шага 2&nbsp;и&nbsp;привычкой отдельно записывать всё, что вас удивило или противоречит гипотезе.<\/p>\n<p>Разговор закончен. Дальше&nbsp;— 15&nbsp;минут, которые сохраняют его ценность.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 8. Запишите главное сразу после разговора\" data-pp-short=\"Шаг 8\"><section class=\"pp-stepsec\" id=\"step-8\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">08<\/span><div><span class=\"pp-part-label\">Шаг 8 из 9<\/span><h2 class=\"pp-section-title\"><span>Запишите главное сразу после разговора<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>15–20 минут после каждого разговора<\/span><\/div><\/div><div class=\"prose\"><p>Сразу после&nbsp;— значит сразу. Через день вы&nbsp;забудете половину деталей. Через неделю будете помнить только то, что подтверждает вашу идею. Память работает так у&nbsp;всех, это не&nbsp;про вас лично.<\/p>\n<p><b>Главное правило записи:<\/b> факты и&nbsp;выводы&nbsp;— раздельно. Факт&nbsp;— что человек сказал и&nbsp;сделал. Вывод&nbsp;— что вы&nbsp;об&nbsp;этом думаете. «Три месяца ходила к&nbsp;психологу за&nbsp;4&nbsp;000 ₽»&nbsp;— факт. «Готова платить за&nbsp;помощь»&nbsp;— ваш вывод. Если их&nbsp;смешать, через десять разговоров вы&nbsp;не&nbsp;сможете отличить, что человек говорил, а&nbsp;что вы&nbsp;додумали.<\/p>\n<h3 class=\"pp-h3\">Шаблон карточки собеседника<\/h3>\n<p>Скопируйте и&nbsp;заполняйте после каждого разговора. Одна карточка&nbsp;— один человек.<\/p>\n<div class=\"pp-template\"><div class=\"pp-template-lbl\">Шаблон для копирования<\/div><pre><span class=\"tpl-h\">КАРТОЧКА СОБЕСЕДНИКА № ___<\/span>\n\nИмя (или инициалы), возраст, город:\nДата разговора, длительность:\nКто это (контекст: работа, семья, ситуация из гипотезы):\n\n<span class=\"tpl-h\">ФАКТЫ — что было и что человек делал<\/span>\n—\n—\n—\n\n<span class=\"tpl-h\">ДОСЛОВНЫЕ ФРАЗЫ — в кавычках, его словами<\/span>\n— «»\n— «»\n— «»\n\n<span class=\"tpl-h\">ЧТО УЖЕ ПРОБОВАЛ И СКОЛЬКО ТРАТИЛ<\/span>\nЧто делал:\nСколько денег (и кто платил):\nСколько времени:\nПочему закончил:\n\n<span class=\"tpl-h\">КАКОЙ РЕЗУЛЬТАТ ХОЧЕТ — его словами:<\/span>\n\n<span class=\"tpl-h\">ОПЫТ ПОХОЖИХ ФОРМАТОВ (группы, онлайн, сопровождение, другие мастера):<\/span>\n\n<span class=\"tpl-h\">ПРОВЕРКА ДЕЛОМ<\/span>\nО чём попросила / попросил:\nЧто человек ответил / сделал:\n\n<span class=\"tpl-h\">ЧТО МЕНЯ УДИВИЛО ИЛИ ПРОТИВОРЕЧИТ ГИПОТЕЗЕ:<\/span>\n\n<span class=\"tpl-h\">МОИ ВЫВОДЫ — отдельно от фактов<\/span>\n—\n\n<span class=\"tpl-h\">ПРЕДПОЛОЖЕНИЯ (+ подтвердил / − опроверг / ? непонятно)<\/span>\nП1 __  П2 __  П3 __  П4 __  … (столько, сколько у вас предположений)<\/pre><\/div>\n<p>После карточки перенесите плюсы и&nbsp;минусы в&nbsp;общую таблицу из&nbsp;шага 6. Это займёт пару минут, но&nbsp;в&nbsp;шаге 9&nbsp;сэкономит вам вечер.<\/p>\n<h3 class=\"pp-h3\">Как выглядит заполненная карточка<\/h3>\n<p>Все три карточки условные&nbsp;— это образец заполнения. Посмотрите, как в&nbsp;каждой факты отделены от&nbsp;выводов, а&nbsp;слова собеседника записаны дословно, в&nbsp;кавычках.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Поле<\/th><th>Что записано<\/th><\/tr><\/thead><tbody><tr><td>Кто<\/td><td>Ольга, 52&nbsp;года. Дочь около года назад переехала в&nbsp;Петербург<\/td><\/tr><tr><td>Факты<\/td><td>С&nbsp;марта по&nbsp;май ходила к&nbsp;психологу. Первое воскресенье без дочери не&nbsp;знала, чем себя занять, весь день убиралась. Вечерами с&nbsp;мужем почти не&nbsp;разговаривают<\/td><\/tr><tr><td>Дословные фразы<\/td><td>«Дома как в&nbsp;музее». «Всё чистое, всё на&nbsp;местах&nbsp;— и&nbsp;никому не&nbsp;надо»<\/td><\/tr><tr><td>Что пробовала и&nbsp;сколько тратила<\/td><td>Психолог 3&nbsp;месяца, 4&nbsp;000 ₽ за&nbsp;встречу. Закончила, «когда вроде стало полегче»<\/td><\/tr><tr><td>Какой результат хочет<\/td><td>«Найти своё дело»<\/td><\/tr><tr><td>Опыт похожих форматов<\/td><td>Была в&nbsp;группе поддержки при психологическом центре, понравилось<\/td><\/tr><tr><td>Проверка делом<\/td><td>Попросила контакт знакомой в&nbsp;похожей ситуации&nbsp;— дала контакт подруги<\/td><\/tr><tr><td>Что удивило<\/td><td>Сама, без вопроса, заговорила о&nbsp;муже. Слов «пустое гнездо» не&nbsp;сказала ни&nbsp;разу<\/td><\/tr><tr><td>Мои выводы<\/td><td>Похоже, тема мужа может быть сильнее, чем я&nbsp;думала. Проверить на&nbsp;следующих разговорах<\/td><\/tr><tr><td>Предположения<\/td><td>П1&nbsp;+ · П2&nbsp;+ · П3&nbsp;− (не&nbsp;«пустое гнездо», а&nbsp;«дома как в&nbsp;музее») · П4&nbsp;+ · П5&nbsp;+ · П6&nbsp;+ · П7&nbsp;+ · П8: модули 1, 2, 4<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Поле<\/th><th>Что записано<\/th><\/tr><\/thead><tbody><tr><td>Кто<\/td><td>Катя, 27&nbsp;лет. Подписчица, следит за&nbsp;работами около двух лет, ни&nbsp;разу не&nbsp;записывалась<\/td><\/tr><tr><td>Факты<\/td><td>Впервые захотела косы после того, как увидела их&nbsp;у&nbsp;подруги. Летом собиралась в&nbsp;отпуск, но&nbsp;так и&nbsp;не&nbsp;записалась. Косы никогда не&nbsp;делала<\/td><\/tr><tr><td>Дословные фразы<\/td><td>«А&nbsp;вдруг мне не&nbsp;пойдёт? Я&nbsp;же&nbsp;не&nbsp;модель». «Не&nbsp;понимаю, как с&nbsp;ними мыть голову и&nbsp;спать»<\/td><\/tr><tr><td>Что пробовала и&nbsp;сколько тратила<\/td><td>Косы&nbsp;— ничего. На&nbsp;волосы в&nbsp;целом&nbsp;— окрашивание раз в&nbsp;пару месяцев<\/td><\/tr><tr><td>Какой результат хочет<\/td><td>«Чтобы в&nbsp;отпуске не&nbsp;думать про волосы вообще»<\/td><\/tr><tr><td>Проверка делом<\/td><td>Предложила записаться на&nbsp;дату перед следующим отпуском&nbsp;— «напишу ближе к&nbsp;делу». Дала контакт подруги, которая тоже хочет косы<\/td><\/tr><tr><td>Что удивило<\/td><td>Цену назвала только третьей причиной. Первые две&nbsp;— «вдруг не&nbsp;пойдёт» и&nbsp;бытовые вопросы<\/td><\/tr><tr><td>Мои выводы<\/td><td>Возможно, тормозит не&nbsp;цена, а&nbsp;страх и&nbsp;незнание. Посмотреть, повторится ли<\/td><\/tr><tr><td>Предположения<\/td><td>П1&nbsp;+ · П2&nbsp;+ (отпуск) · П3&nbsp;? (косы не&nbsp;делала, регулярность проверить нельзя) · П4&nbsp;+ (через подругу)<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Поле<\/th><th>Что записано<\/th><\/tr><\/thead><tbody><tr><td>Кто<\/td><td>Руководитель, с&nbsp;которым познакомил Андрей. 44&nbsp;года. Пять месяцев назад возглавил новое направление, до&nbsp;этого работал в&nbsp;другой отрасли<\/td><\/tr><tr><td>Факты<\/td><td>В&nbsp;прошлом квартале представлял план акционеру&nbsp;— план вернули на&nbsp;доработку. Готовил его ночами, почти в&nbsp;одиночку<\/td><\/tr><tr><td>Дословные фразы<\/td><td>«Я&nbsp;в&nbsp;этой отрасли полгода, а&nbsp;спрашивают как с&nbsp;человека, который в&nbsp;ней двадцать лет». «Обучение&nbsp;— это к&nbsp;HR, у&nbsp;нас на&nbsp;это есть бюджет»<\/td><\/tr><tr><td>Что пробовал и&nbsp;сколько тратил<\/td><td>Два года назад&nbsp;— программа для руководителей, около 400 000 ₽. Платила компания. Коуча не&nbsp;было<\/td><\/tr><tr><td>Какой результат хочет<\/td><td>«Чтобы следующий план приняли с&nbsp;первого раза»<\/td><\/tr><tr><td>Проверка делом<\/td><td>Согласился познакомить с&nbsp;коллегой в&nbsp;похожей ситуации. От&nbsp;платной диагностики отказался: «если компания оплатит&nbsp
