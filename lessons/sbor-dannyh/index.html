Откройте его в&nbsp;меню Плана продюсера или по&nbsp;ссылке <a href=\"https://wearefree.club/booking\">wearefree.club/booking<\/a>.<\/div><\/div>\n  <ol class=\"steps\">\n    <li class=\"step\"><span class=\"step-n\">1<\/span><div><p class=\"step-t\">Подключите Zoom<\/p><p class=\"step-d\">Вкладка «Настройки» → «Подключить Zoom» → войдите в&nbsp;свой аккаунт Zoom.<\/p><\/div><\/li>\n    <li class=\"step\"><span class=\"step-n\">2<\/span><div><p class=\"step-t\">Создайте тип встречи<\/p><p class=\"step-d\">Вкладка «Типы встреч» → например «КЭВ / диагностика», 30–60 минут, место&nbsp;— «Zoom (авто)». Для мастер-класса или эфира включите групповую встречу.<\/p><\/div><\/li>\n    <li class=\"step\"><span class=\"step-n\">3<\/span><div><p class=\"step-t\">Настройте расписание<\/p><p class=\"step-d\">Вкладка «Расписание»&nbsp;— дни и&nbsp;часы, когда вы&nbsp;свободны.<\/p><\/div><\/li>\n    <li class=\"step\"><span class=\"step-n\">4<\/span><div><p class=\"step-t\">Отправляйте личную ссылку<\/p><p class=\"step-d\">В&nbsp;каждом приглашении из&nbsp;записной книжки. Клиент сам выбирает время, Zoom-ссылка создаётся автоматически и&nbsp;приходит ему на&nbsp;почту и&nbsp;в&nbsp;календарь.<\/p><\/div><\/li>\n    <li class=\"step key\"><span class=\"step-n\">5<\/span><div><p class=\"step-t\">После встречи<\/p><p class=\"step-d\">Во&nbsp;вкладке «Записи» отметьте «Завершена»&nbsp;— <b>только так встреча засчитывается в&nbsp;задания.<\/b><\/p><\/div><\/li>\n  <\/ol>\n  <a class=\"btn\" href=\"https://wearefree.club/booking\">Открыть «Встречи»<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/><\/svg><\/a>\n\n  <a class=\"nx-lesson\" href=\"?l=2\">\n    <span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/><\/svg><\/span>\n    <span class=\"nx-t\"><small>Как провести разговор&nbsp;— следующий урок<\/small><b>Кастдев: как проверить идею продукта<\/b><span>Как найти собеседников, пригласить их на&nbsp;разговор, какие вопросы задавать. 9&nbsp;шагов, 15&nbsp;страниц.<\/span><\/span>\n    <span class=\"nx-go\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/><\/svg><\/span>\n  <\/a>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"}, {"kind": "html", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Сбор данных · Подкаст «Каша в голове»<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n  font-size: 17px; line-height: 1.55; letter-spacing: -.011em;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n  text-wrap: pretty;\n}\n.page { max-width: 720px; margin: 0 auto; padding: 8px 16px 24px; }\n\nb, strong { color: var(--t1); font-weight: 700; }\n.am { color: var(--amber); font-weight: 700; }\np + p { margin-top: 12px; }\nsvg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ——— заголовки секций ——— */\n.sec { padding-top: 40px; }\n.sec:first-child { padding-top: 8px; }\n.kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }\n.h2 {\n  font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 14px; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.h3 { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); margin: 24px 0 10px; text-wrap: balance; }\n.lead { font-size: 18px; color: var(--t2); }\n\n/* ——— карточки ——— */\n.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; margin-top: 16px; }\n.card-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.card-t svg.i { width: 18px; height: 18px; color: var(--blue); }\n\n/* ——— шпаргалка ——— */\n.cheat { background: linear-gradient(180deg, #172238 0%, var(--card) 100%); border-color: var(--blue-line); padding: 22px 20px 8px; }\n.cheat-h { font-size: 22px; font-weight: 700; color: var(--t1); line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }\n.cheat-sub { font-size: 15px; color: var(--t3); margin-bottom: 14px; }\n.rule { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }\n.rule-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-bg); color: var(--blue); }\n.rule-ic.red { background: var(--red-bg); color: var(--red); }\n.rule-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.3; }\n.rule-txt { font-size: 15px; line-height: 1.45; color: var(--t2); margin-top: 3px; }\n.tag-loss { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px; background: var(--red-bg); border: 1px solid var(--red-line); color: #FF9B9B; font-size: 13px; font-weight: 600; }\n.tag-loss svg.i { width: 14px; height: 14px; fill: currentColor; stroke: none; }\n\n/* ——— сердечки ——— */\n.hearts { display: flex; gap: 8px; color: var(--red); flex: none; }\n.hearts svg { width: 28px; height: 28px; fill: var(--red); }\n.hearts.sm svg { width: 18px; height: 18px; }\n.hearts .off { fill: rgba(255,255,255,.14); }\n\n/* ——— цель 30 дней ——— */\n.goal { text-align: center; padding: 24px 20px; }\n.goal-days { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }\n.goal-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.goal-or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\n.goal-opt { background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.25; }\n.goal-sep { font-size: 13px; color: var(--t3); font-weight: 600; }\n\n/* ——— списки ——— */\n.list { list-style: none; display: grid; gap: 10px; margin-top: 12px; }\n.list li { position: relative; padding-left: 22px; }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; color: var(--t2); margin-top: 4px; }\n.step-d.ok { color: var(--green); font-weight: 600; }\n\n/* ——— неделя: 3 плашки ——— */\n.week { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }\n.week div { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.3; color: var(--t2); }\n.week div b { width: 20px; text-align: center; font-size: 22px; color: var(--t1); flex: none; }\n.week div:first-child { border-color: rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.week div:first-child b { color: var(--amber); }\n\n/* ——— 80/20 ——— */\n.split-bar { display: grid; grid-template-columns: 20fr 80fr; height: 40px; border-radius: 12px; overflow: hidden; margin: 16px 0 14px; font-size: 14px; font-weight: 700; }\n.split-bar span { display: flex; align-items: center; padding: 0 12px; }\n.split-bar span:first-child { background: var(--gold); color: #1A1406; justify-content: center; padding: 0; }\n.split-bar span:last-child { background: rgba(255,255,255,.07); color: var(--t3); }\n.split { display: grid; gap: 12px; }\n.split .card { margin-top: 0; }\n.split .must { border-color: rgba(234,184,32,.4); }\n.split .must .card-t { color: var(--amber); }\n.split .must .card-t svg.i { color: var(--amber); }\n\n/* ——— таймлайн недели задания ——— */\n.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 14px 0 8px; }\n.day { text-align: center; }\n.day-bar { height: 10px; border-radius: 5px; background: rgba(107,159,255,.28); }\n.day.open .day-bar { background: var(--blue); }\n.day.dl .day-bar { background: var(--red); }\n.day-n { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--t2); }\n.day-s { font-size: 11px; line-height: 1.25; color: var(--t3); margin-top: 2px; }\n.day.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Сбор данных»: дополнения к lesson.css урока «Правила курса». */\n.rule-ic.amber { background: rgba(234,184,32,.12); color: var(--amber); }\n\n/* ——— план урока ——— */\n.plan { margin-top: 14px; padding: 16px 18px 6px; border-radius: var(--r); border: 1px solid var(--line); }\n.plan-h { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); margin-bottom: 6px; }\n.plan ol { list-style: none; }\n.plan li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.3; }\n.plan li:first-child { border-top: 0; }\n.plan b { font-weight: 600; color: var(--t1); }\n.plan em { font-style: normal; font-size: 13px; color: var(--t3); white-space: nowrap; }\n.plan-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--t2); }\n.plan-ic svg.i { width: 15px; height: 15px; }\n.plan-ic.gold { background: rgba(234,184,32,.12); color: var(--amber); }\n\n/* ——— глаза в глаза ——— */\n.near-scale { margin: 4px 0 16px; }\n.near-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(107,159,255,.25), var(--blue) 55%, #F0D080); }\n.near-pts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: -8px; }\n.near-pts span { display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.25; font-weight: 600; color: var(--t2); }\n.near-pts span:nth-child(2) { align-items: center; text-align: center; }\n.near-pts span:nth-child(3) { align-items: flex-end; text-align: right; color: var(--t1); }\n.near-pts i { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 3px var(--blue); }\n.near-pts span:nth-child(3) i { box-shadow: 0 0 0 3px #F0D080; }\n.near-cap { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--amber); }\n.recap { margin-top: 16px; font-size: 15px; color: var(--t3); }\n\n/* ——— воронка ——— */\n.fnl { list-style: none; margin-top: 18px; }\n.fnl-lv { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 16px 18px 18px; }\n.fnl-lv p { font-size: 16px; }\n.fnl-lv p + p { margin-top: 8px; }\n.fnl-hd { display: flex; align-items: center; gap: 12px; }\n.fnl-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); }\n.fnl-n svg.i { width: 16px; height: 16px; }\n.fnl-name { flex: 1; font-size: 18px; font-weight: 700; line-height: 1.2; color: var(--t1); }\n.fnl-v { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; }\n.fnl-bar { display: flex; height: 26px; min-width: 40px; margin: 14px 0; border-radius: 8px; overflow: hidden; background: var(--blue); font-size: 12px; font-weight: 700; color: #0D1117; }\n.fnl-bar span { display: flex; align-items: center; padding: 0 10px; white-space: nowrap; }\n.fnl-bar span:first-child { background: var(--blue); }\n.fnl-bar span:last-child:not(:first-child) { flex: 1; background: #A9C6FF; justify-content: center; padding: 0; }\n.fnl-split { display: flex; gap: 8px; margin: -4px 0 14px; }\n.fnl-split span { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--line2); font-size: 14px; color: var(--t2); }\n.fnl-split b { font-size: 16px; }\n.fnl-cv { display: flex; justify-content: center; padding: 8px 0; }\n.fnl-cv span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 100px; background: var(--blue-bg); border: 1px solid var(--blue-line); font-size: 13px; font-weight: 700; color: var(--blue); }\n.fnl-cv svg.i { width: 15px; height: 15px; }\n.fnl-cash { margin-top: 10px; border-color: rgba(234,184,32,.4); background: linear-gradient(180deg, rgba(234,184,32,.10), var(--card)); }\n.fnl-cash .fnl-n { color: var(--amber); background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.35); }\n.fnl-cash .fnl-v { background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }\n.fnl-cash p { margin-top: 12px; }\n\n/* ——— шаблон отчёта ——— */\n.report { margin-top: 16px; border-radius: var(--r); border: 1px dashed rgba(240,208,128,.45); padding: 18px; background: rgba(240,208,128,.04); }\n.report-h { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #F0D080; margin-bottom: 10px; }\n.report dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }\n.report dl > div:first-child { border-top: 0; }\n.report dt { color: var(--t2); }\n.report dd { text-align: right; font-weight: 700; color: var(--t1); font-variant-numeric: tabular-nums; }\n.report dd small { display: block; font-size: 12px; font-weight: 500; color: var(--t3); }\n.report .sum dt, .report .sum dd { color: #F0D080; }\n.report-f { margin-top: 10px; font-size: 14px; color: var(--t3); }\n\n/* ——— встречи ——— */\n.note a { color: #DCE7FF; font-weight: 600; }\n.note > div { flex: 1; }\n.step.key .step-n { color: var(--amber); background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.4); }\n.step.key b { color: #F0D080; }\n.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 20px; padding: 0 20px; border-radius: 14px; background: linear-gradient(180deg, #DFC880, #C9A84C); color: #2A2008; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #A07828; }\n.btn svg.i { width: 18px; height: 18px; }\n\n/* ——— ссылка на урок-инструкцию ——— */\n.nx-lesson { display: flex; align-items: center; gap: 14px; margin-top: 28px; padding: 18px; border-radius: var(--r); border: 1px solid var(--blue-line); background: linear-gradient(135deg, rgba(107,159,255,.12), rgba(107,159,255,.03)); text-decoration: none; color: var(--t2); }\n.nx-t { flex: 1; min-width: 0; }\n.nx-t small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }\n.nx-t b { display: block; margin-top: 4px; font-size: 17px; line-height: 1.3; color: var(--t1); }\n.nx-t > span { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.nx-go { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--blue-bg); border: 1px solid var(--blue-line); color: var(--blue); }\n.nx-go svg.i { width: 18px; height: 18px; }\n\n/* ——— подкаст ——— */\n.pod { background: linear-gradient(180deg, #1B2233 0%, var(--card) 100%); }\n.pod p { font-size: 16px; }\n.pod .cheat-h { margin-bottom: 10px; }\n\n@media (min-width: 640px) {\n  .fnl-lv { padding: 20px 24px 22px; }\n  .fnl-v { font-size: 34px; }\n}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <div class=\"card pod\">\n    <span class=\"kick\">Подкаст · 14 минут<\/span>\n    <p class=\"cheat-h\">Если сейчас «каша» в&nbsp;голове<\/p>\n    <p>Ниже аудио подскаст - для тех, у&nbsp;кого сейчас «каша» в&nbsp;голове.<\/p>\n    <p>Для тех, кто задается вопросом: «Когда уже ребята начнут рассказывать, как делать продукт, как вести соц сети, о&nbsp;чем писать и&nbsp;как продавать?»<\/p>\n    <p>Чтобы у&nbsp;вас сложилось корректное понимание, обязательно послушайте этот подкаст.<\/p>\n    <p>В&nbsp;нем вы&nbsp;найдете все ответы на&nbsp;ваши алгоритмы:<\/p>\n    <ul class=\"list\">\n      <li>Как именно мы&nbsp;действуем<\/li>\n      <li>Зачем мы&nbsp;идем в&nbsp;глубину и&nbsp;почему алгоритм работы именно такой<\/li>\n      <li>Как это помогает вам продавать, вести соц сети, создавать продукт, который покупают, и&nbsp;как по&nbsp;дороге не&nbsp;выгореть.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"}, {"kind": "audio", "title": "Каша в голове", "dur": "14:17"}, {"kind": "task", "html": "<p>Первое — это провести 10 встреч с потенциальными клиентами с целью продажи.&nbsp;<br>Загрузить фото или видео отчет о 10 встречах в свой командный чат, показать своему проводнику.<\/p><p><\/p><p>Вторая задача – это посчитать эффективность этих встреч, то есть посчитать конверсии по воронке.&nbsp;<\/p>"}], "next": "Кастдев: как проверить идею продукта"}, {"crumb": "Неделя 1", "key": false, "title": "Кастдев: как проверить идею продукта", "blocks": [{"kind": "instr", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Кастдев: как проверить идею продукта — План Продюсера<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap\" rel=\"stylesheet\">\n<style>\n:root {\n  --pp-bg: #0D1117; --pp-bg2: #111827; --pp-card: #141E2B; --pp-card2: #1A2535;\n  --pp-border: rgba(255,255,255,.07); --pp-border2: rgba(255,255,255,.12);\n  --pp-text: #E5E7EB; --pp-text-dim: #9AA6B6; --pp-white: #FFFFFF;\n  --pp-blue: #4B7BFF; --pp-blue2: #6B9FFF; --pp-bglow: rgba(75,123,255,.15);\n  --pp-gold-txt: #CCA830; --pp-amber: #EAB820;\n  --pp-grad-gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --pp-cta-gold: linear-gradient(180deg, #DFC880 0%, #C9A84C 100%);\n  --info-bg: rgba(75,123,255,.10); --info-text: #8FB4FF;\n  --warn-bg: rgba(255,107,107,.10); --warn-text: #FF9B9B;\n  --tip-bg: rgba(234,184,32,.10); --tip-text: #F0CE5C;\n  --good-bg: rgba(107,203,119,.10); --good-text: #8FE09B;\n  --card-radius: 20px; --card-shadow: 0 20px 50px rgba(0,0,0,.35);\n}\n*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0 }\nhtml { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }\nbody {\n  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  background: var(--pp-bg); color: var(--pp-text);\n  font-size: 17px; line-height: 1.6; letter-spacing: -.011em;\n  padding: 24px 16px 80px; min-height: 100vh; text-wrap: pretty;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n}\nbody::before {\n  content: \"\"; position: fixed; inset: 0; z-index: -1; pointer-events: none;\n  background:\n    radial-gradient(55% 40% at 85% -5%, rgba(107,76,158,.18) 0%, transparent 60%),\n    radial-gradient(50% 35% at -5% 3%, rgba(42,76,158,.16) 0%, transparent 60%);\n}\n.container { max-width: 900px; margin: 0 auto }\nsection { scroll-margin-top: 24px; }\n\n/* HERO — парадный */\n.pp-hero {\n  position: relative;\n  background: radial-gradient(120% 80% at 50% 25%, #16202E 0%, #0D1117 60%, #0A0E15 100%);\n  border: 1px solid var(--pp-border); border-radius: 28px; padding: 72px 40px 64px;\n  text-align: center; overflow: hidden; margin-bottom: 24px; isolation: isolate;\n}\n.pp-hero-orbs { position: absolute; inset: 0; z-index: 0; pointer-events: none; }\n.pp-hero-orbs .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }\n.orb-tl { top: -80px; left: -60px; width: 300px; height: 300px; background: radial-gradient(circle, #2A4C9E 0%, transparent 70%); }\n.orb-br { bottom: -120px; right: -80px; width: 360px; height: 360px; background: radial-gradient(circle, #6B4C9E 0%, transparent 70%); }\n.orb-c  { top: 28%; left: 42%; width: 220px; height: 220px; background: radial-gradient(circle, #3A6FE0 0%, transparent 70%); }\n.pp-hero > *:not(.pp-hero-orbs) { position: relative; z-index: 1; }\n.pp-hero-kicker { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--pp-blue2); opacity: .85; margin-bottom: 24px; }\n.pp-hero-wordmark {\n  font-weight: 800; font-size: clamp(30px, 4.6vw, 48px); line-height: 1; letter-spacing: -.02em; margin-bottom: 28px;\n  background: var(--pp-grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent;\n  filter: drop-shadow(0 6px 24px rgba(204,168,48,.18));\n}\n.pp-hero-title { font-size: 50px; font-weight: 800; line-height: 1.08; letter-spacing: -.02em; color: var(--pp-white); margin: 0 auto 18px; max-width: 760px; text-wrap: balance; }\n.pp-hero-title em { font-style: italic; font-weight: 700; color: var(--pp-blue2); }\n.pp-hero-sub { font-size: 18px; font-weight: 500; color: var(--pp-text-dim); max-width: 620px; margin: 0 auto; text-wrap: balance; }\n\n.pp-tag-row { margin: 0 0 36px; text-align: center; }\n.pp-tag-badge { display: inline-block; background: var(--pp-bglow); border: 1px solid rgba(75,123,255,.28); color: var(--pp-blue2); font-size: 13px; font-weight: 700; letter-spacing: .04em; padding: 8px 18px; border-radius: 100px; }\n\n/* PROSE */\n.prose p { margin: 0 0 18px; color: var(--pp-text); }\n.prose b, .prose strong { color: var(--pp-amber); font-weight: 700; }\n.prose p.lead { font-size: 20px; line-height: 1.55; color: var(--pp-white); }\n.intro { margin-bottom: 8px; }\n.bridge p { color: var(--pp-text-dim); font-style: italic; margin-top: 8px; }\ncode { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: rgba(255,255,255,.07); padding: 2px 6px; border-radius: 6px; }\n\n.pp-h3 { font-size: 23px; font-weight: 700; color: var(--pp-white); letter-spacing: -.01em; line-height: 1.25; margin: 40px 0 14px; text-wrap: balance; }\n.pp-h2 { font-size: 30px; font-weight: 800; color: var(--pp-white); margin: 40px 0 14px; }\n\n.pp-list { list-style: none; margin: 0 0 20px; padding: 0; }\n.pp-list li { position: relative; padding-left: 24px; margin-bottom: 11px; line-height: 1.55; }\n.pp-list li::before { content: \"\"; position: absolute; left: 5px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--pp-blue2); }\n.pp-olist { list-style: none; counter-reset: ol; margin: 0 0 20px; padding: 0; }\n.pp-olist li { counter-increment: ol; position: relative; padding-left: 38px; margin-bottom: 12px; line-height: 1.55; }\n.pp-olist li::before { content: counter(ol); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 8px; background: var(--pp-bglow); color: var(--pp-blue2); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }\n\n/* SECTION TITLES */\n.pp-part-label { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--pp-blue2); margin: 0 0 10px; }\n.pp-section-title { font-size: 40px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; color: var(--pp-white); margin: 0 0 20px; text-wrap: balance; }\n.pp-section-title span { background: var(--pp-grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }\n#rules, #result, #faq, #task { margin-top: 80px; }\n\n/* MAP */\n.pp-program { background: var(--pp-card); border: 1px solid var(--pp-border2); border-radius: var(--card-radius); padding: 40px 44px 34px; box-shadow: var(--card-shadow); margin: 36px 0 32px; }\n.pp-program-sub { font-size: 20px; font-weight: 700; color: var(--pp-blue2); margin-bottom: 26px; letter-spacing: -.01em; }\n.pp-steps { list-style: none; padding-left: 0; }\n.pp-step { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 18px; padding: 0 0 22px; }\n.pp-step:last-child { padding-bottom: 2px; }\n.pp-step:not(:last-child)::after { content: \"\"; position: absolute; left: 11px; top: 26px; bottom: 4px; width: 1.5px; background: linear-gradient(180deg, rgba(75,123,255,.5) 0%, rgba(75,123,255,.1) 100%); }\n.pp-step-num { font-size: 17px; font-weight: 700; color: var(--pp-blue2); padding-top: 1px; font-variant-numeric: tabular-nums; position: relative; z-index: 1; background: var(--pp-card); }\n.pp-step-body { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; font-size: 17px; line-height: 1.45; }\n.pp-step-body a { color: var(--pp-text); text-decoration: none; font-weight: 600; border-bottom: 1px solid rgba(107,159,255,.3); transition: color .2s, border-color .2s; }\n.pp-step-body a:hover { color: var(--pp-white); border-color: var(--pp-blue2); }\n.pp-step-time { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--pp-text-dim); white-space: nowrap; }\n.pp-step-time svg, .pp-time svg { width: 15px; height: 15px; flex-shrink: 0; }\n\n/* RULES */\n.pp-rules { display: grid; gap: 18px; margin: 28px 0 8px; }\n.pp-rule { background: rgba(255,255,255,.05); border: 1px solid var(--pp-border2); border-radius: var(--card-radius); padding: 30px 34px 14px; transition: border-color .25s; }\n.pp-rule:hover { border-color: rgba(75,123,255,.4); }\n.pp-rule-num { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pp-blue2); background: var(--pp-bglow); padding: 5px 12px; border-radius: 100px; margin-bottom: 14px; }\n.pp-rule-title { font-size: 24px; font-weight: 700; color: var(--pp-white); line-height: 1.2; letter-spacing: -.01em; margin-bottom: 14px; text-wrap: balance; }\n\n/* STEP SECTIONS */\n.pp-stepsec { margin-top: 88px; padding-top: 40px; border-top: 1px solid var(--pp-border); }\n.pp-stephead { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; margin-bottom: 26px; }\n.pp-stephead-num { font-size: 72px; font-weight: 800; line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; background: var(--pp-grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.pp-stephead .pp-section-title { margin-bottom: 14px; }\n.pp-time { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--pp-blue2); background: var(--pp-bglow); border: 1px solid rgba(75,123,255,.22); padding: 6px 14px; border-radius: 100px; }\n\n/* NOTES */\n.pp-note { display: flex; gap: 14px; align-items: flex-start; border-radius: 14px; padding: 20px 24px; margin: 24px 0; border: 1px solid transparent; }\n.pp-note-icon { flex-shrink: 0; width: 22px; height: 22px; margin-top: 2px; }\n.pp-note-icon svg { width: 22px; height: 22px; display: block; }\n.pp-note-text { font-size: 16px; line-height: 1.55; font-weight: 500; flex: 1; min-width: 0; }\n.pp-note-text p { margin: 0 0 10px; color: inherit; }\n.pp-note-text p:last-child { margin-bottom: 0; }\n.pp-note-text b { font-weight: 700; color: inherit; }\n.pp-note-info .pp-note-text b { color: #C9DAFF; }\n.pp-note-text .nt-title { display: block; font-weight: 700; margin-bottom: 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }\n.pp-note-info { background: var(--info-bg); color: var(--info-text); border-color: rgba(75,123,255,.2); }\n.pp-note-tip  { background: var(--tip-bg);  color: var(- dth: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.45; min-width: 560px; }\n.pp-table th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pp-blue2); background: rgba(75,123,255,.08); padding: 12px 14px; vertical-align: bottom; }\n.pp-table td { padding: 12px 14px; border-top: 1px solid var(--pp-border); vertical-align: top; color: var(--pp-text); }\n.pp-table td:first-child { color: var(--pp-white); font-weight: 500; }\n.pp-table b { color: var(--pp-amber); }\n.pp-table tr:hover td { background: rgba(255,255,255,.02); }\n\n/* TEMPLATE card */\n.pp-template { background: #0A0F16; border: 1px dashed rgba(107,159,255,.35); border-radius: 16px; padding: 20px 24px; margin: 22px 0; }\n.pp-template-lbl { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pp-blue2); margin-bottom: 12px; }\n.pp-template pre { font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6; color: var(--pp-text-dim); white-space: pre-wrap; }\n.pp-template .tpl-h { color: var(--pp-white); font-weight: 700; }\n\n/* CHECKLIST inline */\n.pp-check { list-style: none; padding: 0; margin: 0 0 22px; }\n.pp-check li { position: relative; padding-left: 32px; margin-bottom: 12px; line-height: 1.5; }\n.pp-check li::before { content: \"\"; position: absolute; left: 0; top: 2px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(107,159,255,.55); }\n\n/* RESULTS */\n.pp-results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 24px; }\n.pp-result { display: flex; gap: 14px; align-items: flex-start; background: rgba(255,255,255,.05); border: 1px solid var(--pp-border2); border-radius: 16px; padding: 18px 20px; }\n.pp-result-ic { flex-shrink: 0; width: 22px; height: 22px; color: var(--pp-blue2); background: var(--pp-bglow); border-radius: 7px; padding: 3px; }\n.pp-result p { font-size: 15.5px; line-height: 1.5; color: var(--pp-text-dim); }\n.pp-result b { color: var(--pp-white); }\n\n/* FAQ */\n.pp-faq { background: rgba(255,255,255,.04); border: 1px solid var(--pp-border2); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }\n.pp-faq summary { cursor: pointer; list-style: none; padding: 20px 56px 20px 24px; font-size: 18px; font-weight: 600; color: var(--pp-white); position: relative; line-height: 1.4; }\n.pp-faq summary::-webkit-details-marker { display: none; }\n.pp-faq summary::after { content: \"+\"; position: absolute; right: 22px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: var(--pp-bglow); color: var(--pp-blue2); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; transition: transform .2s; }\n.pp-faq[open] summary::after { content: \"−\"; }\n.pp-faq summary:hover { color: var(--pp-blue2); }\n.pp-faq .prose { padding: 0 24px 8px; }\n\n/* TASK */\n.pp-task { background: linear-gradient(135deg, rgba(234,184,32,.08) 0%, rgba(234,184,32,.03) 100%); border: 1px solid rgba(234,184,32,.28); border-radius: var(--card-radius); padding: 36px 40px; }\n.pp-task-lbl { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pp-amber); display: block; margin-bottom: 8px; }\n.pp-task h4 { font-size: 28px; font-weight: 800; color: var(--pp-white); margin-bottom: 14px; letter-spacing: -.01em; }\n.pp-task .task-intro p { color: var(--pp-text-dim); }\n.pp-task ul { list-style: none; padding: 0; margin: 8px 0 24px; }\n.pp-task li { position: relative; padding-left: 32px; margin-bottom: 14px; color: var(--pp-text-dim); line-height: 1.5; font-size: 16.5px; }\n.pp-task li b { color: var(--pp-white); }\n.pp-task li::before { content: \"\"; position: absolute; left: 0; top: 2px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(234,184,32,.55); }\n.pp-task-check { border-top: 1px solid rgba(234,184,32,.2); padding-top: 18px; font-size: 16px; color: var(--pp-text-dim); line-height: 1.55; }\n.pp-task-check b { color: var(--pp-amber); }\n\n/* FINAL */\n.pp-final { position: relative; background: radial-gradient(120% 120% at 50% 0%, #1A2B54 0%, #111C33 55%, #0D1117 100%); border: 1px solid rgba(75,123,255,.25); border-radius: 28px; padding: 64px 44px; margin-top: 56px; text-align: center; overflow: hidden; }\n.pp-cta-orbs { position: absolute; inset: 0; pointer-events: none; }\n.orb-cta { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .4; }\n.orb-cta-tr { top: -80px; right: -60px; width: 280px; height: 280px; background: radial-gradient(circle, #3A6FE0 0%, transparent 70%); }\n.orb-cta-bl { bottom: -100px; left: -50px; width: 240px; height: 240px; background: radial-gradient(circle, #6B4C9E 0%, transparent 70%); }\n.pp-final > *:not(.pp-cta-orbs) { position: relative; z-index: 1; }\n.pp-cta-lbl { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pp-blue2); margin-bottom: 16px; }\n.pp-cta-title { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; margin: 0 auto 16px; max-width: 680px; text-wrap: balance; background: var(--pp-grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.pp-cta-sub { font-size: 17px; color: rgba(255,255,255,.82); max-width: 640px; margin: 0 auto 30px; line-height: 1.6; }\n.pp-cta-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--pp-cta-gold); color: #3A2E18; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 18px 40px; border-radius: 100px; text-decoration: none; box-shadow: 0 6px 0 #A07828, 0 10px 24px rgba(0,0,0,.4); transition: transform .15s, box-shadow .15s; }\n.pp-cta-btn:hover { transform: translateY(3px); box-shadow: 0 3px 0 #A07828, 0 6px 16px rgba(0,0,0,.4); }\n.pp-cta-btn:focus-visible, .pp-step-body a:focus-visible, .pp-faq summary:focus-visible { outline: 2px solid var(--pp-blue2); outline-offset: 3px; }\n\n/* FOOTER */\nfooter { margin-top: 72px; padding-top: 26px; border-top: 1px solid var(--pp-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }\n.footer-brand-block { display: flex; flex-direction: column; gap: 4px; }\n.footer-logo { font-weight: 800; font-size: 18px; letter-spacing: -.02em; line-height: 1; background: var(--pp-grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.footer-article { font-size: 14px; color: var(--pp-text-dim); font-weight: 500; }\n.footer-meta { font-size: 13px; color: var(--pp-text-dim); }\n\n@media (max-width: 640px) {\n  body { font-size: 16.5px; padding: 14px 12px 60px; }\n  .pp-hero { padding: 48px 20px 44px; border-radius: 22px; }\n  .pp-hero-title { font-size: 31px; }\n  .pp-hero-sub { font-size: 16px; }\n  .pp-section-title { font-size: 28px; }\n  .prose p.lead { font-size: 18px; }\n  .pp-program { padding: 28px 20px 24px; }\n  .pp-step-body { flex-direction: column; }\n  .pp-stephead { grid-template-columns: 1fr; gap: 6px; }\n  .pp-stephead-num { font-size: 52px; }\n  .pp-stepsec { margin-top: 64px; }\n  .pp-rule { padding: 24px 20px 10px; }\n  .pp-example { padding: 20px 18px 6px; }\n  .pp-q { padding: 16px 18px; }\n  .pp-q-why { grid-template-columns: 1fr; gap: 6px; }\n  .pp-q-why span { justify-self: start; }\n  .pp-results { grid-template-columns: 1fr; }\n  .pp-task { padding: 26px 20px; }\n  .pp-final { padding: 48px 22px; }\n  .pp-cta-title { font-size: 25px; }\n  footer { flex-direction: column; align-items: flex-start; gap: 14px; }\n}\n@media print {\n  body { background: #0D1117 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 0; }\n  .pp-hero, .pp-q, .pp-note, .pp-example, .pp-rule, .pp-result, .pp-say { break-inside: avoid; }\n  h1, h2, h3 { break-after: avoid; }\n  .pp-faq { break-inside: avoid; }\n  .pp-faq:not([open]) > *:not(summary) { display: block; }\n}\n\n/* Разные герои — разный цвет врезки */\n.pp-example.ex-braid { border-left-color: #EAB820; }\n.pp-example.ex-braid .pp-example-lbl { color: #F0CE5C; }\n.pp-example.ex-top { border-left-color: #6BCB77; }\n.pp-example.ex-top .pp-example-lbl { color: #8FE09B; }\nsection.pp-gen { margin-top: 80px; }\n\n<\/style>\n<\/head>\n<body>\n<div class=\"container\"><div data-pp-page=\"Зачем кастдев и карта шагов\" data-pp-short=\"Старт\"><section class=\"pp-hero\">\n  <div class=\"pp-hero-orbs\" aria-hidden=\"true\"><span class=\"orb orb-tl\"><\/span><span class=\"orb orb-br\"><\/span><span class=\"orb orb-c\"><\/span><\/div>\n  <p class=\"pp-hero-kicker\">Пошаговая инструкция&nbsp;· 9&nbsp;шагов<\/p>\n  <div class=\"pp-hero-wordmark\">План&nbsp;Продюсера<\/div>\n  <h1 class=\"pp-hero-title\">Кастдев: как проверить <em>идею продукта<\/em> до&nbsp;того, как вы её&nbsp;создадите<\/h1>\n  <p class=\"pp-hero-sub\">Для курса, услуги, программы сопровождения или товара. Как найти собеседников, пригласить их на&nbsp;разговор, какие вопросы задавать и&nbsp;какие нет — и&nbsp;что делать с&nbsp;тем, что вы услышите.<\/p>\n<\/section>\n<div class=\"pp-tag-row\"><span class=\"pp-tag-badge\">Три сквозных примера: психолог, мастер по&nbsp;косам, консультант топ-менеджеров<\/span><\/div>\n\n<section class=\"prose intro\"><p class=\"lead\">Новый курс, групповая программа, сопровождение на&nbsp;несколько месяцев, новая услуга&nbsp;— на&nbsp;всё это уходят недели и&nbsp;месяцы. Придумать, из&nbsp;чего продукт состоит, подготовить материалы, упаковать, рассказать о&nbsp;нём, собрать людей. И&nbsp;самый болезненный сценарий&nbsp;— когда всё готово, а&nbsp;покупают двое. Или вообще никто.<\/p>\n<p>Чаще всего так происходит не&nbsp;потому, что продукт плохой. А&nbsp;потому, что его делали по&nbsp;догадке: «мне кажется, им&nbsp;это нужно». Хорошая новость: догадку можно проверить заранее&nbsp;— за&nbsp;3–4 недели и&nbsp;без вложений. Через разговоры с&nbsp;людьми, которым вы&nbsp;собираетесь это продавать.<\/p>\n<p>Разберём по&nbsp;шагам, как такие разговоры готовить, проводить и&nbsp;что делать с&nbsp;тем, что вы&nbsp;в&nbsp;них услышите.<\/p>\n<div class=\"pp-note pp-note-info\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Термин<\/span><p><b>Кастдев<\/b>&nbsp;— от&nbsp;английского customer development. Простыми словами&nbsp;— исследовательские разговоры с&nbsp;будущими клиентами. Вы&nbsp;не&nbsp;продаёте и&nbsp;не&nbsp;консультируете, а&nbsp;расспрашиваете человека о&nbsp;его жизни: что у&nbsp;него происходит, что он&nbsp;уже пробовал, на&nbsp;что тратил деньги и&nbsp;время. По&nbsp;ответам вы&nbsp;понимаете, нужен ли&nbsp;ему ваш продукт и&nbsp;каким он&nbsp;должен быть.<\/p>\n<p><b>Продукт<\/b>&nbsp;— всё, что вы&nbsp;продаёте. Курс, групповая программа, разовая консультация, пакет встреч, программа сопровождения, услуга мастера, товар. Дальше в&nbsp;статье всё это называем одним словом&nbsp;— продукт.<\/p><\/div><\/div>\n<p>Разговор на&nbsp;40&nbsp;минут стоит вам 40&nbsp;минут. Продукт, который никто не&nbsp;купил, стоит месяцы. Поэтому сначала&nbsp;— разговоры, потом&nbsp;— продукт. Не&nbsp;наоборот.<\/p><\/section>\n<section id=\"map\"><div class=\"pp-program\"><h3 class=\"pp-program-sub\">Карта инструкции: 9 шагов<\/h3><ol class=\"pp-steps\"><li class=\"pp-step\"><span class=\"pp-step-num\">01<\/span><div class=\"pp-step-body\"><a href=\"#step-1\">Формулируем гипотезу&nbsp;— что вы&nbsp;хотите проверить<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>20–30 минут<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">02<\/span><div class=\"pp-step-body\"><a href=\"#step-2\">Раскладываем гипотезу на&nbsp;отдельные предположения<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>40–60 минут<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">03<\/span><div class=\"pp-step-body\"><a href=\"#step-3\">Находим 8–12 собеседников<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>1–2 часа<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">04<\/span><div class=\"pp-step-body\"><a href=\"#step-4\">Приглашаем на&nbsp;разговор<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>1&nbsp;час на&nbsp;тексты, 1–2 недели на&nbsp;ответы<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">05<\/span><div class=\"pp-step-body\"><a href=\"#step-5\">Разбираемся, какие вопросы работают, а&nbsp;какие нет<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>30–40 минут на&nbsp;чтение<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">06<\/span><div class=\"pp-step-body\"><a href=\"#step-6\">Готовимся к&nbsp;разговору<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>около часа, один раз<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">07<\/span><div class=\"pp-step-body\"><a href=\"#step-7\">Проводим разговор<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>20–40 минут на&nbsp;каждый<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">08<\/span><div class=\"pp-step-body\"><a href=\"#step-8\">Записываем главное сразу после разговора<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>15–20 минут после каждого<\/span><\/div><\/li><li class=\"pp-step\"><span class=\"pp-step-num\">09<\/span><div class=\"pp-step-body\"><a href=\"#step-9\">Анализируем все разговоры и&nbsp;решаем, что менять<\/a><span class=\"pp-step-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>2–3 часа<\/span><\/div><\/li><\/ol><\/div><div class=\"prose\"><\/div><\/section>\n<\/div><div data-pp-page=\"Три примера\" data-pp-short=\"Примеры\"><section class=\"pp-gen\"><h2 class=\"pp-section-title\"><span>Три примера, которые пройдут через всю статью<\/span><\/h2><div class=\"prose\"><p>Чтобы всё было наглядно, по&nbsp;каждому шагу мы&nbsp;пройдём вместе с&nbsp;тремя героями. У&nbsp;них разные ниши и&nbsp;разные продукты&nbsp;— так вы&nbsp;увидите, что метод один, а&nbsp;меняются гипотеза, собеседники и&nbsp;то, о&nbsp;чём просить в&nbsp;конце.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Психолог Марина&nbsp;— придуманная героиня, её&nbsp;история&nbsp;— иллюстрация, а&nbsp;не&nbsp;реальный кейс. Все цифры и&nbsp;фразы в&nbsp;её&nbsp;примере условные.<\/p>\n<p>Марина давно замечает: к&nbsp;ней приходят женщины около пятидесяти, у&nbsp;которых дети выросли и&nbsp;уехали. Она хочет сделать для них <b>6-недельную онлайн-группу<\/b> «Жизнь для себя» за&nbsp;15&nbsp;000 ₽. Продукта пока нет&nbsp;— Марина проверяет идею с&nbsp;нуля.<\/p><\/div>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><p>Это собирательный пример: основа взята из&nbsp;реальной истории ученицы программы, детали условные.<\/p>\n<p>Мастер&nbsp;— брейдер, то&nbsp;есть мастер по&nbsp;плетению кос. Заплетает косы, делает афро-причёски и&nbsp;афро-кудри. Среди клиенток&nbsp;— девушки, которые едут в&nbsp;отпуск, и&nbsp;те, кто хочет сменить образ или собирается на&nbsp;косплей (переодевание в&nbsp;героя фильма, игры или аниме). Причёска держится максимум полтора-два месяца, потом клиентка приходит переплетаться. Средний чек&nbsp;— около 11&nbsp;000 ₽. Работа сезонная. Одна постоянная клиентка ходит почти 4&nbsp;года.<\/p>\n<p>Её&nbsp;продукт&nbsp;— <b>услуга<\/b>, она уже продаётся. Клиенты приходят по&nbsp;сарафанному радио, её&nbsp;номер раздают в&nbsp;салонах красоты, реклама, по&nbsp;её&nbsp;словам, «работает, но&nbsp;криво». И&nbsp;главная загадка: люди смотрят её&nbsp;работы годами. «Увидели меня, мои работы, и&nbsp;пока она созреет, может пройти год, два, пять». Бывшие клиентки возвращаются через 3–5 лет.<\/p><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><p>Это тоже собирательный пример: основа реальная, детали условные.<\/p>\n<p>Консультант работает с&nbsp;топ-менеджерами&nbsp;— руководителями высшего уровня: директорами направлений, заместителями генерального директора. Сейчас у&nbsp;него есть разовая консультация за&nbsp;10&nbsp;000 ₽ в&nbsp;час и&nbsp;пакет из&nbsp;4&nbsp;встреч за&nbsp;40&nbsp;000 ₽. Он&nbsp;хочет продавать <b>программу сопровождения на&nbsp;3&nbsp;месяца за&nbsp;600 000 ₽<\/b>.<\/p>\n<p>Для кого: для топ-менеджера, который вошёл в&nbsp;новую роль. Его продвинули на&nbsp;новое направление бизнеса или в&nbsp;новую отрасль, в&nbsp;которой он&nbsp;понимает слишком мало. Акционер давит. При этом у&nbsp;руководителя есть кредит доверия&nbsp;— но&nbsp;его нужно подтвердить. Результат сопровождения&nbsp;— за&nbsp;три месяца защитить свою стратегию на&nbsp;совете директоров: получить понятный план работы, бюджет, полномочия, КПЭ и&nbsp;сохранить позицию.<\/p>\n<p>Опыт у&nbsp;консультанта уже есть: одна разовая встреча привела к&nbsp;покупке пакета, всего прошло 7&nbsp;встреч. Потом клиент уехал в&nbsp;отпуск, затем переезжал в&nbsp;другой офис&nbsp;— и&nbsp;работа прервалась на&nbsp;несколько недель.<\/p><\/div>\n<div class=\"pp-note pp-note-info\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Слова из&nbsp;примера консультанта<\/span><p><b>Акционер<\/b>&nbsp;— совладелец компании. <b>Совет директоров<\/b>&nbsp;— люди, которые от&nbsp;имени владельцев утверждают планы и&nbsp;бюджет компании. <b>КПЭ<\/b>&nbsp;— ключевые показатели эффективности: цифры, по&nbsp;которым оценивают работу руководителя. <b>Оборот<\/b>&nbsp;— все деньги, которые проходят через компанию за&nbsp;год.<\/p><\/div><\/div>\n<p>Перед шагами&nbsp;— три правила, на&nbsp;которых держится весь кастдев. Без них даже двадцать разговоров дадут вам приятные, но&nbsp;бесполезные ответы.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Три правила кастдева\" data-pp-short=\"Правила\"><section id=\"rules\"><span class=\"pp-part-label\">Основа<\/span><h2 class=\"pp-section-title\">Три правила, на&nbsp;которых <span>держится кастдев<\/span><\/h2><div class=\"prose\"><\/div><div class=\"pp-rules\"><div class=\"pp-rule\"><span class=\"pp-rule-num\">Правило 1<\/span><h3 class=\"pp-rule-title\">Говорите о&nbsp;жизни человека, а&nbsp;не&nbsp;о&nbsp;своей идее<\/h3><div class=\"prose\"><p>Как только вы&nbsp;рассказали про свой продукт, собеседник начинает отвечать вежливо, а&nbsp;не&nbsp;честно. Он&nbsp;видит, что вы&nbsp;увлечены, и&nbsp;не&nbsp;хочет вас расстраивать. «Да, классная идея», «Да, наверное, пошла бы». Никто не&nbsp;хочет вас обмануть&nbsp;— люди просто деликатны.<\/p>\n<p>Поэтому весь разговор идёт про собеседника: его день, его трудности, его попытки что-то изменить. Про свой продукт вы&nbsp;говорите только в&nbsp;последние пять минут&nbsp;— коротко, одной-двумя фразами. А&nbsp;иногда не&nbsp;говорите вообще.<\/p><\/div><\/div><div class=\"pp-rule\"><span class=\"pp-rule-num\">Правило 2<\/span><h3 class=\"pp-rule-title\">Спрашивайте о&nbsp;том, что уже было, а&nbsp;не&nbsp;о&nbsp;том, что было бы<\/h3><div class=\"prose\"><div class=\"pp-say\">«Купили бы&nbsp;вы&nbsp;такую программу?»&nbsp;— вопрос о&nbsp;будущем. Человек в&nbsp;этот момент представляет себя лучшей версией себя: собранной, мотивированной, со&nbsp;свободными деньгами. И&nbsp;честно отвечает «да». А&nbsp;через месяц не&nbsp;покупает.<\/div>\n<div class=\"pp-say\">«Когда вы&nbsp;последний раз за&nbsp;что-то платили, чтобы с&nbsp;этим справиться?»&nbsp;— вопрос о&nbsp;прошлом. Здесь нельзя пофантазировать: либо платила, либо нет. <b>Прошлое поведение&nbsp;— факт. Будущее&nbsp;— фантазия.<\/b><\/div><\/div><\/div><div class=\"pp-rule\"><span class=\"pp-rule-num\">Правило 3<\/span><h3 class=\"pp-rule-title\">Слушайте больше, чем говорите<\/h3><div class=\"prose\"><p>Ориентир&nbsp;— собеседник говорит около 80% времени, вы&nbsp;— около 20%. Из&nbsp;40&nbsp;минут разговора на&nbsp;вас приходится примерно 8: короткие вопросы, «а&nbsp;что было дальше?», «расскажите подробнее». Всё остальное время вы&nbsp;слушаете и&nbsp;записываете.<\/p>\n<p>Каждая минута, когда говорите вы,&nbsp;— минута, когда вы&nbsp;ничего не&nbsp;узнаёте.<\/p><\/div><\/div><\/div><div class=\"prose bridge\"><\/div><\/section>\n<\/div><div data-pp-page=\"Что меняется в зависимости от продукта\" data-pp-short=\"Продукт\"><section class=\"pp-gen\"><h2 class=\"pp-section-title\"><span>Что меняется в&nbsp;зависимости от&nbsp;продукта<\/span><\/h2><div class=\"prose\"><p>Правила одинаковые для любого продукта. Меняются три вещи: что именно вы&nbsp;проверяете, где искать собеседников и&nbsp;о&nbsp;чём просить в&nbsp;конце разговора.<\/p>\n<div class=\"pp-note pp-note-info\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Термин<\/span><p><b>Проверка делом<\/b>&nbsp;— маленькая просьба в&nbsp;конце разговора, которая требует от&nbsp;человека действия: потратить время, поделиться контактом, внести деньги. Если человек готов это сделать&nbsp;— интерес настоящий. Если отвечает «ну, посмотрим»&nbsp;— это вежливость. Подробно о&nbsp;ней&nbsp;— в&nbsp;шаге 6.<\/p><\/div><\/div>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Продукт<\/th><th>Что главное проверить<\/th><th>Ключевой вопрос<\/th><th>О&nbsp;чём попросить в&nbsp;конце (проверка делом)<\/th><\/tr><\/thead><tbody><tr><td><b>Разовая услуга<\/b> (консультация, расклад, причёска к&nbsp;событию)<\/td><td>Что подталкивает записаться именно сейчас и&nbsp;где человек ищет специалиста<\/td><td>«Когда вы&nbsp;последний раз записывались к&nbsp;такому специалисту? Что стало поводом?»<\/td><td>Запись на&nbsp;конкретную дату с&nbsp;предоплатой<\/td><\/tr><tr><td><b>Регулярная услуга<\/b> (переплетение кос раз в&nbsp;полтора-два месяца, ежемесячная сессия)<\/td><td>Как часто люди на&nbsp;самом деле возвращаются и&nbsp;почему перестают<\/td><td>«Сколько раз за&nbsp;последний год вы&nbsp;ходили к&nbsp;мастеру? Почему не&nbsp;чаще?»<\/td><td>Запись на&nbsp;следующий визит, приглашение подруги<\/td><\/tr><tr><td><b>Программа сопровождения<\/b> (несколько месяцев работы к&nbsp;результату)<\/td><td>Есть ли&nbsp;у&nbsp;человека срок, к&nbsp;которому нужен результат, и&nbsp;кто платит<\/td><td>«Когда вам последний раз нужно было добиться результата к&nbsp;жёсткому сроку? Что вы&nbsp;делали?»<\/td><td>Знакомство с&nbsp;коллегой в&nbsp;похожей ситуации, платная диагностическая встреча<\/td><\/tr><tr><td><b>Товар<\/b> (колода, свечи, косметика)<\/td><td>Чем человек пользуется сейчас, где и&nbsp;за&nbsp;сколько покупает<\/td><td>«Что вы&nbsp;последним купили для этого? Где и&nbsp;почему именно это?»<\/td><td>Предзаказ<\/td><\/tr><tr><td><b>Курс или групповая программа<\/b><\/td><td>Есть ли&nbsp;боль, пробовал ли&nbsp;человек с&nbsp;ней справиться, подходит ли&nbsp;формат<\/td><td>«Что вы&nbsp;уже пробовали, чтобы с&nbsp;этим справиться? Сколько это стоило?»<\/td><td>Лист ожидания, бронь места с&nbsp;предоплатой<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Правила понятны. Дальше&nbsp;— первый шаг: сформулировать, что именно вы&nbsp;проверяете.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 1. Сформулируйте гипотезу\" data-pp-short=\"Шаг 1\"><section class=\"pp-stepsec\" id=\"step-1\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">01<\/span><div><span class=\"pp-part-label\">Шаг 1 из 9<\/span><h2 class=\"pp-section-title\"><span>Сформулируйте гипотезу<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>20–30 минут<\/span><\/div><\/div><div class=\"prose\"><div class=\"pp-note pp-note-info\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Термин<\/span><p><b>Гипотеза<\/b>&nbsp;— ваше предположение о&nbsp;клиенте и&nbsp;продукте, которое пока не&nbsp;проверено. «Мне кажется, у&nbsp;таких-то людей есть такая-то проблема, и&nbsp;им&nbsp;подойдёт вот такое решение». Пока вы&nbsp;не&nbsp;поговорили с&nbsp;людьми, это не&nbsp;знание, а&nbsp;догадка.<\/p><\/div><\/div>\n<p>Гипотеза в&nbsp;голове обычно звучит размыто: «хочу сделать программу для женщин про любовь к&nbsp;себе». Проверить такое невозможно&nbsp;— непонятно, с&nbsp;кем говорить и&nbsp;что спрашивать. Поэтому гипотезу записывают по&nbsp;формуле из&nbsp;пяти частей.<\/p>\n<p><b>Формула гипотезы:<\/b><\/p>\n<p><b>Кто<\/b> (конкретные люди) → <b>что у&nbsp;них болит<\/b> → <b>что они уже пробуют<\/b> → <b>какой результат хотят<\/b> → <b>что вы&nbsp;предлагаете<\/b>.<\/p>\n<p>Каждая часть&nbsp;— отдельная ступенька. Если какую-то вы&nbsp;не&nbsp;можете заполнить, это нормально: значит, именно её&nbsp;вы&nbsp;и&nbsp;будете выяснять в&nbsp;разговорах.<\/p>\n<p>Гипотеза нужна, даже если продукт уже продаётся. У&nbsp;мастера по&nbsp;косам услуга есть, но&nbsp;она не&nbsp;понимает, почему решение у&nbsp;клиенток созревает годами. Это и&nbsp;есть её&nbsp;гипотеза для проверки.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Марина записывает свою гипотезу по&nbsp;формуле:<\/p>\n<ul class=\"pp-list\"><li><b>Кто:<\/b> женщины 45–55 лет, у&nbsp;которых за&nbsp;последние 1–3 года взрослые дети стали жить отдельно.<\/li><li><b>Что болит:<\/b> после отъезда детей пропала опора. Непонятно, ради чего теперь вставать по&nbsp;утрам и&nbsp;чем заполнить дни.<\/li><li><b>Что уже пробуют:<\/b> заполняют время работой, дачей, сериалами, помощью детям. Некоторые идут к&nbsp;психологу или на&nbsp;женские курсы.<\/li><li><b>Какой результат хотят:<\/b> снова чувствовать интерес к&nbsp;жизни и&nbsp;понимать, чего хотят сами.<\/li><li><b>Что предлагаю:<\/b> 6-недельную онлайн-группу «Жизнь для себя» за&nbsp;15&nbsp;000 ₽.<\/li><\/ul>\n<p>И&nbsp;программа, как Марина её&nbsp;видит сейчас:<\/p>\n<ol class=\"pp-olist\"><li><b>Что со&nbsp;мной происходит.<\/b> Почему после отъезда детей пропадает опора и&nbsp;почему это нормально.<\/li><li><b>Дома стало тихо.<\/b> Отношения с&nbsp;мужем, когда вы&nbsp;снова вдвоём.<\/li><li><b>Новые отношения со&nbsp;взрослыми детьми.<\/b> Как общаться, не&nbsp;контролируя и&nbsp;не&nbsp;обижаясь.<\/li><li><b>Чего хочу я&nbsp;сама.<\/b> Свои желания, интересы, отложенные планы.<\/li><li><b>Тело и&nbsp;энергия.<\/b> Сон, силы, самочувствие в&nbsp;этот период.<\/li><li><b>План на&nbsp;год.<\/b> Первые конкретные шаги в&nbsp;новой жизни.<\/li><\/ol><\/div>\n<div class=\"pp-example ex-braid\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Пример: мастер по&nbsp;косам<\/span><p>Часть гипотезы&nbsp;— факты из&nbsp;её&nbsp;практики, часть&nbsp;— допущения, которые она проверяет. Допущения помечены.<\/p>\n<ul class=\"pp-list\"><li><b>Кто:<\/b> девушки и&nbsp;женщины, которые хотят косы или афро-причёску&nbsp;— перед отпуском, для смены образа, для косплея.<\/li><li><b>Что болит:<\/b> хотят давно&nbsp;— «я&nbsp;всё детство мечтала косички заплести»,&nbsp;— но&nbsp;решаются годами. *Допущение:* решение тормозит что-то конкретное&nbsp;— цена, страх, что не&nbsp;пойдёт, много часов в&nbsp;кресле, непонятно, как ухаживать.<\/li><li><b>Что уже пробуют:<\/b> *допущение*&nbsp;— сохраняют фото, смотрят работы мастеров, спрашивают у&nbsp;знакомых.<\/li><li><b>Какой результат хотят:<\/b> причёску к&nbsp;отпуску или событию, новый образ, исполнить давнюю мечту.<\/li><li><b>Что предлагаю:<\/b> плетение со&nbsp;средним чеком около 11&nbsp;000 ₽ и&nbsp;переплетение раз в&nbsp;полтора-два месяца.<\/li><\/ul>\n<p>Главные вопросы для неё: что тормозит решение и&nbsp;что в&nbsp;итоге подталкивает? Кто платит 11&nbsp;000 ₽ и&nbsp;регулярно переплетается? Где такие люди ищут мастера?<\/p><\/div>\n<div class=\"pp-example ex-top\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/><\/svg>Пример: консультант топ-менеджеров<\/span><ul class=\"pp-list\"><li><b>Кто:<\/b> топ-менеджеры компаний среднего бизнеса с&nbsp;оборотом от&nbsp;1&nbsp;до&nbsp;10&nbsp;млрд ₽, которых недавно продвинули на&nbsp;новое направление или в&nbsp;новую отрасль.<\/li><li><b>Что болит:<\/b> в&nbsp;новой области понимают слишком мало, акционер давит. Кредит доверия есть, но&nbsp;его нужно подтвердить результатом.<\/li><li><b>Что уже пробуют:<\/b> *допущение*&nbsp;— программы для руководителей, MBA (дорогое бизнес-образование для руководителей), коучи для руководителей, консультанты.<\/li><li><b>Какой результат хотят:<\/b> за&nbsp;три месяца защитить стратегию на&nbsp;совете директоров: план работы, бюджет, полномочия, КПЭ&nbsp;— и&nbsp;сохранить позицию.<\/li><li><b>Что предлагаю:<\/b> сопровождение на&nbsp;3&nbsp;месяца за&nbsp;600 000 ₽.<\/li><\/ul>\n<p>И&nbsp;одно отдельное допущение, от&nbsp;которого зависит вся продажа: топ-менеджер платит <b>из&nbsp;своего кармана<\/b>, а&nbsp;не&nbsp;деньгами компании. Консультант сам формулирует это так: «захожу через личные финансы». Если окажется, что платит компания, придётся продавать совсем по-другому.<\/p><\/div>\n<p>Та&nbsp;же&nbsp;формула работает в&nbsp;любой нише. Коротко, для ориентира:<\/p>\n<ul class=\"pp-list\"><li><b>Таролог:<\/b> женщины 30–45, которые годами ходят к&nbsp;тарологам с&nbsp;одними и&nbsp;теми же&nbsp;вопросами → устали зависеть от&nbsp;чужих раскладов → покупают консультации раз в&nbsp;месяц-два → хотят сами понимать карты → курс «Таро для себя».<\/li><li><b>Астролог:<\/b> предпринимательницы с&nbsp;небольшим делом → принимают важные решения наугад и&nbsp;потом жалеют → смотрят бесплатные прогнозы в&nbsp;каналах → хотят планировать год спокойно → годовой разбор натальной карты с&nbsp;календарём решений.<\/li><li><b>Коуч:<\/b> женщины 45+, которые хотят сменить профессию → боятся, что «уже поздно» → смотрят вакансии, записываются на&nbsp;бесплатные вебинары → хотят за&nbsp;полгода перейти на&nbsp;новую работу → 3-месячная программа сопровождения.<\/li><\/ul>\n<div class=\"pp-note pp-note-tip\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Совет<\/span><p>Пишите гипотезу так, чтобы по&nbsp;ней было понятно, кого звать на&nbsp;разговор. «Женщины, которым плохо»&nbsp;— непонятно. «Женщины 45–55, у&nbsp;которых дети за&nbsp;последние 1–3 года стали жить отдельно»&nbsp;— понятно, кого искать и&nbsp;кому писать.<\/p><\/div><\/div>\n<p>Гипотеза записана. Но&nbsp;целиком её&nbsp;не&nbsp;проверить&nbsp;— она слишком большая. Дальше разбираем её&nbsp;на&nbsp;части.<\/p><\/div><\/section>\n<\/div><div data-pp-page=\"Шаг 2. Разложите гипотезу на отдельные предположения\" data-pp-short=\"Шаг 2\"><section class=\"pp-stepsec\" id=\"step-2\"><div class=\"pp-stephead\"><span class=\"pp-stephead-num\">02<\/span><div><span class=\"pp-part-label\">Шаг 2 из 9<\/span><h2 class=\"pp-section-title\"><span>Разложите гипотезу на&nbsp;отдельные предположения<\/span><\/h2><span class=\"pp-time\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg>40–60 минут<\/span><\/div><\/div><div class=\"prose\"><p>Гипотеза Марины&nbsp;— это на&nbsp;самом деле восемь разных догадок, склеенных в&nbsp;одну. Может оказаться, что боль у&nbsp;женщин есть, а&nbsp;онлайн-группа им&nbsp;не&nbsp;подходит. Или что всё верно, кроме цены. Если проверять гипотезу целиком, вы&nbsp;получите смутное «вроде да». Если по&nbsp;частям&nbsp;— точно увидите, какая часть держится, а&nbsp;какая нет.<\/p>\n<div class=\"pp-note pp-note-info\"><div class=\"pp-note-icon\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\/svg><\/div><div class=\"pp-note-text\"><span class=\"nt-title\">Термин<\/span><p><b>Предположение<\/b>&nbsp;— одна отдельная часть гипотезы, которую можно подтвердить или опровергнуть в&nbsp;разговоре. «Клиенты уже тратили деньги на&nbsp;решение этой проблемы»&nbsp;— предположение. Дальше в&nbsp;статье будем называть их&nbsp;П1, П2&nbsp;и&nbsp;так далее. У&nbsp;каждого героя своя нумерация.<\/p><\/div><\/div>\n<p>Для каждого предположения вы&nbsp;заранее решаете две вещи: какими вопросами его проверить и&nbsp;какой ответ его подтвердит, а&nbsp;какой опровергнет. Это самая важная часть подготовки. Потом, после разговоров, вы&nbsp;не&nbsp;будете гадать «ну&nbsp;вроде подтвердилось»&nbsp;— у&nbsp;вас будет готовый критерий.<\/p>\n<p><b>Главное правило:<\/b> хороший вопрос&nbsp;— тот, ответ на&nbsp;который может показать, что вы&nbsp;ошибаетесь. Если на&nbsp;вопрос любой человек ответит «да», он&nbsp;ничего не&nbsp;проверяет.<\/p>\n<div class=\"pp-example ex-marina\"><span class=\"pp-example-lbl\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/><\/svg>Пример: Марина<\/span><p>Так Марина раскладывает свою гипотезу.<\/p>\n<div class=\"pp-table-wrap\"><table class=\"pp-table\"><thead><tr><th>Предположение<\/th><th>Какими вопросами проверяю<\/th><th>Подтвердит<\/th><th>Опровергнет<\/th><\/tr><\/thead><tbody><tr><td><b>П1. Кто.<\/b> Тема остро стоит именно у&nbsp;женщин 45–55, у&nbsp;которых дети недавно стали жить отдельно<\/td><td>«Когда дети стали жить отдельно? Что изменилось в&nbsp;вашей жизни после этого?»<\/td><td>Большинство сами рассказывают о&nbsp;трудностях, связанных с&nbsp;этим периодом<\/td><td>Большинство отвечают «всё нормально, даже легче стало» или трудности не&nbsp;связаны с&nbsp;отъездом детей<\/td><\/tr><tr><td><b>П2. Боль есть.<\/b> После отъезда детей пропала опора и&nbsp;непонятно, чем заполнить жизнь<\/td><td>«Что из&nbsp;этих перемен далось труднее всего? Когда последний раз вы&nbsp;это остро почувствовали?»<\/td><td>Рассказывают конкретные недавние случаи: вечер, выходные, праздник<\/td><td>Не&nbsp;могут вспомнить ни&nbsp;одного конкретного случая&nbsp;— только общие слова<\/td><\/tr><tr><td><b>П3. Слова.<\/b> Женщины сами называют это «пустое гнездо», «пустота»<\/td><td>Отдельного вопроса нет&nbsp;— Марина слушает и&nbsp;записывает дословно, как собеседница это называет<\/td><td>Эти слова звучат у&nbsp;большинства сами, без подсказки<\/td><td>Звучат другие слова&nbsp;— их&nbsp;Марина и&nbsp;заберёт в&nbsp;тексты<\/td><\/tr><tr><td><b>П4. Что уже пробовали.<\/b> Женщины уже пытались справиться и&nbsp;тратили на&nbsp;это деньги или время<\/td><td>«Что вы&nbsp;уже делали, чтобы стало легче? Обращались ли&nbsp;к&nbsp;кому-то за&nbsp;помощью? Сколько это стоило?»<\/td><td>Называют конкретные действия: психолог, курс, книги, группы&nbsp;— с&nbsp;суммами и&nbsp;сроками<\/td><td>Ничего не&nbsp;делали, «само пройдёт», денег на&nbsp;это не&nbsp;тратили никогда<\/td><\/tr><tr><td><b>П5. Результат.<\/b> Хотят «жить для себя»&nbsp;— понять свои желания<\/td><td>«Если через год эта ситуация вас больше не&nbsp;беспокоит&nbsp;— что изменилось бы?»<\/td><td>Описывают что-то про себя: интересы, дело, силы<\/td><td>Описывают другое&nbsp;— например, «чтобы дети чаще звонили» или «чтобы с&nbsp;мужем было о&nbsp;чём говорить»<\/td><\/tr><tr><td><b>П6. Формат.<\/b> Им&nbsp;подходит онлайн-группа<\/td><td>«Вы&nbsp;когда-нибудь занимались в&nbsp;группе&nbsp;— онлайн или вживую? Как это было?»<\/td><td>Были в&nbsp;группах, вспоминают это как полезный опыт, умеют пользоваться видеосвязью<\/td><td>Не&nbsp;были никогда и&nbsp;не&nbsp;хотели бы&nbsp;делиться при чужих, трудно с&nbsp;техникой<\/td><\/tr><tr><td><b>П7. Цена.<\/b> 15&nbsp;000 ₽&nbsp;— в&nbsp;пределах того, что они уже тратят на&nbsp;подобное<\/td><td>«За&nbsp;что подобное вы&nbsp;уже платили? Сколько это стоило?»<\/td><td>Уже платили суммы такого порядка за&nbsp;психолога, курсы, ретриты<\/td><td>Никогда не&nbsp;платили больше пары тысяч за&nbsp;что-то подобное<\/td><\/tr><tr><td><b>П8. Программа.<\/b> Каждый из&nbsp;шести модулей отвечает на&nbsp;то, что у&nbsp;них реально происходит<\/td><td>Отдельная таблица ниже<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n<p>Обратите внимание: ни&nbsp;в&nbsp;одном вопросе нет слов «группа Марины», «курс», «купили бы». Все вопросы&nbsp;— про жизнь собеседницы и&nbsp;про то, что уже было.<\/p>\n<p>Восемь предположений&nbsp;— не&nbsp;обязательное число. Иногда достаточно трёх-четырёх главных&nbsp;— тех, от&nbsp;которых зависит, будет ли&nbsp;продукт продаваться. Так сделали два других героя.<\/p>\n<div
