—— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; color: var(--t2); margin-top: 4px; }\n.step-d.ok { color: var(--green); font-weight: 600; }\n\n/* ——— неделя: 3 плашки ——— */\n.week { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }\n.week div { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.3; color: var(--t2); }\n.week div b { width: 20px; text-align: center; font-size: 22px; color: var(--t1); flex: none; }\n.week div:first-child { border-color: rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.week div:first-child b { color: var(--amber); }\n\n/* ——— 80/20 ——— */\n.split-bar { display: grid; grid-template-columns: 20fr 80fr; height: 40px; border-radius: 12px; overflow: hidden; margin: 16px 0 14px; font-size: 14px; font-weight: 700; }\n.split-bar span { display: flex; align-items: center; padding: 0 12px; }\n.split-bar span:first-child { background: var(--gold); color: #1A1406; justify-content: center; padding: 0; }\n.split-bar span:last-child { background: rgba(255,255,255,.07); color: var(--t3); }\n.split { display: grid; gap: 12px; }\n.split .card { margin-top: 0; }\n.split .must { border-color: rgba(234,184,32,.4); }\n.split .must .card-t { color: var(--amber); }\n.split .must .card-t svg.i { color: var(--amber); }\n\n/* ——— таймлайн недели задания ——— */\n.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 14px 0 8px; }\n.day { text-align: center; }\n.day-bar { height: 10px; border-radius: 5px; background: rgba(107,159,255,.28); }\n.day.open .day-bar { background: var(--blue); }\n.day.dl .day-bar { background: var(--red); }\n.day-n { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--t2); }\n.day-s { font-size: 11px; line-height: 1.25; color: var(--t3); margin-top: 2px; }\n.day.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «100 целей | 300 целей | 1000 целей»: дополнения к lesson.css урока «Правила курса». */\n.lead { color: var(--t1); }\n\n/* ——— энергия под цели ——— */\n.energy { border-color: var(--blue-line); background: linear-gradient(180deg, rgba(107,159,255,.07), var(--card)); }\n.energy p { font-size: 16px; color: var(--t1); }\n.energy b { color: #DCE7FF; }\n\n/* ——— вопрос и ответ ——— */\n.talk { display: grid; gap: 10px; }\n.bub { position: relative; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.45; color: var(--t1);\n  background: rgba(255,255,255,.06); border: 1px solid var(--line2); margin: 0 !important; }\n.bub.l { justify-self: start; border-bottom-left-radius: 6px; font-weight: 600; }\n.bub.r { justify-self: end; border-bottom-right-radius: 6px; background: rgba(234,184,32,.08); border-color: rgba(234,184,32,.32); }\n\n/* ——— итог: 10 желаний ——— */\n.story { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.story .card-t { color: #FF9B9B; }\n.story .card-t svg.i { color: var(--red); }\n.story p { font-size: 16px; color: var(--t1); }\n.big10 { color: #FFB3B3; }\n.story-end { margin-top: 12px; font-size: 18px !important; font-weight: 700; color: #FFD0D0 !important; }\n\n/* ——— три уровня ——— */\n.tiers { display: grid; gap: 12px; }\n.tier { padding: 18px 18px 20px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line2); }\n.tier-h { display: grid; gap: 8px; justify-items: start; }\n.tier-n { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--t1); }\n.tier-l { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); }\n.tier-bar { height: 6px; margin: 14px 0 14px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }\n.tier-bar i { display: block; height: 100%; border-radius: 3px; background: var(--blue); }\n.tier p { font-size: 16px; color: var(--t2); }\n.tier p + p { margin-top: 10px; }\n.t1 .tier-bar i { width: 10%; }\n.t2 .tier-bar i { width: 30%; }\n.t3 { border-color: rgba(234,184,32,.45); background: radial-gradient(120% 120% at 50% 0%, #2A2412 0%, var(--card) 70%); }\n.t3 .tier-n { background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.t3 .tier-l { color: #D9B94E; }\n.t3 .tier-bar i { width: 100%; background: var(--gold); }\n.tier-win { font-weight: 700; color: var(--t1) !important; }\n\n/* ——— по сторонам ——— */\n.range { list-style: none; display: grid; padding: 6px 18px; }\n.range li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.range li:first-child { border-top: 0; }\n.range svg.i { width: 34px; height: 34px; padding: 8px; border-radius: 10px; background: var(--blue-bg); color: var(--blue); margin-top: -5px; }\n\n/* ——— главная мысль ——— */\n.thesis { padding: 22px 20px; border-color: rgba(234,184,32,.30); background: linear-gradient(180deg, #1E2230 0%, var(--card) 100%); }\n.thesis-t { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.thesis p + p { margin-top: 10px; color: var(--t2); }\n\n/* ——— задание ——— */\n.task { border-color: rgba(234,184,32,.45); background: radial-gradient(120% 120% at 50% 0%, #2A2412 0%, var(--card) 70%); padding: 22px 20px; }\n.task .kick { color: #D9B94E; }\n.task p { font-size: 17px; color: var(--t1); }\n.task p + p { margin-top: 12px; }\n.cw { font-weight: 600; }\n.cw.b { color: #7EA8FF; } .cw.o { color: #FFAD66; } .cw.r { color: #FF8080; } .cw.y { color: #FFD95C; }\n/* четыре ватмана с рукописными строчками; часть строк вычеркнута — «через 10 лет будете вычеркивать» */\n.sheets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 300px; margin: 20px auto 24px !important; padding: 0 6px; }\n.sheet { aspect-ratio: 3 / 4; border-radius: 6px; padding: 16% 13%; display: grid; align-content: start; gap: 11%;\n  box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12); }\n.sheet:nth-child(1) { transform: rotate(-4deg); } .sheet:nth-child(2) { transform: rotate(2deg) translateY(4px); }\n.sheet:nth-child(3) { transform: rotate(-2deg); } .sheet:nth-child(4) { transform: rotate(4deg) translateY(3px); }\n.sheet.b { background: #3D6FE0; } .sheet.o { background: #E8893A; } .sheet.r { background: #D9504F; } .sheet.y { background: #E9C23B; }\n.sheet i { position: relative; display: block; height: 3px; border-radius: 2px; background: rgba(255,255,255,.55); }\n.sheet i:nth-child(2n) { width: 78%; } .sheet i:nth-child(3n) { width: 62%; }\n.sheet i.x { background: rgba(255,255,255,.3); }\n.sheet i.x::after { content: \"\"; position: absolute; left: -6%; right: -6%; top: 50%; height: 2px; margin-top: -1px; background: #1A1406; border-radius: 1px; transform: rotate(-3deg); }\n.sheet.y i { background: rgba(40,30,0,.45); } .sheet.y i.x { background: rgba(40,30,0,.25); } .sheet.y i.x::after { background: #fff; }\n.task-go { margin-top: 16px !important; font-size: 24px !important; font-weight: 700; line-height: 1.25 !important; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n\n/* ——— как засчитывается ——— */\n.how { border-color: var(--blue-line); }\n.how .card-t { margin-bottom: 6px; }\n.how-l { list-style: none; display: grid; }\n.how-l li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.how-l li:first-child { border-top: 0; }\n.how-l li:last-child { padding-bottom: 0; }\n.how-n { margin-top: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n\n/* ——— ритм отступов (сетка ПП): текст 12, блоки 20, подзаголовок после kick 10, после h2 14 ——— */\n.sec > * { margin-bottom: 0 !important; }\n.sec > * + * { margin-top: 12px !important; }\n.sec > .kick { margin-bottom: 10px !important; }\n.sec > .kick + * { margin-top: 0 !important; }\n.sec > .h2 { margin-bottom: 0 !important; }\n.sec > .h2 + * { margin-top: 14px !important; }\n.sec > * + :is(.card, .talk, .tiers), .sec > :is(.card, .talk, .tiers) + * { margin-top: 20px !important; }\n.card > :first-child { margin-top: 0 !important; }\n.card > .card-t + * { margin-top: 0 !important; }\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <p class=\"lead\"><b>Сегодняшнее упражнение одно из&nbsp;самых моих любимых.<\/b><\/p>\n  <p>Потому что у&nbsp;многих из&nbsp;нас есть большая проблема с&nbsp;желаниями.<\/p>\n  <p>Нам так много лет подряд говорили чего можно, чего нельзя хотеть, что правильно и&nbsp;неправильно, что все наши желания по&nbsp;факту угасли. И&nbsp;за&nbsp;годы жизни мы&nbsp;просто перестаем чего-то хотеть.<\/p>\n\n  <div class=\"card energy\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/><\/svg>Откуда берётся энергия<\/div>\n    <p>А&nbsp;если вы&nbsp;хорошо помните мои уроки, связанные с&nbsp;мотивацией, то <b>энергия всегда выделяется под цели.<\/b> Когда ты&nbsp;точно знаешь чего ты&nbsp;хочешь. И&nbsp;под зверька. Когда зверек знает чего хочет.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Почему так сложно<\/span>\n  <h2 class=\"h2\"><span class=\"upd\">Мы&nbsp;разучились хотеть<\/span><\/h2>\n  <p>И&nbsp;большинство из&nbsp;вас столкнулись с&nbsp;проблемой, потому что вам очень сложно определить, а&nbsp;чего вы&nbsp;хотите?<\/p>\n\n  <div class=\"talk\" aria-label=\"Вопрос и ответ\">\n    <p class=\"bub l\">Почему?<\/p>\n    <p class=\"bub r\">Да&nbsp;потому что вы&nbsp;пытаетесь вписаться в&nbsp;какие-то рамки.<\/p>\n  <\/div>\n\n  <p>Вы&nbsp;пытаетесь сделать так, чтобы цели или желания попадали в&nbsp;какие-то критерии определенного характера. Ну, что вы&nbsp;сами себе разрешаете желать.<\/p>\n  <p>Из-за этого откидываете очень много желаний. Некоторые даже не&nbsp;рассматриваете.<\/p>\n  <p>А&nbsp;они, запуская цепочку событий, приводят к&nbsp;тому, что вы&nbsp;отметаете еще большее количество желаний.<\/p>\n\n  <div class=\"card story\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg>Что остаётся в&nbsp;итоге<\/div>\n    <p>И&nbsp;в&nbsp;результате чего, человек превращается в&nbsp;то&nbsp;существо, которое может назвать в&nbsp;среднем <b class=\"big10\">10&nbsp;своих желаний.<\/b> От&nbsp;покупки квартиры, машины, путешествия, заканчивая, может быть, парой сумочек или парой интересных обновок в&nbsp;виде айфона или макбука.<\/p>\n    <p class=\"story-end\">На&nbsp;этом всё.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Упражнение урока<\/span>\n  <h2 class=\"h2\"><span class=\"upd\">«1000&nbsp;желаний»<\/span><\/h2>\n  <p>Мое сегодняшнее упражнение одно из&nbsp;самых моих любимых. И&nbsp;оно всегда производит фурор на&nbsp;студентов, потому что мало кто понимает на&nbsp;что он&nbsp;на&nbsp;самом деле способен, чтобы сделать это упражнение.<\/p>\n  <p>Я&nbsp;называю это упражнение «1000&nbsp;желаний». Задача: расписать на&nbsp;ватмане&nbsp;— именно ключевой фактор <b class=\"am\">ОТ&nbsp;РУКИ<\/b>&nbsp;— 1000&nbsp;желаний.<\/p>\n\n  <div class=\"tiers\">\n    <div class=\"tier t1\">\n      <div class=\"tier-h\"><span class=\"tier-n\">100<\/span><span class=\"tier-l\">База · минимум<\/span><\/div>\n      <div class=\"tier-bar\" aria-hidden=\"true\"><i><\/i><\/div>\n      <p>Программа минимум, чтобы получить хоть какие-то монеты за&nbsp;упражнение: расписать 100. Это занимает минут 30&nbsp;максимум. Скорее всего вы&nbsp;упретесь где-то на&nbsp;20-25м, где-то потом на&nbsp;70м. Но&nbsp;100&nbsp;вы&nbsp;напишете.<\/p>\n    <\/div>\n    <div class=\"tier t2\">\n      <div class=\"tier-h\"><span class=\"tier-n\">300<\/span><span class=\"tier-l\">Система · средняя<\/span><\/div>\n      <div class=\"tier-bar\" aria-hidden=\"true\"><i><\/i><\/div>\n      <p>Версия средняя это 300&nbsp;желаний. Потому что после сотни вам придется поменять подход и&nbsp;найти новый способ писать желания, чтобы наполнить список из&nbsp;300&nbsp;вещей.<\/p>\n    <\/div>\n    <div class=\"tier t3\">\n      <div class=\"tier-h\"><span class=\"tier-n\">1000<\/span><span class=\"tier-l\">Вызов Фримана · идеал<\/span><\/div>\n      <div class=\"tier-bar\" aria-hidden=\"true\"><i><\/i><\/div>\n      <p>Но&nbsp;вот 1000&nbsp;желаний&nbsp;— то, что на&nbsp;задание выделяют 24&nbsp;часа на&nbsp;выполнение, потому что более, чем достаточно, чтобы написать 1000. Но&nbsp;когда люди у&nbsp;меня проходили живой тренинг, мастер-класс прямо в&nbsp;зале, 1000&nbsp;желаний мы&nbsp;писали за&nbsp;2&nbsp;часа с&nbsp;нуля. И&nbsp;все их&nbsp;пишут.<\/p>\n      <p class=\"tier-win\">Поэтому 1000&nbsp;желаний это идеальная версия.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Как дойти до&nbsp;тысячи<\/span>\n  <h2 class=\"h2\"><span class=\"upd\">Смотрите по&nbsp;сторонам<\/span><\/h2>\n  <p>Но&nbsp;для того, чтобы написать 1000&nbsp;желаний, вам впервые придется свой мозг расширить и&nbsp;начать смотреть по&nbsp;сторонам, чтобы видеть на&nbsp;самом деле как много прекрасных и&nbsp;интересных вещей есть. Потому что 1000&nbsp;желаний вы&nbsp;не&nbsp;наполните в&nbsp;виде сумки Эрме или Биркин.<\/p>\n  <p>Вы&nbsp;не&nbsp;сможете наполнить тысячу желаний, расписав три автомобиля и&nbsp;пять квартир.<\/p>\n  <p>Для того, чтобы составить тысячу желаний, вам придется даже посмотреть вокруг себя, что происходит.<\/p>\n\n  <ul class=\"card range\">\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z\"/><\/svg><span>От&nbsp;холодильника до&nbsp;пояса, от&nbsp;носков до&nbsp;фирменных трусов.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"6\"/><polyline points=\"12 10 12 12 13 13\"/><path d=\"m16.13 7.66-.81-4.05a2 2 0 0 0-2-1.61h-2.68a2 2 0 0 0-2 1.61l-.78 4.05\"/><path d=\"m7.88 16.36.8 4a2 2 0 0 0 2 1.61h2.72a2 2 0 0 0 2-1.61l.81-4.05\"/><\/svg><span>От&nbsp;набора посуды до&nbsp;ремешка для часов.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m8 3 4 8 5-5 5 15H2L8 3z\"/><\/svg><span>От&nbsp;путешествия в&nbsp;Сидней до&nbsp;подъема на&nbsp;Килиманджаро.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2\"/><path d=\"M12 20v2\"/><path d=\"m4.93 4.93 1.41 1.41\"/><path d=\"m17.66 17.66 1.41 1.41\"/><path d=\"M2 12h2\"/><path d=\"M20 12h2\"/><path d=\"m6.34 17.66-1.41 1.41\"/><path d=\"m19.07 4.93-1.41 1.41\"/><\/svg><span>От&nbsp;поиска и&nbsp;путешествия по&nbsp;саванне и&nbsp;наблюдения за&nbsp;животными до&nbsp;желания покормить жирафа, погладить пингвина, да, понырять во&nbsp;льдах Аляски.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z\"/><path d=\"M18 12v.5\"/><path d=\"M16 17.93a9.77 9.77 0 0 1 0-11.86\"/><path d=\"M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33\"/><path d=\"M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4\"/><path d=\"m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H8c1.17-1.24 2.2-2.88 2.46-4.26\"/><\/svg><span>А, возможно, порыбачить на&nbsp;Северном полюсе.<\/span><\/li>\n  <\/ul>\n\n  <p>То&nbsp;есть вам придется расширить огромное количество своего восприятия реальности, чтобы увидеть, как много удивительных и&nbsp;интересных событий, вещей, приключений есть на&nbsp;этой планете.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Суть задания<\/span>\n  <h2 class=\"h2\"><span class=\"upd\">Не&nbsp;достичь, а&nbsp;разрешить<\/span><\/h2>\n  <p>И&nbsp;важно, чтобы вы&nbsp;понимали, когда вы&nbsp;будете писать свою первую сотню, триста или тысячу желаний, не&nbsp;цель их&nbsp;все достичь. Не&nbsp;нужно их&nbsp;расписывать с&nbsp;точки зрения того, что всю тысячу вы&nbsp;приобретете.<\/p>\n\n  <div class=\"card thesis\">\n    <p class=\"thesis-t\">Нет, самое главное в&nbsp;сути этого задания в&nbsp;том, чтобы разрешить себе хотеть все.<\/p>\n    <p>А&nbsp;в&nbsp;конечном счете, по&nbsp;пути своей жизни, все равно из&nbsp;этих тысяч выберете 100&nbsp;или 200, которые будут наиболее важными вам по&nbsp;пути.<\/p>\n  <\/div>\n\n  <p>Но&nbsp;для того, чтобы найти эти самые 200, вам придется исписать целый ватман.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <div class=\"card task\">\n    <span class=\"kick\">Задание урока<\/span>\n    <p>Поэтому задание такое.<\/p>\n    <p>Советую вам пойти в&nbsp;канцтовары, взять <b>большой ватман,<\/b> желательно цветной: <span class=\"cw b\">синий,<\/span> <span class=\"cw o\">оранжевый,<\/span> <span class=\"cw r\">красный,<\/span> <span class=\"cw y\">желтого<\/span> цвета, чтобы это был не&nbsp;просто белый, потому что он&nbsp;будет у&nbsp;вас храниться.<\/p>\n    <div class=\"sheets\" aria-hidden=\"true\"><span class=\"sheet b\"><i><\/i><i class=\"x\"><\/i><i><\/i><i class=\"x\"><\/i><i><\/i><\/span><span class=\"sheet o\"><i><\/i><i class=\"x\"><\/i><i><\/i><i class=\"x\"><\/i><i><\/i><\/span><span class=\"sheet r\"><i><\/i><i class=\"x\"><\/i><i><\/i><i class=\"x\"><\/i><i><\/i><\/span><span class=\"sheet y\"><i><\/i><i class=\"x\"><\/i><i><\/i><i class=\"x\"><\/i><i><\/i><\/span><\/div>\n    <p>И&nbsp;потом, через 10&nbsp;лет, вы&nbsp;на&nbsp;этом ватмане будете вычеркивать, что вам удалось реализовать.<\/p>\n    <p>Так что приступайте к&nbsp;выполнению задания.<\/p>\n    <p class=\"task-go\">И&nbsp;пусть оно изменит вашу жизнь.<\/p>\n  <\/div>\n\n  <div class=\"card how\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><\/svg><span class=\"upd\">Как засчитывается<\/span><\/div>\n    <ol class=\"how-l\">\n      <li><span class=\"how-n\">1<\/span><span class=\"upd\">Перенесите желания с&nbsp;ватмана в&nbsp;«Трекер Фримана», вкладка <b>«1000&nbsp;целей»<\/b>.<\/span><\/li>\n      <li><span class=\"how-n\">2<\/span><span class=\"upd\">Внизу урока&nbsp;— счётчик желаний. Он&nbsp;обновляется сам.<\/span><\/li>\n      <li><span class=\"how-n\">3<\/span><span class=\"upd\">Набрали 100, 300&nbsp;или 1000&nbsp;— нажмите <b>«Подтвердить выполнение»<\/b> у&nbsp;своего уровня.<\/span><\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n";
const d = new DOMParser().parseFromString(raw, 'text/html');
d.querySelectorAll('script, iframe, object, embed, link, meta, base').forEach(e => e.remove());
d.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => { if (a.name.startsWith('on')) el.removeAttribute(a.name); }));
let css = [...d.querySelectorAll('style')].map(s => s.textContent).join('\n');
d.querySelectorAll('style').forEach(s => s.remove());
css = css.replace(/@import\s+url\([^)]*\)\s*;?/g, '').replace(/:root\b/g, ':host')
  .replace(/(^|[{},\s])html(?=\s*[,{])/g, '$1:host').replace(/(^|[{},\s])body(?=\s*[,{.:[])/g, '$1.pp-shadow-body');
const host = document.getElementById('part'); const root = host.attachShadow({ mode: 'open' });
root.innerHTML = `<style>:host{display:block}${css}</style><div class="pp-shadow-body">${d.body.innerHTML}</div>`;
</script>
</body></html>
