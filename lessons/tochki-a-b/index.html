height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Точки А и Б»: дополнения к lesson.css урока «Правила курса». */\n.lead + p { margin-top: 8px; }\n.after { margin-top: 16px; }\n\n/* ——— тропа А → Б ——— */\n.trail { display: grid; grid-template-columns: 1fr 76px 1fr; align-items: start; gap: 6px; padding: 22px 16px 20px; margin-top: 20px;\n  background: radial-gradient(120% 140% at 50% 0%, #172238 0%, var(--card) 70%); border-color: var(--blue-line); }\n.trail-pt { text-align: center; }\n.trail-dot { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px;\n  font-size: 22px; font-weight: 700; }\n.trail-pt.a .trail-dot { color: var(--blue); background: var(--blue-bg); border: 2px solid var(--blue-line); }\n.trail-pt.b .trail-dot { color: #1A1406; background: var(--gold); box-shadow: 0 0 0 6px rgba(234,184,32,.12), 0 8px 24px rgba(204,168,48,.25);\n  animation: trail-glow .5s ease-out .9s both; }\n.trail-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.2; }\n.trail-pt.b .trail-name { color: #F0D080; }\n.trail-txt { font-size: 13px; line-height: 1.35; color: var(--t2); margin-top: 4px !important; text-wrap: balance; }\n.trail-way { position: relative; padding-top: 8px; }\n.trail-way svg { display: block; width: 100%; height: 36px; overflow: visible; }\n.trail-way path { fill: none; stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }\n.trail-base { stroke: rgba(255,25 r 28px 1fr; align-items: center; gap: 8px; }\n.conv-src { display: grid; gap: 8px; }\n.conv-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px;\n  background: rgba(255,255,255,.04); border: 1px solid var(--line2); font-size: 14px; color: var(--t1); }\n.conv-row b { color: var(--blue); font-size: 16px; }\n.conv-arrow { color: var(--t3); display: grid; place-items: center; }\n.conv-main { padding: 14px 12px; border-radius: 14px; text-align: center; border: 1px solid rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.conv-main small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #D9B94E; margin-bottom: 4px; }\n.conv-main b { font-size: 16px; color: var(--t1); }\n.conv-txt { font-size: 15px; margin-top: 14px; }\n\n/* ——— калькулятор точки Б (только CSS) ——— */\n.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; opacity: 0; }\n.calc { position: relative; margin-top: 20px; padding: 22px 18px;\n  background: linear-gradient(180deg, #1E2230 0%, var(--card) 100%); border-color: rgba(234,184,32,.28); }\n.calc-h { font-size: 20px; font-weight: 700; color: var(--t1); line-height: 1.2; }\n.calc-sub { font-size: 15px; color: var(--t3); margin: 4px 0 14px !important; }\n.calc-tabs { display: grid; gap: 8px; }\n.calc-tabs label { position: relative; display: block; min-height: 52px; padding: 10px 14px 10px 44px; border-radius: 14px; cursor: pointer;\n  background: rgba(255,255,255,.04); border: 1px solid var(--line2); color: var(--t1); font-size: 16px; font-weight: 700; line-height: 1.25;\n  transition: border-color .2s, background-color .2s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }\n.calc-tabs label small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 2px; }\n.calc-tabs label::before { content: \"\"; position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%;\n  border: 2px solid rgba(255,255,255,.28); transition: border-color .2s, box-shadow .2s; }\n.calc-tabs label:hover { border-color: rgba(234,184,32,.4); }\n.calc-tabs label:active { background: rgba(255,255,255,.07); }\n#pa1:checked ~ .calc-tabs label[for=\"pa1\"],\n#pa2:checked ~ .calc-tabs label[for=\"pa2\"],\n#pa3:checked ~ .calc-tabs label[for=\"pa3\"] { border-color: rgba(234,184,32,.6); background: rgba(234,184,32,.09); }\n#pa1:checked ~ .calc-tabs label[for=\"pa1\"]::before,\n#pa2:checked ~ .calc-tabs label[for=\"pa2\"]::before,\n#pa3:checked ~ .calc-tabs label[for=\"pa3\"]::before { border-color: #EAB820; box-shadow: inset 0 0 0 4px #1E2230, inset 0 0 0 9px #EAB820; }\n#pa1:focus-visible ~ .calc-tabs label[for=\"pa1\"],\n#pa2:focus-visible ~ .calc-tabs label[for=\"pa2\"],\n#pa3:focus-visible ~ .calc-tabs label[for=\"pa3\"] { outline: 2px solid var(--blue); outline-offset: 2px; }\n\n.calc-res { margin-top: 12px; border-radius: 16px; background: rgba(0,0,0,.22); border: 1px solid var(--line); padding: 18px 16px; text-align: center; }\n.calc-r { display: none; }\n#pa1:checked ~ .calc-res .r1, #pa2:checked ~ .calc-res .r2, #pa3:checked ~ .calc-res .r3 { display: block; animation: calc-in .22s ease-out; }\n.calc-lbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #D9B94E; }\n.calc-num { font-size: 40px !important; font-weight: 700; line-height: 1.05; letter-spacing: -.03em; margin: 6px 0 8px !important; font-variant-numeric: tabular-nums;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.calc-ex { font-size: 15px; color: var(--t2); margin-top: 0 !important; }\n.calc-foot { font-size: 13px; color: var(--t3); margin-top: 12px !important; }\n@keyframes calc-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n\n@media (min-width: 560px) {\n  .calc-tabs { grid-template-columns: repeat(3, 1fr); }\n  .trail { grid-template-columns: 1fr 160px 1fr; padding: 28px 24px 24px; }\n  .trail-txt { font-size: 14px; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .trail-line { stroke-dashoffset: 0; animation: none; }\n  .trail-pt.b .trail-dot, .calc-r { animation: none !important; }\n}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <p class=\"lead\">Добро пожаловать в&nbsp;урок точка&nbsp;А&nbsp;и&nbsp;точка&nbsp;Б!<\/p>\n  <p>В&nbsp;этом уроке мы&nbsp;с&nbsp;вами определяемся с&nbsp;точкой&nbsp;А&nbsp;и&nbsp;точкой&nbsp;Б.<\/p>\n\n  <div class=\"card trail\" aria-label=\"Путь от точки&nbsp;А к точке Б за 30 дней\">\n    <div class=\"trail-pt a\">\n      <span class=\"trail-dot\">А<\/span>\n      <p class=\"trail-name\">Точка&nbsp;А<\/p>\n      <p class=\"trail-txt\">то, с&nbsp;чем вы&nbsp;пришли на&nbsp;этот тренинг<\/p>\n    <\/div>\n    <div class=\"trail-way\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 200 40\" preserveAspectRatio=\"none\"><path class=\"trail-base\" d=\"M2 30 C 60 30, 70 8, 110 14 S 170 30, 198 10\"/><path class=\"trail-line\" pathLength=\"1\" d=\"M2 30 C 60 30, 70 8, 110 14 S 170 30, 198 10\"/><\/svg>\n      <span class=\"trail-days\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg> 30&nbsp;дней<\/span>\n    <\/div>\n    <div class=\"trail-pt b\">\n      <span class=\"trail-dot\">Б<\/span>\n      <p class=\"trail-name\">Точка&nbsp;Б<\/p>\n      <p class=\"trail-txt\">сумма, которую необходимо заработать за&nbsp;30&nbsp;дней<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Шаг 1<\/span>\n  <h2 class=\"h2\">Точка&nbsp;А<\/h2>\n  <p><b>Точка&nbsp;А&nbsp;–<\/b> это то, с&nbsp;чем вы&nbsp;пришли на&nbsp;этот тренинг. Именно в&nbsp;той нише, которую вы&nbsp;будете реализовывать, в&nbsp;том продукте, который вы&nbsp;будете реализовывать.<\/p>\n\n  <div class=\"pair\">\n    <div class=\"card case\">\n      <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M9.94 14.06 8.5 20l-1.44-5.94L1 12.5l6.06-1.44L8.5 5l1.44 6.06L16 12.5z\"/><path d=\"M20 3v4\"/><path d=\"M22 5h-4\"/><\/svg>Впервые в&nbsp;нише<\/div>\n      <p class=\"case-num\">0<\/p>\n      <p>Если вы&nbsp;до&nbsp;этого в&nbsp;этой нише не&nbsp;зарабатывали, то&nbsp;есть вы&nbsp;впервые открываете наставничество, впервые будете заниматься этим направлением, то&nbsp;ваш доход ноль.<\/p>\n    <\/div>\n    <div class=\"card case\">\n      <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/><\/svg>Давно в&nbsp;теме<\/div>\n      <div class=\"avg\" aria-label=\"Сумма за три месяца, делённая на три\">\n        <span class=\"avg-m\">1&nbsp;мес<\/span><span class=\"avg-op\">+<\/span><span class=\"avg-m\">2&nbsp;мес<\/span><span class=\"avg-op\">+<\/span><span class=\"avg-m\">3&nbsp;мес<\/span>\n        <span class=\"avg-div\">÷&nbsp;3<\/span>\n      <\/div>\n      <p>Если вы&nbsp;давно в&nbsp;этой теме и&nbsp;зарабатываете, то&nbsp;он&nbsp;определяется средним арифметическим за&nbsp;последние три месяца. Сколько вы&nbsp;заработали. Чтобы определить, сколько в&nbsp;среднем получается у&nbsp;вас сделать денег.<\/p>\n    <\/div>\n  <\/div>\n  <p class=\"after\">После этого вы&nbsp;выбираете здесь в&nbsp;графе Точка&nbsp;А ваш результат.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Шаг 2<\/span>\n  <h2 class=\"h2\">Валюта и&nbsp;источники дохода<\/h2>\n\n  <ol class=\"steps\">\n    <li class=\"step\">\n      <span class=\"step-n\">01<\/span>\n      <div>\n        <p class=\"step-t\">Валюта<\/p>\n        <p class=\"step-d\">Также выбираете валюту, которую вы&nbsp;будете дальше считать. У&nbsp;вас есть возможность изменить валюту для того, чтобы вам было удобно. В&nbsp;рублях, гривнах, тенге или в&nbsp;других валютах, которые есть в&nbsp;списке. Если вашей валюты нет, выберите максимально удобную вам для понимания процесса.<\/p>\n        <div class=\"chips\" aria-hidden=\"true\"><span>₽<\/span><span>₴<\/span><span>₸<\/span><span>…<\/span><\/div>\n      <\/div>\n    <\/li>\n    <li class=\"step\">\n      <span class=\"step-n\">02<\/span>\n      <div>\n        <p class=\"step-t\">Источники дохода<\/p>\n        <p class=\"step-d\">После этого можете выбрать источники дохода. В&nbsp;какой категории вы&nbsp;будете зарабатывать.<\/p>\n        <p class=\"step-d\">Это у&nbsp;вас будут: консультации, курсы... Вы&nbsp;можете создать несколько: 5, 10, 20&nbsp;источников дохода. В&nbsp;каждом источнике дохода вы&nbsp;можете выбрать свою валюту.<\/p>\n      <\/div>\n    <\/li>\n  <\/ol>\n\n  <div class=\"card conv\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M18.09 10.37A6 6 0 1 1 10.34 18\"/><path d=\"M7 6h1v4\"/><path d=\"m16.71 13.88.7.71-2.82 2.82\"/><\/svg>Пример<\/div>\n    <div class=\"conv-flow\">\n      <div class=\"conv-src\">\n        <div class=\"conv-row\"><span>Консультации<\/span><b>₽<\/b><\/div>\n        <div class=\"conv-row\"><span>Консультации<\/span><b>$<\/b><\/div>\n      <\/div>\n      <span class=\"conv-arrow\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/><\/svg><\/span>\n      <div class=\"conv-main\"><small>Основная валюта<\/small><b>одна сумма<\/b><\/div>\n    <\/div>\n    <p class=\"conv-txt\">Например, вы&nbsp;продаете консультации в&nbsp;рублях, потом делаете консультации в&nbsp;долларах. Например, если у&nbsp;вас два источника дохода. Для того, чтобы вам легко и&nbsp;удобно было считать.<\/p>\n    <div class=\"note blue\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16\"/><path d=\"M8 16H3v5\"/><\/svg><span>Но&nbsp;конвертироваться все эти доходы будут <b>автоматически в&nbsp;вашу основную валюту.<\/b><\/span><\/div>\n  <\/div>\n\n  <p class=\"chips-lbl\">Категории дохода могут быть разными<\/p>\n  <div class=\"chips wide\" aria-hidden=\"true\"><span>Консультации<\/span><span>Курсы<\/span><span>Инфокурсы<\/span><span>Наставничество<\/span><span>Трипваер<\/span><\/div>\n  <p>Соответственно, возможно, у&nbsp;вас будет инфо курсы, возможно, будет дополнительное наставничество, возможно, будет какой-то трипваер и&nbsp;в&nbsp;дальнейшем у&nbsp;продукта вы&nbsp;можете этим самым удобно вести себе источники дохода, чтобы понимать: где и&nbsp;на&nbsp;чем зарабатывать и&nbsp;какие продукты вам принесут больше всего денег. Так, для удобства подсчетов.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Шаг 3<\/span>\n  <h2 class=\"h2\">Точка&nbsp;Б<\/h2>\n  <p>Ваша <b>точка&nbsp;Б<\/b> определяется вашей точкой&nbsp;А.<\/p>\n  <p>И&nbsp;точка&nbsp;Б, которую покажет вам система, это та&nbsp;сумма, которую вам необходимо заработать за&nbsp;30&nbsp;дней для того, чтобы считаться финалистом тренинга, исходя из&nbsp;вашей точки&nbsp;А.<\/p>\n\n  <div class=\"card calc\">\n    <p class=\"calc-h\">Как система считает точку&nbsp;Б<\/p>\n    <p class=\"calc-sub\">Выберите, сколько вы&nbsp;зарабатываете сейчас<\/p>\n    <input class=\"sr\" type=\"radio\" name=\"pa\" id=\"pa1\" checked>\n    <input class=\"sr\" type=\"radio\" name=\"pa\" id=\"pa2\">\n    <input class=\"sr\" type=\"radio\" name=\"pa\" id=\"pa3\">\n    <div class=\"calc-tabs\" role=\"radiogroup\" aria-label=\"Ваша точка&nbsp;А\">\n      <label for=\"pa1\"><small>Точка&nbsp;А<\/small>до&nbsp;20&nbsp;000&nbsp;₽<\/label>\n      <label for=\"pa2\"><small>Точка&nbsp;А<\/small>20&nbsp;000&nbsp;–&nbsp;75&nbsp;000&nbsp;₽<\/label>\n      <label for=\"pa3\"><small>Точка&nbsp;А<\/small>больше 75&nbsp;000&nbsp;₽<\/label>\n    <\/div>\n    <div class=\"calc-res\">\n      <div class=\"calc-r r1\">\n        <p class=\"calc-lbl\">Точка&nbsp;Б за&nbsp;30&nbsp;дней<\/p>\n        <p class=\"calc-num\">50&nbsp;000&nbsp;₽<\/p>\n        <p class=\"calc-ex\">Например, 0&nbsp;₽ → 50&nbsp;000&nbsp;₽<\/p>\n      <\/div>\n      <div class=\"calc-r r2\">\n        <p class=\"calc-lbl\">Точка&nbsp;Б за&nbsp;30&nbsp;дней<\/p>\n        <p class=\"calc-num\">150&nbsp;000&nbsp;₽<\/p>\n        <p class=\"calc-ex\">Например, 40&nbsp;000&nbsp;₽ → 150&nbsp;000&nbsp;₽<\/p>\n      <\/div>\n      <div class=\"calc-r r3\">\n        <p class=\"calc-lbl\">Точка&nbsp;Б за&nbsp;30&nbsp;дней<\/p>\n        <p class=\"calc-num\">точка&nbsp;А&nbsp;×&nbsp;2<\/p>\n        <p class=\"calc-ex\">Например, 100&nbsp;000&nbsp;₽ → 200&nbsp;000&nbsp;₽<\/p>\n      <\/div>\n    <\/div>\n    <p class=\"calc-foot\">Если вы&nbsp;считаете в&nbsp;другой валюте, пороги пересчитываются по&nbsp;курсу.<\/p>\n  <\/div>\n\n  <p class=\"quote\">Приятного прохождения курса!<\/p>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n";
const d = new DOMParser().parseFromString(raw, 'text/html');
d.querySelectorAll('script, iframe, object, embed, link, meta, base').forEach(e => e.remove());
d.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => { if (a.name.startsWith('on')) el.removeAttribute(a.name); }));
let css = [...d.querySelectorAll('style')].map(s => s.textContent).join('\n');
d.querySelectorAll('style').forEach(s => s.remove());
css = css.replace(/@import\s+url\([^)]*\)\s*;?/g, '').replace(/:root\b/g, ':host')
  .replace(/(^|[{},\s])html(?=\s*[,{])/g, '$1:host').replace(/(^|[{},\s])body(?=\s*[,{.:[])/g, '$1.pp-shadow-body');
const host = document.getElementById('part'); const root = host.attachShadow({ mode: 'open' });
root.innerHTML = `<style>:host{display:block}${css}</style><div class="pp-shadow-body">${d.body.innerHTML}</div>`;
</script>
</body></html>
