: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Система ценностей»: дополнения к lesson.css урока «Правила курса» (база — урок «50 вещей»). */\n.lead + p { margin-top: 10px; }\n.after { margin-top: 18px; }\n.cheat .rule:first-of-type { border-top: 0; }\n.cheat-h { margin-bottom: 6px; }\n.tag-gain { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px;\n  background: rgba(234,184,32,.10); border: 1px solid rgba(234,184,32,.32); color: #F0CE5C; font-size: 13px; font-weight: 600; }\n.tag-gain svg.i { width: 14px; height: 14px; }\n\n/* ——— история ——— */\n.story { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.story .card-t { color: #FF9B9B; }\n.story .card-t svg.i { color: var(--red); }\n.story p { font-size: 16px; color: var(--t1); }\n.story + p { margin-top: 18px; }\n.quote + p { margin-top: 18px; }\n\n/* ——— реплики окружения ——— */\n.talk { display: grid; gap: 10px; margin: 16px 0 18px; }\n.bub { position: relative; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.45; color: var(--t1);\n  background: rgba(255,255,255,.06); border: 1px solid var(--line2); margin: 0 !important; }\n.talk-n { justify-self: center; margin: 0 !important; font-size: 13px; color: var(--t3); }\n.bub.l { justify-self: start; border-bottom-left-radius: 6px; }\n.bub.r { justify-self: end; border-bottom-right-radius: 6px; background: rgba(255,107,107,.08); border-color: var(--red-line); }\n\n/* ——— главная мысль ——— */\n.thesis { margin: 20px 0; padding: 22px 20px; border-color: rgba(234,184,32,.30); background: linear-gradient(180deg, #1E2230 0%, var(--card) 100%); }\n.thesis-t { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.thesis p + p { margin-top: 10px; color: var(--t2); }\n\n/* ——— тетрадка ——— */\n.note-book { margin: 18px 0; padding: 20px 18px 10px; }\n.nb { list-style: none; display: grid; }\n.nb li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.nb li:first-child { border-top: 0; padding-top: 4px; }\n.nb small { display: block; margin-top: 6px; font-size: 14px; color: var(--t3); }\n.nb-n { margin-top: -3px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n\n/* ——— задание ——— */\n.task { border-color: rgba(234,184,32,.45); background: radial-gradient(120% 120% at 50% 0%, #2A2412 0%, var(--card) 70%); padding: 24px 20px; }\n.task .kick { color: #D9B94E; }\n.task p { font-size: 17px; color: var(--t1); }\n.task-go { display: flex; align-items: center; gap: 10px; margin-top: 16px !important; font-size: 24px !important; font-weight: 700;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.task-down { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #2A2008;\n  -webkit-text-fill-color: #2A2008; animation: task-bob 1.6s ease-in-out infinite; }\n.task-down svg.i { width: 18px; height: 18px; }\n@keyframes task-bob { 50% { transform: translateY(3px); } }\n@media (prefers-reduced-motion: reduce) { .task-down { animation: none; } }\n\n/* ——— воронка 16 → 1 ——— */\n.fun { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 4px 0 20px; }\n.fun span { position: relative; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 16px; font-weight: 700;\n  font-variant-numeric: tabular-nums; background: rgba(255,255,255,.04); border: 1px solid var(--line2); color: var(--t3); }\n.fun span.done { background: var(--green-bg); border-color: var(--green-line); color: var(--green); }\n.fun span.on { background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.6); color: #F0CE5C; box-shadow: 0 0 0 3px rgba(234,184,32,.10); }\n.fun span:not(:last-child)::after { content: \"\"; position: absolute; right: -6px; top: 50%; width: 6px; height: 1px; background: var(--line2); }\n.fun-cap { grid-column: 1 / -1; font-size: 13px; color: var(--t3); margin-top: 2px; }\n\n.label { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); }\n.cheat-sub { margin-bottom: 4px; }\n.cheat .rule-txt { font-size: 15px; margin-top: 0; }\n.task .list { margin: 10px 0 14px; }\n.task .note { margin: 14px 0; }\n.card .note.green { margin-top: 14px; }\n.final { text-align: center; }\n.final .task-go { justify-content: center; }\n.final-t { font-size: 26px !important; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; margin: 6px 0 4px !important;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.label.gold { color: #D9B94E; margin-bottom: 8px; }\n.list + p { margin-top: 12px; }\n.card + .h3, .talk + .h3 { margin-top: 28px; }\n.task-go { display: block !important; }\n.task-down { display: inline-grid !important; vertical-align: -8px; margin-left: 8px; }\n\n/* ——— ритм отступов (одна сетка для всех частей): текст 12, блоки 20, подзаголовок 32/10 ——— */\n.sec > * { margin-bottom: 0 !important; }\n.sec > * + * { margin-top: 12px !important; }\n.sec > .kick { margin-bottom: 10px !important; }\n.sec > .kick + * { margin-top: 0 !important; }\n.sec > .h2 { margin-bottom: 0 !important; }\n.sec > .h2 + * { margin-top: 14px !important; }\n.sec > * + :is(.card, .talk, .quote, .note), .sec > :is(.card, .talk, .quote, .note) + * { margin-top: 20px !important; }\n.sec > * + .h3 { margin-top: 32px !important; }\n.sec > .h2 + .h3 { margin-top: 16px !important; }\n.sec > .h3 + * { margin-top: 10px !important; }\n.card > :first-child { margin-top: 0 !important; }\n.cheat { padding-bottom: 8px; }\n.cheat-sub { margin-bottom: 10px !important; }\n.task { padding: 22px 20px; }\n.task-go { line-height: 1.25 !important; text-wrap: balance; }\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <h2 class=\"h2\"><span class=\"upd\">Часть 3&nbsp;из&nbsp;6<\/span><\/h2>\n  <p>Обычно&nbsp;— ничего сложного составить ТОП&nbsp;10. Так как многие из&nbsp;тех шести вы&nbsp;ставили для галочки. Разве нет?<\/p>\n  <p>Работает логика, социальные шаблоны, рациональный ум. Многие здесь чувствуют уверенность:<\/p>\n  <p class=\"quote\">«Да, я&nbsp;точно понимаю, что для меня это менее важно».<\/p>\n  <p>Это нормально.<\/p>\n  <p>Теперь мы&nbsp;переходим к&nbsp;важной части. Вычеркнуть еще&nbsp;3. Ведь нас никогда не&nbsp;интересовали 10&nbsp;ценностей. На&nbsp;самом деле у&nbsp;людей в&nbsp;среднем <b class=\"am\">ТОП&nbsp;7 ключевых.<\/b> Пора&nbsp;бы их&nbsp;узнать. Вычёркивать это не&nbsp;добавлять. Вы&nbsp;сейчас почувствуете…<\/p>\n\n  <div class=\"card task\">\n    <p class=\"task-go\">Вычеркните ещё&nbsp;3. Оставьте&nbsp;7. <span class=\"task-down\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span><\/p>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n", "4": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Система ценностей · часть 4<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n  font-size: 17px; line-height: 1.55; letter-spacing: -.011em;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n  text-wrap: pretty;\n}\n.page { max-width: 720px; margin: 0 auto; padding: 8px 16px 24px; }\n\nb, strong { color: var(--t1); font-weight: 700; }\n.am { color: var(--amber); font-weight: 700; }\np + p { margin-top: 12px; }\nsvg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ——— заголовки секций ——— */\n.sec { padding-top: 40px; }\n.sec:first-child { padding-top: 8px; }\n.kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }\n.h2 {\n  font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 14px; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.h3 { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); margin: 24px 0 10px; text-wrap: balance; }\n.lead { font-size: 18px; color: var(--t2); }\n\n/* ——— карточки ——— */\n.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; margin-top: 16px; }\n.card-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.card-t svg.i { width: 18px; height: 18px; color: var(--blue); }\n\n/* ——— шпаргалка ——— */\n.cheat { background: linear-gradient(180deg, #172238 0%, var(--card) 100%); border-color: var(--blue-line); padding: 22px 20px 8px; }\n.cheat-h { font-size: 22px; font-weight: 700; color: var(--t1); line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }\n.cheat-sub { font-size: 15px; color: var(--t3); margin-bottom: 14px; }\n.rule { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }\n.rule-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-bg); color: var(--blue); }\n.rule-ic.red { background: var(--red-bg); color: var(--red); }\n.rule-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.3; }\n.rule-txt { font-size: 15px; line-height: 1.45; color: var(--t2); margin-top: 3px; }\n.tag-loss { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px; background: var(--red-bg); border: 1px solid var(--red-line); color: #FF9B9B; font-size: 13px; font-weight: 600; }\n.tag-loss svg.i { width: 14px; height: 14px; fill: currentColor; stroke: none; }\n\n/* ——— сердечки ——— */\n.hearts { display: flex; gap: 8px; color: var(--red); flex: none; }\n.hearts svg { width: 28px; height: 28px; fill: var(--red); }\n.hearts.sm svg { width: 18px; height: 18px; }\n.hearts .off { fill: rgba(255,255,255,.14); }\n\n/* ——— цель 30 дней ——— */\n.goal { text-align: center; padding: 24px 20px; }\n.goal-days { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }\n.goal-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.goal-or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\n.goal-opt { background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.25; }\n.goal-sep { font-size: 13px; color: var(--t3); font-weight: 600; }\n\n/* ——— списки ——— */\n.list { list-style: none; display: grid; gap: 10px; margin-top: 12px; }\n.list li { position: relative; padding-left: 22px; }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; color: var(--t2); margin-top: 4px; }\n.step-d.ok { color: var(--green); font-weight: 600; }\n\n/* ——— неделя: 3 плашки ——— */\n.week { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }\n.week div { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.3; color: var(--t2); }\n.week div b { width: 20px; text-align: center; font-size: 22px; color: var(--t1); flex: none; }\n.week div:first-child { border-color: rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.week div:first-child b { color: var(--amber); }\n\n/* ——— 80/20 ——— */\n.split-bar { display: grid; grid-template-columns: 20fr 80fr; height: 40px; border-radius: 12px; overflow: hidden; margin: 16px 0 14px; font-size: 14px; font-weight: 700; }\n.split-bar span { display: flex; align-items: center; padding: 0 12px; }\n.split-bar span:first-child { background: var(--gold); color: #1A1406; justify-content: center; padding: 0; }\n.split-bar span:last-child { background: rgba(255,255,255,.07); color: var(--t3); }\n.split { display: grid; gap: 12px; }\n.split .card { margin-top: 0; }\n.split .must { border-color: rgba(234,184,32,.4); }\n.split .must .card-t { color: var(--amber); }\n.split .must .card-t svg.i { color: var(--amber); }\n\n/* ——— таймлайн недели задания ——— */\n.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 14px 0 8px; }\n.day { text-align: center; }\n.day-bar { height: 10px; border-radius: 5px; background: rgba(107,159,255,.28); }\n.day.open .day-bar { background: var(--blue); }\n.day.dl .day-bar { background: var(--red); }\n.day-n { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--t2); }\n.day-s { font-size: 11px; line-height: 1.25; color: var(--t3); margin-top: 2px; }\n.day.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Система ценностей»: дополнения к lesson.css урока «Правила курса» (база — урок «50 вещей»). */\n.lead + p { margin-top: 10px; }\n.after { margin-top: 18px; }\n.cheat .rule:first-of-type { border-top: 0; }\n.cheat-h { margin-bottom: 6px; }\n.tag-gain { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px;\n  background: rgba(234,184,32,.10); border: 1px solid rgba(234,184,32,.32); color: #F0CE5C; font-size: 13px; font-weight: 600; }\n.tag-gain svg.i { width: 14px; height: 14px; }\n\n/* ——— история ——— */\n.story { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.story .card-t { color: #FF9B9B; }\n.story .card-t svg.i { color: var(--red); }\n.story p { font-size: 16px; color: var(--t1); }\n.story + p { margin-top: 18px; }\n.quote + p { margin-top: 18px; }\n\n/* ——— реплики окружения ——— */\n.talk { display: grid; gap: 10px; margin: 16px 0 18px; }\n.bub { position: relative; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.45; color: var(--t1);\n  background: rgba(255,255,255,.06); border: 1px solid var(--line2); margin: 0 !important; }\n.talk-n { justify-self: center; margin: 0 !important; font-size: 13px; color: var(--t3); }\n.bub.l { justify-self: start; border-bottom-left-radius: 6px; }\n.bub.r { justify-self: end; border-bottom-right-radius: 6px; background: rgba(255,107,107,.08); border-color: var(--red-line); }\n\n/* ——— главная мысль ——— */\n.thesis { margin: 20px 0; padding: 22px 20px; border-color: rgba(234,184,32,.30); background: linear-gradient(180deg, #1E2230 0%, var(--card) 100%); }\n.thesis-t { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.thesis p + p { margin-top: 10px; color: var(--t2); }\n\n/* ——— тетрадка ——— */\n.note-book { margin: 18px 0; padding: 20px 18px 10px; }\n.nb { list-style: none; display: grid; }\n.nb li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.nb li:first-child { border-top: 0; padding-top: 4px; }\n.nb small { display: block; margin-top: 6px; font-size: 14px; color: var(--t3); }\n.nb-n { margin-top: -3px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n\n/* ——— задание ——— */\n.task { border-color: rgba(234,184,32,.45); background: radial-gradient(120% 120% at 50% 0%, #2A2412 0%, var(--card) 70%); padding: 24px 20px; }\n.task .kick { color: #D9B94E; }\n.task p { font-size: 17px; color: var(--t1); }\n.task-go { display: flex; align-items: center; gap: 10px; margin-top: 16px !important; font-size: 24px !important; font-weight: 700;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.task-down { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #2A2008;\n  -webkit-text-fill-color: #2A2008; animation: task-bob 1.6s ease-in-out infinite; }\n.task-down svg.i { width: 18px; height: 18px; }\n@keyframes task-bob { 50% { transform: translateY(3px); } }\n@media (prefers-reduced-motion: reduce) { .task-down { animation: none; } }\n\n/* ——— воронка 16 → 1 ——— */\n.fun { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 4px 0 20px; }\n.fun span { position: relative; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 16px; font-weight: 700;\n  font-variant-numeric: tabular-nums; background: rgba(255,255,255,.04); border: 1px solid var(--line2); color: var(--t3); }\n.fun span.done { background: var(--green-bg); border-color: var(--green-line); color: var(--green); }\n.fun span.on { background: rgba(234,184,32,.12); border-color: rgba(234,184,32,.6); color: #F0CE5C; box-shadow: 0 0 0 3px rgba(234,184,32,.10); }\n.fun span:not(:last-child)::after { content: \"\"; position: absolute; right: -6px; top: 50%; width: 6px; height: 1px; background: var(--line2); }\n.fun-cap { grid-column: 1 / -1; font-size: 13px; color: var(--t3); margin-top: 2px; }\n\n.label { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); }\n.cheat-sub { margin-bottom: 4px; }\n.cheat .rule-txt { font-size: 15px; margin-top: 0; }\n.task .list { margin: 10px 0 14px; }\n.task .note { margin: 14px 0; }\n.card .note.green { margin-top: 14px; }\n.final { text-align: center; }\n.final .task-go { justify-content: center; }\n.final-t { font-size: 26px !important; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; margin: 6px 0 4px !important;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.label.gold { color: #D9B94E; margin-bottom: 8px; }\n.list + p { margin-top: 12px; }\n.card + .h3, .talk + .h3 { margin-top: 28px; }\n.task-go { display: block !important; }\n.task-down { display: inline-grid !important; vertical-align: -8px; margin-left: 8px; }\n\n/* ——— ритм отступов (одна сетка для всех частей): текст 12, блоки 20, подзаголовок 32/10 ——— */\n.sec > * { margin-bottom: 0 !important; }\n.sec > * + * { margin-top: 12px !important; }\n.sec > .kick { margin-bottom: 10px !important; }\n.sec > .kick + * { margin-top: 0 !important; }\n.sec > .h2 { margin-bottom: 0 !important; }\n.sec > .h2 + * { margin-top: 14px !important; }\n.sec > * + :is(.card, .talk, .quote, .note), .sec > :is(.card, .talk, .quote, .note) + * { margin-top: 20px !important; }\n.sec > * + .h3 { margin-top: 32px !important; }\n.sec > .h2 + .h3 { margin-top: 16px !important; }\n.sec > .h3 + * { margin-top: 10px !important; }\n.card > :first-child { margin-top: 0 !important; }\n.cheat { padding-bottom: 8px; }\n.cheat-sub { margin-bottom: 10px !important; }\n.task { padding: 22px 20px; }\n.task-go { line-height: 1.25 !important; text-wrap: balance; }\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <h2 class=\"h2\"><span class=\"upd\">Часть 4&nbsp;из&nbsp;6<\/span><\/h2>\n  <h3 class=\"h3\">Что начинает происходить?<\/h3>\n  <p>Здесь впервые появляется дискомфорт.<\/p>\n  <p>Мозг начинает задавать вопросы:<\/p>\n  <div class=\"talk\">\n    <p class=\"bub l\">«А&nbsp;если это тоже важно?»<\/p>\n    <p class=\"bub l\">«А&nbsp;вдруг я&nbsp;ошибаюсь?»<\/p>\n    <p class=\"bub l\">«А&nbsp;можно оставить чуть больше?»<\/p>\n  <\/div>\n  <div class=\"note red\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg><span>Важно: желание «сохранить всё»&nbsp;— <b>первый сигнал отсутствия реальных приоритетов.<\/b><\/span><\/div>\n  <p class=\"after\">Но&nbsp;у&nbsp;меня для вас хорошая новость… Нужно на&nbsp;самом деле оставить 5&nbsp;ценностей. Как ваши 5&nbsp;чувств. Вычеркните ещё&nbsp;2.<\/p>\n\n  <div class=\"card story\">\n    <p class=\"rule-name\">Здесь начинается настоящий конфликт.<\/p>\n    <p>Потому что:<\/p>\n    <ul class=\"list red\">\n      <li>вы&nbsp;начинаете убирать не&nbsp;«лишнее»<\/li>\n      <li>а&nbsp;то, что действительно имеет цену<\/li>\n    <\/ul>\n    <p>На&nbsp;этом этапе часто возникают эмоции: раздражение, сомнение, злость, апатия.<\/p>\n    <p>Это момент столкновения ценностей между собой.<\/p>\n  <\/div>\n\n  <div class=\"card task\">\n    <p class=\"task-go\">Вперёд.. Что за&nbsp;5&nbsp;ценностей вам важны? <span class=\"task-down\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span><\/p>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n", "5": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Система ценностей · часть 5<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n  font-size: 17px; line-height: 1.55; letter-spacing: -.011em;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n  text-wrap: pretty;\n}\n.page { max-width: 720px; margin: 0 auto; padding: 8px 16px 24px; }\n\nb, strong { color: var(--t1); font-weight: 700; }\n.am { color: var(--amber); font-weight: 700; }\np + p { margin-top: 12px; }\nsvg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ——— заголовки секций ——— */\n.sec { padding-top: 40px; }\n.sec:first-child { padding-top: 8px; }\n.kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }\n.h2 {\n  font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 14px; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.h3 { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); margin: 24px 0 10px; text-wrap: balance; }\n.lead { font-size: 18px; color: var(--t2); }\n\n/* ——— карточки ——— */\n.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; margin-top: 16px; }\n.card-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.card-t svg.i { width: 18px; height: 18px; color: var(--blue); }\n\n/* ——— шпаргалка ——— */\n.cheat { background: linear-gradient(180deg, #172238 0%, var(--card) 100%); border-color: var(--blue-line); padding: 22px 20px 8px; }\n.cheat-h { font-size: 22px; font-weight: 700; color: var(--t1); line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }\n.cheat-sub { font-size: 15px; color: var(--t3); margin-bottom: 14px; }\n.rule { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }\n.rule-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-bg); color: var(--blue); }\n.rule-ic.red { background: var(--red-bg); color: var(--red); }\n.rule-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.3; }\n.rule-txt { font-size: 15px; line-height: 1.45; color: var(--t2); margin-top: 3px; }\n.tag-loss { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px; background: var(--red-bg); border: 1px solid var(--red-line); color: #FF9B9B; font-size: 13px; font-weight: 600; }\n.tag-loss svg.i { width: 14px; height: 14px; fill: currentColor; stroke: none; }\n\n/* ——— сердечки ——— */\n.hearts { display: flex; gap: 8px; color: var(--red); flex: none; }\n.hearts svg { width: 28px; height: 28px; fill: var(--red); }\n.hearts.sm svg { width: 18px; height: 18px; }\n.hearts .off { fill: rgba(255,255,255,.14); }\n\n/* ——— цель 30 дней ——— */\n.goal { text-align: center; padding: 24px 20px; }\n.goal-days { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }\n.goal-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.goal-or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\n.goal-opt { background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.25; }\n.goal-sep { font-size: 13px; color: var(--t3); font-weight: 600; }\n\n/* ——— списки ——— */\n.list { list-style: none; display: grid; gap: 10px; margin-top: 12px; }\n.list li { position: relative; padding-left: 22px; }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; color: var(--t2); margin-top: 4px; }\n.step-d.ok { color: var(--green); font-weight: 600; }\n\n/* ——— неделя: 3 плашки ——— */\n.week { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }\n.week div { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.3; color: var(--t2); }\n.week div b { width: 20px; text-align: center; font-size: 22px; color: var(--t1); flex: none; }\n.week div:first-child { border-color: rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.week div:first-child b { color: var(--amber); }\n\n/* ——— 80/20 ——— */\n.split-bar { display: grid; grid-template-columns: 20fr 80fr; height: 40px; border-radius: 12px; overflow: hidden; margin: 16px 0 14px; font-size: 14px; font-weight: 700; }\n.split-bar span { display: flex; align-items: center; padding: 0 12px; }\n.split-bar span:first-child { background: var(--gold); color: #1A1406; justify-content: center; padding: 0; }\n.split-bar span:last-child { background: rgba(255,255,255,.07); color: var(--t3); }\n.split { display: grid; gap: 12px; }\n.split .card { margin-top: 0; }\n.split .must { border-color: rgba(234,184,32,.4); }\n.split .must .card-t { color: var(--amber); }\n.split .must .card-t svg.i { color: var(--amber); }\n\n/* ——— таймлайн недели задания ——— */\n.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 14px 0 8px; }\n.day { text-align: center; }\n.day-bar { height: 10px; border-radius: 5px; background: rgba(107,159,255,.28); }\n.day.open .day-bar { background: var(--blue); }\n.day.dl .day-bar { background: var(--red); }\n.day-n { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--t2); }\n.day-s { font-size: 11px; line-height: 1.25; color: var(--t3); margin-top: 2px; }\n.day.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «Система ценностей»: дополнения к lesson.css урока «Правила курса» (база — урок «50 вещей»). */\n.lead + p { margin-top: 10px; }\n.after { margin-top: 18px; }\n.cheat .rule:first-of-type { border-top: 0; }\n.cheat-h { margin-bottom: 6px; }\n.tag-gain { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px;\n  background: rgba(234,184,32,.10); border: 1px solid rgba(234,184,32,.32); color: #F0CE5C; font-size: 13px; font-weight: 600; }\n.tag-gain svg.i { width: 14px; height: 14px; }\n\n/* ——— история ——— */\n.story { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.story .card-t { color: #FF9B9B; }\n.story .card-t svg.i { color: var(--red); }\n.story p { font-size: 16px; color: var(--t1); }\n.story + p { margin-top: 18px; }\n.quote + p { margin-top: 18px; }\n\n/* ——— реплики окружения ——— */\n.talk { display: grid; gap: 10px; margin: 16px 0 18px; }\n.bub { position: relative; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.45; color: var(--t1);\n  background: rgba(255,255,255,.06); border: 1px solid var(--line2); margin: 0 !important; }\n.talk-n { justify-self: center; margin: 0 !important; font-size: 13px; color: var(--t3); }\n.bub.l { justify-self: start; border-bottom-left-radius: 6px; }\n.bub.r { justify-self: end; border-bottom-right-radius: 6px; background: rgba(255,107,107,.08); border-color: var(--red-line); }\n\n/* ——— главная мысль ——— */\n.thesis { margin: 20px 0; padding: 22px 20px; border-color: rgba(234,184,32,.30); background: linear-gradient(180deg, #1E2230 0%, var(--card) 100%); }\n.thesis-t { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.thesis p + p { margin-top: 10px; color: var(--t2); }\n\n/* ——— тетрадка ——— */\n.note-book { margin: 18px 0; padding: 20px 18px 10px; }\n.nb { list-style: none; display: grid; }\n.nb li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.nb li:first-child { border-top: 0; padding-top: 4px; }\n.nb small { display: block; margin-top: 6px; font-size: 14px; color: var(--t3); }\n.nb-n { margin-top: -3px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n\n/* ——— задание ——— */\n.task { border-color: rgba(234,184,32,.45); background: radial-gradient(120% 120% at 50% 0%, #2A2412 0%, var(--card) 70%); padding: 24px 20px; }\n.task .kick { color: #D9B94E; }\n.task p { font-size: 17px; color: var(--t1); }\n.task-go { display: flex; align-items: center; gap: 10px; margin-top: 16px !important; font-size: 24px !important; font-weight: 700;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.task-down { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #2A2008;\n  -webkit-text-fill-color: #2A2008; animation: task h d=\"M20 6 9 17l-5-5\"/><\/svg><span><b>значит, вы&nbsp;всё делаете правильно.<\/b><\/span><\/div>\n  <\/div>\n\n  <h3 class=\"h3\">Почему?<\/h3>\n  <p>Потому что психика не&nbsp;любит ситуации, где приходится признавать:<\/p>\n  <p class=\"quote\">я&nbsp;не&nbsp;могу жить, реализовывая всё одновременно.<\/p>\n\n  <div class=\"card task\">\n    <p class=\"task-go\">Какие ваши ТОП&nbsp;3. <span class=\"task-down\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span><\/p>\n    <p>После этого упражнения, будем делиться инсайтами<\/p>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n", "6": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Система ценностей · часть 6<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background:   const open = Math.min(N, sent + 1);   // открыто частей: 1 + отправленные задания-замки
  let html = '';
  for (let n = 1; n <= open; n++) html += `<div class="part" data-n="${n}"></div>` + task(n - 1);
  if (open < N) html += V === 'A' ? lockA(open) : lockB(open);
  else if (sent >= N) html += '<div class="done"><b>Урок пройден.</b> Все шесть частей открыты.</div>';
  flow.innerHTML = html;
  flow.querySelectorAll('.part').forEach(h => mountPart(h, h.dataset.n));
  flow.querySelectorAll('.as-go:not([disabled])').forEach(b => b.onclick = () => {
    sent = Math.max(sent, +b.dataset.i + 1); sessionStorage.setItem('sc-sent', sent); render();
    const next = document.querySelector(`.part[data-n="${Math.min(N, sent + 1)}"]`);
    if (next && sent < N) next.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });
}
render();
</script>
</body></html>
