n .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; pl ard) 100%); }\n.thesis-t { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.thesis p + p { margin-top: 10px; }\n.thesis.tg .thesis-t { font-size: 24px; }\n.quote { margin-top: 0; }\n.quote.red { border-image: none; border-left-color: var(--red); color: #FFD0D0; }\n.note { margin-top: 0; }\n.note.amber { background: rgba(234,184,32,.08); border-color: rgba(234,184,32,.32); color: #F3DFA0; }\n.note.amber b { color: #FFE9A8; }\n.note.amber svg.i { color: var(--amber); }\n\n/* ——— вопросы к себе ——— */\n.ask-l { list-style: none; display: grid; gap: 10px; }\n.ask-l li { padding: 10px 14px; border-radius: 14px 14px 14px 4px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 16px; font-style: italic; line-height: 1.4; color: var(--t1); }\n\n/* ——— реплики ——— */\n.talk { display: grid; gap: 10px; }\n.bub { position: relative; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.45; color: var(--t1);\n  background: rgba(255,255,255,.06); border: 1px solid var(--line2); margin: 0 !important; }\n.bub.l { justify-self: start; border-bottom-left-radius: 6px; font-style: italic; }\n.bub.r { justify-self: end; border-bottom-right-radius: 6px; background: rgba(234,184,32,.08); border-color: rgba(234,184,32,.32); font-weight: 600; }\n.talk-n { justify-self: start; margin: 0 0 0 16px !important; font-size: 13px; color: var(--t3); }\n.step .talk { margin-top: 10px; }\n.step .bub.r { max-width: 100%; font-weight: 500; font-style: italic; }\n\n/* ——— будут ——— */\n.will { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n.will p { margin: 0 !important; display: grid; place-items: center; text-align: center; min-height: 64px; padding: 10px 8px; border-radius: 14px;\n  background: rgba(234,184,32,.07); border: 1px solid rgba(234,184,32,.28); font-size: 15px; fon  }\n.step .note { margin-top: 12px; font-size: 15px; }\n.why .step-n { font-size: 15px; }\n.tgs .step-n svg.i { width: 17px; height: 17px; }\n.tgs .step-n svg.i polygon { fill: currentColor; }\n.st-k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }\n.tgs .step-t { padding-top: 0; }\n.eg { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--t1); }\n\n/* ——— путь к продаже ——— */\n.flow { display: grid; justify-items: center; gap: 6px; }\n.flow p { margin: 0 !important; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line2); text-align: center; font-size: 16px; line-height: 1.35; color: var(--t1); }\n.flow-a { color: var(--t3); display: grid; }\n.flow-a svg.i { width: 18px; height: 18px; }\n.flow .flow-end { border-color: rgba(234,184,32,.45); background: rgba(234,184,32,.08); font-size: 18px; }\n.flow-end b { color: #F0D080; }\n\n/* ——— 341 000 ——— */\n.sum { text-align: center; padding: 22px 18px 24px; border-color: rgba(234,184,32,.35); background: radial-gradient(120% 120% at 50% 100%, #2A2412 0%, var(--card) 70%); }\n.sum-no { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }\n.sum-no li { padding: 5px 12px; border-radius: 100px; background: rgba(255,255,255,.05); border: 1px solid var(--line2); font-size: 14px; font-weight: 600; color: var(--t2); }\n.sum-t { margin-top: 18px !important; font-size: 16px; line-height: 1.45; color: var(--t2); }\n.sum-n { display: block; margin-top: 8px; font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n\n/* ——— набор инструментов ——— */\n.kit-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }\n.kit-t { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); }\n.kit p { font-size: 16px; }\n.kit > * + * { margin-top: 12px !important; }\n.kit .quote { margin-top: 16px !important; font-size: 18px; }\n.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }\n.chips li { padding: 7px 13px; border-radius: 14px; background: var(--blue-bg); border: 1px solid var(--blue-line); font-size: 15px; font-weight: 600; line-height: 1.3; color: #DCE7FF; }\n.me { border-color: var(--green-line); background: linear-gradient(180deg, rgba(107,203,119,.06), var(--card)); }\n.me-t { font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--t1); text-wrap: balance; }\n.check { margin-top: 0; }\n.me .check { margin-top: 14px; }\n.check li { font-weight: 500; }\n\n/* ——— примеры чека ——— */\n.exs-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.exs-t svg.i { width: 18px; height: 18px; color: var(--amber); }\n.exs-t + .ex { margin-top: 0; }\n.ex { margin-top: 0; grid-template-columns: 1fr 20px 1fr; }\n.ex + .ex { margin-top: 8px; }\n.ex > div { background: rgba(255,255,255,.04); font-size: 14px; line-height: 1.35; color: var(--t2); }\n.ex span { display: block; }\n.ex b { font-size: 24px; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--t1); }\n.ex .to { border-color: rgba(234,184,32,.4); background: rgba(234,184,32,.07); }\n.ex .to b { color: #F0D080; }\n.ex .arrow svg.i { width: 18px; height: 18px; }\n\n/* ——— неделя / дальше ——— */\n.split-t { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--t1); margin-bottom: 12px; }\n.split-t svg.i { color: var(--blue); }\n.must .split-t svg.i { color: var(--amber); }\n.split .card p { font-size: 16px; }\n.split .list { margin-top: 0; }\n.split .card p + .list { margin-top: 12px; }\n\n/* ——— что в задании ——— */\n.how { border-color: var(--blue-line); margin-top: 20px; }\n.how .card-t { margin-bottom: 6px; }\n.how-l { list-style: none; display: grid; }\n.how-l li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.how-l li:first-child { border-top: 0; }\n.how-l li:last-child { padding-bottom: 0; }\n.how-n { margin-top: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); }\n\n/* ——— ритм отступов (сетка ПП): текст 12, блоки 20, после kick 10, после h2 14, h3 28/12 ——— */\n.sec > * { margin-bottom: 0 !important; }\n.sec > * + * { margin-top: 12px !important; }\n.sec > :is(.kick, .over) { margin-bottom: 10px !important; }\n.sec > :is(.kick, .over) + * { margin-top: 0 !important; }\n.sec > .h2 + * { margin-top: 14px !important; }\n.sec > * + :is(.card, .talk, .trio, .will, .flow, .steps, .split, .note, .quote, .check),\n.sec > :is(.card, .talk, .trio, .will, .flow, .steps, .split, .note, .quote, .check) + * { margin-top: 20px !important; }\n.sec > * + .h3 { margin-top: 28px !important; }\n.sec > .h3 + * { margin-top: 12px !important; }\n.sec > .hello + .lead { margin-top: 6px !important; }\n.card > :first-child { margin-top: 0 !important; }\n.card > .card-t + * { margin-top: 0 !important; }\n@media (min-width: 640px) {\n  .trio { grid-template-columns: 1fr; }\n  .toc-l { grid-template-columns: repeat(4, 1fr); }\n  .hello { font-size: 36px; }\n}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <p class=\"hello\">Приветствую, герои!<\/p>\n  <p class=\"lead\"><b>Добро пожаловать в&nbsp;начало второй недели!<\/b><\/p>\n  <p>Поздравляю вас с&nbsp;финалом первой. Выдохнули. Я&nbsp;знаю, было весело: были и&nbsp;слезы, и&nbsp;нервы, и&nbsp;страхи, и&nbsp;желание слиться. Потом вы&nbsp;восстанавливались и&nbsp;двигались дальше. Но&nbsp;в&nbsp;любом случае впереди еще более веселая неделя.<\/p>\n  <p>Но&nbsp;давайте для начала порефлексируем над тем, что вы&nbsp;поняли для себя по&nbsp;итогу этой недели. А&nbsp;я&nbsp;сделаю определенные акценты, чтобы вы&nbsp;могли обратить внимание на&nbsp;важные вещи. Потому что, когда вы&nbsp;не&nbsp;понимаете, что происходит, вы&nbsp;делаете ложные выводы, а&nbsp;отсюда появляется дополнительная нервотрепка.<\/p>\n  <p>Давайте разберемся по&nbsp;пунктам.<\/p>\n\n  <div class=\"card toc\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"/><line x1=\"4\" x2=\"4\" y1=\"22\" y2=\"15\"/><\/svg>Четыре вывода первой недели<\/div>\n    <ol class=\"toc-l\">\n      <li><span class=\"upd\"><b>1<\/b>Команда<\/span><\/li>\n      <li><span class=\"upd\"><b>2<\/b>Напарник<\/span><\/li>\n      <li><span class=\"upd\"><b>3<\/b>Игра как модель жизни<\/span><\/li>\n      <li><span class=\"upd\"><b>4<\/b>Ролевая модель<\/span><\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Команда<\/span>\n  <h2 class=\"h2\"><span class=\"hn\">1.<\/span> Вы&nbsp;разделились на&nbsp;команды<\/h2>\n  <p>Большинство из&nbsp;вас находятся в&nbsp;разных командах, кроме одиночки. Зачем это нужно? Я&nbsp;не&nbsp;знаю, как далеко вы&nbsp;пойдете в&nbsp;своей карьере, насколько великими экспертами или предпринимателями вы&nbsp;станете, но&nbsp;я&nbsp;точно знаю одно: вы&nbsp;либо будете возглавлять команды, либо станете частью чьей-то команды.<\/p>\n  <p>То&nbsp;есть на&nbsp;протяжении всей своей жизни, если вы&nbsp;будете стремиться к&nbsp;масштабу, вы&nbsp;будете взаимодействовать с&nbsp;другими людьми.<\/p>\n  <p>А&nbsp;люди проявляются по-разному. Каждому человеку нужен свой подход, своя мотивация, и&nbsp;с&nbsp;каждым нужно выстраивать отношения по-своему.<\/p>\n  <p>Одну вещь, которую вы&nbsp;должны понять сейчас по&nbsp;поводу команды:<\/p>\n  <p class=\"quote\">бизнес состоит из&nbsp;трех ключевых вещей.<\/p>\n\n  <div class=\"trio\">\n    <div class=\"card tri\">\n      <div class=\"tri-h\"><span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><\/svg><\/span><h3 class=\"tri-t\">Первое&nbsp;— цель бизнеса<\/h3><\/div>\n      <p>У&nbsp;самого бизнеса есть цель. Например, бизнес хочет получать прибыль в&nbsp;размере 1&nbsp;миллиона долларов. Или захватить 5% рынка. Это цель бизнеса.<\/p>\n    <\/div>\n    <div class=\"card tri\">\n      <div class=\"tri-h\"><span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M12 11h4\"/><path d=\"M12 16h4\"/><path d=\"M8 11h.01\"/><path d=\"M8 16h.01\"/><\/svg><\/span><h3 class=\"tri-t\">Второе&nbsp;— функции<\/h3><\/div>\n      <p>У&nbsp;бизнеса есть функции. Совокупность большого количества функций дает результат. Например, чтобы достичь 150&nbsp;тысяч рублей за&nbsp;месяц, нужно выполнить ряд действий: настроить рекламу, снимать рилсы, провести переговоры, выполнить обязательства.<\/p>\n      <p>Это и&nbsp;есть различные функции в&nbsp;компании.<\/p>\n    <\/div>\n    <div class=\"card tri\">\n      <div class=\"tri-h\"><span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/><\/svg><\/span><h3 class=\"tri-t\">Третье&nbsp;— человек<\/h3><\/div>\n      <p>За&nbsp;каждую функцию отвечает человек. Это третье звено в&nbsp;системе&nbsp;— человек, который это делает. Пока что это делаете вы, но&nbsp;в&nbsp;дальнейшем это будут делать разные люди. И, соответственно, у&nbsp;человека есть свои желания и&nbsp;свои цели.<\/p>\n    <\/div>\n  <\/div>\n\n  <p>И&nbsp;вот в&nbsp;чем искусство работы в&nbsp;команде:<\/p>\n  <ol class=\"card abc\">\n    <li><span class=\"abc-n\">а)<\/span><div>понимать, к&nbsp;какой цели мы&nbsp;стремимся. Например, какую выручку мы&nbsp;пытаемся достичь;<\/div><\/li>\n    <li><span class=\"abc-n\">б)<\/span><div>понимать, из&nbsp;каких функций состоит эта цель. Какие действия необходимо выполнить, чтобы добиться результата. По&nbsp;каждому действию есть свой итог. Какой результат должен дать рилс? Какой результат должны дать правильные сообщения? Какой результат должен быть у&nbsp;КЭВа? И&nbsp;именно совокупность этих результатов приводит к&nbsp;общей цели;<\/div><\/li>\n    <li><span class=\"abc-n\">в)<\/span><div>каждый человек, отвечающий за&nbsp;свою функцию, должен знать, какой результат он&nbsp;обязан выдать. Если ты&nbsp;отвечаешь за&nbsp;рилсы, то&nbsp;какой результат ты&nbsp;должен получить на&nbsp;выходе?<\/div><\/li>\n  <\/ol>\n\n  <p>Именно поэтому мы&nbsp;и&nbsp;тренируемся писать результат и&nbsp;анализ действия&nbsp;— чтобы учиться видеть все действия через призму результата. Потому что именно от&nbsp;этого в&nbsp;дальнейшем и&nbsp;будет происходить рост.<\/p>\n  <p>И&nbsp;третье, что надо понимать: у&nbsp;каждого человека внутри своей функции есть собственные желания.<\/p>\n  <p>Например, каждый в&nbsp;вашей команде пришел в&nbsp;эту программу со&nbsp;своими мотивами. Кто-то хочет что-то делать, кто-то не&nbsp;хочет. Кто-то относится к&nbsp;команде наплевательски, кто-то, наоборот, тянет ее&nbsp;вперед. Это неважно. Но&nbsp;для того чтобы все работали как единый организм, нужно знать цели и&nbsp;желания каждого участника.<\/p>\n\n  <ul class=\"card rows\">\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/><\/svg><span>Каждый участник должен четко понимать, какой результат он&nbsp;должен выдать вам как своей функцией.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg><span>Каждый участник должен понимать, как достижение его результата приведет к&nbsp;результату команды, то&nbsp;есть бизнеса.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M6 9H4.5a2.5 2.5 0 0 1 0-5H6\"/><path d=\"M18 9h1.5a2.5 2.5 0 0 0 0-5H18\"/><path d=\"M4 22h16\"/><path d=\"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22\"/><path d=\"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22\"/><path d=\"M18 2H6v7a6 6 0 0 0 12 0V2Z\"/><\/svg><span>И&nbsp;как достижение результата бизнеса поможет ему достичь его личных результатов.<\/span><\/li>\n  <\/ul>\n\n  <p>Если вы&nbsp;не&nbsp;научитесь соорганизовывать эти смыслы между собой, вам будет очень трудно находиться в&nbsp;команде и&nbsp;уж&nbsp;тем более ею&nbsp;управлять.<\/p>\n  <div class=\"card thesis\">\n    <p class=\"thesis-t\">Поэтому во&nbsp;взаимодействии с&nbsp;командой важно понимать: вместе вы&nbsp;сильнее, но&nbsp;только в&nbsp;одном случае&nbsp;— если вы&nbsp;научитесь соорганизовываться. Действовать сообща.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Напарник<\/span>\n  <h2 class=\"h2\"><span class=\"hn\">2.<\/span> Второй популярный момент&nbsp;— это Напарник<\/h2>\n  <p>На&nbsp;протяжении всей своей жизни вы&nbsp;очень часто либо играете роль спасателя&nbsp;— когда спасаете тех, кто даже не&nbsp;просит, либо живете наплевательски&nbsp;— когда вы&nbsp;сами по&nbsp;себе, и&nbsp;все, что вокруг вас, вас не&nbsp;интересует.<\/p>\n\n  <div class=\"card energy\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg>Зачем напарник<\/div>\n    <p><b>Напарник<\/b>&nbsp;— это, по&nbsp;большому счету, имитация бизнес-партнера, который у&nbsp;вас в&nbsp;жизни обязательно будет.<\/p>\n  <\/div>\n\n  <p>Партнерство бывает равное, а&nbsp;бывает так, что у&nbsp;вас, например, есть топ-менеджер. Он&nbsp;тоже отчасти ваш партнер, потому что от&nbsp;него зависит очень многое.<\/p>\n  <p>И&nbsp;в&nbsp;партнерстве важно понимать: насколько бы&nbsp;ты&nbsp;ни&nbsp;был эффективным, если твой партнер не&nbsp;справляется, вся команда идет ко&nbsp;дну.<\/p>\n\n  <div class=\"card story\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/><\/svg>Как теряли жизнь<\/div>\n    <p>И&nbsp;на&nbsp;протяжении недели могло быть так: даже если вы&nbsp;держали невероятный фокус и&nbsp;все сделали, но&nbsp;забыли про своего напарника, про своего Buddy,&nbsp;— вы&nbsp;потеряли жизнь просто потому, что лишний раз не&nbsp;уточнили, успевает он&nbsp;или не&nbsp;успевает, не&nbsp;проконтролировали. И, соответственно, все полетело в&nbsp;тартарары.<\/p>\n  <\/div>\n\n  <p>В&nbsp;бизнесе происходит то&nbsp;же&nbsp;самое.<\/p>\n  <ul class=\"card rows red\">\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z\"/><path d=\"m21.854 2.147-10.94 10.939\"/><\/svg><span>Вы&nbsp;не&nbsp;проконтролировали сотрудника: отправил ли&nbsp;он&nbsp;отчет вовремя.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M12 11h4\"/><path d=\"M12 16h4\"/><path d=\"M8 11h.01\"/><path d=\"M8 16h.01\"/><\/svg><span>Бухгалтера: подал ли&nbsp;он&nbsp;налоговую декларацию вовремя.<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span>Сдал ли&nbsp;он&nbsp;все задания и&nbsp;домашки вовремя.<\/span><\/li>\n  <\/ul>\n  <p class=\"quote red\">А&nbsp;в&nbsp;штраф попадаете вы.<\/p>\n  <p>И&nbsp;вы&nbsp;можете обижаться, злиться, но&nbsp;такова реальность.<\/p>\n  <p>И&nbsp;вам впервые нужно при масштабировании и&nbsp;в&nbsp;стремлении добиться какого-то выдающегося результата думать не&nbsp;только о&nbsp;том, на&nbsp;что способны вы, но&nbsp;и&nbsp;о&nbsp;том, на&nbsp;что способны ваши партнеры и&nbsp;члены вашей команды.<\/p>\n  <p>Потому что сейчас вы&nbsp;могли видеть, что какие-то команды получили награды, а&nbsp;какие-то&nbsp;— нет.<\/p>\n\n  <div class=\"card thesis\">\n    <p class=\"thesis-t\">И&nbsp;опять-таки вопрос: являешься ли&nbsp;ты&nbsp;в&nbsp;своей команде тем самым человеком, который помог ей&nbsp;заработать награду? Или нет&nbsp;— ты&nbsp;был тем, кого все тащили?<\/p>\n    <p>И, соответственно, какие выводы ты&nbsp;сделаешь на&nbsp;следующей неделе? И&nbsp;кем ты&nbsp;станешь?<\/p>\n  <\/div>\n\n  <div class=\"note green\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16\"/><path d=\"M8 16H3v5\"/><\/svg><span>Ведь на&nbsp;этой неделе счет обнуляется, и&nbsp;у&nbsp;вас есть шанс сделать крутой результат уже сейчас.<\/span><\/div>\n  <p>И&nbsp;всему этому вы&nbsp;учитесь по&nbsp;ходу.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Игра<\/span>\n  <h2 class=\"h2\"><span class=\"hn\">3.<\/span> Вся программа&nbsp;— это моделирование реальной жизни<\/h2>\n  <p>Вся программа&nbsp;— это лишь моделирование того, что происходит в&nbsp;реальной жизни. Все упражнения и&nbsp;задания созданы здесь таким образом, чтобы повторять ваше поведение в&nbsp;реальности.<\/p>\n  <p>Чтобы вы&nbsp;увидели здесь, в&nbsp;игре, где максимальный риск&nbsp;— просто потерять жизнь или не&nbsp;добрать баллов. А&nbsp;в&nbsp;жизни это потеря клиентов, потеря роста, потеря денег и&nbsp;так далее.<\/p>\n  <p>То&nbsp;есть здесь мы&nbsp;тренируемся увидеть: а&nbsp;как эта же&nbsp;самая ситуация проявляется у&nbsp;нас в&nbsp;жизни?<\/p>\n\n  <div class=\"card ask\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"/><path d=\"M12 17h.01\"/><\/svg>Вопросы к&nbsp;себе<\/div>\n    <ul class=\"ask-l\">\n      <li>Что конкретно нас бесит?<\/li>\n      <li>Что конкретно мы&nbsp;не&nbsp;можем заставить себя делать?<\/li>\n      <li>Почему мы&nbsp;относимся к&nbsp;той или иной функции именно так?<\/li>\n      <li>Почему нас бесят определенные люди в&nbsp;команде?<\/li>\n      <li>Почему я&nbsp;должен за&nbsp;них отвечать?<\/li>\n      <li>Почему я&nbsp;должен отчитываться?<\/li>\n      <li>Я&nbsp;вообще пришел за&nbsp;свободой. Я&nbsp;пришел за&nbsp;деньгами. Я&nbsp;пришел…<\/li>\n    <\/ul>\n  <\/div>\n\n  <p class=\"quote\">Но&nbsp;все это неизбежно в&nbsp;вашем развитии. Вам все равно придется это делать.<\/p>\n  <p>И&nbsp;неважно, какими навыками вы&nbsp;обладали в&nbsp;прошлом, какой опыт проходили&nbsp;— все эти качества пригодятся при построении своей собственной компании.<\/p>\n  <p>Вы&nbsp;даже не&nbsp;представляете, какое количество людей на&nbsp;программе потеряли жизни просто из-за невнимательности.<\/p>\n  <p>Например, тот же&nbsp;самый <b>Фокус<\/b>, где задача очень простая: просто поставить себе напоминание и&nbsp;не&nbsp;забыть сделать задачу. Но&nbsp;оказывается, так сложно 8&nbsp;раз написать сообщение.<\/p>\n  <p>Более того, я&nbsp;обожаю читать ваши <b>Фокусы<\/b>, <b>План/Факты<\/b> и&nbsp;смотреть, насколько серьезно вы&nbsp;понимаете задачи, которые перед вами стоят. Насколько вы&nbsp;умеете отфильтровывать важное от&nbsp;неважного. Насколько халатно вы&nbsp;делаете&nbsp;— на&nbsp;отстань&nbsp;— или действительно стараетесь сделать лучше. Насколько внимательно или невнимательно вы&nbsp;читаете задания.<\/p>\n  <p>И&nbsp;поверьте мне: по&nbsp;некоторым участникам, когда я&nbsp;видел, как люди писали пост, как писали План, как отчитывались по&nbsp;домашке, я&nbsp;с&nbsp;самого начала говорил:<\/p>\n  <div class=\"talk\"><p class=\"bub l\">«Саша, вот этот человек, скорее всего, не&nbsp;выдержит и&nbsp;недели».<\/p><\/div>\n  <p>И&nbsp;пока у&nbsp;меня всегда 100% попадание. Потому что за&nbsp;мои годы насмотренности я&nbsp;уже знаю закономерности того, кто на&nbsp;самом деле добьется результата.<\/p>\n  <div class=\"note green\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M9.94 14.06 8.5 20l-1.44-5.94L1 12.5l6.06-1.44L8.5 5l1.44 6.06L16 12.5z\"/><path d=\"M20 3v4\"/><path d=\"M22 5h-4\"/><\/svg><span>Но&nbsp;человек всегда может измениться.<\/span><\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Паттерны<\/span>\n  <h2 class=\"h2\"><span class=\"hn\">4.<\/span> Все, что вы&nbsp;делаете,&nbsp;— это ваша ролевая модель<\/h2>\n  <p>Все, что вы&nbsp;делаете в&nbsp;жизни,&nbsp;— это ваша ролевая модель.<\/p>\n  <p>Вы&nbsp;думаете, что вы&nbsp;уникальны. Думаете, что вы&nbsp;самобытны. На&nbsp;самом деле у&nbsp;вас просто есть паттерны поведения.<\/p>\n  <p>И&nbsp;задача программы&nbsp;— исправить, подкорректировать и&nbsp;направить их&nbsp;в&nbsp;более эффективную сторону, чтобы вы&nbsp;могли использовать свои сильные стороны и&nbsp;гасить свои слабые.<\/p>\n  <p>Впереди вас ждет удивительное приключение. И&nbsp;за&nbsp;эту неделю вы&nbsp;еще больше узнаете о&nbsp;себе самого разного.<\/p>\n  <p>Так что впереди у&nbsp;вас классная, потрясающая, захватывающая неделя.<\/p>\n\n  <div class=\"will\">\n    <p>Слезы будут.<\/p>\n    <p>Смех будет.<\/p>\n    <p>Новая дружба будет.<\/p>\n  <\/div>\n\n  <p>Но&nbsp;одно я&nbsp;знаю точно: в&nbsp;любом случае весь этот тренинг станет одним из&nbsp;самых незабываемых приключений вашей жизни.<\/p>\n  <p>Вам будет что вспомнить.<\/p>\n  <p class=\"task-go\">Хорошей вам недели. Выполняйте задания на&nbsp;неделю.<\/p>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n", "2": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Задание на вторую неделю<\/title>\n<style>\n/* Урок «Правила курса» — вставки HTML-страниц в урок кабинета «План Продюсера».\n   Фон и карточки совпадают с кабинетом (ProducerPlanLayout: --pl-bg #0D1117, --pl-card #141E2B). */\n@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap');\n\n:root {\n  --bg: #0D1117;\n  --card: #141E2B;\n  --card2: #1A2535;\n  --line: rgba(255,255,255,.07);\n  --line2: rgba(255,255,255,.12);\n  --t1: #FFFFFF;\n  --t2: rgba(255,255,255,.76);\n  --t3: rgba(255,255,255,.52);\n  --blue: #6B9FFF;\n  --blue-bg: rgba(107,159,255,.10);\n  --blue-line: rgba(107,159,255,.28);\n  --amber: #EAB820;\n  --gold: linear-gradient(135deg, #F0D080 0%, #CCA830 100%);\n  --red: #FF6B6B;\n  --red-bg: rgba(255,107,107,.09);\n  --red-line: rgba(255,107,107,.28);\n  --green: #6BCB77;\n  --green-bg: rgba(107,203,119,.09);\n  --green-line: rgba(107,203,119,.28);\n  --r: 18px;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { background: var(--bg) !important; }\nbody {\n  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  color: var(--t2);\n  font-size: 17px; line-height: 1.55; letter-spacing: -.011em;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n  text-wrap: pretty;\n}\n.page { max-width: 720px; margin: 0 auto; padding: 8px 16px 24px; }\n\nb, strong { color: var(--t1); font-weight: 700; }\n.am { color: var(--amber); font-weight: 700; }\np + p { margin-top: 12px; }\nsvg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ——— заголовки секций ——— */\n.sec { padding-top: 40px; }\n.sec:first-child { padding-top: 8px; }\n.kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }\n.h2 {\n  font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 14px; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.h3 { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); margin: 24px 0 10px; text-wrap: balance; }\n.lead { font-size: 18px; color: var(--t2); }\n\n/* ——— карточки ——— */\n.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; margin-top: 16px; }\n.card-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.card-t svg.i { width: 18px; height: 18px; color: var(--blue); }\n\n/* ——— шпаргалка ——— */\n.cheat { background: linear-gradient(180deg, #172238 0%, var(--card) 100%); border-color: var(--blue-line); padding: 22px 20px 8px; }\n.cheat-h { font-size: 22px; font-weight: 700; color: var(--t1); line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }\n.cheat-sub { font-size: 15px; color: var(--t3); margin-bottom: 14px; }\n.rule { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }\n.rule-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-bg); color: var(--blue); }\n.rule-ic.red { background: var(--red-bg); color: var(--red); }\n.rule-name { font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.3; }\n.rule-txt { font-size: 15px; line-height: 1.45; color: var(--t2); margin-top: 3px; }\n.tag-loss { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px; background: var(--red-bg); border: 1px solid var(--red-line); color: #FF9B9B; font-size: 13px; font-weight: 600; }\n.tag-loss svg.i { width: 14px; height: 14px; fill: currentColor; stroke: none; }\n\n/* ——— сердечки ——— */\n.hearts { display: flex; gap: 8px; color: var(--red); flex: none; }\n.hearts svg { width: 28px; height: 28px; fill: var(--red); }\n.hearts.sm svg { width: 18px; height: 18px; }\n.hearts .off { fill: rgba(255,255,255,.14); }\n\n/* ——— цель 30 дней ——— */\n.goal { text-align: center; padding: 24px 20px; }\n.goal-days { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }\n.goal-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.goal-or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\n.goal-opt { background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 10px; font-size: 16px; font-weight: 700; color: var(--t1); line-height: 1.25; }\n.goal-sep { font-size: 13px; color: var(--t3); font-weight: 600; }\n\n/* ——— списки ——— */\n.list { list-style: none; display: grid; gap: 10px; margin-top: 12px; }\n.list li { position: relative; padding-left: 22px; }\n.list li::before { content: \"\"; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.list.red li::before { background: var(--red); }\n.list.green li::before { background: var(--green); }\n.list.muted li::before { background: var(--t3); }\n\n/* ——— цитата-вывод ——— */\n.quote { margin-top: 18px; padding: 4px 0 4px 16px; border-left: 3px solid; border-image: var(--gold) 1; font-size: 19px; font-weight: 600; line-height: 1.4; color: var(--t1); }\n\n/* ——— футбол ——— */\n.pair { display: grid; gap: 12px; margin-top: 16px; }\n.pair .card { margin-top: 0; }\n\n/* ——— Точка Б ——— */\n.lvls { display: grid; gap: 10px; margin-top: 16px; }\n.lvl { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.lvl-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.lvl-now { font-size: 15px; font-weight: 600; color: var(--t1); line-height: 1.3; }\n.lvl-now small, .lvl-goal small { display: block; font-size: 13px; font-weight: 500; color: var(--t3); }\n.lvl-arrow { color: var(--t3); }\n.lvl-goal .lvl-lbl { color: #D9B94E; }\n.lvl-goal b { font-size: 20px; line-height: 1.15; background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.lvl-n { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: -2px; }\n\n/* ——— этапы (вертикальная линия) ——— */\n.steps { list-style: none; margin-top: 16px; }\n.step { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; }\n.step:last-child { padding-bottom: 0; }\n.step:not(:last-child)::after { content: \"\"; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--blue-line), rgba(107,159,255,.06)); }\n.step-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n.step-n.done { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }\n.step-t { font-size: 17px; font-weight: 700; color: var(--t1); padding-top: 6px; line-height: 1.3; }\n.step-t .dur { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 100px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--t2); vertical-align: 2px; }\n.step-d { font-size: 15px; color: var(--t2); margin-top: 4px; }\n.step-d.ok { color: var(--green); font-weight: 600; }\n\n/* ——— неделя: 3 плашки ——— */\n.week { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }\n.week div { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.3; color: var(--t2); }\n.week div b { width: 20px; text-align: center; font-size: 22px; color: var(--t1); flex: none; }\n.week div:first-child { border-color: rgba(234,184,32,.35); background: rgba(234,184,32,.07); }\n.week div:first-child b { color: var(--amber); }\n\n/* ——— 80/20 ——— */\n.split-bar { display: grid; grid-template-columns: 20fr 80fr; height: 40px; border-radius: 12px; overflow: hidden; margin: 16px 0 14px; font-size: 14px; font-weight: 700; }\n.split-bar span { display: flex; align-items: center; padding: 0 12px; }\n.split-bar span:first-child { background: var(--gold); color: #1A1406; justify-content: center; padding: 0; }\n.split-bar span:last-child { background: rgba(255,255,255,.07); color: var(--t3); }\n.split { display: grid; gap: 12px; }\n.split .card { margin-top: 0; }\n.split .must { border-color: rgba(234,184,32,.4); }\n.split .must .card-t { color: var(--amber); }\n.split .must .card-t svg.i { color: var(--amber); }\n\n/* ——— таймлайн недели задания ——— */\n.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 14px 0 8px; }\n.day { text-align: center; }\n.day-bar { height: 10px; border-radius: 5px; background: rgba(107,159,255,.28); }\n.day.open .day-bar { background: var(--blue); }\n.day.dl .day-bar { background: var(--red); }\n.day-n { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--t2); }\n.day-s { font-size: 11px; line-height: 1.25; color: var(--t3); margin-top: 2px; }\n.day.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-li .steps { margin-top: 0; }\n.step-t { padding-top: 5px; }\n.step-d { margin-top: 8px !important; font-size: 16px; line-height: 1.5; }\n.step .list { margin-top: 8px; }\n.step .note { margin-top: 12px; font-size: 15px; }\n.why .step-n { font-size: 15px; }\n.tgs .step-n svg.i { width: 17px; height: 17px; }\n.tgs .step-n svg.i polygon { fill: currentColor; }\n.st-k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }\n.tgs .step-t { padding-top: 0; }\n.eg { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--t1); }\n\n/* ——— путь к продаже ——— */\n.flow { display: grid; justify-items: center; gap: 6px; }\n.flow p { margin: 0 !important; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line2); text-align: center; font-size: 16px; line-height: 1.35; color: var(--t1); }\n.flow-a { color: var(--t3); display: grid; }\n.flow-a svg.i { width: 18px; height: 18px; }\n.flow .flow-end { border-color: rgba(234,184,32,.45); background: rgba(234,184,32,.08); font-size: 18px; }\n.flow-end b { color: #F0D080; }\n\n/* ——— 341 000 ——— */\n.sum { text-align: center; padding: 22px 18px 24px; border-color: rgba(234,184,32,.35); background: radial-gradient(120% 120% at 50% 100%, #2A2412 0%, var(--card) 70%); }\n.sum-no { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }\n.sum-no li { padding: 5px 12px; border-radius: 100px; background: rgba(255,255,255,.05); border: 1px solid var(--line2); font-size: 14px; font-weight: 600; color: var(--t2); }\n.sum-t { margin-top: 18px !important; font-size: 16px; line-height: 1.45; color: var(--t2); }\n.sum-n { display: block; margin-top: 8px; font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n\n/* ——— набор инструментов ——— */\n.kit-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }\n.kit-t { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--t1); }\n.kit p { font-size: 16px; }\n.kit > * + * { margin-top: 12px !important; }\n.kit .quote { margin-top: 16px !important; font-size: 18px; }\n.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }\n.chips li { padding: 7px 13px; border-radius: 14px; background: var(--blue-bg); border: 1px solid var(--blue-line); font-size: 15px; font-weight: 600; line-height: 1.3; color: #DCE7FF; }\n.me { border-color: var(--green-line); background: linear-gradient(180deg, rgba(107,203,119,.06), var(--card)); }\n.me-t { font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--t1); text-wrap: balance; }\n.check { margin-top: 0; }\n.me .check { margin-top: 14px; }\n.check li { font-weight: 500; }\n\n/* ——— примеры чека ——— */\n.exs-t { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 14px; }\n.exs-t svg.i { width: 18px; height: 18px; color: var(--amber); }\n.exs-t + .ex { margin-top: 0; }\n.ex { margin-top: 0; grid-template-columns: 1fr 20px 1fr; }\n.ex + .ex { margin-top: 8px; }\n.ex > div { background: rgba(255,255,255,.04); font-size: 14px; line-height: 1.35; color: var(--t2); }\n.ex span { display: block; }\n.ex b { font-size: 24px; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--t1); }\n.ex .to { border-color: rgba(234,184,32,.4); background: rgba(234,184,32,.07); }\n.ex .to b { color: #F0D080; }\n.ex .arrow svg.i { width: 18px; height: 18px; }\n\n/* ——— неделя / дальше ——— */\n.split-t { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--t1); margin-bottom: 12px; }\n.split-t svg.i { color: var(--blue); }\n.must .split-t svg.i { color: var(--amber); }\n.split .card p { font-size: 16px; }\n.split .list { margin-top: 0; }\n.split .card p + .list { margin-top: 12px; }\n\n/* ——— что в задании ——— */\n.how { border-color: var(--blue-line); margin-top: 20px; }\n.how .card-t { margin-bottom: 6px; }\n.how-l { list-style: none; display: grid; }\n.how-l li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.how-l li:first-child { border-top: 0; }\n.how-l li:last-child { padding-bottom: 0; }\n.how-n { margin-top: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); }\n\n/* ——— ритм отступов (сетка ПП): текст 12, блоки 20, после kick 10, после h2 14, h3 28/12 ——— */\n.sec > * { margin-bottom: 0 !important; }\n.sec > * + * { margin-top: 12px !important; }\n.sec > :is(.kick, .over) { margin-bottom: 10px !important; }\n.sec > :is(.kick, .over) + * { margin-top: 0 !important; }\n.sec > .h2 + * { margin-top: 14px !important; }\n.sec > * + :is(.card, .talk, .trio, .will, .flow, .steps, .split, .note, .quote, .check),\n.sec > :is(.card, .talk, .trio, .will, .flow, .steps, .split, .note, .quote, .check) + * { margin-top: 20px !important; }\n.sec > * + .h3 { margin-top: 28px !important; }\n.sec > .h3 + * { margin-top: 12px !important; }\n.sec > .hello + .lead { margin-top: 6px !important; }\n.card > :first-child { margin-top: 0 !important; }\n.card > .card-t + * { margin-top: 0 !important; }\n@media (min-width: 640px) {\n  .trio { grid-template-columns: 1fr; }\n  .toc-l { grid-template-columns: repeat(4, 1fr); }\n  .hello { font-size: 36px; }\n}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <h2 class=\"h2\">Задание на&nbsp;вторую неделю<\/h2>\n  <p>Сейчас будет задание для <b>второй недели<\/b>. Но&nbsp;сначала я&nbsp;коротко хочу подвести итоги того, что нам уже удалось сделать.<\/p>\n\n  <div class=\"card cheat\">\n    <p class=\"cheat-h\"><span class=\"upd\">Три задачи недели<\/span><\/p>\n    <a class=\"rule\" href=\"#z1\">\n      <div class=\"rule-ic\"><span class=\"upd\">1<\/span><\/div>\n      <div><p class=\"rule-name\"><span class=\"upd\">Сделать минимум 3&nbsp;продажи своих услуг<\/span><\/p><\/div>\n    <\/a>\n    <a class=\"rule\" href=\"#z2\">\n      <div class=\"rule-ic\"><span class=\"upd\">2<\/span><\/div>\n      <div><p class=\"rule-name\"><span class=\"upd\">Поднять средний чек на&nbsp;30%<\/span><\/p>\n        <p class=\"rule-txt\"><span class=\"upd\">Но&nbsp;не&nbsp;меньше, чем на&nbsp;500&nbsp;рублей.<\/span><\/p><\/div>\n    <\/a>\n    <a class=\"rule\" href=\"#z3\">\n      <div class=\"rule-ic\"><span class=\"upd\">3<\/span><\/div>\n      <div><p class=\"rule-name\"><span class=\"upd\">Выполнить план по&nbsp;доходу<\/span><\/p>\n        <span class=\"tag-gain\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M18.09 10.37A6 6 0 1 1 10.34 18\"/><path d=\"M7 6h1v4\"/><path d=\"m16.71 13.88.7.71-2.82 2.82\"/><\/svg><span class=\"upd\">За&nbsp;задание в&nbsp;срок&nbsp;— 1000&nbsp;баллов и&nbsp;1000&nbsp;фениксов, после срока&nbsp;— 300<\/span><\/span><\/div>\n    <\/a>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Итоги<\/span>\n  <h2 class=\"h2\">Что мы&nbsp;сделали на&nbsp;первой неделе<\/h2>\n  <p>На&nbsp;первой неделе мы&nbsp;с&nbsp;вами проводили <b class=\"am\">10&nbsp;созвонов с&nbsp;потенциальными клиентами<\/b>.<\/p>\n  <h3 class=\"h3\">Зачем это было нужно?<\/h3>\n\n  <ol class=\"steps why\">\n    <li class=\"step\">\n      <span class=\"step-n\">1.<\/span>\n      <div>\n        <p class=\"step-t\">Чтобы вы&nbsp;выбрались из&nbsp;своей теплой норки<\/p>\n        <p class=\"step-d\">Из&nbsp;той самой норки, в&nbsp;которой многие сидели по&nbsp;нескольку лет, и&nbsp;наконец-то снова начали проявляться.<\/p>\n        <p class=\"step-d\">Чтобы люди:<\/p>\n        <ul class=\"list\">\n          <li>увидели вас;<\/li>\n          <li>узнали о&nbsp;вашем существовании;<\/li>\n          <li>поняли, чем вы&nbsp;занимаетесь.<\/li>\n        <\/ul>\n      <\/div>\n    <\/li>\n    <li class=\"step\">\n      <span class=\"step-n\">2.<\/span>\n      <div>\n        <p class=\"step-t\">Чтобы вы&nbsp;услышали реальные проблемы людей<\/p>\n        <p class=\"step-d\">Те, у&nbsp;кого не&nbsp;было ниши, кто не&nbsp;понимал, какую именно проблему он&nbsp;решает, наконец-то вышли из&nbsp;своей коробочки и&nbsp;перестали бесконечно размышлять в&nbsp;духе: <i>«Чем бы&nbsp;мне заняться?»<\/i><\/p>\n        <p class=\"step-d\">Вместо этого вы&nbsp;начали слышать <b>реальные проблемы реальных людей<\/b>&nbsp;— а&nbsp;значит, получили материал для того, чтобы придумать оффер и&nbsp;понять, как именно вы&nbsp;можете помочь.<\/p>\n        <div class=\"note red\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg><span>Если вы&nbsp;этого не&nbsp;сделали&nbsp;— это плохо. На&nbsp;этой неделе вам придется догонять остальных, потому что это <b>крайне важно<\/b>.<\/span><\/div>\n      <\/div>\n    <\/li>\n    <li class=\"step\">\n      <span class=\"step-n\">3.<\/span>\n      <div>\n        <p class=\"step-t\">Мы&nbsp;написали оффер на&nbsp;КЭВ<\/p>\n        <p class=\"step-d\">Мы&nbsp;с&nbsp;вами написали <b>оффер на&nbsp;КЭВ&nbsp;— на&nbsp;ключевой этап воронки<\/b>.<\/p>\n        <p class=\"step-d\">И&nbsp;теперь этот оффер у&nbsp;нас есть.<\/p>\n        <p class=\"step-d\">Почему мы&nbsp;делали это именно на&nbsp;первой неделе? Потому что тогда вы&nbsp;могли протестировать его на&nbsp;своей <b>лояльной базе<\/b>&nbsp;— на&nbsp;людях, которые вас уже знают.<\/p>\n      <\/div>\n    <\/li>\n  <\/ol>\n  <p>Теперь же&nbsp;задача другая:<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Что меняется<\/span>\n  <h2 class=\"h2\">Задача второй недели<\/h2>\n  <div class=\"card thesis\">\n    <p class=\"thesis-t\">Теперь нам нужно сделать так, чтобы даже те&nbsp;люди, которые нас не&nbsp;знают, хорошо реагировали на&nbsp;наш оффер на&nbsp;КЭВ.<\/p>\n  <\/div>\n  <p>Именно поэтому у&nbsp;нас были:<\/p>\n  <ul class=\"list\">\n    <li>публичные разборы домашних заданий;<\/li>\n    <li>подробная проработка этой темы;<\/li>\n    <li>детальная обратная связь.<\/li>\n  <\/ul>\n  <p>Потому что чем глубже вы&nbsp;понимаете эту механику, тем выше будет <b>конверсия перехода<\/b>:<\/p>\n  <div class=\"flow\">\n    <p>от&nbsp;этапа, где люди вас еще не&nbsp;знают,<\/p>\n    <span class=\"flow-a\" aria-hidden=\"true\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span>\n    <p>к&nbsp;этапу, где они переходят на&nbsp;ключевой этап воронки,<\/p>\n    <span class=\"flow-a\" aria-hidden=\"true\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span>\n    <p class=\"flow-end\">то&nbsp;есть&nbsp;— <b>к&nbsp;продаже<\/b>.<\/p>\n  <\/div>\n  <p>Поэтому мы&nbsp;так плотно с&nbsp;этим и&nbsp;работали.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Деньги первой недели<\/span>\n  <h2 class=\"h2\">Еще один важный итог первой недели<\/h2>\n  <p>Кто-то воспользовался упражнением <b>«10&nbsp;созвонов»<\/b>, заработал деньги и&nbsp;даже <b>зафиналил тренинг<\/b>. И&nbsp;это очень круто.<\/p>\n  <p>Все, кто это сделал,&nbsp;— красавчики.<br>Все ребята, которые приблизились к&nbsp;своему финансовому плану,&nbsp;— тоже большие молодцы.<\/p>\n  <p>Но&nbsp;по&nbsp;факту у&nbsp;нас <b>не&nbsp;было задачи на&nbsp;первой неделе продавать<\/b>.<\/p>\n  <p>Потому что такая задача у&nbsp;вас будет <b>на&nbsp;второй неделе<\/b>.<\/p>\n  <p>И&nbsp;в&nbsp;этот момент вы&nbsp;можете сказать мне:<\/p>\n  <div class=\"talk\">\n    <p class=\"bub l\">«Саша, но&nbsp;мы&nbsp;же&nbsp;не&nbsp;умеем продавать».<\/p>\n    <p class=\"bub r\">Не&nbsp;получится. Вы&nbsp;спалились.<\/p>\n  <\/div>\n  <p>Потому что мы&nbsp;с&nbsp;вами <b>на&nbsp;второй день тренинга<\/b> за <b>один час<\/b> всей группой заработали <b>341&nbsp;тысячу рублей<\/b>.<\/p>\n\n  <div class=\"card sum\">\n    <ul class=\"sum-no\">\n      <li>Без скриптов.<\/li>\n      <li>Без глубокого понимания проблемы.<\/li>\n      <li>Без КЭВов.<\/li>\n      <li>Без всего.<\/li>\n    <\/ul>\n    <p class=\"sum-t\">В <b>2&nbsp;часа ночи<\/b>, в&nbsp;воскресенье, группа каким-то образом сгенерировала <span class=\"sum-n\">341&nbsp;000&nbsp;рублей.<\/span><\/p>\n  <\/div>\n\n  <p class=\"quote\">Так что теперь ваша задача&nbsp;— продавать в&nbsp;течение 5&nbsp;будничных дней.<\/p>\n<\/section>\n\n<section class=\"sec\" id=\"z1\">\n  <span class=\"over\">Главная задача недели<\/span>\n  <h2 class=\"h2\">Задача №1&nbsp;— сделать 3&nbsp;продажи<\/h2>\n  <p>Вам нужно сделать <b class=\"am\">три продажи своих услуг<\/b>.<\/p>\n  <p>Чтобы у&nbsp;вас это получилось, мы, конечно же, даем вам все необходимые инструменты.<\/p>\n  <h3 class=\"h3\">Что именно вы&nbsp;получаете?<\/h3>\n\n  <div class=\"card kit\">\n    <div class=\"kit-h\"><span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"/><\/svg><\/span><p class=\"kit-t\">Скрипты продаж<\/p><\/div>\n    <p>Но&nbsp;сразу важно понять:<\/p>\n    <p><i>Скрипты продаж<\/i>&nbsp;— это не&nbsp;про то, что нужно слово в&nbsp;слово повторять, как сказал Саша.<\/p>\n    <p>Скрипты&nbsp;— это:<\/p>\n    <ul class=\"chips\">\n      <li>база;<\/li>\n      <li>фундамент;<\/li>\n      <li>понимание принципов, по&nbsp;которым строится продажа.<\/li>\n    <\/ul>\n    <p>То&nbsp;есть вы&nbsp;понимаете:<\/p>\n    <ul class=\"list\">\n      <li>с&nbsp;чего начать разговор;<\/li>\n      <li>как развивать мысль;<\/li>\n      <li>как определить проблему;<\/li>\n      <li>как подвести к&nbsp;офферу;<\/li>\n      <li>как отрабатывать возражения.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"card kit\">\n    <div class=\"kit-h\"><span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z\"/><\/svg><\/span><p class=\"kit-t\">Разные форматы продаж<\/p><\/div>\n    <p>Чтобы у&nbsp;вас было объемное понимание темы, мы&nbsp;даем вам продажи:<\/p>\n    <ul class=\"chips\">\n      <li>через разборы;<\/li>\n      <li>через диагностику;<\/li>\n      <li>через переписку.<\/li>\n    <\/ul>\n    <p>Плюс&nbsp;— отдельно разбираем:<\/p>\n    <ul class=\"chips\">\n      <li>возражения;<\/li>\n      <li>способы закрытия;<\/li>\n      <li>реальные примеры.<\/li>\n    <\/ul>\n    <p>Я&nbsp;даже даю вам разбор продаж моей клиентки с&nbsp;первого потока&nbsp;— натуропата. Чтобы вы&nbsp;послушали и&nbsp;поняли:<\/p>\n    <p class=\"quote\">«Ага, все. Вот теперь можно работать».<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Клиенты<\/span>\n  <h2 class=\"h2\">Где брать клиентов?<\/h2>\n  <p>И&nbsp;вот в&nbsp;этот момент вы&nbsp;можете сказать:<\/p>\n  <div class=\"talk\">\n    <p class=\"bub l\">«Саша, у&nbsp;меня записная книжка закончилась. Что мне делать?»<\/p>\n    <p class=\"bub r\">Честно? Я&nbsp;в&nbsp;это очень слабо верю.<\/p>\n  <\/div>\n  <p>Почему?<\/p>\n  <p>Потому что нам надо было провести всего <b>10&nbsp;созвонов<\/b>, а&nbsp;значит, ваша записная книжка, скорее всего, еще <b>не&nbsp;дообработана<\/b>.<\/p>\n  <p>Тем более, если у&nbsp;вас теперь есть <b>новый крутой КЭВ<\/b>, вероятность найти людей становится еще выше.<\/p>\n  <p>А&nbsp;нам нужно сделать <b>всего три продажи<\/b>.<\/p>\n\n  <div class=\"card me\">\n    <h3 class=\"me-t\">Если бы&nbsp;я&nbsp;был на&nbsp;вашем месте, я&nbsp;бы&nbsp;делал так:<\/h3>\n    <ul class=\"check\">\n      <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>работал бы&nbsp;с&nbsp;записной книжкой;<\/span><\/li>\n      <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>пошел бы&nbsp;к&nbsp;людям-паукам и&nbsp;рассказал бы&nbsp;им&nbsp;про свой КЭВ и&nbsp;про то, как я&nbsp;могу помочь;<\/span><\/li>\n      <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>написал бы&nbsp;тем, кто уже что-то у&nbsp;меня покупал;<\/span><\/li>\n      <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>узнал бы, с&nbsp;какими проблемами они сталкиваются сейчас;<\/span><\/li>\n      <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>предложил бы&nbsp;им&nbsp;новое решение.<\/span><\/li>\n    <\/ul>\n  <\/div>\n\n  <h3 class=\"h3\">Какие еще есть источники клиентов?<\/h3>\n  <p>У&nbsp;вас также будет:<\/p>\n  <ul class=\"list\">\n    <li>инструмент работы с&nbsp;досками;<\/li>\n    <li>работа с&nbsp;альтернативными платформами;<\/li>\n    <li>способы поиска клиентов вне привычного круга.<\/li>\n  <\/ul>\n  <p>Но, наверное, <b>самый рабочий и&nbsp;самый результативный способ<\/b>, особенно если вы&nbsp;говорите:<\/p>\n  <div class=\"talk\">\n    <p class=\"bub l\">«Саша, я&nbsp;живу в&nbsp;Германии, где нет экспатов»<\/p>\n    <p class=\"talk-n\">или<\/p>\n    <p class=\"bub l\">«Я&nbsp;живу в&nbsp;деревне, где вообще никого нет» —<\/p>\n  <\/div>\n  <div class=\"card thesis tg\">\n    <p class=\"thesis-t\">это работа с&nbsp;Telegram-чатами.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Пошагово<\/span>\n  <h2 class=\"h2\">Как искать клиентов через Telegram-чаты<\/h2>\n  <p>Смотрите, как это работает.<\/p>\n\n  <ol class=\"steps tgs\">\n    <li class=\"step\">\n      <span class=\"step-n\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><\/svg><\/span>\n      <div>\n        <p class=\"step-t\"><span class=\"st-k\">Шаг 1.<\/span> Выбираем тему<\/p>\n        <p class=\"step-d\">Вы&nbsp;выбираете проблему, которую решаете.<\/p>\n        <p class=\"step-d\">Например:<\/p>\n        <p class=\"step-d eg\"><i>проблемы в&nbsp;отношениях с&nbsp;папой.<\/i><\/p>\n      <\/div>\n    <\/li>\n    <li class=\"step\">\n      <span class=\"step-n\"><svg class=\"i\" viewBox=\"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span>\n      <div>\n        <p class=\"step-t\"><span class=\"st-k\">Шаг 2.<\/span> Идем на&nbsp;YouTube<\/p>\n        <p class=\"step-d\">Вбиваете эту тему в&nbsp;YouTube и&nbsp;смотрите:<\/p>\n        <ul class=\"list\">\n          <li>кто из&nbsp;экспертов уже вещает на&nbsp;эту тему;<\/li>\n          <li>у&nbsp;кого есть просмотры;<\/li>\n          <li>у&nbsp;кого уже собрана аудитория.<\/li>\n        <\/ul>\n      <\/div>\n    <\/li>\n    <li class=\"step\">\n      <span class=\"step-n\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z\"/><path d=\"m21.854 2.147-10.94 10.939\"/><\/svg><\/span>\n      <div>\n        <p class=\"step-t\"><span class=\"st-k\">Шаг 3.<\/span> Переходите в&nbsp;Telegram<\/p>\n        <p class=\"step-d\">Находите этого эксперта и&nbsp;переходите в&nbsp;его Telegram-канал.<\/p>\n        <p class=\"step-d\">Очень часто в&nbsp;таких каналах люди:<\/p>\n        <ul class=\"list\">\n          <li>задают вопросы;<\/li>\n          <li>пишут о&nbsp;своих сложностях;<\/li>\n          <li>комментируют посты;<\/li>\n          <li>открыто формулируют свои боли.<\/li>\n        <\/ul>\n      <\/div>\n    <\/li>\n    <li class=\"step\">\n      <span class=\"step-n\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"/><\/svg><\/span>\n      <div>\n        <p class=\"step-t\"><span class=\"st-k\">Шаг 4.<\/span> Пишете этим людям<\/p>\n        <p class=\"step-d\">Дальше вы&nbsp;можете написать человеку примерно в&nbsp;такой логике:<\/p>\n        <div class=\"talk\"><p class=\"bub r\">«Слушайте, я&nbsp;психолог / коуч / наставник / специалист. Я&nbsp;понимаю, как можно решить вашу проблему. Приходите на&nbsp;бесплатную диагностическую сессию&nbsp;— разберемся, подсвечу, что и&nbsp;как можно сделать».<\/p><\/div>\n        <p class=\"step-d\">Более подробно техника разобрана у&nbsp;вас <b>в&nbsp;программе обучения<\/b>.<\/p>\n      <\/div>\n    <\/li>\n  <\/ol>\n\n  <p>Так что комментарии в&nbsp;духе:<\/p>\n  <div class=\"talk\">\n    <p class=\"bub l\">«Ой, Саша, я&nbsp;не&nbsp;знаю, где взять клиентов» —<\/p>\n    <p class=\"bub r\">не&nbsp;принимаются.<\/p>\n  <\/div>\n  <p>Потому что все это у&nbsp;вас уже есть:<\/p>\n  <ul class=\"list\">\n    <li>как работать по&nbsp;рекомендациям;<\/li>\n    <li>как приводить клиентов через Telegram-каналы;<\/li>\n    <li>как искать людей на&nbsp;других площадках;<\/li>\n    <li>как запускать первые простые касания.<\/li>\n  <\/ul>\n  <p class=\"quote\">Варианты решения есть.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <div class=\"card task\">\n    <span class=\"over\">Итак, первая задача недели<\/span>\n    <p class=\"task-h\">Сделать минимум 3&nbsp;продажи<\/p>\n    <p>Минимум&nbsp;— три.<\/p>\n    <p>Больше&nbsp;— пожалуйста. Никто вас не&nbsp;ограничивает.<\/p>\n    <p>Более того, я&nbsp;думаю, мы&nbsp;еще придумаем <b>какой-нибудь бонус<\/b> тем, кто сделает больше продаж за&nbsp;эту неделю.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"z2\">\n  <span class=\"over\">Вторая задача недели<\/span>\n  <h2 class=\"h2\">Повысить средний чек<\/h2>\n  <p>Если вы&nbsp;всю жизнь продавали за <b>5000&nbsp;рублей<\/b>, или прямо сейчас продаете за <b>5000&nbsp;рублей<\/b>, ваша задача&nbsp;— <b class=\"am\">поднять средний чек минимум на&nbsp;30%<\/b>.<\/p>\n\n  <div class=\"card exs\">\n    <p class=\"exs-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/><\/svg>Примеры:<\/p>\n    <div class=\"ex\"><div><span>продавали за<\/span> <b>5000<\/b><\/div><span class=\"arrow\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/><\/svg><\/span><div class=\"to\"><span>теперь продаете за<\/span> <b>6500<\/b>;<\/div><\/div>\n    <div class=\"ex\"><div><span>продавали за<\/span> <b>2000<\/b><\/div><span class=\"arrow\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/><\/svg><\/span><div class=\"to\"><span>теперь продаете за<\/span> <b>2600<\/b>.<\/div><\/div>\n  <\/div>\n\n  <p>При этом важно:<\/p>\n  <div class=\"note amber\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg><span>Повышаем средний чек на <b>30%<\/b>, но <b>не&nbsp;меньше, чем на&nbsp;500&nbsp;рублей<\/b>.<\/span><\/div>\n  <p>То&nbsp;есть если вы&nbsp;продавали свои сессии по <b>500&nbsp;рублей<\/b>, то&nbsp;теперь должны продавать их <b>минимум за&nbsp;1000&nbsp;рублей<\/b>.<\/p>\n\n  <h3 class=\"h3\">Как выполнять это задание?<\/h3>\n  <p>Например:<\/p>\n  <ul class=\"list\">\n    <li>две продажи вы&nbsp;можете сделать по&nbsp;старой цене;<\/li>\n    <li>но <b>третью продажу обязательно<\/b> нужно сделать уже по&nbsp;новой цене.<\/li>\n  <\/ul>\n\n  <div class=\"card kit\">\n    <div class=\"kit-h\"><span class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/><\/svg><\/span><p class=\"kit-t\">Как поднимать средний чек<\/p><\/div>\n    <p>У&nbsp;вас есть отдельная статья, где я&nbsp;рассказываю:<\/p>\n    <ul class=\"list\">\n      <li>как поднимать средний чек;<\/li>\n      <li>как объяснить это своему мозгу;<\/li>\n      <li>как объяснить это своим бывшим клиентам;<\/li>\n      <li>как сделать это органично;<\/li>\n      <li>как не&nbsp;выгореть в&nbsp;процессе;<\/li>\n      <li>как поменять оффер;<\/li>\n      <li>как поменять предложение;<\/li>\n      <li>как прийти к&nbsp;более сильным клиентам.<\/li>\n    <\/ul>\n    <p>Вся эта информация у&nbsp;вас уже есть.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"z3\">\n  <span class=\"over\">Третья задача недели<\/span>\n  <h2 class=\"h2\">Выполнить план по&nbsp;доходу<\/h2>\n  <p>Я&nbsp;хочу, чтобы за&nbsp;эту неделю вы <b class=\"am\">заработали и&nbsp;выполнили свой план по&nbsp;доходу<\/b>.<\/p>\n  <p>Я&nbsp;вам настоятельно рекомендую:<\/p>\n\n  <div class=\"split\">\n    <div class=\"card must\">\n      <div class=\"split-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/><\/svg><span>На&nbsp;этой неделе:<\/span><\/div>\n      <ul class=\"list\">\n        <li>закрыть свой план по&nbsp;доходу;<\/li>\n        <li>заработать деньги;<\/li>\n        <li>сделать это быстро;<\/li>\n        <li>сделать это простыми инструментами;<\/li>\n        <li><b>не&nbsp;усложнять<\/b>.<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"split-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m8 3 4 8 5-5 5 15H2L8 3z\"/><\/svg><span>А&nbsp;дальше:<\/span><\/div>\n      <p>оставшееся время на&nbsp;проекте <b>«План продюсера»<\/b> посвятить уже фундаментальным, системным вещам:<\/p>\n      <ul class=\"list\">\n        <li>построению системы;<\/li>\n        <li>регулярному приходу клиентов;<\/li>\n        <li>устойчивому росту дохода.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n  <p>Сейчас задача не&nbsp;усложнять.<\/p>\n  <p>Сейчас задача&nbsp;— <b>заработать денег<\/b>.<\/p>\n  <div class=\"will\">\n    <p>Быстро.<\/p>\n    <p>Просто.<\/p>\n    <p>Рабочими инструментами.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Дедлайн<\/span>\n  <h2 class=\"h2\">Почему я&nbsp;уверен, что у&nbsp;вас получится<\/h2>\n  <p>Я&nbsp;точно знаю: когда у&nbsp;нас есть <b>четкий дедлайн<\/b>, когда нужно выполнить план&nbsp;— мы&nbsp;его закрываем.<\/p>\n  <p>Помните, я&nbsp;рассказывал вам историю, как мне нужно было срочно заплатить за&nbsp;квартиру?<\/p>\n  <p>Я&nbsp;очень быстро понял:<\/p>\n  <ul class=\"card rows\">\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"/><\/svg><span>кому мне нужно звонить;<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M18.09 10.37A6 6 0 1 1 10.34 18\"/><path d=\"M7 6h1v4\"/><path d=\"m16.71 13.88.7.71-2.82 2.82\"/><\/svg><span>у&nbsp;кого точно есть деньги;<\/span><\/li>\n    <li><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg><span>кто может помочь мне решить этот вопрос.<\/span><\/li>\n  <\/ul>\n  <p>И&nbsp;у&nbsp;вас будет точно так же.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Итог недели<\/span>\n  <h2 class=\"h2\">Что я&nbsp;хочу от&nbsp;вас по&nbsp;итогу недели<\/h2>\n  <p>Я&nbsp;хочу, чтобы вы:<\/p>\n  <ul class=\"check\">\n    <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>закрыли свой план;<\/span><\/li>\n    <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>выдохнули;<\/span><\/li>\n    <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>кайфанули;<\/span><\/li>\n    <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>начали покупать подарки близким;<\/span><\/li>\n    <li><span class=\"box\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/span><span>а&nbsp;оставшееся время посвятили росту дохода и&nbsp;построению системы.<\/span><\/li>\n  <\/ul>\n  <p>Потому что я&nbsp;точно знаю: <b>у&nbsp;вас это получится<\/b>.<\/p>\n  <p>Вы&nbsp;уже не&nbsp;раз были уверены, что какие-то вещи для вас недоступны и&nbsp;нереальны.<\/p>\n  <div class=\"card thesis\">\n    <p>А&nbsp;я&nbsp;точно знаю другое:<\/p>\n    <p class=\"thesis-t\">все реально. И&nbsp;у&nbsp;вас получится.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"sec\">\n  <div class=\"card task\">\n    <span class=\"over\">Мы&nbsp;в&nbsp;вас верим<\/span>\n    <p class=\"task-h\">Пишите. Звоните.<\/p>\n    <p>В&nbsp;среду разберем:<\/p>\n    <ul class=\"list\">\n      <li>все ваши вопросы;<\/li>\n      <li>все сложности;<\/li>\n      <li>продажи;<\/li>\n      <li>поиск клиентов;<\/li>\n      <li>отработку возражений.<\/li>\n    <\/ul>\n    <p>Все в&nbsp;среду расскажем и&nbsp;разложим.<\/p>\n    <p class=\"task-go\">Вперед. Дерзайте! <span class=\"task-down\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span><\/p>\n  <\/div>\n\n  <div class=\"card how\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M12 11h4\"/><path d=\"M12 16h4\"/><path d=\"M8 11h.01\"/><path d=\"M8 16h.01\"/><\/svg><span class=\"upd\">В&nbsp;задании три поля<\/span><\/div>\n    <ol class=\"how-l\">\n      <li><span class=\"how-n\"><span class=\"upd\">1<\/span><\/span><span class=\"upd\">Задача №1. Сделать минимум 3&nbsp;продажи своих услуг.<\/span><\/li>\n      <li><span class=\"how-n\"><span class=\"upd\">2<\/span><\/span><span class=\"upd\">Задача №2. Поднять стоимость своих услуг на&nbsp;30% (минимум на&nbsp;500&nbsp;рублей, 7$).<\/span><\/li>\n      <li><span class=\"how-n\"><span class=\"upd\">3<\/span><\/span><span class=\"upd\">Показатели воронки за&nbsp;неделю.<\/span><\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"};
for (const n of Object.keys(RAW)) {
  const d = new DOMParser().parseFromString(RAW[n], 'text/html');
  d.querySelectorAll('script, iframe, object, embed, link, meta, base').forEach(e => e.remove());
  let css = [...d.querySelectorAll('style')].map(s => s.textContent).join('\n');
  d.querySelectorAll('style').forEach(s => s.remove());
  css = css.replace(/@import\s+url\([^)]*\)\s*;?/g, '').replace(/:root\b/g, ':host')
    .replace(/(^|[{},\s])html(?=\s*[,{])/g, '$1:host').replace(/(^|[{},\s])body(?=\s*[,{.:[])/g, '$1.pp-shadow-body');
  const root = document.getElementById('p' + n).attachShadow({ mode: 'open' });
  root.innerHTML = `<style>:host{display:block}${css}</style><div class="pp-shadow-body">${d.body.innerHTML}</div>`;
  root.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (!a) return; e.preventDefault();
    const t = root.getElementById(a.getAttribute('href').slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}
</script>
