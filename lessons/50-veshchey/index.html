.open .day-s { color: var(--blue); font-weight: 600; }\n.day.dl .day-s { color: #FF9B9B; font-weight: 600; }\n\n/* ——— факты-числа ——— */\n.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }\n.fact { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.fact b { display: block; font-size: 24px; line-height: 1.1; color: var(--t1); letter-spacing: -.02em; margin-bottom: 4px; }\n.fact.wide { grid-column: 1 / -1; }\n.fact.wide b { font-size: 18px; }\n.fact span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— красные / зелёные блоки ——— */\n.note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px; border: 1px solid; font-size: 16px; line-height: 1.5; }\n.note svg.i { margin-top: 2px; }\n.note.red { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.note.red b { color: #FFD0D0; }\n.note.green { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.note.green b { color: #D2F5D6; }\n.note.blue { background: var(--blue-bg); border-color: var(--blue-line); color: #B5CCFF; }\n.note.blue b { color: #DCE7FF; }\n\n/* ——— путь жизней ——— */\n.path { display: grid; gap: 0; margin-top: 16px; }\n.path-st { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 16px; }\n.path-st.solo { border-color: rgba(234,184,32,.35); }\n.path-st.out { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.path-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.path-name { font-size: 17px; font-weight: 700; color: var(--t1); }\n.path-st p { font-size: 15px; margin-top: 6px; }\n.path-link { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 18px; font-size: 13px; font-weight: 600; color: #FF9B9B; }\n.path-link::before { content: \"\"; width: 2px; height: 22px; background: var(--red-line); margin-right: 6px; }\n\n/* ——— хорошо / плохо ——— */\n.vs { display: grid; gap: 10px; margin-top: 14px; }\n.vs-col { border-radius: 16px; padding: 14px 16px; border: 1px solid; }\n.vs-col.bad { background: var(--red-bg); border-color: var(--red-line); }\n.vs-col.good { background: var(--green-bg); border-color: var(--green-line); }\n.vs-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }\n.vs-col.bad .vs-h { color: #FF9B9B; }\n.vs-col.good .vs-h { color: var(--green); }\n.vs-col ul { list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--t1); }\n\n/* ——— таймлайн дня ——— */\n.clock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.clock div { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px 16px; }\n.clock b { display: block; font-size: 28px; line-height: 1; letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-bottom: 6px; }\n.clock span { font-size: 14px; line-height: 1.35; color: var(--t2); display: block; }\n\n/* ——— пример фокуса ——— */\n.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }\n.ex > div { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; }\n.ex small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }\n.ex b { font-size: 16px; line-height: 1.3; }\n.ex .arrow { align-self: center; background: none; border: 0; padding: 0; color: var(--t3); }\n\n/* ——— монеты / баллы ——— */\n.cur { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n.cur .card { margin-top: 0; padding: 16px; }\n.cur-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }\n.cur-ic.pts { background: var(--blue-bg); color: var(--blue); }\n.cur-ic.coin { background: rgba(234,184,32,.12); color: var(--amber); }\n.cur-n { font-size: 18px; font-weight: 700; color: var(--t1); }\n.cur-what { font-size: 14px; line-height: 1.4; color: var(--t2); margin-top: 4px; }\n.plusminus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.pm { border-radius: 14px; padding: 12px 14px; border: 1px solid; font-size: 14px; line-height: 1.4; }\n.pm b { display: block; font-size: 20px; margin-bottom: 2px; }\n.pm.up { background: var(--green-bg); border-color: var(--green-line); color: #A9E8B1; }\n.pm.up b { color: var(--green); }\n.pm.down { background: var(--red-bg); border-color: var(--red-line); color: #FFB3B3; }\n.pm.down b { color: var(--red); }\n\n/* ——— свойства инвентаря ——— */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n.tile { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.4; color: var(--t2); }\n.tile .rule-ic { margin-bottom: 10px; }\n.tile b { color: var(--t1); }\n\n/* ——— итоговый чек-лист ——— */\n.check { list-style: none; display: grid; gap: 10px; margin-top: 14px; }\n.check li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; color: var(--t1); font-weight: 600; line-height: 1.4; }\n.check li span.box { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); }\n.check li span.box svg.i { width: 16px; height: 16px; stroke-width: 3; }\n.check li small { display: block; font-size: 14px; font-weight: 500; color: var(--t2); margin-top: 2px; }\n\n.divider { height: 1px; background: var(--line); margin: 36px 0 0; }\n\n@media (min-width: 640px) {\n  .page { padding: 8px 0 32px; }\n  .h2 { font-size: 34px; }\n  .card { padding: 24px; }\n  .pair, .split, .vs { grid-template-columns: 1fr 1fr; }\n  .lvls { grid-template-columns: repeat(3, 1fr); }\n  .lvl { grid-template-columns: 1fr; gap: 6px; }\n  .lvl-arrow { transform: rotate(90deg); justify-self: start; }\n  .facts { grid-template-columns: repeat(4, 1fr); }\n  .fact.wide { grid-column: span 2; }\n  .week { grid-template-columns: repeat(3, 1fr); }\n  .grid2 { grid-template-columns: repeat(4, 1fr); }\n}\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n\n/* Урок «50 вещей по пути к самооценке»: дополнения к lesson.css урока «Правила курса». */\n.lead + p { margin-top: 10px; }\n.after { margin-top: 18px; }\n.cheat .rule:first-of-type { border-top: 0; }\n.cheat-h { margin-bottom: 6px; }\n.tag-gain { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 100px;\n  background: rgba(234,184,32,.10); border: 1px solid rgba(234,184,32,.32); color: #F0CE5C; font-size: 13px; font-weight: 600; }\n.tag-gain svg.i { width: 14px; height: 14px; }\n\n/* ——— история ——— */\n.story { border-color: var(--red-line); background: linear-gradient(180deg, rgba(255,107,107,.06), var(--card)); }\n.story .card-t { color: #FF9B9B; }\n.story .card-t svg.i { color: var(--red); }\n.story p { font-size: 16px; color: var(--t1); }\n.story + p { margin-top: 18px; }\n.quote + p { margin-top: 18px; }\n\n/* ——— реплики окружения ——— */\n.talk { display: grid; gap: 10px; margin: 16px 0 18px; }\n.bub { position: relative; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.45; color: var(--t1);\n  background: rgba(255,255,255,.06); border: 1px solid var(--line2); margin: 0 !important; }\n.talk-n { justify-self: center; margin: 0 !important; font-size: 13px; color: var(--t3); }\n.bub.l { justify-self: start; border-bottom-left-radius: 6px; }\n.bub.r { justify-self: end; border-bottom-right-radius: 6px; background: rgba(255,107,107,.08); border-color: var(--red-line); }\n\n/* ——— главная мысль ——— */\n.thesis { margin: 20px 0; padding: 22px 20px; border-color: rgba(234,184,32,.30); background: linear-gradient(180deg, #1E2230 0%, var(--card) 100%); }\n.thesis-t { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.thesis p + p { margin-top: 10px; color: var(--t2); }\n\n/* ——— тетрадка ——— */\n.note-book { margin: 18px 0; padding: 20px 18px 10px; }\n.nb { list-style: none; display: grid; }\n.nb li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--t1); }\n.nb li:first-child { border-top: 0; padding-top: 4px; }\n.nb small { display: block; margin-top: 6px; font-size: 14px; color: var(--t3); }\n.nb-n { margin-top: -3px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--blue);\n  background: var(--blue-bg); border: 1px solid var(--blue-line); font-variant-numeric: tabular-nums; }\n\n/* ——— задание ——— */\n.task { border-color: rgba(234,184,32,.45); background: radial-gradient(120% 120% at 50% 0%, #2A2412 0%, var(--card) 70%); padding: 24px 20px; }\n.task .kick { color: #D9B94E; }\n.task p { font-size: 17px; color: var(--t1); }\n.task-go { display: flex; align-items: center; gap: 10px; margin-top: 16px !important; font-size: 24px !important; font-weight: 700;\n  background: var(--gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.task-down { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #2A2008;\n  -webkit-text-fill-color: #2A2008; animation: task-bob 1.6s ease-in-out infinite; }\n.task-down svg.i { width: 18px; height: 18px; }\n@keyframes task-bob { 50% { transform: translateY(3px); } }\n@media (prefers-reduced-motion: reduce) { .task-down { animation: none; } }\n\n/* ——— ритм отступов (сетка как в «Системе ценностей»): текст 12, блоки 20, подзаголовок 32/10 ——— */\n.sec > * { margin-bottom: 0 !important; }\n.sec > * + * { margin-top: 12px !important; }\n.sec > .kick { margin-bottom: 10px !important; }\n.sec > .kick + * { margin-top: 0 !important; }\n.sec > .h2 { margin-bottom: 0 !important; }\n.sec > .h2 + * { margin-top: 14px !important; }\n.sec > * + :is(.card, .talk, .quote), .sec > :is(.card, .talk, .quote) + * { margin-top: 20px !important; }\n.card > :first-child { margin-top: 0 !important; }\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"sec\">\n  <p class=\"lead\"><b>Приветствую, будущий Фриман и&nbsp;участник «План Продюсера»!<\/b><\/p>\n  <p>Сегодня у&nbsp;нас с&nbsp;тобой один из&nbsp;важнейших уроков, который предопределит твою самооценку. Это упражнение очень простое, очень понятное. Но&nbsp;сделать его людям почему-то все равно крайне сложно.<\/p>\n\n  <div class=\"card cheat\">\n    <p class=\"cheat-h\"><span class=\"upd\">Упражнение урока<\/span><\/p>\n    <div class=\"rule\">\n      <div class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/><\/svg><\/div>\n      <div><p class=\"rule-name\"><span class=\"upd\">Завести тетрадку<\/span><\/p><\/div>\n    <\/div>\n    <div class=\"rule\">\n      <div class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\/svg><\/div>\n      <div><p class=\"rule-name\"><span class=\"upd\">За&nbsp;один вечер написать 50&nbsp;вещей, в&nbsp;чем ты&nbsp;хорош<\/span><\/p><\/div>\n    <\/div>\n    <div class=\"rule\">\n      <div class=\"rule-ic\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><\/div>\n      <div><p class=\"rule-name\"><span class=\"upd\">Выписать все 50 в&nbsp;задание внизу урока<\/span><\/p>\n        <p class=\"rule-txt\"><span class=\"upd\">Ответы увидят участники твоего потока.<\/span><\/p>\n        <span class=\"tag-gain\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M18.09 10.37A6 6 0 1 1 10.34 18\"/><path d=\"M7 6h1v4\"/><path d=\"m16.71 13.88.7.71-2.82 2.82\"/><\/svg><span class=\"upd\">500 баллов, 500 фениксов и&nbsp;«Журнал Продюсера»<\/span><\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <p class=\"after\">Потому что на&nbsp;протяжении всей своей жизни всё пространство делает всё, чтобы мы&nbsp;обесценивали себя, не&nbsp;ценили себя и, собственно, не&nbsp;верили в&nbsp;себя.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">История Игоря<\/span>\n  <h2 class=\"h2\"><span class=\"upd\">С&nbsp;чего всё началось<\/span><\/h2>\n  <p>Когда я&nbsp;начинал свой бизнес, я&nbsp;был тоже в&nbsp;таком&nbsp;же состоянии.<\/p>\n  <p>Причин, почему у&nbsp;меня не&nbsp;должно было получиться, было сильно больше. Вся моя жизнь, к&nbsp;моим 18-ти годам, абсолютно не&nbsp;вела меня к&nbsp;успеху.<\/p>\n\n  <div class=\"card story\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg>К&nbsp;18&nbsp;годам<\/div>\n    <p>Я&nbsp;рос в&nbsp;беспрерывном унижении, родители в&nbsp;меня не&nbsp;верили, в&nbsp;школе меня, условно, буллили (обижали). Результатов в&nbsp;жизни особо не&nbsp;было. Я&nbsp;подрабатывал, сдавая бутылки, вынося строительный мусор и&nbsp;раздавая газеты. И&nbsp;то, потому что нужны были деньги. За&nbsp;всю мою жизнь мне никто не&nbsp;давал даже карманных денег.<\/p>\n  <\/div>\n\n  <p>И&nbsp;вот тут я&nbsp;попадаю впервые на&nbsp;тренинг, где мне сказали, что есть возможность стать богатым.<\/p>\n  <p class=\"quote\">Но&nbsp;где все эти люди, а&nbsp;где&nbsp;я.<\/p>\n  <p>Это у&nbsp;них есть такая возможность, а&nbsp;не&nbsp;у&nbsp;меня.<\/p>\n  <p>И&nbsp;тогда мне впервые дали такое упражнение, которое называется&nbsp;<b class=\"am\">«50&nbsp;вещей, в&nbsp;чем я&nbsp;хорош»<\/b>.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Зачем это нужно<\/span>\n  <h2 class=\"h2\">Что это такое?<\/h2>\n  <p>Для того, чтобы добиться выдающихся результатов в&nbsp;жизни, нужно мыслить амбициозно. Т.е. за&nbsp;пределами стандартного поведения. Т.е. выходить за&nbsp;рамки. Т.е. делать более опасные вещи, более рисковые вещи, чем все остальные.<\/p>\n  <p>Для примера: если вы&nbsp;сейчас новичок и&nbsp;вы&nbsp;планируете сейчас заработать свои первые 150.000 рублей, еще и&nbsp;на&nbsp;своем деле, естественно, вы&nbsp;будете получать негативное внимание со&nbsp;стороны своего окружения. Ведь вы&nbsp;это болотце растягиваете, вы&nbsp;же его шевелите. И, естественно, люди, чтобы защитить свое болотце, будут вас унижать. Говорить, что у&nbsp;тебя не&nbsp;получится.<\/p>\n\n  <div class=\"talk\" aria-label=\"Что говорит окружение\">\n    <p class=\"bub l\">Ой, что это ты&nbsp;у&nbsp;нас, предпринимателем заделался?<\/p>\n    <p class=\"talk-n\">…не&nbsp;верить в&nbsp;вас. Говорить:<\/p>\n    <p class=\"bub r\">Слушай, куда ты&nbsp;двигаешься? Оставайся на&nbsp;своем месте.<\/p>\n  <\/div>\n\n  <p>А&nbsp;значит тебе нужно на&nbsp;порядок больше сил, чтобы это сделать.<\/p>\n  <p>И&nbsp;так как ты&nbsp;изначально веришь в&nbsp;то, что ты&nbsp;не&nbsp;способен, так устроена психика, у&nbsp;тебя нет этой внутренней точки опоры.<\/p>\n\n  <div class=\"card thesis\">\n    <p class=\"thesis-t\">Поэтому, условно, завышенная самооценка безумно необходима предпринимателям. Потому что ты&nbsp;должен поверить, что ты&nbsp;можешь сделать невозможное.<\/p>\n    <p>А&nbsp;это невозможно в&nbsp;глазах большинства людей на&nbsp;планете.<\/p>\n  <\/div>\n\n  <p>Это я&nbsp;знаю, что это возможно. Потому что я&nbsp;это проходил.<\/p>\n  <p>И&nbsp;ты&nbsp;может быть чуть-чуть веришь, что это возможно, но&nbsp;не&nbsp;веришь, что это можешь сделать&nbsp;ты. И&nbsp;это важно.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <span class=\"kick\">Как я это сделал<\/span>\n  <h2 class=\"h2\"><span class=\"upd\">Тетрадка и&nbsp;один вечер<\/span><\/h2>\n  <p>И&nbsp;первое, что я&nbsp;сделал, я&nbsp;тогда открыл тетрадку (завел специально тетрадку) и&nbsp;за&nbsp;один вечер&nbsp;- <b class=\"am\">и&nbsp;это ключевой фактор<\/b>&nbsp;- за&nbsp;один вечер я&nbsp;сделал эту задачу: Нужно написать за&nbsp;раз 50&nbsp;вещей в&nbsp;чем ты&nbsp;хорош. Что у&nbsp;тебя получилось?<\/p>\n  <p>Большинство людей не&nbsp;могут сделать эту задачу комфортно потому, что у&nbsp;них нет таких вещей.<\/p>\n  <p>И&nbsp;я&nbsp;такой сел и&nbsp;\"О'кей, Игорь, а&nbsp;в&nbsp;чем ты&nbsp;хорош?<\/p>\n\n  <div class=\"card note-book\">\n    <div class=\"card-t\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/><\/svg>Тетрадка Игоря<\/div>\n    <ol class=\"nb\">\n      <li><span class=\"nb-n\">1<\/span><div>У&nbsp;меня, кстати, тест по&nbsp;IQ показал результат 162 или 165.<small>Я&nbsp;такой: \"Так, хорошо. Одна вещь\".<\/small><\/div><\/li>\n      <li><span class=\"nb-n\">2<\/span><div>А&nbsp;сейчас я&nbsp;кандидат в&nbsp;мастер спорта по&nbsp;дзюдо.<\/div><\/li>\n      <li><span class=\"nb-n\">3<\/span><div>И&nbsp;я&nbsp;сам научился в&nbsp;альпинизме вязать узлы. Я, кстати, получил разряд по&nbsp;альпинизму.<\/div><\/li>\n      <li><span class=\"nb-n\">4<\/span><div>Я&nbsp;сам научился играть на&nbsp;гитаре за&nbsp;1&nbsp;месяц с&nbsp;нуля.<\/div><\/li>\n      <li><span class=\"nb-n\">5<\/span><div>Я&nbsp;сам научился играть на&nbsp;фортепиано просто по&nbsp;цветным клавишам, которые загорались. И&nbsp;так подобрал основные сонаты и&nbsp;мелодии. А&nbsp;потом благодаря этому играл в&nbsp;рок-группе.<\/div><\/li>\n      <li><span class=\"nb-n\">6<\/span><div>Я&nbsp;сам поступил в&nbsp;университет без денег и&nbsp;взятки.<\/div><\/li>\n    <\/ol>\n  <\/div>\n\n  <p>Я&nbsp;начал понимать, что на&nbsp;самом деле за&nbsp;свою жизнь, даже к&nbsp;своим 18-ти годам, я&nbsp;что-то да&nbsp;сделал!&nbsp;Что-то да&nbsp;у&nbsp;меня получилось!<\/p>\n  <p class=\"quote\">И&nbsp;это дало мне точку опоры.<\/p>\n  <p>Просто я&nbsp;понял, что я&nbsp;на&nbsp;самом деле достаточно классный пацан. Талантливый в&nbsp;определенных местах. Достаточно амбициозный.<\/p>\n  <p>И&nbsp;я-то думал, что я&nbsp;ничего из&nbsp;себя не&nbsp;представляю. Я-то думал, что я&nbsp;ни&nbsp;на&nbsp;что не&nbsp;способен. Потому что все всю жизнь мне об&nbsp;этом говорили. Учителя в&nbsp;школе, родители, друзья.<\/p>\n<\/section>\n\n<section class=\"sec\">\n  <div class=\"card task\">\n    <span class=\"kick\">Задание урока<\/span>\n    <p>И&nbsp;поэтому, <b>первое задание<\/b>, которое есть у&nbsp;тебя в&nbsp;рамках этого урока по&nbsp;работе с&nbsp;самооценкой, это сесть, завести тетрадку и&nbsp;написать 50&nbsp;вещей в&nbsp;чем ты&nbsp;хорош.<\/p>\n    <p>И&nbsp;все 50&nbsp;вещей выписать в&nbsp;это задание. Чтобы мы&nbsp;все вместе почитали, а&nbsp;в&nbsp;чем ты&nbsp;хорош?<\/p>\n    <p class=\"task-go\">Приступай! <span class=\"task-down\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14\"/><path d=\"m19 12-7 7-7-7\"/><\/svg><\/span><\/p>\n  <\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n";
const d = new DOMParser().parseFromString(raw, 'text/html');
d.querySelectorAll('script, iframe, object, embed, link, meta, base').forEach(e => e.remove());
d.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => { if (a.name.startsWith('on')) el.removeAttribute(a.name); }));
let css = [...d.querySelectorAll('style')].map(s => s.textContent).join('\n');
d.querySelectorAll('style').forEach(s => s.remove());
css = css.replace(/@import\s+url\([^)]*\)\s*;?/g, '').replace(/:root\b/g, ':host')
  .replace(/(^|[{},\s])html(?=\s*[,{])/g, '$1:host').replace(/(^|[{},\s])body(?=\s*[,{.:[])/g, '$1.pp-shadow-body');
const host = document.getElementById('part'); const root = host.attachShadow({ mode: 'open' });
root.innerHTML = `<style>:host{display:block}${css}</style><div class="pp-shadow-body">${d.body.innerHTML}</div>`;
</script>
</body></html>
