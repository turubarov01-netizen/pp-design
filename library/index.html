<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Библиотека — три варианта</title>
<style>
@font-face{font-family:"Medeo Sans";src:url("fonts/MedeoSansVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#EEF2FC; --ink:#0B1020; --ink2:#4E566B; --ink3:#7D849A; --line:rgba(47,123,255,.13);
  --blue:#2F7BFF; --blue-ink:#1F5FD6; --blue-soft:#EEF3FF; --gold:#C9A24A; --gold-ink:#8A6A1F;
  --panel:rgba(255,255,255,.9); --ok:#1F9D55;
  --ease:cubic-bezier(.22,1,.36,1);
  --sh:0 8px 32px rgba(47,123,255,.08),0 2px 8px rgba(11,16,32,.03),inset 0 1px 0 rgba(255,255,255,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Medeo Sans",-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
svg{flex:none;width:18px;height:18px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* каркас как у нового дашборда */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(rgba(255,255,255,.94),rgba(249,251,255,.82) 55%,rgba(255,255,255,.9));border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 18px;font-weight:700}
.logo img{width:32px;height:32px;border-radius:9px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;color:var(--ink2);font-size:14px}
.nav.on{background:var(--blue-soft);color:var(--ink);font-weight:600}.nav.on svg{color:var(--blue)}
.main{min-width:0}
.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 32px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.top h1{font-size:17px;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:8px}
.top .back{width:34px;height:34px;border-radius:10px;display:none;place-items:center;color:var(--ink2)}
.tb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--ink2);position:relative}
.tb i{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:#E5484D;color:#fff;font:700 10px/13px "Medeo Sans";font-style:normal;padding:0 4px;border:2px solid #fff}
.ava{width:38px;height:38px;border-radius:50%;background:#C9D6F5;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:26px 32px 72px}
.bnav{display:none}

/* общие куски */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-weight:500;opacity:.6}
.search{display:flex;gap:8px;align-items:center}
.search .in{flex:1;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink3);font-size:15px}
.search .fb{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.sh{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sh h2{font-size:20px;font-weight:750;letter-spacing:-.01em}
.sh small{color:var(--ink3);font-size:14px}
.sh a{margin-left:auto;color:var(--blue-ink);font-size:14px;font-weight:600;white-space:nowrap}
.thumb{position:relative;border-radius:14px;overflow:hidden;background:#1B2236;aspect-ratio:16/9}
.thumb img{width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(11,16,32,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 7px;border-radius:7px;backdrop-filter:blur(6px)}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.3)}.bar b{display:block;height:100%;background:var(--blue)}
.done-b{position:absolute;left:8px;top:8px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;display:flex;gap:4px;align-items:center}
.done-b svg{width:12px;height:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink3);font-size:13px;align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center}.meta svg{width:14px;height:14px}
.meta .star{color:#E0A100}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--blue-soft);color:var(--blue-ink)}
.tag.gold{background:#FBF3E0;color:var(--gold-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.btn{white-space:nowrap;height:44px;padding:0 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.icobtn{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:inline-grid;place-items:center;color:var(--ink2)}
.player{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}
.player img{width:100%;height:100%;object-fit:cover;opacity:.55}
.player .pb{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.35)}
.player .pb svg{width:26px;height:26px;margin-left:3px}
.player .ctl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;display:flex;align-items:center;gap:12px;color:#fff;font-size:12px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.player .ctl .tr{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}.player .ctl .tr b{display:block;width:40%;height:100%;border-radius:2px;background:var(--blue)}
.player .ctl svg{width:16px;height:16px}

/* статья урока: авторская HTML-страница, только без чужих рамок вокруг */
.art{font-size:16px;line-height:1.62;color:#1E2333}
.art .ah{background:linear-gradient(135deg,#F7F1E4,#FFFDF8);border-radius:18px;padding:22px 20px 18px}
.art .lvl{display:inline-block;background:#B08A3E;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 12px;border-radius:999px;text-transform:uppercase}
.art h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:28px;line-height:1.15;margin:14px 0 8px;color:#1A1712}
.art .sub{font-family:Georgia,serif;font-style:italic;color:#B08A3E;font-size:17px;margin-bottom:12px}
.art .by{border-top:1px solid #EADFC8;padding-top:10px;margin-top:12px;font-size:13px;color:#8C8577}
.art .by b{color:#4A4438}
.art p{margin:16px 0}
.art .lead{font-family:Georgia,serif;font-size:17px;color:#4A4438}
.art .call{background:#F6F1E7;border-radius:14px;padding:14px 16px;margin:12px 0}
.art .call b{display:block;font-family:Georgia,serif;font-weight:400;color:#9C7A33;font-size:17px;margin-bottom:4px}
.art .fade{height:60px;margin-top:-60px;position:relative;background:linear-gradient(rgba(255,255,255,0),#fff)}

/* =========== ВАРИАНТ А · Кинотеатр =========== */
.A .cont{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:20px;align-items:center;padding:14px;border-radius:22px}
.A .cont .thumb{border-radius:16px}
.A .cont .k{font-size:12px;font-weight:700;color:var(--blue-ink);text-transform:uppercase;letter-spacing:.06em}
.A .cont h3{font-size:22px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
.A .cont .left{font-size:13px;color:var(--ink3);margin:10px 0 14px}
.A .rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px)/4);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.A .rail::-webkit-scrollbar{display:none}
.A .card{scroll-snap-align:start}
.A .card h4{font-size:15px;font-weight:650;line-height:1.3;margin:10px 2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.A .card .meta{padding:0 2px}
.A .lgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.A .stage{border-radius:22px;overflow:hidden}
.A .lhead{padding:18px 4px 0}
.A .lhead h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:10px 0 10px}
.A .acts{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.A .tabs{display:flex;gap:4px;background:#E3E9F8;border-radius:12px;padding:4px;margin:20px 0 16px;width:max-content}
.A .tabs b{white-space:nowrap;height:36px;padding:0 16px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink2)}
.A .tabs b.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,16,32,.08)}
.A .artw{padding:20px;border-radius:22px}
.A .next{padding:18px;border-radius:20px;position:sticky;top:82px}
.A .next h3{font-size:16px;margin-bottom:12px}
.A .row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:12px;margin:0 -8px}
.A .row.on{background:var(--blue-soft)}
.A .row .thumb{border-radius:10px}
.A .row h4{font-size:14px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.A .row .n{font-size:12px;color:var(--ink3);margin-top:3px}
.A .rate{margin-top:20px;padding:18px 20px;border-radius:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.A .rate b{font-size:16px;margin-right:auto}
.stars{display:flex;gap:6px;color:#C8CEDC}.stars svg{width:28px;height:28px}

/* =========== ВАРИАНТ Б · Лента-читалка =========== */
.B .list{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:20px}
.B .li{display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px;border-radius:14px}
.B .li:hover{background:var(--blue-soft)}
.B .li .thumb{border-radius:10px}
.B .li h4{font-size:15px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.B .li .go{color:var(--ink3)}
.B .li .pr{height:4px;border-radius:2px;background:#E3E9F8;margin-top:8px;max-width:200px}.B .li .pr b{display:block;height:100%;border-radius:2px;background:var(--blue)}
.B .read{display:grid;grid-template-columns:220px minmax(0,720px);gap:32px;justify-content:center;align-items:start}
.B .toc{position:sticky;top:86px;font-size:14px}
.B .toc b{display:block;font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.B .toc a{display:block;padding:7px 10px;border-radius:9px;color:var(--ink2);line-height:1.3}
.B .toc a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(11,16,32,.06)}
.B .crumb{font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.B .lt h2{font-size:28px;line-height:1.18;letter-spacing:-.015em;margin:10px 0 10px}
.B .vid{border-radius:18px;overflow:hidden;margin:18px 0}
.B .paper{background:#fff;border-radius:20px;padding:24px 28px;border:1px solid var(--line)}
.B .dock{position:sticky;bottom:18px;margin-top:20px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(11,16,32,.12)}
.B .dock .btn{flex:1}

/* =========== ВАРИАНТ В · Подборки =========== */
.C .colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.C .coll{border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.C .coll .cov{position:relative;aspect-ratio:16/8;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:minmax(0,1fr);gap:2px;background:#0B1020;overflow:hidden}
.C .coll .cov>img,.C .coll .cov .r,.C .coll .cov .r img{min-height:0}
.C .coll .cov img{width:100%;height:100%;object-fit:cover}
.C .coll .cov .r{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:2px}
.C .coll .cov .cnt{position:absolute;left:12px;bottom:12px;background:rgba(11,16,32,.75);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px}
.C .coll .bd{padding:14px 16px 16px}
.C .coll h4{font-size:17px;font-weight:700}
.C .coll .pp{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink3)}
.C .coll .pp i{flex:1;height:6px;border-radius:3px;background:#E3E9F8;overflow:hidden}.C .coll .pp i b{display:block;height:100%;background:var(--blue)}
.C .lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.C .chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.C .chead .pi{flex:1}
.C .chead .pi small{font-size:13px;color:var(--ink3)}
.C .chead .pi i{display:block;height:6px;border-radius:3px;background:#DCE4F7;margin-top:6px;overflow:hidden}.C .chead .pi i b{display:block;height:100%;width:30%;background:var(--blue)}
.C .stage{border-radius:22px;overflow:hidden}
.C h2.t{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:16px 0 10px}
.C .chap{margin:18px 0;padding:6px;border-radius:18px}
.C .chap summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:650;cursor:pointer}
.C .chap summary::-webkit-details-marker{display:none}
.C .chap summary small{margin-left:auto;color:var(--ink3);font-weight:500}
.C .chap ol{list-style:none;counter-reset:c;padding:0 6px 6px}
.C .chap li{counter-increment:c;display:flex;gap:12px;padding:9px 8px;border-radius:10px;font-size:14px;color:var(--ink2)}
.C .chap li::before{content:counter(c);width:22px;height:22px;border-radius:7px;background:var(--blue-soft);color:var(--blue-ink);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.C .pl{border-radius:20px;padding:16px;position:sticky;top:82px}
.C .pl h3{font-size:16px}
.C .pl .s{font-size:13px;color:var(--ink3);margin:2px 0 12px}
.C .it{display:grid;grid-template-columns:26px 88px minmax(0,1fr);gap:10px;align-items:center;padding:7px;border-radius:12px;margin:0 -7px}
.C .it.on{background:var(--blue-soft)}
.C .it .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink3);border:1.5px solid #CBD3E6}
.C .it.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.C .it.on .num{background:var(--blue);border-color:var(--blue);color:#fff}
.C .it .thumb{border-radius:8px}
.C .it h4{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.C .it .n{font-size:12px;color:var(--ink3)}
.C .pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.C .pn a{padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.C .pn a small{display:block;font-size:12px;color:var(--ink3)}
.C .pn a b{font-size:14px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.C .pn a.nx{background:var(--blue);color:#fff;border-color:var(--blue);text-align:right}.C .pn a.nx small{color:rgba(255,255,255,.75)}
.C .artw{padding:20px;border-radius:22px;margin-top:4px}

/* =========== В2 · доработанный В (Саша 09.11) =========== */
.fx{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:999px;background:#FBF3E0;color:var(--gold-ink);font-size:14px;font-weight:600;white-space:nowrap;border:1px solid rgba(201,162,74,.32)}
.fx svg{width:18px;height:18px;color:#E07B12}
.fx b{font-weight:750;color:#5C4513}
.D .grp{display:flex;align-items:center;gap:12px;margin:18px 0 10px}
.D .grp h3{font-size:15px;font-weight:700}
.D .grp .pg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);white-space:nowrap}
.D .grp .pg i{width:90px;height:6px;border-radius:3px;background:#DCE4F7;overflow:hidden}.D .grp .pg i b{display:block;height:100%;background:var(--ok)}
.D .grp a{margin-left:auto;color:var(--blue-ink);font-size:14px;font-weight:600}
.D .gd{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 14px}
.D .gd .x{display:none}.D .gd.open .x{display:block}
.D .gd .x12{display:none}.D .gd.open .x12{display:block}
.D .more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--blue-ink);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.D .more svg{width:16px;height:16px;transform:rotate(90deg);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.D .more.open svg{transform:rotate(-90deg)}
.D .more:hover{background:var(--blue-soft)}
.D .cd{min-width:0;display:block}
.D .fxnote{font-size:13px;color:var(--ink3);margin-top:12px}
/* страница рубрики */
.D .rhd{padding:18px 20px;border-radius:20px;margin-top:4px}
.D .rhd .ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.D .rhd h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.D .rhd .ttl small{font-size:15px;color:var(--ink3)}
.D .rhd .seg{margin-top:14px}
.D .flt{margin:16px 0 14px}
.D .chip{cursor:pointer}
.D .gd .cd[hidden]{display:none}
.D .empty{grid-column:1/-1;padding:30px 0;text-align:center;color:var(--ink3);font-size:14px}
.D .cd .thumb{aspect-ratio:1/1}
.D .cd h4{font-size:14px;font-weight:600;line-height:1.3;margin:9px 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.D .cd .st{font-size:12px;color:var(--ink3);margin:3px 2px 0}
.D .cd .st.now{color:var(--blue-ink);font-weight:600}
.D .thumb.lk img{filter:grayscale(.5) brightness(.5)}
.D .thumb .lock{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.92)}
.D .thumb .lock svg{width:26px;height:26px}
.prc{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:8px;background:#FBF3E0;color:#5C4513;font-size:12px;font-weight:700;white-space:nowrap}
.prc svg{width:14px;height:14px;color:#E07B12}
.D .thumb .prc{position:absolute;left:8px;bottom:8px}
.D .base{padding:16px 18px;border-radius:18px}
.D .seg{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:#D5DCEB}
.D .seg b{min-width:5px;background:#D5DCEB}.D .seg b.k{background:var(--ok)}.D .seg b.o{background:var(--blue)}
.D .lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink2);align-items:center}
.D .lg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
